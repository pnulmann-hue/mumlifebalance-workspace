name: Haushalt-Vorabend

# Schickt Patricia jeden Abend um 19:00 (Europe/Zurich) einen Vorabend-Ueberblick
# fuer den naechsten Tag aus der Notion "🏠 Haushalts-Liste" — via eigenem
# Haushalts-Telegram-Bot (NICHT der Cockpit-Bot).
#
# Cron ist UTC. Schweiz = UTC+2 (Sommer) / UTC+1 (Winter).
# 17:00 UTC = 19:00 CEST (Sommer) bzw. 18:00 CET (Winter). Toleranter Drift.

on:
  schedule:
    - cron: '0 17 * * *'   # taeglich 19:00 CEST / 18:00 CET
  workflow_dispatch:        # manueller Test-Trigger ueber die GitHub-UI

permissions:
  contents: read

jobs:
  send-vorabend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/haushalts-bot/requirements.txt

      - name: Install deps
        working-directory: scripts/haushalts-bot
        run: pip install -r requirements.txt

      - name: Send Vorabend-Briefing
        working-directory: scripts/haushalts-bot
        env:
          TELEGRAM_HAUSHALT_BOT_TOKEN: ${{ secrets.TELEGRAM_HAUSHALT_BOT_TOKEN }}
          TELEGRAM_HAUSHALT_CHAT_ID: ${{ secrets.TELEGRAM_HAUSHALT_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TZ: Europe/Zurich
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
          LANG: 'C.UTF-8'
          LC_ALL: 'C.UTF-8'
        run: python run_once.py
