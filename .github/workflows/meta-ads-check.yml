name: Meta Ads Live-Check

# 4x täglich + on-demand. Während Launches via workflow_dispatch häufiger anstossen.
on:
  schedule:
    # 06:00 / 12:00 / 18:00 / 22:00 Schweiz (Sommer = UTC+2)
    - cron: '0 4,10,16,20 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Lookback in Tagen (Standard: 3)'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

concurrency:
  group: meta-ads-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Meta-Ads Check
        working-directory: scripts/meta-ads
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_CURRENCY: CHF
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
        run: node check-active-ads.js

      - name: Telegram-Alert bei kritischen Befunden
        if: success() && hashFiles('outputs/ads-runs/alerts.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram-Secrets fehlen, überspringe Push."
            exit 0
          fi
          ALERTS=$(node -e "const a = require('./outputs/ads-runs/alerts.json'); console.log(a.map(x => '🛑 ' + (x.adSet ? x.campaign + ' → ' + x.adSet : x.campaign) + ' (' + x.verdict + ')').join('\n'))")
          MSG="*Meta-Ads-Alert*%0A%0A${ALERTS}%0A%0ADetails: outputs/ads-runs/latest.md"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" > /dev/null

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ads-runs/
          if git diff --staged --quiet; then
            echo "Keine neuen Daten, skipping commit."
          else
            git commit -m "ads: live-check $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi
