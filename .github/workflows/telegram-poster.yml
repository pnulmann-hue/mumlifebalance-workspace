name: Telegram Poster (Saison-Content)

# Postet fällige Saison-Beiträge in Patricias Öle-Telegram-Channel.
# Ersetzt den kaputten Railway-Worker: läuft alle 30 Min, postet alle
# scheduled_posts mit status='scheduled' && scheduled_for <= now.

on:
  schedule:
    - cron: '0,30 * * * *' # alle 30 Minuten (UTC)
  workflow_dispatch: {} # manueller Test-Trigger

concurrency:
  group: telegram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts/telegram-userbot
        run: npm ci

      - name: Run poster
        working-directory: scripts/telegram-userbot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFICATION_BOT_TOKEN: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          PATRICIA_TELEGRAM_USER_ID: ${{ secrets.PATRICIA_TELEGRAM_USER_ID }}
        run: npx tsx src/poster-once.ts
