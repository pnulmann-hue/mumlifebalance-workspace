name: Obsidian Vault Reindex

on:
  # Täglich 23:00 Schweiz (= 21:00 UTC im Sommer / 22:00 UTC im Winter)
  schedule:
    - cron: "0 22 * * *"
  # Manueller Trigger über GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Run reindex
        run: bash scripts/obsidian-reindex.sh

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "🤖 obsidian-reindex: Auto-Pflege _INDEX.md + Frontmatter-Tags

Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>"
            git push
            echo "✓ Reindex commit pushed"
          else
            echo "✓ Nothing to do — vault sauber"
          fi
