<section id="l46-satz" data-transition="push" style="background:#29556d; color:#f1ecdd; font-family:'Source Sans 3', Verdana, sans-serif; padding:128px; display:flex; flex-direction:column; justify-content:center; gap:32px"><h2 style="font-family:'Philosopher', Georgia, serif; font-size:92px; font-weight:700; line-height:1.15; color:#f1ecdd">Es liegt am Auftrag,<br>nicht an dir.</h2><p style="font-size:34px; font-weight:400; line-height:1.45; color:#12828c">Und einen Auftrag kannst du ändern.</p><aside>Viele geben an dieser Stelle auf, weil sie denken, sie seien zu blöd dafür. Sag diesen Satz so deutlich wie möglich.</aside></section>
