<section id="l44b-titel" data-transition="fade" style="background:#f7f4ec; color:#0c1c30; font-family:'Source Sans 3', Verdana, sans-serif; padding:128px; display:flex; flex-direction:column; gap:40px"><p style="font-size:26px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#12828c">Lektion 4.4b</p><h2 style="font-family:'Philosopher', Georgia, serif; font-size:88px; font-weight:700; line-height:1.1; color:#29556d">Damit nichts verloren geht</h2><p style="font-size:38px; font-weight:400; line-height:1.45; color:#5c6b73">Dein Arbeitsplatz liegt auf deinem Rechner. Was passiert, wenn der kaputtgeht?</p><aside>Diese Frage kam in allen vier fremden Calls, die ich mir angeschaut habe, als häufigste — und sie wurde nirgends richtig beantwortet. Nimm dir die Zeit dafür.</aside></section>
