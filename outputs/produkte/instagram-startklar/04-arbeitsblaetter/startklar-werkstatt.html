<title>Startklar-Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">

<style>
:root{
  --creme:#f1ecdd; --petrol:#12828c; --tief:#29556d; --orange:#dc822e;
  --ground:#f7f4ec; --card:#ffffff; --ink:#16323a; --ink-weich:#5a6b70;
  --linie:#e2dccd; --feld:#fdfcf8;
  --ok:#2f7d5c; --ok-bg:#e8f2ec; --warn:#b45e12; --warn-bg:#fbf0e2; --stop:#a8332a; --stop-bg:#f8e8e6;
  --schatten:0 1px 2px rgba(22,50,58,.06), 0 8px 24px rgba(22,50,58,.05);
  --radius:10px;
  --display:"Philosopher", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --creme:#1d2b30; --petrol:#4bb8bf; --tief:#8fb6c6; --orange:#e79a51;
    --ground:#121c20; --card:#1a262b; --ink:#e8e2d4; --ink-weich:#9dabaf;
    --linie:#2b3b41; --feld:#162126;
    --ok:#6cc79a; --ok-bg:#17302a; --warn:#e0a35f; --warn-bg:#33261a; --stop:#e58a80; --stop-bg:#331f1e;
    --schatten:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --creme:#1d2b30; --petrol:#4bb8bf; --tief:#8fb6c6; --orange:#e79a51;
  --ground:#121c20; --card:#1a262b; --ink:#e8e2d4; --ink-weich:#9dabaf;
  --linie:#2b3b41; --feld:#162126;
  --ok:#6cc79a; --ok-bg:#17302a; --warn:#e0a35f; --warn-bg:#33261a; --stop:#e58a80; --stop-bg:#331f1e;
  --schatten:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--display); font-weight:700; text-wrap:balance; margin:0}
p{margin:0}
button{font-family:inherit; font-size:inherit}
:focus-visible{outline:3px solid var(--petrol); outline-offset:2px; border-radius:4px}

/* ---------- Kopf ---------- */
.kopf{
  background:var(--tief); color:#f4efe3;
  padding:26px clamp(16px,4vw,40px) 22px;
}
:root[data-theme="dark"] .kopf, :root:not([data-theme="light"]) .kopf{color:#eef3f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kopf{background:#16323d}}
:root[data-theme="dark"] .kopf{background:#16323d}
.kopf-innen{max-width:1120px; margin:0 auto; display:flex; flex-wrap:wrap; gap:16px; align-items:baseline; justify-content:space-between}
.kopf h1{font-size:clamp(26px,4vw,36px); letter-spacing:.01em; color:inherit}
.kopf .unter{font-size:14.5px; opacity:.82; margin-top:4px; max-width:52ch}
.fortschritt{display:flex; align-items:center; gap:10px; font-size:14px; opacity:.9}
.balken{width:120px; height:6px; border-radius:99px; background:rgba(255,255,255,.22); overflow:hidden}
.balken span{display:block; height:100%; background:#7fd0d4; width:0; transition:width .35s ease}
.zaehler{font-variant-numeric:tabular-nums}

/* ---------- Rahmen ---------- */
.rahmen{max-width:1120px; margin:0 auto; padding:clamp(16px,3vw,32px); display:grid; gap:clamp(16px,3vw,32px); grid-template-columns:250px 1fr; align-items:start}
@media (max-width:860px){ .rahmen{grid-template-columns:1fr} }

/* ---------- Stationsleiste ---------- */
.rail{position:sticky; top:16px; display:flex; flex-direction:column; gap:2px}
@media (max-width:860px){
  .rail{position:static; flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:6px; -webkit-overflow-scrolling:touch}
}
.rail-gruppe{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-weich); font-weight:700; margin:14px 0 6px; padding-left:10px}
@media (max-width:860px){ .rail-gruppe{display:none} }
.rail button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:transparent; border:0; border-radius:8px; padding:8px 10px; cursor:pointer;
  color:var(--ink); font-size:14.5px; line-height:1.3;
}
@media (max-width:860px){ .rail button{width:auto; white-space:nowrap; background:var(--card); border:1px solid var(--linie)} }
.rail button:hover{background:var(--creme)}
.rail button[aria-current="true"]{background:var(--petrol); color:#fff}
.rail button[aria-current="true"] .punkt{border-color:#fff}
.punkt{flex:0 0 auto; width:15px; height:15px; border-radius:50%; border:2px solid var(--ink-weich); display:grid; place-items:center; font-size:10px; line-height:1}
.punkt.fertig{background:var(--ok); border-color:var(--ok); color:#fff}
.punkt.fertig::after{content:"✓"}

/* ---------- Station ---------- */
.karte{background:var(--card); border:1px solid var(--linie); border-radius:var(--radius); box-shadow:var(--schatten); padding:clamp(18px,3.5vw,30px)}
.eyebrow{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); font-weight:700}
.karte h2{font-size:clamp(21px,3vw,27px); margin:6px 0 8px; color:var(--tief)}
.lead{color:var(--ink-weich); max-width:62ch; margin-bottom:20px}

.feldgruppe{display:flex; flex-direction:column; gap:16px; margin-bottom:20px}
label.feld{display:flex; flex-direction:column; gap:5px}
label.feld .titel{font-weight:600; font-size:14.5px}
label.feld .hinweis{font-size:13px; color:var(--ink-weich)}
input[type=text], textarea{
  font-family:inherit; font-size:16px; color:var(--ink);
  background:var(--feld); border:1px solid var(--linie); border-radius:8px; padding:10px 12px; width:100%;
  transition:border-color .15s ease;
}
input[type=text]:focus, textarea:focus{border-color:var(--petrol)}
textarea{resize:vertical; min-height:78px; line-height:1.5}

.wahl{display:flex; flex-direction:column; gap:8px}
.wahl label, .haken label{
  display:flex; gap:10px; align-items:flex-start; padding:10px 12px;
  border:1px solid var(--linie); border-radius:8px; background:var(--feld); cursor:pointer; font-size:15px;
}
.wahl label:hover, .haken label:hover{border-color:var(--petrol)}
.wahl input, .haken input{margin-top:3px; accent-color:var(--petrol); flex:0 0 auto; width:17px; height:17px}
.haken{display:flex; flex-direction:column; gap:7px}

.aktion{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:4px}
.knopf{
  border:0; border-radius:8px; padding:11px 20px; font-weight:600; cursor:pointer;
  background:var(--petrol); color:#fff;
}
.knopf:hover{filter:brightness(1.08)}
.knopf.stumm{background:transparent; color:var(--petrol); border:1px solid var(--petrol)}
.knopf.stumm:hover{background:var(--creme); filter:none}

/* ---------- Rückmeldung ---------- */
.antwort{margin-top:20px; display:flex; flex-direction:column; gap:9px}
.antwort:empty{display:none}
.zeile{display:flex; gap:11px; padding:12px 14px; border-radius:8px; font-size:15px; line-height:1.5; border-left:4px solid}
.zeile b{font-weight:700}
.zeile .zeichen{flex:0 0 auto; font-weight:700; font-size:14px; line-height:1.6}
.z-ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.z-warn{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.z-stop{background:var(--stop-bg); border-color:var(--stop); color:var(--stop)}
.zeile span.txt{color:var(--ink)}

.tipp{
  margin-top:18px; border:1px dashed var(--orange); border-radius:8px; padding:14px 16px;
  background:color-mix(in srgb, var(--orange) 7%, transparent);
  font-size:14.5px;
}
.tipp .kopfzeile{font-weight:700; color:var(--orange); margin-bottom:3px}
.tipp-reihe{display:flex; flex-wrap:wrap; gap:9px; margin-top:12px}
.tipp a.tipp-link{
  display:inline-block; padding:9px 16px; border-radius:7px;
  background:var(--orange); color:#fff; font-weight:700; text-decoration:none; font-size:14px;
}
.tipp a.tipp-link.zweit{background:transparent; color:var(--orange); border:1px solid var(--orange)}
.tipp a.tipp-link:hover{filter:brightness(1.07)}
.tipp a.tipp-link.zweit:hover{background:color-mix(in srgb, var(--orange) 12%, transparent); filter:none}

/* ---------- Patricias Blick (KI-Analyse) ---------- */
.blick{
  margin-top:18px; border:1px solid var(--petrol); border-left-width:4px; border-radius:8px;
  padding:16px 18px; background:color-mix(in srgb, var(--petrol) 6%, transparent);
}
.blick .kopfzeile{
  font-family:var(--display); font-size:16px; font-weight:700; color:var(--petrol); margin-bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.blick p{margin:0 0 10px; font-size:15px; line-height:1.6}
.blick p:last-child{margin-bottom:0}
.blick.laedt .kopfzeile::after{
  content:""; width:13px; height:13px; border-radius:50%;
  border:2px solid var(--petrol); border-top-color:transparent;
  animation:dreh .8s linear infinite;
}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .blick.laedt .kopfzeile::after{animation:none; opacity:.4} }
.blick .fehlt{font-size:14px; color:var(--ink-weich)}

.zugang{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.zugang input{
  font-family:inherit; font-size:14px; padding:7px 11px; width:180px;
  background:var(--feld); border:1px solid var(--linie); border-radius:7px; color:var(--ink);
}
.zugang input:focus{border-color:var(--petrol); outline:none}

.fuss{display:flex; justify-content:space-between; gap:12px; margin-top:26px; padding-top:18px; border-top:1px solid var(--linie)}
.fuss .knopf.stumm[disabled]{opacity:.35; cursor:not-allowed}

.werkzeug{max-width:1120px; margin:0 auto; padding:0 clamp(16px,3vw,32px) 48px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:14px; color:var(--ink-weich)}
.werkzeug .knopf{padding:8px 14px; font-size:14px}

@media print{
  .rail,.werkzeug,.fuss,.aktion{display:none}
  .karte{box-shadow:none; border:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div class="kopf">
  <div class="kopf-innen">
    <div>
      <h1>Startklar-Werkstatt</h1>
      <p class="unter">Dein Mitmach-Heft zum Tippen. Du schreibst rein, was du auf Instagram stehen haben willst — und kriegst sofort zurück, was schon sitzt und was noch nicht.</p>
    </div>
    <div class="fortschritt">
      <span class="zaehler"><span id="fertig">0</span>/12</span>
      <div class="balken"><span id="balken"></span></div>
    </div>
  </div>
</div>

<div class="rahmen">
  <nav class="rail" id="rail" aria-label="Stationen"></nav>
  <main>
    <section class="karte" id="buehne" aria-live="polite"></section>
  </main>
</div>

<div class="werkzeug">
  <button class="knopf stumm" id="kopieren">Alles kopieren</button>
  <button class="knopf stumm" id="drucken">Drucken</button>
  <button class="knopf stumm" id="leeren">Von vorn</button>
  <span class="zugang" id="zugang" hidden>
    <label for="codefeld">Zugangscode</label>
    <input type="text" id="codefeld" placeholder="STARTKLAR-..." autocomplete="off">
  </span>
  <span id="status"></span>
</div>

<script>
"use strict";

/* ---------------------------------------------------------------
   Regelwerk — die Prüfungen kommen aus Patricias Unterricht.
   Rückgabe je Prüfung: {level:"ok"|"warn"|"stop", text:"..."}
----------------------------------------------------------------*/

const FIRMEN = ["doterra","ringana","herbalife","lifeplus","life plus","pm international","pm-international","juice plus","juiceplus","zinzino","forever living","younique","nuskin","nu skin","arbonne","amway","tupperware","vorwerk","thermomix","lr health","farmasi","itworks","it works","modere","kyani","enagic","partylite","pmi"];
const GRUSS = ["hallo","hey","hi ","guten morgen","guten abend","ihr lieben","meine lieben","grüezi","gruezi","servus","moin","willkommen","schön dass du"];
const ZEITANKER = ["gestern","heute","vorgestern","letzte woche","letzten","vorhin","neulich","vor drei","vor zwei","vor einem","seit","heute morgen","gerade eben","diese woche","vor kurzem"];
const CTA = ["↓","kommentier","schreib","hol dir","klick","link","gratis","kostenlos","speicher","teile","folg","melde","sichere","hier"];
const FLOSKEL = ["speicher diesen post","speichere diesen post","swipe","in diesem post zeige ich dir","lies die caption","mehr dazu in meinen stories","mehr in meinen stories"];

const norm = s => (s||"").toLowerCase();
const woerter = s => (s||"").trim().split(/\s+/).filter(Boolean);
const saetze = s => (s||"").split(/[.!?…]+/).map(x=>x.trim()).filter(Boolean);
const hat = (s,liste) => liste.find(k => norm(s).includes(k));
const beginntMit = (s,liste) => liste.find(k => norm(s).trimStart().startsWith(k));

const ok   = t => ({level:"ok",   text:t});
const warn = t => ({level:"warn", text:t});
const stop = t => ({level:"stop", text:t});

function firmenCheck(text, wo){
  const f = hat(text, FIRMEN);
  return f ? stop(`Ich lese „${f}“ in ${wo}. Der Firmenname macht dich zu einer von tausend — nimm ihn raus und schreib stattdessen hin, wobei du hilfst.`) : null;
}

/* ---------------------------------------------------------------
   Stationen
----------------------------------------------------------------*/

const STATIONEN = [

/* ---------- Modul 1 ---------- */
{
  id:"konto", modul:"Modul 1 · Dein Profil steht", lektion:"Lektion 1.1", kurz:"Konto",
  titel:"Neues Konto oder dein altes umbauen?",
  lead:"Die erste Entscheidung, an der die meisten zwei Wochen hängen. Wir klären sie jetzt.",
  felder:[
    {typ:"wahl", key:"weg", titel:"Was machst du?", optionen:[
      "Ich stelle mein bestehendes Profil um und nehme meine Leute mit.",
      "Ich lege ein neues Konto an, weil mein altes zu privat ist."
    ]},
    {typ:"lang", key:"archiv", titel:"Wenn du umstellst: welche Beiträge archivierst du?", hinweis:"Stichworte reichen. Archivieren ist kein Löschen — die Bilder liegen in einer Schublade, die nur du siehst."}
  ],
  pruefen(v){
    const r=[];
    if(!v.weg) return [warn("Kreuz zuerst an, welchen Weg du gehst.")];
    if(v.weg.startsWith("Ich lege ein neues")){
      r.push(warn("Neues Konto heisst: du startest bei null Followern. Überleg nochmal, ob du deine Leute nicht doch mitnehmen willst — deine Tante und die Mädels aus dem Turnverein sind deine ersten Zuschauerinnen, auch wenn sie nie kaufen."));
    } else {
      r.push(ok("Gute Wahl. Menschen, die dich schon kennen, sind mehr wert als ein aufgeräumtes leeres Konto."));
      if(!v.archiv || v.archiv.trim().length<3) r.push(warn("Schreib noch auf, was du archivierst. Sonst machst du es nicht."));
      else r.push(ok("Archiv-Liste steht. Mach das direkt jetzt und nicht später."));
    }
    return r;
  },
  tipp:null
},

{
  id:"namen", modul:"Modul 1 · Dein Profil steht", lektion:"Lektion 1.2", kurz:"Namensfelder",
  titel:"Deine zwei Namensfelder",
  lead:"Der Username ist deine Adresse. Das Name-Feld ist dein Suchbegriff. Nur diese beiden durchsucht Instagram — deine Bio nicht.",
  felder:[
    {typ:"kurz", key:"user", titel:"Dein @username", hinweis:"Kurz, merkbar, ohne Zahlenwüste."},
    {typ:"kurz", key:"name", titel:"Dein Name-Feld", hinweis:"Dein Name plus wobei du hilfst. Zum Beispiel: Sandra · Energie für Mamas ab 35"}
  ],
  pruefen(v){
    const r=[];
    const u=(v.user||"").replace(/^@/,"");
    if(!u) r.push(warn("Trag deinen Username ein."));
    else{
      const f=firmenCheck(u,"deinem Username"); if(f) r.push(f);
      if(u.length>25) r.push(warn(`${u.length} Zeichen sind viel. Kürzer merkt man sich leichter.`));
      if((u.match(/\d/g)||[]).length>=3) r.push(warn("Drei oder mehr Ziffern im Namen sehen nach Zweitkonto aus. Geht das ohne?"));
      if(!f && u.length<=25) r.push(ok("Username passt."));
    }
    const n=v.name||"";
    if(!n) r.push(warn("Das Name-Feld ist leer — genau hier verschenken die meisten ihre Sichtbarkeit."));
    else{
      const f=firmenCheck(n,"deinem Name-Feld"); if(f) r.push(f);
      if(woerter(n).length<3) r.push(warn("Da steht nur dein Name. Schreib dazu, wobei du hilfst — sonst findet dich niemand, der dich nicht schon kennt."));
      else if(n.length>60) r.push(warn(`${n.length} Zeichen — das wird auf dem Handy abgeschnitten. Bleib unter 40.`));
      else if(!f) r.push(ok("Dein Name-Feld sagt, worum es geht. Genau so."));
    }
    return r;
  },
  tipp:{kopf:"Dein Profil ist dein Schaufenster", text:"Wie du Name-Feld, Bio und die ersten drei Beiträge so aufstellst, dass eine Fremde in drei Sekunden denkt „die ist meine Expertin“ — das ist die Schaufenster-Strategie aus der Instagram-Kundenmaschine.", link:{url:"https://mumlifebalance.thrivecart.com/instagram-kundenmaschine/", label:"Instagram-Kundenmaschine ansehen"}}
},

{
  id:"bio", ki:true, modul:"Modul 1 · Dein Profil steht", lektion:"Lektion 1.3", kurz:"Bio",
  titel:"Deine Bio in vier Zeilen",
  lead:"Zwei bis drei Sekunden schaut jemand auf dein Profil, bevor er entscheidet. Schreib erst hier, dann tipp es ab.",
  felder:[
    {typ:"kurz", key:"z1", titel:"Zeile 1 — Wem hilfst du wobei?"},
    {typ:"kurz", key:"z2", titel:"Zeile 2 — Warum ausgerechnet du?", hinweis:"Deine Erfahrung, eine Zahl, dein Leben."},
    {typ:"kurz", key:"z3", titel:"Zeile 3 — Was gibt es hier zu holen?"},
    {typ:"kurz", key:"z4", titel:"Zeile 4 — Was soll sie jetzt tun?", hinweis:"Ein Pfeil nach unten auf deinen Link gehört hierhin."}
  ],
  pruefen(v){
    const r=[];
    const alle=[v.z1,v.z2,v.z3,v.z4].map(x=>x||"");
    const leer=alle.filter(x=>!x.trim()).length;
    const ganz=alle.join("\n");
    if(leer===4) return [warn("Noch nichts drin. Fang mit Zeile 1 an — die ist die wichtigste.")];
    if(leer) r.push(warn(`${leer} von 4 Zeilen sind noch leer. Eine halbe Bio wirkt wie ein halbes Schaufenster.`));
    const f=firmenCheck(ganz,"deiner Bio"); if(f) r.push(f);
    if(/beraterin bei|vertriebspartnerin|selbstständige partnerin|unabhängige beraterin/i.test(ganz))
      r.push(stop("„Beraterin bei …“ sagt, für wen du arbeitest — nicht, wobei du jemandem hilfst. Dreh es um."));
    const laenge=ganz.replace(/\n/g,"").length;
    if(laenge>150) r.push(stop(`${laenge} Zeichen. Instagram lässt nur 150 zu — der Rest fällt weg.`));
    else r.push(ok(`${laenge} von 150 Zeichen. ${laenge<50?"Da ist noch Platz.":"Gute Länge."}`));
    if(v.z1 && woerter(v.z1).length<3) r.push(warn("Zeile 1 ist sehr knapp. Da muss stehen, WEM du WOBEI hilfst."));
    if(v.z4 && !hat(v.z4,CTA)) r.push(warn("In Zeile 4 fehlt die Aufforderung. Ein Pfeil nach unten und ein Wort wie „gratis“ oder „hol dir“ reichen."));
    if(v.z4 && hat(v.z4,CTA)) r.push(ok("Zeile 4 sagt, was als Nächstes passiert."));
    return r;
  },
  tipp:{kopf:"Und jetzt der Bio-Check", text:"Wenn deine Bio steht, lass sie durch meinen Bio-Check laufen — du bekommst zurück, was schon zieht und was noch schwammig ist. Den Link findest du in deinem Kursbereich. Und wenn dabei rauskommt, dass dein Thema selbst noch wackelt: genau dafür gibt es „Finde dein Thema als Network-Mama in 60 Minuten“.", link:{url:"https://mumlifebalance.thrivecart.com/thema-finden/", label:"Finde dein Thema ansehen"}}
},

{
  id:"schaufenster", modul:"Modul 1 · Dein Profil steht", lektion:"Lektion 1.4", kurz:"Schaufenster",
  titel:"Highlights und dein Link",
  lead:"Die kleinen Kreise unter deiner Bio sind die Stelle, an der jemand nachschaut, ob du echt bist. Fünf Ordner reichen.",
  felder:[
    {typ:"haken", key:"ordner", titel:"Angelegt", optionen:["Über mich","Mein Thema","Feedback","Gratis für dich","Mein Angebot"]},
    {typ:"kurz", key:"link", titel:"Welcher Link steht in deiner Bio?"}
  ],
  pruefen(v){
    const r=[];
    const n=(v.ordner||[]).length;
    if(n===0) r.push(warn("Noch kein Highlight angelegt. Poste fünf einfache Stories hintereinander und pack sie sofort in die Ordner — niemand merkt, dass du das an einem Nachmittag gemacht hast."));
    else if(n<5) r.push(warn(`${n} von 5 Ordnern stehen. Leg auch die leeren an — dann weisst du, wo die erste Rückmeldung hingehört, wenn sie kommt.`));
    else r.push(ok("Alle fünf stehen. Dein Schaufenster ist eingerichtet."));
    if(!v.link) r.push(warn("Ohne Link in der Bio führt dein Profil nirgendwohin."));
    else if(/linktr\.ee|linktree/i.test(v.link)) r.push(warn("Linktree kostet dich einen Zwischenklick. Instagram lässt dich inzwischen mehrere Links direkt eintragen — nimm lieber das."));
    else r.push(ok("Link steht."));
    return r;
  },

/* ---------------------------------------------------------------
   Zustand + Speicherung
----------------------------------------------------------------*/
/* ---------------------------------------------------------------
   Dienst fuer die ausfuehrliche Analyse.
   URL leer lassen = nur Formcheck (die Datei laeuft dann komplett offline).
   Nach dem Vercel-Deploy hier die Adresse eintragen, z.B.
   "https://startklar.mumlifebalance.ch/api/pruefen"
----------------------------------------------------------------*/
const DIENST_URL = "";

const SPEICHER="startklar-werkstatt-v1";
const CODE_SPEICHER="startklar-code";
let daten = {};
let aktiv = 0;

try{ daten = JSON.parse(localStorage.getItem(SPEICHER)||"{}"); }catch(e){ daten={}; }

function sichern(){
  try{ localStorage.setItem(SPEICHER, JSON.stringify(daten)); }
  catch(e){ /* privater Modus: läuft ohne Speichern weiter */ }
}
function wert(id){ return daten[id] || (daten[id]={}); }

function zugangscode(){
  try{ return localStorage.getItem(CODE_SPEICHER)||""; }catch(e){ return ""; }
}
function zugangscodeSetzen(c){
  try{ localStorage.setItem(CODE_SPEICHER, c); }catch(e){}
}

/** Ihr Thema aus Bio + Name-Feld — das ist der Kontext, gegen den geprueft wird. */
function themaDerFrau(){
  const bio=daten.bio||{}, namen=daten.namen||{};
  const teile=[namen.name, bio.z1, bio.z2].map(x=>(x||"").trim()).filter(Boolean);
  return teile.join(" \u00b7 ");
}

async function analyseHolen(st, v, formcheck){
  const antwort = await fetch(DIENST_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      station: st.id,
      eingabe: v,
      thema: themaDerFrau(),
      formcheck: formcheck,
      code: zugangscode()
    })
  });
  const daten2 = await antwort.json().catch(()=>({}));
  if(!antwort.ok) throw new Error(daten2.text || "Der Dienst antwortet gerade nicht. Sag Patricia bitte kurz Bescheid, damit sie es weiss.");
  return daten2.text || "";
}
function erledigt(st){
  const v = daten[st.id]; if(!v) return false;
  return Object.values(v).some(x => Array.isArray(x) ? x.length : String(x||"").trim());
}

/* ---------------------------------------------------------------
   Aufbau
----------------------------------------------------------------*/
const rail = document.getElementById("rail");
const buehne = document.getElementById("buehne");

function railBauen(){
  rail.innerHTML="";
  let letztesModul=null;
  STATIONEN.forEach((st,i)=>{
    if(st.modul!==letztesModul){
      const h=document.createElement("div");
      h.className="rail-gruppe"; h.textContent=st.modul;
      rail.appendChild(h); letztesModul=st.modul;
    }
    const b=document.createElement("button");
    b.type="button";
    b.setAttribute("aria-current", i===aktiv ? "true" : "false");
    const p=document.createElement("span");
    p.className="punkt"+(erledigt(st)?" fertig":"");
    b.appendChild(p);
    b.appendChild(document.createTextNode(st.kurz));
    b.addEventListener("click",()=>{ aktiv=i; zeichnen(); window.scrollTo({top:0,behavior:"smooth"}); });
    rail.appendChild(b);
  });
  const n=STATIONEN.filter(erledigt).length;
  document.getElementById("fertig").textContent=n;
  document.getElementById("balken").style.width=(n/STATIONEN.length*100)+"%";
}

function feldBauen(st,f,v){
  if(f.typ==="wahl" || f.typ==="haken"){
    const box=document.createElement("div");
    const t=document.createElement("div");
    t.className="titel"; t.style.marginBottom="7px"; t.textContent=f.titel;
    box.appendChild(t);
    const liste=document.createElement("div");
    liste.className = f.typ==="wahl" ? "wahl" : "haken";
    f.optionen.forEach(opt=>{
      const l=document.createElement("label");
      const i=document.createElement("input");
      i.type = f.typ==="wahl" ? "radio" : "checkbox";
      i.name = st.id+"-"+f.key;
      if(f.typ==="wahl") i.checked = v[f.key]===opt;
      else i.checked = (v[f.key]||[]).includes(opt);
      i.addEventListener("change",()=>{
        if(f.typ==="wahl") v[f.key]=opt;
        else{
          const arr=new Set(v[f.key]||[]);
          i.checked ? arr.add(opt) : arr.delete(opt);
          v[f.key]=[...arr];
        }
        sichern(); railBauen();
      });
      l.appendChild(i);
      l.appendChild(document.createTextNode(opt));
      liste.appendChild(l);
    });
    box.appendChild(liste);
    return box;
  }
  const l=document.createElement("label");
  l.className="feld";
  const t=document.createElement("span"); t.className="titel"; t.textContent=f.titel; l.appendChild(t);
  if(f.hinweis){ const h=document.createElement("span"); h.className="hinweis"; h.textContent=f.hinweis; l.appendChild(h); }
  const el = f.typ==="lang" ? document.createElement("textarea") : document.createElement("input");
  if(f.typ!=="lang") el.type="text";
  el.value = v[f.key]||"";
  el.addEventListener("input",()=>{ v[f.key]=el.value; sichern(); railBauen(); });
  l.appendChild(el);
  return l;
}

function zeichnen(){
  const st=STATIONEN[aktiv];
  const v=wert(st.id);
  buehne.innerHTML="";

  const eb=document.createElement("p"); eb.className="eyebrow"; eb.textContent=st.lektion;
  const h2=document.createElement("h2"); h2.textContent=st.titel;
  const lead=document.createElement("p"); lead.className="lead"; lead.textContent=st.lead;
  buehne.append(eb,h2,lead);

  const gruppe=document.createElement("div"); gruppe.className="feldgruppe";
  st.felder.forEach(f=>gruppe.appendChild(feldBauen(st,f,v)));
  buehne.appendChild(gruppe);

  const aktion=document.createElement("div"); aktion.className="aktion";
  const pruef=document.createElement("button");
  pruef.className="knopf"; pruef.type="button"; pruef.textContent="Prüf das mal";
  aktion.appendChild(pruef);
  buehne.appendChild(aktion);

  const antwort=document.createElement("div"); antwort.className="antwort";
  buehne.appendChild(antwort);

  pruef.addEventListener("click",async ()=>{
    antwort.innerHTML="";
    const meldungen=st.pruefen(v)||[];
    meldungen.forEach(m=>{
      const z=document.createElement("div");
      z.className="zeile z-"+m.level;
      const ic=document.createElement("span");
      ic.className="zeichen";
      ic.textContent = m.level==="ok" ? "✓" : m.level==="warn" ? "!" : "✕";
      const tx=document.createElement("span"); tx.className="txt"; tx.textContent=m.text;
      z.append(ic,tx); antwort.appendChild(z);
    });
    if(st.tipp){
      const t=document.createElement("div"); t.className="tipp";
      const k=document.createElement("div"); k.className="kopfzeile"; k.textContent=st.tipp.kopf;
      const p=document.createElement("p"); p.textContent=st.tipp.text;
      t.append(k,p);
      const verweise = st.tipp.links || (st.tipp.link ? [st.tipp.link] : []);
      if(verweise.length){
        const reihe=document.createElement("div"); reihe.className="tipp-reihe";
        verweise.forEach((lk,i)=>{
          const a=document.createElement("a");
          a.className="tipp-link"+(i?" zweit":"");
          a.href=lk.url; a.target="_blank"; a.rel="noopener";
          a.textContent=lk.label+" \u2192";
          reihe.appendChild(a);
        });
        t.appendChild(reihe);
      }
      antwort.appendChild(t);
    }
    railBauen();

    /* ---- Patricias Blick: die ausfuehrliche Analyse ---- */
    if(!st.ki || !DIENST_URL) return;

    const blick=document.createElement("div");
    blick.className="blick laedt";
    const bk=document.createElement("div"); bk.className="kopfzeile";
    bk.appendChild(document.createTextNode("Ich schau mir das genauer an"));
    blick.appendChild(bk);
    antwort.insertBefore(blick, antwort.firstChild);

    try{
      const text = await analyseHolen(st, v, meldungen.map(m=>m.text));
      blick.className="blick";
      bk.textContent="Mein Blick drauf";
      text.split(/\n{2,}|\n/).map(x=>x.trim()).filter(Boolean).forEach(abs=>{
        const p=document.createElement("p"); p.textContent=abs; blick.appendChild(p);
      });
    }catch(e){
      blick.className="blick";
      bk.textContent="Der ausf\u00fchrliche Blick fehlt gerade";
      const p=document.createElement("p"); p.className="fehlt";
      let meldung = /bescheid|patricia/i.test(e.message)
        ? e.message
        : e.message+" Sag Patricia bitte kurz Bescheid, damit sie es weiss.";
      if(!/Formcheck/.test(meldung)) meldung += " Der Formcheck oben gilt trotzdem.";
      p.textContent = meldung;
      blick.appendChild(p);
    }
  });

  const fuss=document.createElement("div"); fuss.className="fuss";
  const zurueck=document.createElement("button");
  zurueck.className="knopf stumm"; zurueck.type="button"; zurueck.textContent="Zurück";
  zurueck.disabled = aktiv===0;
  zurueck.addEventListener("click",()=>{ if(aktiv>0){aktiv--; zeichnen(); window.scrollTo({top:0,behavior:"smooth"});} });
  const weiter=document.createElement("button");
  weiter.className="knopf"; weiter.type="button";
  weiter.textContent = aktiv===STATIONEN.length-1 ? "Fertig" : "Weiter";
  weiter.disabled = aktiv===STATIONEN.length-1;
  weiter.addEventListener("click",()=>{ if(aktiv<STATIONEN.length-1){aktiv++; zeichnen(); window.scrollTo({top:0,behavior:"smooth"});} });
  fuss.append(zurueck,weiter);
  buehne.appendChild(fuss);

  railBauen();
}

const status=document.getElementById("status");
function melden(t){ status.textContent=t; setTimeout(()=>{ if(status.textContent===t) status.textContent=""; },3500); }

function alsText(){
  const zeilen=["STARTKLAR — deine Antworten",""];
  STATIONEN.forEach(st=>{
    const v=daten[st.id]; if(!v) return;
    const inhalt=st.felder.map(f=>{
      const x=v[f.key];
      const s=Array.isArray(x) ? x.join(", ") : (x||"").trim();
      return s ? "  "+f.titel+": "+s : null;
    }).filter(Boolean);
    if(inhalt.length){ zeilen.push(st.lektion+" — "+st.titel, ...inhalt, ""); }
  });
  return zeilen.join("\n");
}

document.getElementById("kopieren").addEventListener("click", async ()=>{
  const t=alsText();
  try{ await navigator.clipboard.writeText(t); melden("Kopiert — jetzt kannst du es irgendwo einfügen."); }
  catch(e){ melden("Kopieren hat nicht geklappt. Nimm stattdessen Drucken."); }
});
document.getElementById("drucken").addEventListener("click",()=>window.print());

const zugang=document.getElementById("zugang");
const codefeld=document.getElementById("codefeld");
if(DIENST_URL){
  zugang.hidden=false;
  codefeld.value=zugangscode();
  codefeld.addEventListener("input",()=>zugangscodeSetzen(codefeld.value.trim()));
}
document.getElementById("leeren").addEventListener("click",()=>{
  if(!confirm("Alles löschen und von vorn anfangen?")) return;
  daten={}; sichern(); aktiv=0; zeichnen(); melden("Alles geleert.");
});

zeichnen();
