<script>
const DATEN = [{"name": "Begrüssung (erste Seite im Kurs)", "titelfeld": "Schön, dass du da bist", "eigenesFeld": false, "html": "<h2>Schön, dass du da bist</h2>\n<p>Wenn du hier gelandet bist, kennst du das wahrscheinlich: Du hast schon einiges darüber gelesen, wie eine gute Bio aussehen soll und was man auf Instagram so postet — und trotzdem sitzt du vor deinem Handy und weisst nicht, wo du eigentlich hindrücken musst. Fragen magst du auch niemanden, weil es sich komisch anfühlt, bei etwas so Grundsätzlichem nachzuhaken.</p>\n<p>Genau da fangen wir an. In den nächsten rund hundert Minuten richten wir zusammen dein Profil ein, du lädst dein erstes Reel hoch, dein erstes Karussell und deine erste Story, und am Ende hast du deine ersten fünf Beiträge geplant. Klick für Klick, auf meinem Handy mitgefilmt, damit du nebenher auf deinem dasselbe machen kannst.</p>\n<p><strong>Drei Dinge vorweg:</strong></p>\n<p><strong>Nimm dein Handy in die Hand.</strong> Dieser Kurs ist zum Mitmachen gebaut, nicht zum Anschauen. Wer nur zuschaut, hat am Ende ein gutes Gefühl und ein leeres Profil.</p>\n<p><strong>Fertig schlägt perfekt.</strong> Deine Bio wird beim ersten Mal nicht die Beste sein, die du je schreibst, und dein erstes Reel auch nicht. Beides lässt sich jederzeit ändern. Was sich nicht ändern lässt, sind die Monate, in denen gar nichts online war.</p>\n<p><strong>Du brauchst keine Technik-Ader.</strong> Ich habe das selber neben vier Kindern gelernt, und zwar genau so, wie du es hier siehst: eine Sache nach der anderen, bis sie steht.</p>\n<p>Zu jeder Lektion gehört eine Station in der Startklar-Werkstatt — dort tippst du rein, was nachher auf deinem Profil stehen soll. Den Link findest du gleich unter diesem Text.</p>\n<p>Leg los mit Modul 1. Wir sehen uns dort.</p>", "text": "Schön, dass du da bist\n\nWenn du hier gelandet bist, kennst du das wahrscheinlich: Du hast schon einiges darüber gelesen, wie eine gute Bio aussehen soll und was man auf Instagram so postet — und trotzdem sitzt du vor deinem Handy und weisst nicht, wo du eigentlich hindrücken musst. Fragen magst du auch niemanden, weil es sich komisch anfühlt, bei etwas so Grundsätzlichem nachzuhaken.\n\nGenau da fangen wir an. In den nächsten rund hundert Minuten richten wir zusammen dein Profil ein, du lädst dein erstes Reel hoch, dein erstes Karussell und deine erste Story, und am Ende hast du deine ersten fünf Beiträge geplant. Klick für Klick, auf meinem Handy mitgefilmt, damit du nebenher auf deinem dasselbe machen kannst.\n\nDrei Dinge vorweg:\n\nNimm dein Handy in die Hand. Dieser Kurs ist zum Mitmachen gebaut, nicht zum Anschauen. Wer nur zuschaut, hat am Ende ein gutes Gefühl und ein leeres Profil.\n\nFertig schlägt perfekt. Deine Bio wird beim ersten Mal nicht die Beste sein, die du je schreibst, und dein erstes Reel auch nicht. Beides lässt sich jederzeit ändern. Was sich nicht ändern lässt, sind die Monate, in denen gar nichts online war.\n\nDu brauchst keine Technik-Ader. Ich habe das selber neben vier Kindern gelernt, und zwar genau so, wie du es hier siehst: eine Sache nach der anderen, bis sie steht.\n\nZu jeder Lektion gehört eine Station in der Startklar-Werkstatt — dort tippst du rein, was nachher auf deinem Profil stehen soll. Den Link findest du gleich unter diesem Text.\n\nLeg los mit Modul 1. Wir sehen uns dort."}, {"name": "Die Startklar-Werkstatt (eigene Seite oder Block unter der Begrüssung)", "titelfeld": "Deine Werkstatt — hier tippst du mit", "eigenesFeld": false, "html": "<h2>Deine Werkstatt — hier tippst du mit</h2>\n<p>Die Werkstatt ist dein Mitmach-Heft zum Kurs. Sie hat <strong>zwölf Stationen</strong>, für jede Lektion eine, und du füllst sie aus, während du das Video schaust.</p>\n<p>Du tippst dort hinein, was später wirklich auf deinem Profil stehen soll: deine Namensfelder, deine Bio, deine fünf Highlight-Ordner, dein Link. Und du bekommst sofort zurück, was schon sitzt und was noch zu schwammig ist — nicht erst, wenn es schon online steht und du dich fragst, warum niemand reagiert.</p>\n<p>Oben siehst du deinen Fortschritt, und mit <strong>Alles kopieren</strong> holst du dir am Ende deine fertigen Texte am Stück heraus, um sie in Instagram einzusetzen. <strong>Drucken</strong> gibt dir das Ganze auf Papier, falls du lieber mit einem Stift denkst.</p>\n<p>👉 <strong><a href=\"https://startklar.mumlifebalance.ch\">Zur Startklar-Werkstatt</a></strong></p>\n<p>Leg dir den Link gleich als Lesezeichen an, du brauchst ihn in jeder Lektion.</p>\n<p>Ganz unten in der Werkstatt gibt es ein Feld <strong>Zugangscode</strong>. Trag dort <strong>STARTKLAR_KUNDE</strong> ein, einmal, dann merkt sich dein Browser ihn. Damit bekommst du zu jeder Station meine ausführliche Rückmeldung dazu. Ohne Code läuft die Werkstatt trotzdem — du siehst dann nur die schnelle Prüfung, nicht den langen Text.</p>", "text": "Deine Werkstatt — hier tippst du mit\n\nDie Werkstatt ist dein Mitmach-Heft zum Kurs. Sie hat zwölf Stationen, für jede Lektion eine, und du füllst sie aus, während du das Video schaust.\n\nDu tippst dort hinein, was später wirklich auf deinem Profil stehen soll: deine Namensfelder, deine Bio, deine fünf Highlight-Ordner, dein Link. Und du bekommst sofort zurück, was schon sitzt und was noch zu schwammig ist — nicht erst, wenn es schon online steht und du dich fragst, warum niemand reagiert.\n\nOben siehst du deinen Fortschritt, und mit Alles kopieren holst du dir am Ende deine fertigen Texte am Stück heraus, um sie in Instagram einzusetzen. Drucken gibt dir das Ganze auf Papier, falls du lieber mit einem Stift denkst.\n\n👉 [Zur Startklar-Werkstatt](https://startklar.mumlifebalance.ch)\n\nLeg dir den Link gleich als Lesezeichen an, du brauchst ihn in jeder Lektion.\n\nGanz unten in der Werkstatt gibt es ein Feld Zugangscode. Trag dort STARTKLAR_KUNDE ein, einmal, dann merkt sich dein Browser ihn. Damit bekommst du zu jeder Station meine ausführliche Rückmeldung dazu. Ohne Code läuft die Werkstatt trotzdem — du siehst dann nur die schnelle Prüfung, nicht den langen Text."}, {"name": "Modul 1 — Dein Profil steht", "titelfeld": "Modul 1 — Dein Profil steht", "eigenesFeld": true, "html": "<p>Am Ende dieses Moduls steht dein Profil so da, dass du es jemandem zeigen kannst, ohne dich dabei zu erklären. Du hast dich zwischen neuem Konto und Umbau entschieden, deine Namensfelder sind gesetzt, deine Bio ist getippt, fünf Highlights sind angelegt und dein Konto ist abgesichert.</p>\n<p>Fünf Lektionen, rund 38 Minuten. Nimm dir dein Handy dazu — bei jeder Lektion zeige ich dir Klick für Klick, wo du hindrücken musst.</p>", "text": "Am Ende dieses Moduls steht dein Profil so da, dass du es jemandem zeigen kannst, ohne dich dabei zu erklären. Du hast dich zwischen neuem Konto und Umbau entschieden, deine Namensfelder sind gesetzt, deine Bio ist getippt, fünf Highlights sind angelegt und dein Konto ist abgesichert.\n\nFünf Lektionen, rund 38 Minuten. Nimm dir dein Handy dazu — bei jeder Lektion zeige ich dir Klick für Klick, wo du hindrücken musst."}, {"name": "Lektion 1.1 — Konto anlegen oder umstellen", "titelfeld": "Lektion 1.1 — Konto anlegen oder umstellen", "eigenesFeld": true, "html": "<p>Das ist die Frage, an der die meisten zwei Wochen hängen bleiben: ein neues Konto anlegen oder das bestehende umbauen? Wir klären sie jetzt, und du siehst dabei auf meinem Handy beide Wege.</p>\n<p>Am Ende hast du dich entschieden, und alles, was nicht zu dir als Unternehmerin passt, ist sauber weggeräumt — ohne dass du ein einziges Bild löschen musst.</p>\n<p>📋 Werkstatt · Station „Konto\"</p>", "text": "Das ist die Frage, an der die meisten zwei Wochen hängen bleiben: ein neues Konto anlegen oder das bestehende umbauen? Wir klären sie jetzt, und du siehst dabei auf meinem Handy beide Wege.\n\nAm Ende hast du dich entschieden, und alles, was nicht zu dir als Unternehmerin passt, ist sauber weggeräumt — ohne dass du ein einziges Bild löschen musst.\n\n📋 Werkstatt · Station „Konto\""}, {"name": "Lektion 1.2 — Username, Name-Feld, Profilbild", "titelfeld": "Lektion 1.2 — Username, Name-Feld, Profilbild", "eigenesFeld": true, "html": "<p>Instagram durchsucht genau zwei Felder auf deinem Profil, und eines davon lässt fast jede Networkerin ungenutzt. Hier trägst du beide so ein, dass dich auch jemand findet, der dich noch gar nicht kennt.</p>\n<p>Dazu zeige ich dir, was ein Profilbild braucht, damit man dich erkennt, wenn das Handy auf Armlänge weg ist.</p>\n<p>📋 Werkstatt · Station „Namensfelder\"</p>", "text": "Instagram durchsucht genau zwei Felder auf deinem Profil, und eines davon lässt fast jede Networkerin ungenutzt. Hier trägst du beide so ein, dass dich auch jemand findet, der dich noch gar nicht kennt.\n\nDazu zeige ich dir, was ein Profilbild braucht, damit man dich erkennt, wenn das Handy auf Armlänge weg ist.\n\n📋 Werkstatt · Station „Namensfelder\""}, {"name": "Lektion 1.3 — Deine Bio in vier Zeilen", "titelfeld": "Lektion 1.3 — Deine Bio in vier Zeilen", "eigenesFeld": true, "html": "<p>Vier Zeilen entscheiden darüber, ob jemand auf deinem Profil bleibt oder weiterscrollt. Wir tippen deine Bio in dieser Lektion gemeinsam, und zwar in der Fassung, die dir in zehn Minuten einfällt — sie wird sich später noch ändern, und das ist so gedacht.</p>\n<p>Wenn sie steht, kannst du sie durch meinen Bio-Check laufen lassen und bekommst zurück, was schon zieht und was noch schwammig ist.</p>\n<p>📋 Werkstatt · Station „Bio\"</p>", "text": "Vier Zeilen entscheiden darüber, ob jemand auf deinem Profil bleibt oder weiterscrollt. Wir tippen deine Bio in dieser Lektion gemeinsam, und zwar in der Fassung, die dir in zehn Minuten einfällt — sie wird sich später noch ändern, und das ist so gedacht.\n\nWenn sie steht, kannst du sie durch meinen Bio-Check laufen lassen und bekommst zurück, was schon zieht und was noch schwammig ist.\n\n📋 Werkstatt · Station „Bio\""}, {"name": "Lektion 1.4 — Highlights und dein Link", "titelfeld": "Lektion 1.4 — Highlights und dein Link", "eigenesFeld": true, "html": "<p>Die fünf Ordner unter deiner Bio sind dein Schaufenster. Wer auf deinem Profil landet, sieht dort in zwei Sekunden, worum es bei dir geht.</p>\n<p>Für ein Highlight brauchst du allerdings erst eine Story, und für eine Story brauchst du Mut. Deshalb machen wir es in dieser Lektion andersherum: du postest fünf einfache Stories hintereinander und packst sie sofort in die Ordner. Am Ende steht auch dein Link in der Bio.</p>\n<p>📋 Werkstatt · Station „Schaufenster\"</p>", "text": "Die fünf Ordner unter deiner Bio sind dein Schaufenster. Wer auf deinem Profil landet, sieht dort in zwei Sekunden, worum es bei dir geht.\n\nFür ein Highlight brauchst du allerdings erst eine Story, und für eine Story brauchst du Mut. Deshalb machen wir es in dieser Lektion andersherum: du postest fünf einfache Stories hintereinander und packst sie sofort in die Ordner. Am Ende steht auch dein Link in der Bio.\n\n📋 Werkstatt · Station „Schaufenster\""}, {"name": "Lektion 1.5 — Konto absichern", "titelfeld": "Lektion 1.5 — Konto absichern", "eigenesFeld": true, "html": "<p>Das ist die langweiligste Lektion im ganzen Kurs, und gleichzeitig die, über die du am meisten fluchst, wenn du sie überspringst.</p>\n<p>In fünf Minuten steht deine Zwei-Faktor-Anmeldung, deine Wiederherstellungs- codes liegen an einem Ort, an dem du sie wiederfindest, und du schaust zum Schluss einmal mit fremden Augen auf dein fertiges Profil.</p>\n<p>📋 Werkstatt · Station „Profil-Check\"</p>", "text": "Das ist die langweiligste Lektion im ganzen Kurs, und gleichzeitig die, über die du am meisten fluchst, wenn du sie überspringst.\n\nIn fünf Minuten steht deine Zwei-Faktor-Anmeldung, deine Wiederherstellungs- codes liegen an einem Ort, an dem du sie wiederfindest, und du schaust zum Schluss einmal mit fremden Augen auf dein fertiges Profil.\n\n📋 Werkstatt · Station „Profil-Check\""}, {"name": "Abschlusstext Modul 1 (optional, nach der letzten Lektion)", "titelfeld": "Abschlusstext Modul 1 (optional, nach der letzten Lektion)", "eigenesFeld": true, "html": "<p>Dein Profil steht. Wenn jetzt jemand über einen Kommentar oder eine Story bei dir landet, sieht er innerhalb von Sekunden, wer du bist und worum es geht.</p>\n<p>In Modul 2 posten wir. Ein Reel, ein Karussell und eine Story — und ich zeige dir jedes einzeln, von der Aufnahme bis zum Veröffentlichen.</p>", "text": "Dein Profil steht. Wenn jetzt jemand über einen Kommentar oder eine Story bei dir landet, sieht er innerhalb von Sekunden, wer du bist und worum es geht.\n\nIn Modul 2 posten wir. Ein Reel, ein Karussell und eine Story — und ich zeige dir jedes einzeln, von der Aufnahme bis zum Veröffentlichen."}, {"name": "Modul 2 — Du kannst posten", "titelfeld": "Modul 2 — Du kannst posten", "eigenesFeld": true, "html": "<p>In diesem Modul geht zum ersten Mal etwas von dir online. Ein Reel, ein Karussell und eine Story — und ich bin bei jedem Schritt dabei, von der Aufnahme bis zu dem Moment, in dem es auf deinem Profil steht.</p>\n<p>Fünf Lektionen, rund 46 Minuten. Plan dir für die Reel-Lektion etwas mehr Zeit ein, weil du dort wirklich drehst.</p>", "text": "In diesem Modul geht zum ersten Mal etwas von dir online. Ein Reel, ein Karussell und eine Story — und ich bin bei jedem Schritt dabei, von der Aufnahme bis zu dem Moment, in dem es auf deinem Profil steht.\n\nFünf Lektionen, rund 46 Minuten. Plan dir für die Reel-Lektion etwas mehr Zeit ein, weil du dort wirklich drehst."}, {"name": "Lektion 2.1 — Reel, Beitrag, Story: was ist was", "titelfeld": "Lektion 2.1 — Reel, Beitrag, Story: was ist was", "eigenesFeld": true, "html": "<p>Reel, Beitrag, Karussell, Story — alle reden davon, und keiner sagt dir, was der Unterschied eigentlich ist. Hier bekommst du ihn in normaler Sprache, ohne Fachbegriffe.</p>\n<p>Dazu die Faustregel, die dir jede Woche Entscheidungen abnimmt: Wenn dich noch niemand kennt, sind Reels dein Hebel. Wenn dich jemand kennt, entscheiden deine Stories.</p>", "text": "Reel, Beitrag, Karussell, Story — alle reden davon, und keiner sagt dir, was der Unterschied eigentlich ist. Hier bekommst du ihn in normaler Sprache, ohne Fachbegriffe.\n\nDazu die Faustregel, die dir jede Woche Entscheidungen abnimmt: Wenn dich noch niemand kennt, sind Reels dein Hebel. Wenn dich jemand kennt, entscheiden deine Stories."}, {"name": "Lektion 2.2 — Dein erstes Reel", "titelfeld": "Lektion 2.2 — Dein erstes Reel", "eigenesFeld": true, "html": "<p>Jetzt drehst du. Sieben Sekunden Video, ein Satz — und entschieden wird in den ersten zwei bis drei davon.</p>\n<p>Wir machen es zusammen, und ich zeige dir dabei jeden Klick: aufnehmen, Text drauf, hochladen. Was dabei herauskommt, ist kein Meisterwerk, und das soll es auch nicht sein. Es ist dein erster Klick.</p>\n<p>📋 Werkstatt · Station „Reel\"</p>", "text": "Jetzt drehst du. Sieben Sekunden Video, ein Satz — und entschieden wird in den ersten zwei bis drei davon.\n\nWir machen es zusammen, und ich zeige dir dabei jeden Klick: aufnehmen, Text drauf, hochladen. Was dabei herauskommt, ist kein Meisterwerk, und das soll es auch nicht sein. Es ist dein erster Klick.\n\n📋 Werkstatt · Station „Reel\""}, {"name": "Lektion 2.3 — Dein erstes Karussell", "titelfeld": "Lektion 2.3 — Dein erstes Karussell", "eigenesFeld": true, "html": "<p>Ein Karussell zu bauen fühlt sich nach Design an, und genau davor drücken sich die meisten. Dabei steckt dahinter eine Struktur, die du dir einmal merkst und danach immer wieder benutzt: Folie 1 eine Aussage, die hängen bleibt, dann ein Gedanke pro Folie, und am Schluss, was sie jetzt tun soll.</p>\n<p>Wir bauen dein erstes in Canva und laden es hoch. Mehr als zehn Folien brauchst du übrigens nie — Instagram lässt mehr zu, gelesen wird es nicht.</p>\n<p>📋 Werkstatt · Station „Karussell\"</p>", "text": "Ein Karussell zu bauen fühlt sich nach Design an, und genau davor drücken sich die meisten. Dabei steckt dahinter eine Struktur, die du dir einmal merkst und danach immer wieder benutzt: Folie 1 eine Aussage, die hängen bleibt, dann ein Gedanke pro Folie, und am Schluss, was sie jetzt tun soll.\n\nWir bauen dein erstes in Canva und laden es hoch. Mehr als zehn Folien brauchst du übrigens nie — Instagram lässt mehr zu, gelesen wird es nicht.\n\n📋 Werkstatt · Station „Karussell\""}, {"name": "Lektion 2.4 — Deine erste Story", "titelfeld": "Lektion 2.4 — Deine erste Story", "eigenesFeld": true, "html": "<p>Stories sind das Format, in dem später deine Kundinnen entstehen. Nicht weil sie hübscher sind, sondern weil dort tatsächlich jemand antwortet.</p>\n<p>Du lernst die vier Sticker kennen, die vollkommen reichen — Umfrage, Frage-Box, Quiz und Link — und postest deine erste Story mit einer Umfrage drin. Eine Umfrage bringt dir übrigens mehr als das schönste Bild, weil sie etwas auslöst statt nur gesehen zu werden.</p>\n<p>📋 Werkstatt · Station „Story\"</p>", "text": "Stories sind das Format, in dem später deine Kundinnen entstehen. Nicht weil sie hübscher sind, sondern weil dort tatsächlich jemand antwortet.\n\nDu lernst die vier Sticker kennen, die vollkommen reichen — Umfrage, Frage-Box, Quiz und Link — und postest deine erste Story mit einer Umfrage drin. Eine Umfrage bringt dir übrigens mehr als das schönste Bild, weil sie etwas auslöst statt nur gesehen zu werden.\n\n📋 Werkstatt · Station „Story\""}, {"name": "Lektion 2.5 — Caption, Hashtags, Musik, Cover", "titelfeld": "Lektion 2.5 — Caption, Hashtags, Musik, Cover", "eigenesFeld": true, "html": "<p>Vier Dinge, über die endlos geredet wird, und nur eines davon entscheidet wirklich mit. Hier erfährst du, welches — und wobei du dich ab heute nicht mehr aufhalten musst.</p>\n<p>Wichtig für deine Caption: Angezeigt werden nur die ersten ein bis zwei Zeilen. Alles danach liest, wer auf „mehr\" tippt, und das sind deutlich weniger, als du denkst.</p>\n<p>📋 Werkstatt · Station „Caption\"</p>", "text": "Vier Dinge, über die endlos geredet wird, und nur eines davon entscheidet wirklich mit. Hier erfährst du, welches — und wobei du dich ab heute nicht mehr aufhalten musst.\n\nWichtig für deine Caption: Angezeigt werden nur die ersten ein bis zwei Zeilen. Alles danach liest, wer auf „mehr\" tippt, und das sind deutlich weniger, als du denkst.\n\n📋 Werkstatt · Station „Caption\""}, {"name": "Modul 3 — Sauber starten", "titelfeld": "Modul 3 — Sauber starten", "eigenesFeld": true, "html": "<p>Zwei Lektionen zum Schluss, rund 17 Minuten. Die erste räumt die Fehler weg, die Networkerinnen auf Instagram teuer zu stehen kommen, und die zweite gibt dir deinen Plan für die kommende Woche.</p>\n<p>Danach bist du fertig — und startklar.</p>", "text": "Zwei Lektionen zum Schluss, rund 17 Minuten. Die erste räumt die Fehler weg, die Networkerinnen auf Instagram teuer zu stehen kommen, und die zweite gibt dir deinen Plan für die kommende Woche.\n\nDanach bist du fertig — und startklar."}, {"name": "Lektion 3.1 — Die fünf Network-Fallen", "titelfeld": "Lektion 3.1 — Die fünf Network-Fallen", "eigenesFeld": true, "html": "<p>Es gibt fünf Sachen, die fast jede Networkerin auf Instagram macht und die ihr jedes Mal im Weg stehen. Firmenname in der Bio ist eine davon, dann bist du nämlich eine von tausend.</p>\n<p>Wir gehen alle fünf durch, und du prüfst dein frisches Profil direkt dagegen. Der Leitsatz dahinter: Dein Thema steht vorne, das Produkt kommt später und im Gespräch. Menschen folgen dir wegen dem, was du löst.</p>\n<p>📋 Werkstatt · Station „Network-Fallen\"</p>", "text": "Es gibt fünf Sachen, die fast jede Networkerin auf Instagram macht und die ihr jedes Mal im Weg stehen. Firmenname in der Bio ist eine davon, dann bist du nämlich eine von tausend.\n\nWir gehen alle fünf durch, und du prüfst dein frisches Profil direkt dagegen. Der Leitsatz dahinter: Dein Thema steht vorne, das Produkt kommt später und im Gespräch. Menschen folgen dir wegen dem, was du löst.\n\n📋 Werkstatt · Station „Network-Fallen\""}, {"name": "Lektion 3.2 — Dein Startplan für Woche eins", "titelfeld": "Lektion 3.2 — Dein Startplan für Woche eins", "eigenesFeld": true, "html": "<p>Zum Schluss planst du deine ersten fünf Beiträge, und zwar konkret: welcher wann kommt und was hineingehört. Montag, Mittwoch und Freitag je ein Beitrag, Dienstag und Donnerstag eine Story mit Umfrage, Wochenende frei. Wirklich frei.</p>\n<p>Und wenn du zwei ruhige Stunden hast, nimmst du alle Reels der Woche hintereinander auf — ein Outfit, ein Licht, fünf Videos.</p>\n<p>📋 Werkstatt · Station „Startplan\"</p>", "text": "Zum Schluss planst du deine ersten fünf Beiträge, und zwar konkret: welcher wann kommt und was hineingehört. Montag, Mittwoch und Freitag je ein Beitrag, Dienstag und Donnerstag eine Story mit Umfrage, Wochenende frei. Wirklich frei.\n\nUnd wenn du zwei ruhige Stunden hast, nimmst du alle Reels der Woche hintereinander auf — ein Outfit, ein Licht, fünf Videos.\n\n📋 Werkstatt · Station „Startplan\""}, {"name": "Abschlusstext Modul 3 (nach der letzten Lektion)", "titelfeld": "Abschlusstext Modul 3 (nach der letzten Lektion)", "eigenesFeld": true, "html": "<p>Das war es. Dein Profil steht, du hast gepostet, und du weisst, was diese Woche ansteht.</p>\n<p>Wenn du beim Posten merkst, dass dir der Inhalt ausgeht, liegt das fast immer am Thema — dafür habe ich „Finde dein Thema als Network-Mama in 60 Minuten\". Und wenn aus deinem Profil wirklich Kundinnen werden sollen, ist die Instagram-Kundenmaschine dein nächster Schritt.</p>\n<p>Schreib mir, wenn dein erster Beitrag online ist. Ich schau ihn mir an.</p>", "text": "Das war es. Dein Profil steht, du hast gepostet, und du weisst, was diese Woche ansteht.\n\nWenn du beim Posten merkst, dass dir der Inhalt ausgeht, liegt das fast immer am Thema — dafür habe ich „Finde dein Thema als Network-Mama in 60 Minuten\". Und wenn aus deinem Profil wirklich Kundinnen werden sollen, ist die Instagram-Kundenmaschine dein nächster Schritt.\n\nSchreib mir, wenn dein erster Beitrag online ist. Ich schau ihn mir an."}];

function karte(a, i){
  const el = document.createElement('div');
  el.className = 'karte';
  const titelzeile = a.eigenesFeld
    ? '<div class="titelzeile"><span>Titelfeld:</span> <b>' + a.titelfeld + '</b>' +
      '<button class="klein" data-titel="' + i + '">Titel kopieren</button></div>'
    : '';
  el.innerHTML =
    '<div class="kopf"><h2>' + a.name + '</h2></div>' +
    titelzeile +
    '<div class="vorschau">' + a.html + '</div>' +
    '<div class="reihe">' +
      '<button data-kopieren="' + i + '">Text kopieren</button>' +
      '<span class="hinweis">mit Formatierung</span>' +
    '</div>';
  return el;
}

async function kopieren(html, text, knopf){
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([text], {type:'text/plain'})
    })]);
  } catch(e) {
    // Rueckfall: nur Text, falls der Browser ClipboardItem nicht mag
    try { await navigator.clipboard.writeText(text); }
    catch(e2) { alert('Kopieren hat nicht geklappt. Markier den Text von Hand.'); return; }
  }
  const alt = knopf.textContent;
  knopf.textContent = 'Kopiert';
  knopf.classList.add('fertig');
  setTimeout(() => { knopf.textContent = alt; knopf.classList.remove('fertig'); }, 1500);
}

const liste = document.getElementById('liste');
DATEN.forEach((a, i) => liste.appendChild(karte(a, i)));

liste.addEventListener('click', async ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.kopieren !== undefined){
    const a = DATEN[+b.dataset.kopieren];
    await kopieren(a.html, a.text, b);
  }
  if (b.dataset.titel !== undefined){
    const a = DATEN[+b.dataset.titel];
    await kopieren('<p>' + a.titelfeld + '</p>', a.titelfeld, b);
  }
});
</script>
