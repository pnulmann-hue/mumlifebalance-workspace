function aktTag(){
  if(!S.start)return 1;

  return Math.max(1,Math.min(t,SETS[S.set].tage));

  var html='<p class="leise">'+(kids?"Welcher Roller ist bei euch wann dran? Hak an, was ihr macht. Zwei, drei feste Momente reichen völlig.":"Hak an, was zu dir passt. Eine Routine, die du lebst, ist mehr wert als eine perfekte auf dem Papier.")+'</p>';
  Object.keys(R).forEach(function(z){
    html+='<div class="stapel" style="gap:8px"><h3>'+z+'</h3><div class="tageszeit">'+R[z].map(function(x,i){
      var key=z+i, o=byId[x[0]], zu=o&&!offen(o), an=!!S.routine[key]; if(an)gew++;
      return '<label class="'+(zu?"zu":"")+'"><input type="checkbox" data-rt="'+key+'"'+(an?" checked":"")+(zu?" disabled":"")+'><span>'+e(x[1])+(zu?' <span class="minik">· ab Tag '+o.ab+'</span>':"")+'</span></label>';
    }).join("")+'</div></div>';
  });
  if(gew)html+='<button class="knopf zweit" id="routinekopie">Meine Routine kopieren</button>';
  return html;
}

    var zu=!offen(o), n=S.stempel[o.id]||0;

  }).join("")+'</div>';
}

/* ---------------------------------------------------------------- Bedienung */
app.addEventListener("click",function(ev){
  var b=ev.target.closest("button,a"); if(!b)return;
  if(b.dataset.set){S.set=b.dataset.set;S.start=S.start||heute0().toISOString();S.reiter="heute";S.tag=null;speichern();zeichne();window.scrollTo(0,0);return;}
  if(b.id==="wechsel"){S.set=null;speichern();zeichne();return;}
  if(b.dataset.r){S.reiter=b.dataset.r;speichern();zeichne();return;}
  if(b.dataset.tag){var t=+b.dataset.tag;if(t>=1&&t<=aktTag()){S.tag=t;zeichne();}return;}
  if(b.id==="gemacht"){S.erledigt[S.tag]=1;speichern();zeichne();melde("Schritt "+S.tag+" erledigt");return;}
  if(b.id==="nochnicht"){delete S.erledigt[S.tag];speichern();zeichne();return;}
  if(b.dataset.oel){if(b.getAttribute("aria-disabled")){melde("Kommt in den nächsten Tagen dazu");return;}var el=document.getElementById("i-"+b.dataset.oel);el.hidden=!el.hidden;b.setAttribute("aria-expanded",String(!el.hidden));return;}
  if(b.dataset.st){S.stempel[b.dataset.st]=(S.stempel[b.dataset.st]||0)+1;speichern();zeichne();melde("Stempel gesetzt");return;}
  if(b.id==="wkopie")return kopiere(wunschText());
  if(b.id==="routinekopie"){
    var R=ROUTINE[S.set],t="Meine Routine:\n";Object.keys(R).forEach(function(z){var l=R[z].filter(function(x,i){return S.routine[z+i];}).map(function(x){return "- "+x[1];});if(l.length)t+="\n"+z+"\n"+l.join("\n")+"\n";});
    return kopiere(t);
  }
});
var druckTimer;
app.addEventListener("pointerdown",function(ev){var b=ev.target.closest("[data-st]");if(!b)return;druckTimer=setTimeout(function(){var id=b.dataset.st;S.stempel[id]=Math.max(0,(S.stempel[id]||0)-2);speichern();melde("Stempel korrigiert");},700);});
app.addEventListener("pointerup",function(){clearTimeout(druckTimer);});
app.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.dataset.rt){S.routine[t.dataset.rt]=t.checked;speichern();zeichne();}
  else if(t.dataset.w){S.wunsch[t.dataset.w]=t.checked;speichern();zeichne();}
  else if(t.id==="alter"){S.alter=+t.value;speichern();zeichne();}
});
app.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="notiz"){S.notiz=t.value;speichern();}
  if(t.id==="lieb"){S.lieb=t.value;speichern();var a=document.getElementById("wsenden");if(a)a.href=WHATSAPP+"?text="+encodeURIComponent(wunschText());}
});
function kopiere(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){melde("Kopiert");},function(){fallback(t);});}else fallback(t);
}
function fallback(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");melde("Kopiert");}catch(e){melde("Bitte von Hand kopieren");}a.remove();}

zeichne();
</script>
