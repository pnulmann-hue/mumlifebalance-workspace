function grundSeite(){
 return '<div class="abschnitt"><h2 class="gross">Grundlagen der Hausapothekerin</h2><p class="unter">Ätherische Öle sind konzentrierte Pflanzenkraft – grossartige Helfer, aber kein Spielzeug. Hier die wichtigsten Grundregeln.</p>'+
 video(LINKS.bedeutung,"Was es bedeutet, Hausapothekerin zu sein","Video zu Kapitel 1")+
 '<p class="tipp">Starte klein und einfach: Wähle dir ein Öl aus deinem Starterset und finde heute noch eine einzige Anwendung, z. B. Lemon im Wasser am Morgen oder Lavender im Diffuser am Abend.</p>'+
 '<h2 class="gross" style="font-size:1.3rem">Sicherheit und Dosierung</h2><div class="zwei">'+
 '<div class="kasten"><h3>Zitrusöle & Sonne</h3><p>Zitrone, Bergamotte, Limette und andere Zitrusöle können Hautreaktionen hervorrufen, wenn die Haut danach der Sonne oder UV-Licht ausgesetzt wird. Deshalb die Haut nach Anwendung mindestens 1 Tag vor Sonne schützen.</p></div>'+
 '<div class="kasten"><h3>Schwangerschaft & Kinder</h3><p>Für Kinder und Schwangere werden ätherische Öle immer stärker verdünnt. In der Schwangerschaft ist es ratsam, mit der Hebamme Rücksprache zu halten oder sich in Fachliteratur einzulesen. <a href="'+LINKS.oilacademySchwanger+'" target="_blank" rel="noopener">Oder schau mal in der Oilacademy!</a></p></div>'+
 '<div class="kasten"><h3>Allgemeine Sicherheit</h3><p>Die Öle gehören nicht in die Augen oder Ohren. Öle im Wasser stets aus einer Glas- oder Aluflasche trinken, nicht aus einer Plastikflasche. Im Zweifel immer zu viel verdünnen. Welche Öle verdünnt oder unverdünnt angewendet werden, findest du im „Kraft der Natur“.</p></div>'+
 '<div class="kasten"><h3>Aufbewahrung & Haltbarkeit</h3><p>Ätherische Öle sind licht- und hitzeempfindlich. Ein kühler, trockener Platz verlängert ihre Haltbarkeit – Zitrusöle bleiben zum Beispiel nur 1–2 Jahre frisch, während Harze wie Weihrauch deutlich länger haltbar sind. Mein Tipp: Vertraue immer deiner Nase.</p></div></div>'+
 '<h2 class="gross" style="font-size:1.3rem">Verdünnung</h2><div class="kasten rand"><label for="alter"><b>Für wen mischst du?</b></label><select id="alter">'+VERD.map(function(x,i){return '<option value="'+i+'"'+(i==S.alter?" selected":"")+'>'+x.a+'</option>';}).join("")+'</select>'+
 '<p class="gross" style="font-size:1.35rem;text-transform:none">'+VERD[S.alter].t+'</p><p class="leise">'+VERD[S.alter].p+' Verdünnung · Je jünger das Kind, umso geringer der Gehalt an ätherischen Ölen.</p><p><a href="'+LINKS.verduennung+'" target="_blank" rel="noopener">Die ganze Verdünnungstabelle öffnen</a></p></div>'+
 '<h2 class="gross" style="font-size:1.3rem">Qualität & Aufbewahrung</h2><p>Die Wirkung ätherischer Öle hängt entscheidend von ihrer Qualität ab. Achte deshalb darauf, ausschliesslich 100 % naturreine, geprüfte Öle ohne synthetische Zusätze zu verwenden.</p>'+
 '<div class="dos"><div class="k">Don’ts</div><div class="k">Besser</div>'+
 [["Plastikflasche für Zitrusöle → Kunststoff kann sich lösen","Immer dunkle Glasflaschen nutzen"],["Öle offen in der Sonne oder auf der Heizung lagern","Öle kühl & lichtgeschützt lagern (Zitrusöle evtl. Kühlschrank)"],["Fläschchen unverschlossen stehen lassen","Fläschchen nach Gebrauch sofort fest verschliessen"],["Unbeschriftete Mischungen, man weiss nicht mehr, was drin ist","Eigene Mischungen mit Datum & Inhalt beschriften"],["Abgelaufene, ranzig riechende Öle verwenden","Auf die Nase vertrauen"]].map(function(x){return '<div>'+e(x[0])+'</div><div>'+e(x[1])+'</div>';}).join("")+'</div>'+
 '<h2 class="gross" style="font-size:1.3rem">3 Wege der Anwendung</h2>'+video(LINKS.anwendungsarten,"Die Anwendungsarten im Detail","Video")+
 '<div class="zwei"><div class="kasten"><h3>01 · Aromatisch</h3><p>Über die Luft – im Diffuser, als Raumspray oder durch einfaches Einatmen aus der Handfläche. Schon wenige Tropfen reichen, um Stimmung, Energie oder Entspannung zu beeinflussen.</p><a href="'+LINKS.infoAromatisch+'" target="_blank" rel="noopener">Mehr Infos</a></div>'+
 '<div class="kasten"><h3>02 · Äusserlich</h3><p>Bei der Anwendung auf der Haut gelangen die Wirkstoffe direkt über die Poren in den Körper. Typisch sind Roll-ons, Massagen, Kompressen oder Wickel. Wichtig: immer mit einem Trägeröl verdünnen – besonders bei Kindern und empfindlicher Haut.</p><a href="'+LINKS.infoAeusserlich+'" target="_blank" rel="noopener">Mehr Infos</a></div>'+
 '<div class="kasten"><h3>03 · Innerlich</h3><p>Einige Öle können auch innerlich angewendet werden, zum Beispiel Lemon im Wasser oder Oregano in einer leeren Kapsel. Nur Öle nutzen, die ausdrücklich dafür freigegeben sind, und mit kleinen Mengen beginnen (meist 1 Tropfen).</p><a href="'+LINKS.infoInnerlich+'" target="_blank" rel="noopener">Mehr Infos</a></div></div></div>';
}

 '<h2 class="gross" style="font-size:1.3rem">Aromatische Ideen</h2><div class="zwei">'+
 [["Raumsprays","Ersetze giftige Raumsprays durch natürliche. Mische, was dir schmeckt, z. B. Lemon und On Guard für frische Luft und Reinigung."],["Wäscheduft / Weichspüler-Ersatz","2–3 Tropfen Lavendel oder Lemon in ein Wäschenetz oder mit Essig als natürlichem Weichspüler mischen."],["Schrank- / Bettsprays","Lavendel aufs Kopfkissen oder die Bettwäsche oder auf einem Tuch in den Schrank gegen Motten."],["Parfums","Mische dir mit der Kraft der Natur dein persönliches Parfum."],["Dampfinhalation oder Handinhalation","z. B. Air, Pfefferminze, Teebaum → bei Erkältung, Nebenhöhlenbeschwerden, Atemwegen."],["Aromadusche","1–2 Tropfen Pfefferminze, Air oder Lemon in die Duschecke und auf die Armaturen → belebender Dampf am Morgen."]].map(function(x){return '<div class="kasten"><h3>'+x[0]+'</h3><p>'+e(x[1])+'</p></div>';}).join("")+'</div>'+

function passSeite(){
 return '<div class="abschnitt"><h2 class="gross">Roller-Pass</h2><p class="unter">Für dein Kind: Jedes Mal, wenn es einen Roller benutzt, darf es einen Stempel setzen. Lange drücken nimmt einen Stempel zurück.</p><div class="pass">'+ROLLER.map(function(o){var n=S.stempel[o.id]||0;return '<div class="stempel"><button data-st="'+o.id+'" style="background:'+o.farbe+'" aria-label="Stempel für '+o.name+'">'+o.name.charAt(0)+'</button><b>'+o.name+'</b><span class="zahl">'+n+' ★</span></div>';}).join("")+'</div></div>';

/* ---------------------------------------------------------------- Bedienung */
app.addEventListener("click",function(ev){
 var b=ev.target.closest("button,a");if(!b)return;
 if(b.dataset.set){S.set=b.dataset.set;S.start=S.start||heute0().toISOString();S.reiter="heute";S.tag=null;offenesOel=null;speichern();zeichne();window.scrollTo(0,0);return;}
 if(b.id==="wechsel"){S.set=null;offenesOel=null;speichern();zeichne();return;}
 if(b.dataset.r){S.reiter=b.dataset.r;offenesOel=null;speichern();zeichne();return;}
 if(b.dataset.tag){var t=+b.dataset.tag;if(t>=1&&t<=aktTag()){S.tag=t;zeichne();}return;}
 if(b.id==="gemacht"){S.erledigt[S.tag]=1;speichern();zeichne();melde("Schritt "+S.tag+" erledigt");return;}
 if(b.id==="nochnicht"){delete S.erledigt[S.tag];speichern();zeichne();return;}
 if(b.dataset.oel){offenesOel=b.dataset.oel;zeichne();document.querySelector(".reiter").scrollIntoView();return;}
 if(b.dataset.zu){offenesOel=null;zeichne();return;}
 if(b.dataset.st){S.stempel[b.dataset.st]=(S.stempel[b.dataset.st]||0)+1;speichern();zeichne();melde("Stempel gesetzt");return;}
 if(b.id==="wkopie")return kopiere(wunschText());
 if(b.id==="routinekopie"){var R=ROUTINE[S.set],t="Meine Routine:\n";Object.keys(R).forEach(function(z){var l=R[z][1].filter(function(x,i){return S.routine[z+i];}).map(function(x){return "- "+x[0];});if(l.length)t+="\n"+z+"\n"+l.join("\n")+"\n";});return kopiere(t);}
});
var druckTimer;
app.addEventListener("pointerdown",function(ev){var b=ev.target.closest("[data-st]");if(!b)return;druckTimer=setTimeout(function(){var id=b.dataset.st;S.stempel[id]=Math.max(0,(S.stempel[id]||0)-2);speichern();melde("Stempel zurückgenommen");},700);});
app.addEventListener("pointerup",function(){clearTimeout(druckTimer);});
app.addEventListener("change",function(ev){var t=ev.target;
 if(t.dataset.rt){S.routine[t.dataset.rt]=t.checked;speichern();zeichne();}
 else if(t.dataset.w){S.wunsch[t.dataset.w]=t.checked;speichern();}
 else if(t.id==="alter"){S.alter=+t.value;speichern();zeichne();}
});
app.addEventListener("input",function(ev){var t=ev.target;
 if(t.dataset.notiz){S.notizen[t.dataset.notiz]=t.value;speichern();}
 else if(t.id==="notiz-tag"){S.notizen.tag=t.value;speichern();}
 else if(t.dataset.ueb){S.uebung[+t.dataset.ueb]=t.value;speichern();}
 else if(t.id==="lieb"){S.lieb=t.value;speichern();}
 else if(t.id==="sossuche"){document.getElementById("sosliste").innerHTML=sosListe(t.value);}
});
function kopiere(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){melde("Kopiert");},function(){fallback(t);});}else fallback(t);}
function fallback(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");melde("Kopiert");}catch(x){melde("Bitte von Hand kopieren");}a.remove();}
zeichne();
</script>
