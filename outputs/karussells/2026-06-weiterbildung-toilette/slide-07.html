<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Slide 7</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .slide {
    width: 1080px;
    height: 1350px;
    background: #12828c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 200px 100px;
    position: relative;
    font-family: 'Source Sans 3', sans-serif;
  }
  .accent-bar {
    width: 60px;
    height: 3px;
    background: rgba(241, 236, 221, 0.7);
    margin-bottom: 70px;
    border-radius: 2px;
  }
  .hero {
    font-family: 'Philosopher', serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.18;
    color: #f1ecdd;
    text-align: center;
    max-width: 880px;
    margin-bottom: 40px;
  }
  .hero em {
    font-style: italic;
    color: #dc822e;
    font-weight: 400;
  }
  .sub {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 42px;
    line-height: 1.45;
    color: rgba(241, 236, 221, 0.7);
    text-align: center;
    max-width: 880px;
  }
  .footer-brand {
    position: absolute;
    bottom: 60px;
    left: 100px;
    font-family: 'Source Sans 3', sans-serif;
    color: rgba(241, 236, 221, 0.7);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .footer-meta {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-family: 'Philosopher', serif;
    font-style: italic;
    color: rgba(241, 236, 221, 0.7);
    font-size: 24px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="accent-bar"></div>
    <h1 class="hero">Wenn du einen einzigen Rat von mir hören willst: investiere in deine <em>Weiterbildung</em>.</h1>
    <p class="sub">Auch wenn dein Network grad zäh läuft. Gerade dann.</p>
    <div class="footer-brand">Mum Life Balance</div>
    <div class="footer-meta">7 / 8</div>
  </div>
</body>
</html>
