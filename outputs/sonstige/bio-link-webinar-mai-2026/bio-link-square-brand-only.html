
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; }
  .tile {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: 'Source Sans 3', sans-serif;
    background: linear-gradient(135deg, #29556d 0%, #12828c 60%, #12828c 100%);
  }
  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
    z-index: 1;
  }
  .bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.10) 40%, rgba(18,130,140,0.50) 60%, rgba(18,130,140,0.94) 82%);
    z-index: 2;
  }
  .tile > .tag, .tile > .micro, .tile > .content {
    position: absolute;
    z-index: 3;
  }
  .tag {
    position: absolute;
    top: 70px;
    left: 70px;
    background: #dc822e;
    color: #f1ecdd;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.18em;
    padding: 12px 28px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .micro {
    position: absolute;
    top: 75px;
    right: 70px;
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-style: italic;
    font-size: 28px;
    opacity: 0.92;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .content {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 80px 80px 90px;
    background: linear-gradient(180deg, rgba(18,130,140,0.0) 0%, #12828c 38%);
  }
  .label {
    color: rgba(241, 236, 221, 0.92);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Philosopher', serif;
    font-weight: 700;
    font-size: 82px;
    line-height: 1.12;
    color: #f1ecdd;
    margin: 0 0 32px 0;
    max-width: 880px;
  }
  .sub {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 36px;
    line-height: 1.35;
    color: rgba(241, 236, 221, 0.92);
    margin: 0 0 36px 0;
    max-width: 820px;
  }
  .cta {
    display: inline-block;
    background: #dc822e;
    color: #f1ecdd;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 22px 44px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }
</style></head><body>
<div class="tile">
  
  <div class="tag">KOSTENLOSES WEBINAR</div>
  <div class="micro">Mum Life Balance</div>
  <div class="content">
    <div class="label">Mai 2026 · Live mit Patricia</div>
    <h1>In 90 Min dein Mama-Leben mit KI-Assistenten umkrempeln.</h1>
    <p class="sub">Drei KI-Mitarbeiter. Live gezeigt. Bildschirm-Sharing. Keine Slides.</p>
    <div class="cta">Hier anmelden →</div>
  </div>
</div>
</body></html>
