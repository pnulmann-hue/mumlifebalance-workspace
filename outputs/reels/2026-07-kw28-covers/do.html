<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Do Reel-Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol: #12828c; --dunkelblau: #29556d; --creme: #f1ecdd; --text: #0c1c30; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a1a; font-family: "Source Sans 3", sans-serif; padding: 40px; }
      .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; margin: 40px auto; background: var(--petrol); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 110px 90px; }
      .eyebrow { font-family: "Source Sans 3"; font-weight: 700; font-size: 34px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.85); margin-bottom: 44px; }
      .headline { font-family: "Philosopher"; font-weight: 700; font-size: 90px; line-height: 1.08; color: #fff; }
      .headline .pop { font-style: italic; background: rgba(255,255,255,0.18); padding: 0 16px; border-radius: 10px; }
      .subline { font-family: "Source Sans 3"; font-weight: 600; font-size: 46px; line-height: 1.35; color: rgba(255,255,255,0.92); margin-top: 40px; }
      .handle { position: absolute; bottom: 54px; left: 0; right: 0; text-align: center; font-family: "Source Sans 3"; font-weight: 600; font-size: 26px; color: rgba(255,255,255,0.6); }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="eyebrow">Ehrlich gesagt</div>
      <div class="headline">Hör auf mit den <span class="pop">90 %</span>, die dich nur Zeit kosten.</div>
      <div class="subline">… und dir trotzdem keine Anfragen bringen.</div>
      <div class="handle">@mumlifebalance</div>
    </div>
  </body>
</html>
