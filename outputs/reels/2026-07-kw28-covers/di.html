<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Di Reel-Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol: #12828c; --dunkelblau: #29556d; --creme: #f1ecdd; --text: #0c1c30; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a1a; font-family: "Source Sans 3", sans-serif; padding: 40px; }
      .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; margin: 40px auto; background: var(--creme); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 110px 90px; }
      .eyebrow { font-family: "Source Sans 3"; font-weight: 700; font-size: 34px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--petrol); margin-bottom: 44px; }
      .headline { font-family: "Philosopher"; font-weight: 700; font-size: 86px; line-height: 1.1; color: var(--dunkelblau); }
      .subline { font-family: "Source Sans 3"; font-weight: 600; font-size: 46px; line-height: 1.35; color: var(--petrol); margin-top: 40px; }
      .handle { position: absolute; bottom: 54px; left: 0; right: 0; text-align: center; font-family: "Source Sans 3"; font-weight: 600; font-size: 26px; color: rgba(12,28,48,0.5); }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="eyebrow">POV</div>
      <div class="headline">Du postest zum 100. Mal ein Produktbild …</div>
      <div class="subline">… und hoffst, dass dich heute keiner fragt, wie's läuft.</div>
      <div class="handle">@mumlifebalance</div>
    </div>
  </body>
</html>
