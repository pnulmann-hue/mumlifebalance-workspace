<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Do Reel-Cover KW29</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol: #12828c; --dunkelblau: #29556d; --creme: #f1ecdd; --text: #0c1c30; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a1a; font-family: "Source Sans 3", sans-serif; padding: 40px; }
      .slide { width: 1080px; height: 1920px; position: relative; overflow: hidden; margin: 40px auto; }
      .cover-foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 18%; z-index: 1; }
      .hook-card { position: absolute; left: 60px; right: 60px; bottom: 460px; background: var(--creme); padding: 52px 56px; border-radius: 30px; box-shadow: 0 18px 48px rgba(12,28,48,0.45); z-index: 4; }
      .hook-card .lead { font-family: "Philosopher"; font-weight: 700; font-size: 64px; line-height: 1.08; color: var(--dunkelblau); }
      .hook-card .quote { font-family: "Philosopher"; font-weight: 700; font-style: italic; font-size: 60px; line-height: 1.1; color: var(--petrol); margin-top: 18px; }
      .handle { position: absolute; bottom: 390px; left: 64px; font-family: "Source Sans 3"; font-weight: 600; font-size: 26px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.7); z-index: 5; }
    </style>
  </head>
  <body>
    <div class="slide">
      <img class="cover-foto" src="assets/do-cover.jpg" alt="Patricia" />
      <div class="hook-card">
        <div class="lead">Ich bin nicht die, die dir sagt:</div>
        <div class="quote">„Halt einfach täglich dein Produkt in die Kamera."</div>
      </div>
      <div class="handle">@mumlifebalance</div>
    </div>
  </body>
</html>
