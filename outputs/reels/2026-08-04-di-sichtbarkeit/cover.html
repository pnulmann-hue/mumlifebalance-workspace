<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,700;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol:#12828c; --creme:#f1ecdd; }
      * { margin:0; padding:0; box-sizing:border-box; }
      .slide { width:1080px; height:1920px; background:var(--petrol); position:relative; overflow:hidden; font-family:"Source Sans 3",sans-serif; }
      .wrap { position:absolute; left:90px; right:90px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; }
      .eyebrow { font-weight:700; font-size:34px; letter-spacing:0.16em; color:var(--creme); opacity:0.85; text-transform:uppercase; margin-bottom:40px; }
      .headline { font-family:"Philosopher"; font-weight:700; font-size:112px; line-height:1.04; color:#fff; }
      .sub { font-weight:600; font-size:50px; line-height:1.22; color:var(--creme); margin-top:34px; }
      .handle { position:absolute; bottom:120px; left:90px; font-weight:600; font-size:30px; color:rgba(255,255,255,0.7); }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="wrap">
        <div class="eyebrow">Steile These</div>
        <div class="headline">Reichweite ist völlig überbewertet.</div>
        <div class="sub">Warum die kleine, klare Bubble jedes Mal gewinnt.</div>
      </div>
      <div class="handle">@mumlifebalance</div>
    </div>
  </body>
</html>
