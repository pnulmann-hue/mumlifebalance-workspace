<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reel-Cover · Hüte-Methode · Webinar 24.6.</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .cover {
    width: 1080px;
    height: 1920px;
    background: #12828c;
    position: relative;
    overflow: hidden;
    padding: 130px 90px;
    font-family: 'Source Sans 3', sans-serif;
  }
  .webinar-badge {
    position: absolute;
    top: 70px;
    right: 70px;
    background: #dc822e;
    color: #f1ecdd;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 24px;
    border-radius: 4px;
    z-index: 3;
    text-align: center;
    line-height: 1.2;
  }
  .webinar-badge .date {
    display: block;
    font-family: 'Philosopher', serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: none;
    margin-top: 4px;
  }
  .corner-top {
    position: absolute;
    top: 90px;
    left: 90px;
    font-family: 'Source Sans 3', sans-serif;
    color: rgba(241, 236, 221, 0.65);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .corner-top::before {
    content: '';
    display: inline-block;
    width: 50px;
    height: 2px;
    background: #dc822e;
    vertical-align: middle;
    margin-right: 18px;
  }
  .main {
    position: absolute;
    top: 50%;
    left: 90px;
    right: 90px;
    transform: translateY(-50%);
    z-index: 2;
  }
  .eyebrow {
    color: #dc822e;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }
  .headline {
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-size: 168px;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -2px;
    text-shadow: 0 6px 28px rgba(0,0,0,0.35);
    margin-bottom: 50px;
  }
  .headline em {
    font-style: italic;
    color: #dc822e;
    font-weight: 400;
  }
  .divider {
    width: 180px;
    height: 4px;
    background: #dc822e;
    margin: 50px 0;
  }
  .sub {
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-size: 56px;
    font-weight: 400;
    font-style: italic;
    line-height: 1.25;
    letter-spacing: 0.5px;
    opacity: 0.95;
    max-width: 800px;
  }
  .footer {
    position: absolute;
    bottom: 90px;
    left: 90px;
    right: 90px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 2;
  }
  .cta {
    color: #f1ecdd;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 1px;
    opacity: 0.92;
  }
  .cta span {
    display: inline-block;
    margin-left: 14px;
    color: #dc822e;
    font-size: 40px;
  }
  .brand {
    color: rgba(241, 236, 221, 0.65);
    font-family: 'Philosopher', serif;
    font-size: 26px;
    font-style: italic;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="corner-top">Patricia · Mum Life Balance</div>
    <div class="webinar-badge">Live-Webinar<span class="date">24. Juni</span></div>
    <div class="main">
      <div class="eyebrow">für Mamas im Network</div>
      <h1 class="headline">Network stagniert?<br><em>Schau auf deine Hüte.</em></h1>
      <div class="divider"></div>
      <p class="sub">Die Hüte-Methode aus Mama-CEO. Live im nächsten Webinar.</p>
    </div>
    <div class="footer">
      <div class="cta">Kommentier WEBINAR <span>↓</span></div>
      <div class="brand">Funktionieren<br>war gestern.</div>
    </div>
  </div>
</body>
</html>
