<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reel-Cover · POV-Dorf (3 Zeilen)</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }

  .cover {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    /* Warme Wiesen-Platzhalterfarbe, falls noch kein Foto drin ist */
    background: linear-gradient(160deg, #c9b98a 0%, #b8a36a 45%, #8f7c4e 100%);
  }

  /* === HQ-FOTO HIER REINLEGEN ===
     Pusteblumen-Shooting in den Ordner legen als  assets/cover-foto.jpg
     dann ist die <img> unten automatisch aktiv. */
  .cover-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 28%;
  }

  /* Lesbarkeits-Verlauf nach unten */
  .gradient-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 62%;
    background: linear-gradient(to bottom,
      rgba(20,16,8,0) 0%,
      rgba(20,16,8,0.28) 40%,
      rgba(20,16,8,0.62) 72%,
      rgba(20,16,8,0.80) 100%);
    z-index: 1;
  }

  .text-box {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    /* MEHR LUFT NACH UNTEN: vorher klebte der Text am Rand.
       260px Abstand = Text sitzt deutlich oberhalb der Unterkante. */
    bottom: 260px;
    width: 96%;
    text-align: center;
    z-index: 2;
  }

  .eyebrow {
    color: #1aa7b2;                /* Petrol-Akzent */
    font-family: 'Source Sans 3', sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 14px;
    text-transform: uppercase;
    margin-bottom: 34px;
    padding-left: 14px;            /* optisch zentriert trotz letter-spacing */
    text-shadow: 0 2px 12px rgba(0,0,0,0.45);
  }

  /* Headline bewusst auf 3 Zeilen gesetzt (per <br>).
     Schriftgröße so gewählt, dass die längste Zeile
     „Wenn die aus meinem Dorf" sauber in eine Zeile passt. */
  .headline {
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-size: 74px;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.5px;
    white-space: nowrap;          /* erzwingt exakt die 3 <br>-Zeilen, kein Auto-Umbruch */
    text-shadow: 0 4px 26px rgba(0,0,0,0.55);
  }
</style>
</head>
<body>
  <div class="cover">
    <img class="cover-bg" src="assets/cover-foto.jpg" alt="Pusteblume" onerror="this.style.display='none'">
    <div class="gradient-bottom"></div>
    <div class="text-box">
      <div class="eyebrow">POV:</div>
      <h1 class="headline">Wenn die aus meinem Dorf<br>meine ersten Stories<br>gesehen haben.</h1>
    </div>
  </div>
</body>
</html>
