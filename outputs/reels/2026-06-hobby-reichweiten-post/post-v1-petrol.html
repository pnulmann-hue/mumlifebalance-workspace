<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hobby-Reichweiten-Post · V1 Petrol</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .slide {
    width: 1080px;
    height: 1350px;
    background: #12828c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 150px 100px;
    position: relative;
    font-family: 'Source Sans 3', sans-serif;
  }
  .accent-bar {
    width: 60px;
    height: 3px;
    background: rgba(241, 236, 221, 0.6);
    margin-bottom: 70px;
    border-radius: 2px;
  }
  .label {
    color: #dc822e;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }
  .hero {
    font-family: 'Philosopher', serif;
    font-weight: 700;
    font-size: 92px;
    line-height: 1.15;
    color: #f1ecdd;
    text-align: center;
    max-width: 880px;
    margin-bottom: 50px;
  }
  .hero em {
    font-style: italic;
    font-weight: 400;
    color: #dc822e;
  }
  .sub-italic {
    font-family: 'Philosopher', serif;
    font-style: italic;
    font-size: 44px;
    line-height: 1.4;
    color: #f1ecdd;
    text-align: center;
    max-width: 820px;
    opacity: 0.92;
  }
  .footer-brand {
    position: absolute;
    bottom: 60px;
    left: 100px;
    font-family: 'Source Sans 3', sans-serif;
    color: rgba(241, 236, 221, 0.6);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .footer-meta {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-family: 'Philosopher', serif;
    font-style: italic;
    color: rgba(241, 236, 221, 0.6);
    font-size: 24px;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="accent-bar"></div>
    <div class="label">für dich</div>
    <h1 class="hero">Für jede Mama, deren Business zuhause noch <em>„das kleine Hobby"</em> heisst.</h1>
    <p class="sub-italic">Diese hier ist für dich.</p>
    <div class="footer-brand">Mum Life Balance</div>
    <div class="footer-meta">Funktionieren war gestern.</div>
  </div>
</body>
</html>
