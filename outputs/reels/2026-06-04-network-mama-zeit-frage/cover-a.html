<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Reel-Cover A · Brand Typo</title>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .cover {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #12828c 0%, #29556d 100%);
    padding: 100px 80px;
  }
  .grain {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(220,130,46,0.10) 0%, transparent 50%);
    pointer-events: none;
  }
  .corner-top {
    position: absolute;
    top: 80px;
    left: 80px;
    font-family: 'Source Sans 3', sans-serif;
    color: #f1ecdd;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .corner-top::before {
    content: '';
    display: inline-block;
    width: 50px;
    height: 2px;
    background: #dc822e;
    vertical-align: middle;
    margin-right: 20px;
  }
  .label {
    position: absolute;
    top: 80px;
    right: 80px;
    font-family: 'Source Sans 3', sans-serif;
    color: #f1ecdd;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: rgba(241, 236, 221, 0.12);
    padding: 12px 22px;
    border-radius: 4px;
    border: 1px solid rgba(241, 236, 221, 0.25);
  }
  .main {
    position: absolute;
    top: 50%;
    left: 80px;
    right: 80px;
    transform: translateY(-50%);
    z-index: 2;
  }
  .eyebrow {
    color: #dc822e;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .headline {
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-size: 200px;
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -3px;
    text-shadow: 0 6px 28px rgba(0,0,0,0.35);
    margin-bottom: 30px;
  }
  .headline em {
    font-style: italic;
    color: #dc822e;
    font-weight: 400;
  }
  .divider {
    width: 180px;
    height: 4px;
    background: #dc822e;
    margin: 50px 0;
  }
  .sub {
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-size: 56px;
    font-weight: 400;
    font-style: italic;
    line-height: 1.25;
    letter-spacing: 0.5px;
    opacity: 0.95;
    max-width: 720px;
  }
  .footer {
    position: absolute;
    bottom: 100px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }
  .answer-hint {
    color: #f1ecdd;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 1px;
    opacity: 0.88;
  }
  .answer-hint span {
    display: inline-block;
    margin-left: 14px;
    color: #dc822e;
    font-size: 38px;
  }
  .brand {
    color: #f1ecdd;
    font-family: 'Philosopher', serif;
    font-size: 28px;
    font-style: italic;
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="grain"></div>
    <div class="corner-top">Patricia · Mum Life Balance</div>
    <div class="label">Mama-CEO</div>
    <div class="main">
      <div class="eyebrow">die wichtigste Frage</div>
      <h1 class="headline">Mama.<br>Network.<br><em>Wie?</em></h1>
      <div class="divider"></div>
      <p class="sub">5 Mamas haben sie sich gerade gestellt — und die Antwort verändert ihr Setup.</p>
    </div>
    <div class="footer">
      <div class="answer-hint">Antwort in der Caption <span>↓</span></div>
      <div class="brand">Funktionieren war gestern.</div>
    </div>
  </div>
</body>
</html>
