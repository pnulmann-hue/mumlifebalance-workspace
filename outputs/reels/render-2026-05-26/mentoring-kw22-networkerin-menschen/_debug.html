<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Karussell-Render</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; }
  body { font-family: 'Source Sans 3', sans-serif; color: #0c1c30; }
  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
  }
  .footer-brand {
    position: absolute;
    left: 60px;
    bottom: 60px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .footer-meta {
    position: absolute;
    right: 60px;
    bottom: 60px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .top-tag {
    position: absolute;
    top: 60px;
    left: 60px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }
  .slide-num-circle {
    position: absolute;
    top: 60px;
    right: 60px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f1ecdd;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 700;
    font-size: 22px;
  }
</style>
</head>
<body>

      <div class="slide reel-cover v3" style="
        width: 1080px;
        height: 1920px;
        background: #f1ecdd;
        position: relative;
        overflow: hidden;
        padding: 100px 80px;
      ">
        <div style="
          position: absolute;
          top: 100px;
          left: 80px;
          font-family: 'Source Sans 3', sans-serif;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.16em;
          color: #12828c;
        ">MENTORING</div>

        <div style="
          position: absolute;
          left: 100px;
          right: 100px;
          top: 50%;
          transform: translateY(-50%);
        ">
          <div style="
            width: 100px;
            height: 5px;
            background: #12828c;
            margin-bottom: 60px;
            border-radius: 2px;
          "></div>

          <h1 style="
            font-family: 'Philosopher', serif;
            font-weight: 700;
            font-size: 88px;
            line-height: 1.13;
            color: #0c1c30;
            margin-bottom: 50px;
          ">Du bist Networkerin geworden, um mit Menschen zu arbeiten — nicht um sechs Stunden am Tag Posts zu schreiben.</h1>

          <div style="
            display: flex;
            gap: 22px;
            align-items: flex-start;
          ">
            <div style="
              width: 5px;
              align-self: stretch;
              background: #12828c;
              border-radius: 2px;
              min-height: 70px;
            "></div>
            <p style="
              font-family: 'Philosopher', serif;
              font-style: italic;
              font-size: 38px;
              line-height: 1.42;
              color: #12828c;
            ">Das ist der Bruch, den niemand offen anspricht.</p>
          </div>
        </div>

        <div style="
          position: absolute;
          left: 80px;
          bottom: 100px;
          font-family: 'Philosopher', serif;
          font-style: italic;
          font-weight: 400;
          font-size: 26px;
          color: rgba(12, 28, 48, 0.78);
        ">Mum Life Balance</div>
      </div>
    
</body>
</html>
