<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol:#12828c; --dunkelblau:#29556d; --creme:#f1ecdd; }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { background:#1a1a1a; font-family:"Source Sans 3",sans-serif; }
      .slide { width:1080px; height:1920px; position:relative; overflow:hidden; }
      .cover-foto { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:52% 32%; z-index:1; }
      .hook-card { position:absolute; left:60px; right:60px; bottom:300px; background:var(--creme); padding:56px 58px; border-radius:30px; box-shadow:0 18px 48px rgba(12,28,48,0.45); z-index:4; }
      .hook-card .hook { font-family:"Philosopher"; font-weight:700; font-size:62px; line-height:1.1; color:var(--dunkelblau); }
      .hook-card .hook .pop { color:var(--petrol); font-style:italic; }
      .hook-card .spoiler { font-family:"Source Sans 3"; font-weight:700; font-size:40px; color:var(--petrol); margin-top:22px; }
      .handle { position:absolute; bottom:220px; left:64px; font-family:"Source Sans 3"; font-weight:600; font-size:26px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,0.7); z-index:5; }
    </style>
  </head>
  <body>
    <div class="slide">
      <img class="cover-foto" src="assets/cover.jpg" alt="Patricia" />
      <div class="hook-card">
        <div class="hook">Taschengeld-Business — oder endlich eins, das wirklich <span class="pop">trägt</span>?</div>
        <div class="spoiler">Heute Abend schliesst die Tür zur MBA.</div>
      </div>
      <div class="handle">@mumlifebalance</div>
    </div>
  </body>
</html>
