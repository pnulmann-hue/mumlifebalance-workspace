<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent}
  .page{width:1080px;height:1920px;position:relative;background:transparent;font-family:'Poppins',sans-serif}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:58%;
    background:linear-gradient(to top, rgba(15,26,34,.88) 0%, rgba(15,26,34,.72) 42%, rgba(15,26,34,0) 100%)}
  .txt{position:absolute;left:70px;right:70px;bottom:230px;text-align:center;color:#fff;
    font-weight:800;font-size:74px;line-height:1.24;text-shadow:0 4px 24px rgba(0,0,0,.55)}
  .kicker{display:block;font-size:44px;font-weight:800;letter-spacing:3px;color:#E79A45;margin-bottom:26px;text-transform:uppercase}
  .hl{color:#E79A45}
</style></head>
<body>
<div class="page">
  <div class="scrim"></div>
  <div class="txt">
    <span class="kicker">Monatsende</span>
    Du machst dein Backoffice auf – und klappst das Handy <span class="hl">sofort wieder zu.</span> Weil du die Zahl heute einfach nicht sehen willst.
  </div>
</div>
</body></html>
