<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  .page{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Poppins',sans-serif}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 16%}
  /* weicher Verlauf unten fuer Textlesbarkeit */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:56%;
    background:linear-gradient(to top, rgba(10,20,28,.9) 0%, rgba(10,20,28,.7) 40%, rgba(10,20,28,0) 100%)}
  .txt{position:absolute;left:70px;right:70px;bottom:96px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .kicker{font-size:40px;font-weight:800;letter-spacing:4px;color:#E79A45;text-transform:uppercase;
    text-shadow:0 3px 14px rgba(0,0,0,.6)}
  .big{font-size:82px;font-weight:800;line-height:1.02;letter-spacing:-.01em;color:#fff;
    text-shadow:-3px -3px 0 rgba(10,20,26,.9),3px -3px 0 rgba(10,20,26,.9),-3px 3px 0 rgba(10,20,26,.9),3px 3px 0 rgba(10,20,26,.9),0 6px 22px rgba(0,0,0,.4)}
  .bar{display:inline-block;position:relative;padding:2px 20px 8px;margin-top:6px}
  .bar i{position:absolute;inset:0;background:#12828c;border-radius:6px;transform:rotate(-1deg)}
  .bar span{position:relative;font-size:82px;font-weight:800;color:#fff;line-height:1.02;
    text-shadow:0 3px 14px rgba(0,0,0,.35)}
</style></head>
<body>
<div class="page">
  <img class="bg" src="cover-frame.png">
  <div class="scrim"></div>
  <div class="txt">
    <span class="kicker">Monatsende</span>
    <span class="big">Backoffice auf &ndash;</span>
    <span class="bar"><i></i><span>und sofort wieder zu.</span></span>
  </div>
</div>
</body></html>
