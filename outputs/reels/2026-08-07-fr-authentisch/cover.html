<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,700;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol:#12828c; --dunkelblau:#29556d; --creme:#f1ecdd; --grey:#9a9384; }
      * { margin:0; padding:0; box-sizing:border-box; }
      .slide { width:1080px; height:1920px; background:var(--creme); position:relative; overflow:hidden; font-family:"Source Sans 3",sans-serif; }
      .wrap { position:absolute; left:90px; right:90px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; }
      .eyebrow { font-weight:700; font-size:34px; letter-spacing:0.16em; color:var(--petrol); text-transform:uppercase; margin-bottom:40px; }
      .headline { font-family:"Philosopher"; font-weight:700; font-size:98px; line-height:1.05; color:var(--dunkelblau); }
      .headline .pop { color:var(--petrol); font-style:italic; }
      .handle { position:absolute; bottom:120px; left:90px; font-weight:600; font-size:30px; color:var(--grey); }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="wrap">
        <div class="eyebrow">POV</div>
        <div class="headline">Die Reels, die floppen, sind die, in denen du dich <span class="pop">verstellst</span>.</div>
      </div>
      <div class="handle">@mumlifebalance</div>
    </div>
  </body>
</html>
