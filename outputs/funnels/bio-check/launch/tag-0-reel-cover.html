<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Reel-Cover · Bio-Check Tag 0</title>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --petrol: #12828c;
      --dunkelblau: #29556d;
      --creme: #f1ecdd;
      --orange: #dc822e;
      --text-dark: #0c1c30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2a2a2a;
      padding: 40px;
      font-family: 'Source Sans 3', sans-serif;
      display: flex;
      justify-content: center;
    }
    .stage-wrap {
      width: calc(1080px * 0.4);
      height: calc(1350px * 0.4);
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .stage { transform: scale(0.4); transform-origin: top left; width: 1080px; height: 1350px; }
    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0c1c30 0%, #29556d 50%, #12828c 100%);
    }

    /* dezente Sterne oben rechts als Akzent */
    .sparkles {
      position: absolute;
      top: 60px;
      right: 70px;
      font-size: 36px;
      letter-spacing: 8px;
      opacity: 0.35;
      color: var(--creme);
      transform: rotate(-8deg);
    }

    /* Top-Badge */
    .badge {
      position: absolute;
      top: 70px;
      left: 70px;
      background: var(--orange);
      color: #fff;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 14px 26px;
      border-radius: 40px;
    }

    /* Hauptteil — Hook */
    .hook-wrap {
      position: absolute;
      top: 280px;
      left: 70px;
      right: 70px;
    }
    .hook-eyebrow {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 26px;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 24px;
    }
    .hook-main {
      font-family: 'Philosopher', Georgia, serif;
      font-weight: 700;
      font-size: 110px;
      color: var(--creme);
      line-height: 1.0;
      letter-spacing: -2px;
    }
    .hook-main .accent {
      color: var(--orange);
      display: block;
    }
    .hook-divider {
      width: 100px;
      height: 5px;
      background: var(--orange);
      margin: 50px 0 30px;
    }
    .hook-sub {
      font-family: 'Philosopher', Georgia, serif;
      font-style: italic;
      font-size: 46px;
      color: rgba(241, 236, 221, 0.85);
      line-height: 1.3;
    }

    /* Schaufenster-Icon mittig-rechts */
    .schaufenster {
      position: absolute;
      top: 220px;
      right: 90px;
      width: 130px;
      height: 130px;
      background: rgba(241, 236, 221, 0.08);
      border: 4px solid rgba(241, 236, 221, 0.4);
      border-radius: 12px;
    }
    .schaufenster::before,
    .schaufenster::after {
      content: '';
      position: absolute;
      background: rgba(241, 236, 221, 0.4);
    }
    .schaufenster::before {
      width: 4px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    .schaufenster::after {
      width: 100%;
      height: 4px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Bottom — KI-Bot Pill + Brand */
    .bottom-bar {
      position: absolute;
      bottom: 80px;
      left: 70px;
      right: 70px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .feature-pill-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .feature-pill {
      background: rgba(241, 236, 221, 0.12);
      border: 1.5px solid rgba(241, 236, 221, 0.35);
      color: var(--creme);
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: 2px;
      padding: 14px 24px;
      border-radius: 40px;
      text-transform: uppercase;
    }
    .feature-pill .check {
      color: var(--orange);
      margin-right: 8px;
    }

    /* Brand-Tag unten */
    .brand-tag {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 5px;
      color: rgba(241, 236, 221, 0.55);
      text-transform: uppercase;
      margin-top: 8px;
    }
    .brand-tag .accent { color: var(--orange); }
  </style>
</head>
<body>
  <div class="stage-wrap"><div class="stage">
    <div class="slide">

      <div class="badge">Heute · 0 CHF</div>
      <div class="sparkles">✦ ✦ ✦</div>

      <div class="schaufenster"></div>

      <div class="hook-wrap">
        <div class="hook-eyebrow">Network-Mama …</div>

        <h1 class="hook-main">
          Deine Bio
          <span class="accent">kostet dich</span>
          Kunden.
        </h1>

        <div class="hook-divider"></div>

        <p class="hook-sub">
          Mein KI-Bot fixt sie.<br>
          In 3 Minuten.
        </p>
      </div>

      <div class="bottom-bar">
        <div class="feature-pill-row">
          <span class="feature-pill"><span class="check">✓</span>Experten-Satz</span>
          <span class="feature-pill"><span class="check">✓</span>5 Bio-Vorschläge</span>
        </div>
        <div class="brand-tag">
          BIO-CHECK · <span class="accent">@mumlifebalance</span>
        </div>
      </div>

    </div>
  </div></div>
</body>
</html>
