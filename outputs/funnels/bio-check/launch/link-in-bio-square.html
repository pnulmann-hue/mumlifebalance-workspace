<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bio-Check · Link-in-Bio Square</title>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --petrol: #12828c;
      --dunkelblau: #29556d;
      --creme: #f1ecdd;
      --orange: #dc822e;
      --text-dark: #0c1c30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2a2a2a;
      padding: 40px;
      font-family: 'Source Sans 3', sans-serif;
      display: flex;
      justify-content: center;
    }
    .stage-wrap {
      width: calc(1080px * 0.5);
      height: calc(1080px * 0.5);
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .stage {
      transform: scale(0.5);
      transform-origin: top left;
      width: 1080px;
      height: 1080px;
    }
    .slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0c1c30 0%, #29556d 50%, #12828c 100%);
    }

    /* Sterne-Akzent oben */
    .accent-stars {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 36px;
      letter-spacing: 24px;
      opacity: 0.35;
      color: var(--creme);
    }

    /* Schaufenster-Icon (CSS gebaut, kein Emoji) */
    .schaufenster {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 240px;
      background: rgba(241, 236, 221, 0.12);
      border: 6px solid var(--creme);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .schaufenster::before,
    .schaufenster::after {
      content: '';
      position: absolute;
      background: var(--creme);
    }
    .schaufenster::before {
      width: 6px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    .schaufenster::after {
      width: 100%;
      height: 6px;
      top: 50%;
      transform: translateY(-50%);
    }
    .schaufenster .label {
      position: absolute;
      bottom: -56px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 4px;
      color: rgba(241, 236, 221, 0.7);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Gratis-Badge oben rechts */
    .badge {
      position: absolute;
      top: 70px;
      right: 70px;
      background: var(--orange);
      color: #fff;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 14px 26px;
      border-radius: 40px;
      transform: rotate(8deg);
    }

    /* Hauptbereich Headline */
    .head-block {
      position: absolute;
      top: 480px;
      left: 80px;
      right: 80px;
      text-align: center;
    }
    .head-block h1 {
      font-family: 'Philosopher', Georgia, serif;
      font-weight: 700;
      font-size: 130px;
      color: var(--creme);
      line-height: 0.95;
      letter-spacing: -2px;
    }
    .head-block .sub {
      font-family: 'Philosopher', Georgia, serif;
      font-style: italic;
      font-size: 44px;
      color: rgba(241, 236, 221, 0.75);
      margin-top: 18px;
    }

    /* Feature-Liste */
    .features {
      position: absolute;
      top: 760px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: center;
      gap: 36px;
    }
    .features .item {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 24px;
      color: var(--creme);
      opacity: 0.9;
    }
    .features .item .check {
      color: var(--orange);
      margin-right: 6px;
    }

    /* CTA-Pill unten */
    .cta {
      position: absolute;
      bottom: 100px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .cta .pill {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 700;
      font-size: 36px;
      letter-spacing: 4px;
      padding: 26px 56px;
      border-radius: 60px;
      text-transform: uppercase;
    }
    .cta .arrow {
      display: inline-block;
      margin-left: 12px;
      transform: rotate(-45deg);
      font-size: 36px;
    }
  </style>
</head>
<body>
  <div class="stage-wrap"><div class="stage">
    <div class="slide">

      <div class="accent-stars">✦ ✦ ✦ ✦ ✦ ✦ ✦</div>

      <div class="badge">Gratis · 0 CHF</div>

      <div class="schaufenster">
        <span class="label">Dein Schaufenster</span>
      </div>

      <div class="head-block">
        <h1>Bio-Check</h1>
        <div class="sub">für Network-Mamas</div>
      </div>

      <div class="features">
        <div class="item"><span class="check">✓</span>3 Minuten</div>
        <div class="item"><span class="check">✓</span>Experten-Satz</div>
        <div class="item"><span class="check">✓</span>PDF per Mail</div>
      </div>

      <div class="cta">
        <span class="pill">Tippen <span class="arrow">→</span></span>
      </div>

    </div>
  </div></div>
</body>
</html>
