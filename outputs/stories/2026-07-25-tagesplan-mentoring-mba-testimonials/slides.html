<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MBA Testimonials</title>
<link rel="stylesheet" href="../../../scripts/karussell-render/brand-stories.css">
<style>
  .slide.tm { background:#f1ecdd; }
  /* Intro */
  .tm-intro .content{ justify-content:center; text-align:center; padding:200px 110px; }
  .tm-intro .eyebrow{ font-family:'Source Sans 3',sans-serif; font-size:38px; font-weight:700; letter-spacing:5px; text-transform:uppercase; color:#12828c; margin-bottom:44px; }
  .tm-intro h1{ font-family:'Philosopher',serif; font-size:104px; font-weight:700; line-height:1.08; color:#0c1c30; margin-bottom:40px; }
  .tm-intro .sub{ font-family:'Source Sans 3',sans-serif; font-size:44px; color:#29556d; }
  /* Screenshot-Slide */
  .tm-shot{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:110px 80px 80px; }
  .tm-shot .quote{ font-family:'Philosopher',serif; font-size:60px; font-weight:700; line-height:1.2; color:#0c1c30; text-align:center; margin-bottom:52px; }
  .tm-shot .quote .hl{ color:#12828c; }
  .tm-shot .card{ background:#ffffff; border-radius:28px; padding:26px; box-shadow:0 22px 60px rgba(12,28,48,0.22); }
  .tm-shot .card img{ display:block; width:760px; height:auto; border-radius:12px; image-orientation:from-image; }
  .tm-shot .attrib{ font-family:'Silver South Script',cursive; font-family:'Philosopher',serif; font-style:italic; font-size:46px; color:#29556d; margin-top:40px; }
</style>
</head>
<body class="profil-mentoring">
<div class="grid">

  <!-- 1 INTRO -->
  <div class="stage-wrap"><div class="stage">
    <div class="slide tm tm-intro">
      <div class="content">
        <div class="eyebrow">Echte Stimmen 💜</div>
        <h1>Das sagen die Frauen über die Zusammenarbeit</h1>
        <div class="sub">Direkt aus meinem Postfach 👇</div>
      </div>
      <div class="brand-corner">Mum Life Balance</div>
    </div>
  </div></div>

  <!-- 2 SCREENSHOT -->
  <div class="stage-wrap"><div class="stage">
    <div class="slide tm tm-shot">
      <div class="quote">„Endlich ins Tun kommen — und <span class="hl">nicht mehr alles alleine</span> erschaffen müssen."</div>
      <div class="card"><img src="testimonial-1.jpg" alt="Rückmeldung einer MBA-Mama"></div>
      <div class="attrib">— eine Mama aus der MBA</div>
      <div class="brand-corner">Mum Life Balance</div>
    </div>
  </div></div>

</div>
</body>
</html>
