<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Folie 3 — 3 Satzanfänge</title>
<link rel="stylesheet" href="../../../scripts/karussell-render/brand-stories.css">
<style>
  .slide.tip{ background:#f1ecdd; padding:150px 90px 100px; justify-content:flex-start; }
  .tip .eyebrow{ font-family:'Source Sans 3',sans-serif; font-size:36px; font-weight:700; letter-spacing:5px; text-transform:uppercase; color:#dc822e; margin-bottom:34px; }
  .tip h1{ font-family:'Philosopher',serif; font-size:96px; font-weight:700; line-height:1.05; color:#0c1c30; margin-bottom:20px; }
  .tip .sub{ font-family:'Source Sans 3',sans-serif; font-size:40px; color:#29556d; margin-bottom:80px; }
  .tip .rows{ display:flex; flex-direction:column; gap:34px; }
  .tip .row{ display:flex; align-items:center; gap:34px; background:#ffffff; border-radius:26px; padding:44px 46px; box-shadow:0 14px 34px rgba(12,28,48,0.14); }
  .tip .row .num{ flex:0 0 auto; width:90px; height:90px; border-radius:50%; background:#12828c; color:#f1ecdd; font-family:'Philosopher',serif; font-size:54px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .tip .row .phrase{ font-family:'Philosopher',serif; font-style:italic; font-size:52px; font-weight:400; line-height:1.2; color:#0c1c30; }
</style>
</head>
<body class="profil-mentoring">
<div class="grid">
  <div class="stage-wrap"><div class="stage">
    <div class="slide tip">
      <div class="eyebrow">📌 Speicher dir das</div>
      <h1>3 Satzanfänge für deine Story</h1>
      <div class="sub">…wenn dein Kopf grad leer ist.</div>
      <div class="rows">
        <div class="row"><div class="num">1</div><div class="phrase">„Gestern hat mich jemand gefragt…"</div></div>
        <div class="row"><div class="num">2</div><div class="phrase">„Ich hab heute gemerkt, dass…"</div></div>
        <div class="row"><div class="num">3</div><div class="phrase">„Ganz ehrlich? Das nervt mich grad…"</div></div>
      </div>
      <div class="brand-corner">Mum Life Balance</div>
    </div>
  </div></div>
</div>
</body>
</html>
