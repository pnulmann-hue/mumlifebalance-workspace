<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Die Umsetzerinnen — Telegram-Titelbild (1080x1080)</title>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --petrol: #12828c;
      --dunkelblau: #29556d;
      --creme: #f1ecdd;
      --orange: #dc822e;
      --text-dark: #0c1c30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2a2a2a;
      padding: 40px 0;
      font-family: 'Source Sans 3', sans-serif;
      color: var(--text-dark);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .frame-label {
      color: #fff;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .stage-wrap {
      width: calc(1080px * 0.5);
      height: calc(1080px * 0.5);
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .stage {
      transform: scale(0.5);
      transform-origin: top left;
      width: 1080px;
      height: 1080px;
      position: relative;
    }

    .slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: var(--creme);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 90px 80px;
      text-align: center;
    }

    .accent-bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 10px;
      background: var(--petrol);
    }
    .accent-bar.top { top: 0; }
    .accent-bar.bottom { bottom: 0; }

    .section-top {
      flex: 0 0 auto;
      width: 100%;
    }
    .section-middle {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 38px;
    }
    .section-bottom {
      flex: 0 0 auto;
      width: 100%;
    }

    .eyebrow {
      display: inline-block;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: var(--dunkelblau);
      opacity: 0.85;
      border-top: 2px solid var(--dunkelblau);
      border-bottom: 2px solid var(--dunkelblau);
      padding: 10px 26px;
    }

    .main-title {
      font-family: 'Philosopher', serif;
      font-weight: 700;
      font-size: 110px;
      line-height: 1.0;
      color: var(--dunkelblau);
      letter-spacing: -1px;
    }

    .divider {
      width: 70px;
      height: 4px;
      background: var(--orange);
      border-radius: 2px;
    }

    .subtitle {
      font-family: 'Philosopher', serif;
      font-weight: 400;
      font-style: italic;
      font-size: 36px;
      line-height: 1.35;
      color: var(--text-dark);
    }

    .subtitle .accent {
      color: var(--orange);
      font-weight: 700;
      font-style: normal;
    }

    .date-row {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--dunkelblau);
      opacity: 0.75;
    }

    .footer-mark {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--dunkelblau);
      opacity: 0.5;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="frame-label">Telegram-Titelbild · 1080×1080</div>
      <div class="stage-wrap">
        <div class="stage">
          <div class="slide">
            <div class="accent-bar top"></div>

            <div class="section-top">
              <span class="eyebrow">Save the Date · 30.04.</span>
            </div>

            <div class="section-middle">
              <h1 class="main-title">Die<br>Umsetzerinnen</h1>
              <div class="divider"></div>
              <p class="subtitle">
                Nicht überlegen. Nicht warten. <span class="accent">Umsetzen.</span>
              </p>
            </div>

            <div class="section-bottom">
              <div class="date-row">Erster Call · Morgen · 09:00 Uhr</div>
              <div class="footer-mark">Mum Life Balance · Patricia</div>
            </div>

            <div class="accent-bar bottom"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
