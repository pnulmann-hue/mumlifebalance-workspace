<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Die Umsetzerinnen — Telegram-Profilbild (1080x1080)</title>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --petrol: #12828c;
      --dunkelblau: #29556d;
      --creme: #f1ecdd;
      --orange: #dc822e;
      --text-dark: #0c1c30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2a2a2a;
      padding: 40px 0;
      font-family: 'Source Sans 3', sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .frame-label {
      color: #fff;
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .stage-wrap {
      width: calc(1080px * 0.5);
      height: calc(1080px * 0.5);
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .stage {
      transform: scale(0.5);
      transform-origin: top left;
      width: 1080px;
      height: 1080px;
      position: relative;
    }

    .slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: var(--dunkelblau);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Riesiges Monogramm "U" mit Punkt */
    .monogram {
      font-family: 'Philosopher', serif;
      font-weight: 700;
      font-size: 720px;
      line-height: 0.85;
      color: var(--creme);
      position: relative;
      letter-spacing: -10px;
      margin-bottom: 30px;
    }

    /* Orange Akzent-Punkt nach dem U */
    .accent-dot {
      position: absolute;
      bottom: 90px;
      right: -85px;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: var(--orange);
    }

    /* Divider */
    .divider {
      width: 100px;
      height: 4px;
      background: var(--orange);
      border-radius: 2px;
      margin: 30px 0;
    }

    /* Wortmarke unter Divider */
    .wordmark {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 700;
      font-size: 50px;
      letter-spacing: 12px;
      color: var(--creme);
      text-transform: uppercase;
      padding-left: 12px;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="frame-label">Telegram-Profilbild · 1080×1080 (wird zu Kreis gecroppt)</div>
      <div class="stage-wrap">
        <div class="stage">
          <div class="slide">
            <div class="content">
              <div class="monogram">
                U
                <span class="accent-dot"></span>
              </div>

              <div class="divider"></div>

              <div class="wordmark">Die Umsetzerinnen</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
