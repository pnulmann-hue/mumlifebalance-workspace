  var PHASEN = ["Vorbereitung", "Warm-up", "Anmeldung", "Verkauf", "Cart Close", "Nachbereitung", "Abgeschlossen"];

  function dayOfYear(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return null;
    return { jahr: d.getFullYear(), tag: Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000) };
  }

  function renderLaunches(main) {
    var jahr = new Date().getFullYear();
    main.innerHTML =
      '<div class="page-head"><div><h1>Launches</h1>' +
      '<p>Die zeitliche Ebene. Was gerade läuft, in welcher Phase es steckt und wie viele geplante Posts darauf einzahlen.</p></div>' +
      '<div class="head-actions"><button class="btn primary" id="addlaunch">Launch anlegen</button></div></div>' +
      '<div class="timeline"><div class="tl-track">' +
        '<div class="tl-months">' + ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"].map(function (m) { return "<span>" + m + "</span>"; }).join("") + '</div>' +
        '<div class="tl-rows" id="tlrows"><div class="tl-grid">' + new Array(12).fill("<i></i>").join("") + '</div></div>' +
      '</div></div>' +
      '<div id="launchlist"></div>';

    var rows = main.querySelector("#tlrows");
    var imJahr = state.launches.filter(function (l) {
      var a = dayOfYear(l.start);
      return a && a.jahr === jahr;
    });
    if (!imJahr.length) {
      rows.innerHTML += '<div class="tl-row"><div class="note" style="padding-top:8px">Noch kein Launch für ' + jahr + ' eingetragen.</div></div>';
    }
    imJahr.forEach(function (l) {
      var a = dayOfYear(l.start), b = dayOfYear(l.ende) || a;
      var row = document.createElement("div");
      row.className = "tl-row";
      var left = (a.tag - 1) / 365 * 100;
      var width = Math.max(2.5, ((b.tag - a.tag + 1) / 365) * 100);
      var vorbei = l.phase === "Abgeschlossen";
      row.innerHTML = '<div class="tl-bar' + (vorbei ? " past" : "") + '" style="left:' + left + '%;width:' + Math.min(100 - left, width) + '%" title="' +
        esc(l.name + " · " + l.start + " bis " + (l.ende || "offen")) + '">' + esc(l.name || "ohne Namen") + '</div>';
      rows.appendChild(row);
    });
    var heuteTag = dayOfYear(todayISO());
    var marker = document.createElement("div");
    marker.className = "tl-today";
    marker.style.left = ((heuteTag.tag - 1) / 365 * 100) + "%";
    marker.title = "heute";
    rows.appendChild(marker);

    var list = main.querySelector("#launchlist");
    if (!state.launches.length) {
      list.innerHTML = '<div class="panel"><div class="empty">Noch kein Launch. Ein Launch ist alles mit Start- und Enddatum, auch ein Bootcamp oder eine Aktionswoche.</div></div>';
    }
    state.launches.slice().sort(function (x, y) { return (x.start || "") < (y.start || "") ? -1 : 1; }).forEach(function (l) {
      var card = document.createElement("div");
      card.className = "chain";
      var eingezahlt = state.posts.filter(function (p) {
        return l.start && l.ende && p.datum >= l.start && p.datum <= l.ende;
      });
      card.innerHTML =

  /* =========================================================
     Story-Rendering (1080 x 1920)
     ========================================================= */
  var SW = 1080, SH = 1920;
  var STORY_LAYOUTS = {
    text: "Text",
    bild: "Bild mit Text",
    frage: "Fragebox",
    umfrage: "Umfrage",
    cta: "Aufruf"
  };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); }
    else {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  function renderStoryFrame(canvas, fr, st, index, total) {
    var b = BRANDS[st.brand] || BRANDS.mlb_dark;
    var ctx = canvas.getContext("2d");
    canvas.width = SW; canvas.height = SH;
    var pad = 96;

    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, SW, SH);

    getImageObj(fr.id, function (img) {
      if (img) {
        drawCover(ctx, img, 0, 0, SW, SH, fr.zoom, fr.ox, fr.oy);
        var g = ctx.createLinearGradient(0, 0, 0, SH);
        g.addColorStop(0, "rgba(0,0,0,0.45)");
        g.addColorStop(0.42, "rgba(0,0,0,0.12)");
        g.addColorStop(1, b.bg);
        ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH);
      } else if (fr.layout === "bild") {
        ctx.fillStyle = b.bg2; ctx.fillRect(0, 0, SW, SH);
        ctx.fillStyle = b.muted; ctx.font = "36px " + b.body; ctx.textAlign = "center";
        ctx.fillText("Bild hier hochladen", SW / 2, SH / 2);
        ctx.textAlign = "left";
      }

      // Fortschrittsbalken oben
      var segW = (SW - pad * 2 - (total - 1) * 8) / total;
      for (var i = 0; i < total; i++) {
        ctx.fillStyle = i <= index ? b.text : b.muted;
        ctx.globalAlpha = i <= index ? 0.9 : 0.3;
        roundRect(ctx, pad + i * (segW + 8), 62, segW, 7, 4);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Handle
      var hd = st.handle || b.handle;
      if (hd) {
        ctx.fillStyle = b.accent2;
        ctx.beginPath(); ctx.arc(pad + 26, 132, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = b.text; ctx.font = "26px " + b.body;
        ctx.textBaseline = "middle"; ctx.fillText(hd, pad + 68, 134); ctx.textBaseline = "alphabetic";
      }

      var maxW = SW - pad * 2;

      if (fr.layout === "frage" || fr.layout === "umfrage") {
        var box = fitLines(ctx, fr.text, maxW - 80, 420, b.display, "bold", 62, 34, 1.2);
        var boxH = box.lines.length * box.size * 1.2 + 200;
        var by = SH * 0.36;
        ctx.fillStyle = b.bg2;
        ctx.globalAlpha = img ? 0.92 : 1;
        roundRect(ctx, pad, by, maxW, boxH, 36); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.font = "bold " + box.size + "px " + b.display;
        ctx.fillStyle = b.text;
        ctx.textAlign = "center";
        box.lines.forEach(function (ln, i) { ctx.fillText(ln, SW / 2, by + 78 + box.size + i * box.size * 1.2); });
        var innerY = by + 88 + box.lines.length * box.size * 1.2;
        if (fr.layout === "frage") {
          ctx.fillStyle = b.bg;
          roundRect(ctx, pad + 48, innerY, maxW - 96, 88, 44); ctx.fill();
          ctx.fillStyle = b.muted; ctx.font = "32px " + b.body;
          ctx.fillText(fr.cta || "Antworten …", SW / 2, innerY + 56);
        } else {
          var bw = (maxW - 96 - 24) / 2;
          [[fr.optA || "Ja", pad + 48], [fr.optB || "Nein", pad + 48 + bw + 24]].forEach(function (o) {
            ctx.fillStyle = b.accent;
            roundRect(ctx, o[1], innerY, bw, 88, 44); ctx.fill();
            ctx.fillStyle = b.bg; ctx.font = "bold 34px " + b.body;
            ctx.fillText(o[0], o[1] + bw / 2, innerY + 56);
          });
        }
        ctx.textAlign = "left";
      } else {
        var isCta = fr.layout === "cta";
        var t = fitLines(ctx, fr.text, maxW, SH * 0.42, b.display, "bold", isCta ? 76 : 68, 36, 1.2);
        var blockH = t.lines.length * t.size * 1.2;
        var ty = fr.layout === "bild" ? SH - pad - 260 - blockH : (SH - blockH) / 2;
        ctx.font = "bold " + t.size + "px " + b.display;
        ctx.fillStyle = b.text;
        t.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, ty + t.size + i * t.size * 1.2); });
        if (fr.cta) {
          ctx.font = "bold 38px " + b.body;
          var cw = ctx.measureText(fr.cta).width;
          var cy = ty + blockH + 70;
          ctx.fillStyle = b.accent;
          roundRect(ctx, pad, cy, cw + 74, 96, 48); ctx.fill();
          ctx.fillStyle = b.bg;
          ctx.fillText(fr.cta, pad + 37, cy + 60);
        }
      }
    });
  }

  function renderStoryStrip(strip, st) {
    strip.innerHTML = "";

    var add = document.createElement("button");

      saveStory(st); renderStoryStrip(strip, st);

  function storyCard(st, fr, i) {
    var card = document.createElement("div");
    card.className = "storycard";
    var head = document.createElement("div");
    head.className = "sc-head";
    head.innerHTML = '<span class="sc-num">Frame ' + (i + 1) + '</span>';
    var tools = document.createElement("div");
    tools.className = "sc-tools";
    [["‹", -1], ["›", 1]].forEach(function (t) {
      var b = document.createElement("button");
      b.className = "btn ghost"; b.textContent = t[0];
      b.onclick = function () {
        var j = i + t[1];
        if (j < 0 || j >= st.frames.length) return;
        var tmp = st.frames[i]; st.frames[i] = st.frames[j]; st.frames[j] = tmp;
        saveStory(st); renderStoryStrip(card.parentNode, st);
      };
      tools.appendChild(b);
    });
    var rm = document.createElement("button");
    rm.className = "btn ghost"; rm.textContent = "×";
    rm.onclick = function () {
      if (st.frames.length === 1) { toast("Eine Sequenz braucht mindestens einen Frame."); return; }
      st.frames.splice(i, 1); saveStory(st); renderStoryStrip(card.parentNode, st);
    };
    tools.appendChild(rm);
    head.appendChild(tools);
    card.appendChild(head);

    var cv = document.createElement("canvas");
    card.appendChild(cv);

    var body = document.createElement("div");
    body.className = "sc-body";

    var lay = document.createElement("select");
    Object.keys(STORY_LAYOUTS).forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = STORY_LAYOUTS[k];
      if (fr.layout === k) o.selected = true;
      lay.appendChild(o);
    });
    lay.onchange = function () { fr.layout = lay.value; saveStory(st); draw(); extrasBauen(); };
    body.appendChild(lay);

    var ta = document.createElement("textarea");
    ta.rows = 3; ta.placeholder = "Text auf dem Frame"; ta.value = fr.text || "";
    ta.oninput = function () { fr.text = ta.value; saveStory(st); draw(); };
    body.appendChild(ta);

    var extras = document.createElement("div");
    extras.style.cssText = "display:flex;flex-direction:column;gap:8px";
    body.appendChild(extras);

    function extrasBauen() {
      extras.innerHTML = "";
      if (fr.layout === "umfrage") {
        [["optA", "Antwort links"], ["optB", "Antwort rechts"]].forEach(function (o) {
          var inp = document.createElement("input");
          inp.placeholder = o[1]; inp.value = fr[o[0]] || "";
          inp.oninput = function () { fr[o[0]] = inp.value; saveStory(st); draw(); };
          extras.appendChild(inp);
        });
      } else {
        var c = document.createElement("input");
        c.placeholder = fr.layout === "frage" ? "Text im Antwortfeld" : "Aufruf, z.B. Schreib mir FAHRPLAN";
        c.value = fr.cta || "";
        c.oninput = function () { fr.cta = c.value; saveStory(st); draw(); };
        extras.appendChild(c);
      }
      var fb = document.createElement("label");
      fb.className = "btn filebtn";
      fb.innerHTML = "<span>" + (images[fr.id] ? "Bild ersetzen" : "Bild wählen") + "</span>";
      var fi = document.createElement("input");
      fi.type = "file"; fi.accept = "image/*";
      fi.onchange = function () {
        if (!fi.files || !fi.files[0]) return;
        compressImage(fi.files[0], function (u) { saveImage("storys/" + st.id, fr.id, u); draw(); extrasBauen(); });
      };
      fb.appendChild(fi);
      extras.appendChild(fb);
      if (images[fr.id]) {
        [["Zoom", "zoom", 1, 3, 0.02], ["Links/Rechts", "ox", -50, 50, 1], ["Hoch/Runter", "oy", -50, 50, 1]].forEach(function (sl) {
          var row = document.createElement("div");
          row.className = "sliderow";
          var lb = document.createElement("span"); lb.textContent = sl[0];
          var rg = document.createElement("input");
          rg.type = "range"; rg.min = sl[2]; rg.max = sl[3]; rg.step = sl[4];
          rg.value = fr[sl[1]] != null ? fr[sl[1]] : (sl[1] === "zoom" ? 1 : 0);
          rg.oninput = function () { fr[sl[1]] = parseFloat(rg.value); draw(); };
          rg.onchange = function () { saveStory(st); };
          row.appendChild(lb); row.appendChild(rg);
          extras.appendChild(row);
        });
      }

    extrasBauen();

    function draw() { renderStoryFrame(cv, fr, st, i, st.frames.length); }

  function seekTo(video, t) {
    return new Promise(function (res) {
      var fertig = false;
      function done() { if (fertig) return; fertig = true; video.removeEventListener("seeked", done); res(); }
      video.addEventListener("seeked", done);

  function frameScore(canvas) {
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    var w = canvas.width, h = canvas.height;
    var d;
    try { d = ctx.getImageData(0, 0, w, h).data; } catch (e) { return 0; }
    var grau = new Float32Array(w * h), summe = 0;
    for (var i = 0, j = 0; i < d.length; i += 4, j++) {
      var g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      grau[j] = g; summe += g;
    }
    var mittel = summe / (w * h);
    // Schärfe über die Nachbarschaftsdifferenz
    var schaerfe = 0, n = 0;
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var k = y * w + x;
        var lap = 4 * grau[k] - grau[k - 1] - grau[k + 1] - grau[k - w] - grau[k + w];
        schaerfe += lap * lap; n++;
      }
    }
    schaerfe = Math.sqrt(schaerfe / Math.max(1, n));
    // zu dunkel oder ausgebrannt wird bestraft
    var helligkeit = 1 - Math.abs(mittel - 128) / 128;
    return schaerfe * (0.45 + 0.55 * helligkeit);
  }

  function frameVorschlaege(video, anzahl, cb) {
    var dauer = video.duration;
    if (!dauer || !isFinite(dauer)) { cb([]); return; }
    var start = Math.min(0.4, dauer * 0.03);
    var zeiten = [];
    for (var i = 0; i < anzahl; i++) zeiten.push(start + (dauer - start) * (i / (anzahl - 1 || 1)) * 0.94);
    var thumb = document.createElement("canvas");
    thumb.width = 168; thumb.height = 298;
    var tctx = thumb.getContext("2d", { willReadFrequently: true });
    var gross = document.createElement("canvas");
    gross.width = 405; gross.height = 720;
    var gctx = gross.getContext("2d");
    var out = [];
    var idx = 0;
    function naechster() {
      if (idx >= zeiten.length) {
        out.sort(function (a, b) { return b.score - a.score; });
        cb(out);
        return;
      }
      var t = zeiten[idx++];
      seekTo(video, t).then(function () {
        try {
          zeichneCover(tctx, video, thumb.width, thumb.height);
          zeichneCover(gctx, video, gross.width, gross.height);
          out.push({ t: t, score: frameScore(thumb), vorschau: gross.toDataURL("image/jpeg", 0.72) });
        } catch (e) {}
        setTimeout(naechster, 20);
      });
    }
    naechster();
  }

  function zeichneCover(ctx, quelle, w, h) {
    var sw = quelle.videoWidth || quelle.width, sh = quelle.videoHeight || quelle.height;
    var f = Math.max(w / sw, h / sh);
    var dw = sw * f, dh = sh * f;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(quelle, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  }

  function renderReelCanvas(canvas, r, opts) {
    opts = opts || {};
    var b = BRANDS[r.brand] || BRANDS.mlb_dark;
    var ctx = canvas.getContext("2d");
    canvas.width = RW; canvas.height = RH;
    ctx.clearRect(0, 0, RW, RH);

    function textZeichnen() {
      var pad = 96;
      var maxW = RW - pad * 2;
      var h = fitLines(ctx, String(r.hook || "").toUpperCase(), maxW, RH * 0.34, b.display, "bold", 104, 44, 1.12);
      var uLines = [];
      if (r.unter) {
        ctx.font = "40px " + b.body;
        uLines = wrap(ctx, r.unter, maxW).slice(0, 3);
      }
      var blockH = h.lines.length * h.size * 1.12 + (uLines.length ? uLines.length * 56 + 34 : 0);
      var y;
      if (r.pos === "oben") y = 300;
      else if (r.pos === "mitte") y = (RH - blockH) / 2;
      else y = RH - 470 - blockH;

      if (r.scrim && !opts.transparent) {
        var g = ctx.createLinearGradient(0, y - 150, 0, y + blockH + 150);
        g.addColorStop(0, "rgba(6,14,24,0)");
        g.addColorStop(0.35, "rgba(6,14,24,0.62)");
        g.addColorStop(0.7, "rgba(6,14,24,0.62)");
        g.addColorStop(1, "rgba(6,14,24,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, y - 150, RW, blockH + 300);
      }

      ctx.font = "bold " + h.size + "px " + b.display;
      ctx.fillStyle = opts.transparent ? "#ffffff" : b.text;
      if (opts.transparent) {
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 4;
      }
      h.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, y + h.size + i * h.size * 1.12); });
      var uy = y + h.lines.length * h.size * 1.12 + 34;
      if (uLines.length) {
        ctx.font = "40px " + b.body;
        ctx.fillStyle = opts.transparent ? "rgba(255,255,255,0.92)" : b.muted;
        uLines.forEach(function (ln, i) { ctx.fillText(ln, pad, uy + 40 + i * 56); });
      }
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      // Akzentstrich unter der Hook
      ctx.fillStyle = b.accent;
      ctx.fillRect(pad, y - 46, 130, 9);

      if (opts.guides) {
        ctx.strokeStyle = "rgba(255,80,80,0.85)";
        ctx.setLineDash([16, 14]);
        ctx.lineWidth = 4;
        ctx.strokeRect(60, 240, RW - 120 - 200, RH - 240 - 480);
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(255,80,80,0.95)";
        ctx.font = "30px " + b.body;
        ctx.fillText("sichere Zone", 74, 214);
      }
    }

    if (opts.transparent) { textZeichnen(); return; }

    var titel = images[r.id];
    if (titel) {
      getImageObj(r.id, function (img) {
        if (img) drawCover(ctx, img, 0, 0, RW, RH, 1, 0, 0);
        else { ctx.fillStyle = b.bg; ctx.fillRect(0, 0, RW, RH); }
        textZeichnen();
      });
    } else {
      ctx.fillStyle = b.bg;
      ctx.fillRect(0, 0, RW, RH);
      ctx.fillStyle = b.muted;
      ctx.font = "40px " + b.body;
      ctx.textAlign = "center";
      ctx.fillText("Noch kein Titelbild gewählt", RW / 2, RH / 2);
      ctx.textAlign = "left";
      textZeichnen();
    }
  }

    btn.onclick = function () {
      if (!datum.value) { datum.focus(); toast("Setz zuerst ein Datum."); return; }
      if (!(r.caption || "").trim()) { toast("Ohne Caption kein Beitrag. Schreib sie oben rein."); return; }
      speichern();
      btn.disabled = true;
      btn.textContent = "lege ab …";

      var wann = new Date(datum.value + "T" + (zeit.value || "18:00"));
      var basis = "freigaben/" + r.id;

      function steuerSchreiben() {
        db.collection("freigaben").doc(r.id).set({
          name: r.name,
          typ: "reel",
          videodatei: r.videodatei,
          caption: r.caption || "",
          profil: profil.value,
          datum: datum.value,
          zeit: zeit.value || "18:00",
          zeitpunktISO: isNaN(wann) ? "" : wann.toISOString(),
          status: "wartet",
          updatedAt: new Date().toISOString()
        }).then(function () {
          b.status = "wartet";
          saveReel(r);
          btn.disabled = false;
          render();
          toast("Freigegeben. Sag mir im Chat Bescheid, dann geht es raus.");
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = "Für Blotato freigeben";
          toast("Das Ablegen hat nicht geklappt.");
        });
      }

      // Das Titelbild wird als Cover mitgegeben, damit im Feed steht, was sie sieht.
      var c = document.createElement("canvas");
      renderReelCanvas(c, r, {});
      setTimeout(function () {
        var q = 0.9, out = c.toDataURL("image/jpeg", q);
        while (out.length > 700000 && q > 0.45) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
        db.doc(basis).collection("bilder").doc("cover").set({ dataUrl: out, nr: 1 })
          .then(steuerSchreiben)
          .catch(function () {
            btn.disabled = false;
            btn.textContent = "Für Blotato freigeben";
            toast("Das Cover liess sich nicht ablegen.");
          });
      }, 320);
    };
  }

  function komprimiereDataUrl(dataUrl, cb) {
    var img = new Image();
    img.onload = function () {
      var maxW = 1080, q = 0.8, out = "";
      for (var a = 0; a < 6; a++) {
        var c = document.createElement("canvas");
        var f = Math.min(1, maxW / img.width);
        c.width = Math.round(img.width * f);
        c.height = Math.round(img.height * f);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 180000) break;
        if (q > 0.5) q -= 0.12; else maxW = Math.round(maxW * 0.75);
      }
      cb(out);
    };
    img.src = dataUrl;
  }

  /* =========================================================
     Render-Dispatcher
     ========================================================= */
  function render() {
    renderNav();
    var main = document.getElementById("main");
    if (activeTab === "uebersicht") renderUebersicht(main);
    else if (activeTab === "karussell") renderKarussell(main);
    else if (activeTab === "studio") renderStudio(main);
    else if (activeTab === "storys") renderStorys(main);
    else if (activeTab === "reels") renderReels(main);
    else if (activeTab === "wissen") renderWissen(main);
    else if (activeTab === "funnel") renderFunnel(main);
    else if (activeTab === "mailings") renderMailings(main);
    else if (activeTab === "produkte") renderProdukte(main);
    else if (activeTab === "suche") renderSuche(main);
    else if (activeTab === "kurse") renderKurse(main);
    else if (activeTab === "rangtracker") renderRangtracker(main);
    else if (activeTab === "launches") renderLaunches(main);
    else if (activeTab === "woche") renderWoche(main);
    else if (activeTab === "zahlen") renderZahlen(main);
    else renderTable(main, activeTab);
  }

  /* =========================================================
     Start: lokal laden, dann Datenbank drüberlegen
     ========================================================= */
  DOC_KEYS.forEach(function (k) { state[k] = lsGet(k, []); });
  Object.assign(settings, lsGet("einstellungen", {}) || {});
  Object.assign(mailings, lsGet("mailings", {}) || {});
  produktdetails = lsGet("produkt-details", {}) || {};
  doterra = lsGet("doterra", null);
  kurse = lsGet("kurse", null);
  WISSEN_FELDER.forEach(function (f) { wissen[f.k] = f.d; });
  Object.assign(wissen, lsGet("wissen", {}) || {});
  (lsGet("karliste", []) || []).forEach(function (id) {
    var c = lsGet("kar-" + id, null);
    if (c) state.karussells.push(c);
  });
  state.karussells.forEach(function (c) {
    c.slides.forEach(function (s) {
      var d = lsGet("img-" + s.id, null);
      if (d) images[s.id] = d;
    });
  });
  (lsGet("storyliste", []) || []).forEach(function (id) {
    var x = lsGet("st-" + id, null);
    if (x) state.storys.push(x);
  });
  state.storys.forEach(function (x) {
    x.frames.forEach(function (f) {
      var d = lsGet("img-" + f.id, null);
      if (d) images[f.id] = d;
    });
  });
  (lsGet("reelliste", []) || []).forEach(function (id) {
    var x = lsGet("rl-" + id, null);
    if (x) { state.reels.push(x); var d = lsGet("img-" + x.id, null); if (d) images[x.id] = d; }
  });
  if (state.karussells.length) activeCarousel = state.karussells[0].id;
  if (state.storys.length) activeStory = state.storys[0].id;
  if (state.reels.length) activeReel = state.reels[0].id;
  render();
  setSaveState("verbinde …", "");

  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
    window.claude.use("sample").then(function (s) { sampler = s; if (activeTab === "karussell") render(); }).catch(function () {});
    window.claude.use("db").then(function (d) {
      if (!d) { setSaveState("lokal gespeichert", "off"); return; }
      db = d;
      setSaveState("gespeichert", "on");
      db.doc("daten/wissen").onSnapshot(function (snap) {
        if (!snap.exists) return;
        Object.assign(wissen, snap.data() || {});
        lsSet("wissen", wissen);
        if (activeTab === "wissen") render();
      }, function () {});
      db.collection("storys").limit(60).get().then(function (qs) {
        var seen = {};
        state.storys.forEach(function (x) { seen[x.id] = x; });
        qs.docs.forEach(function (doc) {
          var d0 = doc.data() || {};
          if (!d0.frames || !d0.frames.length) return;
          var st = { id: doc.id, name: d0.name || "Sequenz", brand: d0.brand || "mlb_dark", handle: d0.handle || "", phase: d0.phase || "", frames: d0.frames, updatedAt: d0.updatedAt || "" };
          if (seen[st.id]) Object.assign(seen[st.id], st); else state.storys.push(st);
        });
        state.storys.sort(function (a, b) { return (b.updatedAt || "") < (a.updatedAt || "") ? -1 : 1; });
        if (!activeStory && state.storys.length) activeStory = state.storys[0].id;
        state.storys.forEach(function (st) {
          db.doc("storys/" + st.id).collection("bilder").limit(30).get().then(function (bs) {
            var neu = false;
            bs.docs.forEach(function (b) {
              var u = (b.data() || {}).dataUrl;
              if (u && images[b.id] !== u) { images[b.id] = u; lsSet("img-" + b.id, u); neu = true; }
            });
            if (neu && activeTab === "storys") render();
          }).catch(function () {});
        });
        render();
      }).catch(function () {});
      db.collection("reels").limit(60).get().then(function (qs) {
        var seen = {};
        state.reels.forEach(function (x) { seen[x.id] = x; });
        qs.docs.forEach(function (doc) {
          var d0 = doc.data() || {};
          var rl = { id: doc.id, name: d0.name || "Reel", hook: d0.hook || "", unter: d0.unter || "", pos: d0.pos || "unten", brand: d0.brand || "mlb_dark", datum: d0.datum || "", textfrei: !!d0.textfrei, coverfarbe: d0.coverfarbe || "dunkelblau", videourl: d0.videourl || "", scrim: d0.scrim !== false, skript: d0.skript || "", caption: d0.caption || "", untertitel: d0.untertitel || "", videodatei: d0.videodatei || "", blotato: d0.blotato || null, updatedAt: d0.updatedAt || "" };
          if (seen[rl.id]) Object.assign(seen[rl.id], rl); else state.reels.push(rl);
        });
        state.reels.sort(function (a, b) { return (b.updatedAt || "") < (a.updatedAt || "") ? -1 : 1; });
        if (!activeReel && state.reels.length) activeReel = state.reels[0].id;
        state.reels.forEach(function (rl) {
          db.doc("reels/" + rl.id).collection("bilder").limit(4).get().then(function (bs) {
            var neu2 = false;
            bs.docs.forEach(function (b) {
              var u = (b.data() || {}).dataUrl;
              if (u && images[b.id] !== u) { images[b.id] = u; lsSet("img-" + b.id, u); neu2 = true; }
            });
            if (neu2 && activeTab === "reels") render();
          }).catch(function () {});
        });
        render();
      }).catch(function () {});
      db.doc("daten/produkt-details").onSnapshot(function (snap) {
        if (!snap.exists) return;
        produktdetails = (snap.data() || {}).werte || {};
        lsSet("produkt-details", produktdetails);
        if (activeTab === "produkte") render();
      }, function () {});
      db.doc("daten/kurse").onSnapshot(function (snap) {
        if (!snap.exists) return;
        kurse = snap.data() || null;
        lsSet("kurse", kurse);
        if (activeTab === "kurse") render();
      }, function () {});
      db.doc("daten/doterra").onSnapshot(function (snap) {
        if (!snap.exists) return;
        doterra = snap.data() || null;
        lsSet("doterra", doterra);
        if (activeTab === "rangtracker") render();
      }, function () {});
      db.doc("daten/mailings").onSnapshot(function (snap) {
        if (!snap.exists) return;
        var d0 = snap.data() || {};
        mailings = { listen: d0.listen || [], automationen: d0.automationen || [],
                     stand: d0.stand || "" };
        lsSet("mailings", mailings);
        if (activeTab === "mailings") render();
      }, function () {});
      db.doc("daten/einstellungen").onSnapshot(function (snap) {
        if (!snap.exists) return;
        Object.assign(settings, snap.data() || {});
        lsSet("einstellungen", settings);
        if (activeTab === "uebersicht" || activeTab === "zahlen") render();
      }, function () {});
      DOC_KEYS.forEach(function (k) {
        db.doc("daten/" + k).onSnapshot(function (snap) {
          if (!snap.exists) return;
          var items = (snap.data() || {}).items;
          if (!Array.isArray(items)) return;
          state[k] = items.map(function (x) { return Object.assign({}, x); });
          lsSet(k, state[k]);
          if (activeTab === k || activeTab === "uebersicht") render(); else renderNav();
        }, function () { setSaveState("nur lokal gespeichert", "off"); });
      });
      db.collection("karussells").limit(60).get().then(function (qs) {
        var seen = {};
        state.karussells.forEach(function (c) { seen[c.id] = c; });
        qs.docs.forEach(function (doc) {
          var d0 = doc.data() || {};
          var car = { id: doc.id, datum: d0.datum || "", name: d0.name || "Karussell", brand: d0.brand || "mlb_dark", handle: d0.handle || "", typ: d0.typ || "listicle", funnel: d0.funnel || "TOF", textfrei: !!d0.textfrei, blotato: d0.blotato || null, caption: d0.caption || "", slides: d0.slides || [], updatedAt: d0.updatedAt || "" };
          if (!car.slides.length) return;
          if (seen[car.id]) { Object.assign(seen[car.id], car); }
          else { state.karussells.push(car); }
        });
        state.karussells.sort(function (a, b) { return (b.updatedAt || "") < (a.updatedAt || "") ? -1 : 1; });
        if (!activeCarousel && state.karussells.length) activeCarousel = state.karussells[0].id;
        // Bilder der Karussells nachladen
        state.karussells.forEach(function (car) {
          db.doc("karussells/" + car.id).collection("bilder").limit(30).get().then(function (bs) {
            var neu = false;
            bs.docs.forEach(function (b) {
              var u = (b.data() || {}).dataUrl;
              if (u && images[b.id] !== u) { images[b.id] = u; lsSet("img-" + b.id, u); neu = true; }
            });
            if (neu && activeTab === "karussell") render();
          }).catch(function () {});
        });
        render();
      }).catch(function () {});
    }).catch(function () { setSaveState("lokal gespeichert", "off"); });
  } else {
    setSaveState("lokal gespeichert", "off");
  }
})();
</script>
