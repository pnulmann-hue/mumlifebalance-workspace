
<title>Mum Life Balance Cockpit</title>
<style>
  :root {
    --ground: #f3efe4;
    --surface: #fbf8f1;
    --surface-2: #ebe4d3;
    --ink: #0c1c30;
    --ink-soft: #4d6076;
    --line: rgba(12, 28, 48, 0.14);
    --line-strong: rgba(12, 28, 48, 0.28);
    --teal: #12828c;
    --teal-soft: rgba(18, 130, 140, 0.12);
    --navy: #29556d;
    --orange: #dc822e;
    --orange-soft: rgba(220, 130, 46, 0.16);
    --good: #2f7d5b;
    --warn: #b8791b;
    --crit: #b34733;
    --shadow: 0 1px 2px rgba(12, 28, 48, 0.06), 0 8px 24px rgba(12, 28, 48, 0.07);
    --display: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --body: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1c30;
      --surface: #12283f;
      --surface-2: #1a3450;
      --ink: #f1ecdd;
      --ink-soft: #a8bccb;
      --line: rgba(241, 236, 221, 0.16);
      --line-strong: rgba(241, 236, 221, 0.32);
      --teal: #35a8b2;
      --teal-soft: rgba(53, 168, 178, 0.16);
      --navy: #7fb0c7;
      --orange: #eb9a4f;
      --orange-soft: rgba(235, 154, 79, 0.18);
      --good: #5fb98d;
      --warn: #d9a84b;
      --crit: #e08a76;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1c30;
    --surface: #12283f;
    --surface-2: #1a3450;
    --ink: #f1ecdd;
    --ink-soft: #a8bccb;
    --line: rgba(241, 236, 221, 0.16);
    --line-strong: rgba(241, 236, 221, 0.32);
    --teal: #35a8b2;
    --teal-soft: rgba(53, 168, 178, 0.16);
    --navy: #7fb0c7;
    --orange: #eb9a4f;
    --orange-soft: rgba(235, 154, 79, 0.18);
    --good: #5fb98d;
    --warn: #d9a84b;
    --crit: #e08a76;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .side {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 22px 14px 28px;
    display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brandmark { padding: 0 8px; }
  .brandmark .bm-name { font-family: var(--display); font-size: 20px; line-height: 1.15; letter-spacing: -0.01em; }
  .brandmark .bm-sub { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  .navbtn {
    display: flex; align-items: center; gap: 10px;
    background: none; border: 0; text-align: left;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    color: var(--ink-soft); font-size: 14px;
  }
  .navbtn:hover { background: var(--surface-2); color: var(--ink); }
  .navbtn[aria-current="true"] { background: var(--teal-soft); color: var(--ink); font-weight: bold; box-shadow: inset 3px 0 0 var(--teal); }
  .navbtn .cnt { margin-left: auto; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .side-foot { margin-top: auto; font-size: 11px; color: var(--ink-soft); padding: 0 8px; line-height: 1.45; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--good); }
  .dot.off { background: var(--warn); }

  main { padding: 26px 28px 70px; min-width: 0; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head h1 { font-family: var(--display); font-size: 26px; margin: 0; font-weight: normal; letter-spacing: -0.01em; text-wrap: balance; }
  .page-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13px; max-width: 62ch; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    border: 1px solid var(--line-strong); background: var(--surface);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); padding: 6px 8px; }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  /* ---------- overview ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
  .tile .t-lab { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
  .tile .t-num { font-family: var(--display); font-size: 30px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .t-note { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .panel h2 { font-family: var(--display); font-size: 17px; margin: 0 0 12px; font-weight: normal; }
  .mini { display: flex; flex-direction: column; }
  .mini-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .mini-row:first-child { border-top: 0; }
  .mini-row .m-date { font-size: 12px; color: var(--ink-soft); min-width: 74px; font-variant-numeric: tabular-nums; }
  .mini-row .m-main { flex: 1; min-width: 0; }
  .empty { color: var(--ink-soft); font-size: 13px; font-style: italic; padding: 8px 0; }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .trow { display: grid; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--line); min-width: max-content; }
  .trow.head { border-top: 0; background: var(--surface-2); position: sticky; top: 0; }
  .trow.head span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .trow input, .trow select, .trow textarea {
    width: 100%; background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 5px 7px; font-size: 13px;
  }
  /* Ein Auswahlfeld muss man sehen, bevor man mit der Maus draufkommt:
     eigener Grund, eigener Rand, eigenes Pfeilchen. */
  .trow select {
    -webkit-appearance: none; appearance: none;
    background-color: var(--surface-2);
    border-color: var(--line);
    padding-right: 22px; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%234d6076' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 7px center;
  }
  .trow select:hover { border-color: var(--line-strong); }
  .trow select:focus { outline: 2px solid var(--teal-soft); border-color: var(--teal); }
  .trow input:hover, .trow select:hover, .trow textarea:hover { border-color: var(--line); }
  .trow input:focus, .trow select:focus, .trow textarea:focus { border-color: var(--teal); background: var(--ground); outline: none; }
  .trow .del { border: 0; background: none; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 15px; line-height: 1; }
  .trow .del:hover { background: var(--orange-soft); color: var(--crit); }
  select.pill { border-radius: 999px !important; border: 1px solid var(--line-strong) !important; font-size: 12px !important; padding: 4px 8px !important; }
  select.pill[data-tone="go"] { background: rgba(47,125,91,0.14); color: var(--good); border-color: transparent !important; }
  select.pill[data-tone="mid"] { background: var(--orange-soft); color: var(--warn); border-color: transparent !important; }
  select.pill[data-tone="new"] { background: var(--teal-soft); color: var(--teal); border-color: transparent !important; }
  select.pill[data-tone="aus"] { background: var(--surface-2); color: var(--ink-soft); border-color: transparent !important; opacity: 0.75; }
  .tablefoot { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }

  /* ---------- carousel editor ---------- */
  .editbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    background: var(--ground); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 13px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none; }
  .slidestrip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .slidecard { flex: 0 0 268px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
  .slidecard.dragging { opacity: 0.5; }
  .sc-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .sc-head .sc-num { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
  .sc-head .sc-tools { margin-left: auto; display: flex; gap: 2px; }
  .sc-canvas { display: block; width: 100%; height: auto; background: #0c1c30; cursor: grab; }
  .sc-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sc-body textarea { resize: vertical; min-height: 42px; }
  .sliderow { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center; }
  .sliderow span { font-size: 11px; color: var(--ink-soft); }
  input[type="range"] { accent-color: var(--teal); width: 100%; }
  .filebtn { position: relative; overflow: hidden; display: inline-flex; }
  .filebtn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .addslide {
    flex: 0 0 120px; align-self: stretch; min-height: 340px;
    border: 1px dashed var(--line-strong); border-radius: var(--r); background: transparent;
    color: var(--ink-soft); cursor: pointer; font-size: 13px;
  }
  .addslide:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
  .captionbox { margin-top: 18px; }
  .captionbox textarea { width: 100%; min-height: 190px; resize: vertical; font-family: var(--body); }
  .cap-meta { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-soft); margin-top: 8px; flex-wrap: wrap; }
  .hooklist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .hookopt { text-align: left; border: 1px solid var(--line); background: var(--ground); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .hookopt:hover { border-color: var(--teal); }
  .note { font-size: 12px; color: var(--ink-soft); }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; box-shadow: var(--shadow); z-index: 50;
  }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); letter-spacing: 0.04em; }
  .chip.orange { background: var(--orange-soft); color: var(--orange); }

  .navgroup { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); padding: 14px 10px 4px; opacity: 0.8; }
  .studio-grid { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .studio-grid { grid-template-columns: 1fr; } }
  .studio-form { display: flex; flex-direction: column; gap: 12px; }
  .studio-form textarea { min-height: 92px; resize: vertical; }
  .result-block { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .result-block:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .result-block h3 { font-family: var(--display); font-size: 15px; margin: 0 0 8px; font-weight: normal; }
  .slidepreviewlist { display: flex; flex-direction: column; gap: 8px; }
  .sp { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--ground); font-size: 13px; }
  .sp b { display: block; font-family: var(--display); font-size: 14px; margin-bottom: 3px; }
  .sp .sp-lay { float: right; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .thinking { display: inline-block; color: var(--ink-soft); font-size: 13px; }
  .storystrip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .storycard { flex: 0 0 210px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
  .storycard canvas { display: block; width: 100%; height: auto; background: #0c1c30; cursor: grab; }
  .dropzone { display: block; border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 30px 20px; text-align: center; color: var(--ink-soft); background: var(--surface); cursor: pointer; position: relative; }
  .dropzone:hover, .dropzone.over { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .reel-grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .reel-grid { grid-template-columns: 1fr; } }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .frames button { border: 2px solid transparent; border-radius: 8px; padding: 0; background: none; cursor: pointer; overflow: hidden; line-height: 0; position: relative; }
  .frames button img { width: 100%; display: block; border-radius: 6px; }
  .frames button[aria-pressed="true"] { border-color: var(--teal); }
  .frames button .fscore { position: absolute; left: 4px; bottom: 4px; font-size: 9px; letter-spacing: 0.06em; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 5px; border-radius: 99px; line-height: 1.5; }
  .reel-preview { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .reel-preview canvas { width: 264px; height: auto; border-radius: 10px; background: #0c1c30; box-shadow: var(--shadow); }
  .wissen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .wissen-grid textarea { width: 100%; min-height: 120px; resize: vertical; background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  .wissen-grid textarea:focus { border-color: var(--teal); outline: none; }

  /* ---------- Funnel-Ketten ---------- */
  .chain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
  .chain-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chain-top .c-name { font-family: var(--display); font-size: 16px; }
  .chain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; }
  .chain-step { display: flex; flex-direction: column; gap: 4px; position: relative; }
  .chain-step > label { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
  .chain-step input { background: var(--ground); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 13px; }
  .chain-step input:focus { border-color: var(--teal); outline: none; }
  .chain-step.gap input { border-color: var(--crit); background: rgba(179, 71, 51, 0.07); }
  .chain-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; flex-wrap: wrap; }
  .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .flag.ok { background: rgba(47,125,91,0.14); color: var(--good); }
  .flag.bad { background: rgba(179,71,51,0.14); color: var(--crit); }

  /* ---------- Launch-Zeitachse ---------- */
  .timeline { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 10px; margin-bottom: 18px; overflow-x: auto; }
  .tl-track { position: relative; min-width: 720px; }
  .tl-months { display: grid; grid-template-columns: repeat(12, 1fr); font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }
  .tl-months span { border-left: 1px solid var(--line); padding: 0 0 6px 6px; }
  .tl-rows { position: relative; }
  .tl-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); pointer-events: none; }
  .tl-grid i { border-left: 1px solid var(--line); }
  .tl-row { position: relative; height: 34px; }
  .tl-bar { position: absolute; top: 6px; height: 22px; border-radius: 6px; background: var(--teal); color: #fff; font-size: 12px; line-height: 22px; padding: 0 9px; white-space: nowrap; overflow: hidden; }
  .tl-bar.past { background: var(--navy); }
  .tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--orange); }

  /* ---------- Balken ---------- */
  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row .bar-lab { display: flex; justify-content: space-between; font-size: 13px; gap: 10px; }
  .bar-row .bar-lab b { font-variant-numeric: tabular-nums; font-weight: normal; color: var(--ink-soft); }
  .bar-track { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); margin-top: 5px; }
  .bar-fill { height: 100%; border-radius: 99px; background: var(--teal); }
  .bar-soll { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--orange); }
  .columns { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 10px; }
  .col-item { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
  .col-bar { width: 100%; max-width: 46px; border-radius: 4px 4px 0 0; background: var(--teal); min-height: 2px; }
  .col-cap { font-size: 11px; color: var(--ink-soft); }
  .goalline { position: relative; }
  .goalline .gl { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--orange); }
  .goalline .gl span { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--orange); background: var(--surface); padding: 0 4px; }

  /* ---------- Wochen-Vorschau ---------- */
  .wochentag { margin-bottom: 22px; }
  .wt-kopf { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .wt-kopf .wt-name { font-family: var(--display); font-size: 18px; }
  .wt-kopf .wt-datum { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .wkarte {
    display: grid; grid-template-columns: 190px 1fr; gap: 18px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
    border-left: 3px solid var(--orange);
  }
  .wkarte.frei { border-left-color: var(--good); }
  @media (max-width: 760px) { .wkarte { grid-template-columns: 1fr; } }
  .wkarte .wk-bild { width: 100%; border-radius: 8px; display: block; background: var(--surface-2); }
  .wkarte .wk-leer {
    aspect-ratio: 9/16; border: 1px dashed var(--line-strong); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--ink-soft); font-size: 12px; padding: 10px;
  }
  .wk-haupt { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .wk-zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .wk-hook { font-family: var(--display); font-size: 17px; line-height: 1.3; }
  .wk-unter { font-size: 13px; color: var(--ink-soft); }
  .wk-caption {
    white-space: pre-wrap; font-size: 13px; line-height: 1.6; background: var(--ground);
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px;
    max-height: 168px; overflow-y: auto; margin: 0;
  }
  .wk-tags { font-size: 12px; color: var(--teal); word-break: break-word; }
  .wk-fuss { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* =========================================================
     Bild verkleinern, damit es in ein Dokument passt
     ========================================================= */
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 1200, q = 0.78, out = "";
        for (var attempt = 0; attempt < 6; attempt++) {
          var scale = Math.min(1, maxW / img.width);
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 180000) break;
          if (q > 0.5) { q -= 0.12; } else { maxW = Math.round(maxW * 0.75); }
        }
        cb(out);
      };
      img.onerror = function () { toast("Das Bild konnte nicht gelesen werden."); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function getImageObj(slideId, cb) {
    if (!images[slideId]) { cb(null); return; }
    if (imageObjs[slideId] && imageObjs[slideId].__src === images[slideId]) { cb(imageObjs[slideId]); return; }
    var im = new Image();
    im.onload = function () { im.__src = images[slideId]; imageObjs[slideId] = im; cb(im); };
    im.onerror = function () { cb(null); };
    im.src = images[slideId];
  }

  /* =========================================================
     Slide-Rendering auf Canvas (Vorschau = Export)
     ========================================================= */
  var W = 1080, H = 1350;

  function wrap(ctx, text, maxW) {
    var out = [];
    String(text || "").split("\n").forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean);
      if (!words.length) { out.push(""); return; }
      var line = words[0];
      for (var i = 1; i < words.length; i++) {
        var test = line + " " + words[i];
        if (ctx.measureText(test).width > maxW) { out.push(line); line = words[i]; }
        else { line = test; }
      }
      out.push(line);
    });
    return out;
  }

  function fitLines(ctx, text, maxW, maxH, family, weight, start, min, lh) {
    var size = start;
    while (size > min) {
      ctx.font = weight + " " + size + "px " + family;
      var lines = wrap(ctx, text, maxW);
      if (lines.length * size * lh <= maxH) return { size: size, lines: lines };
      size -= 4;
    }
    ctx.font = weight + " " + min + "px " + family;
    return { size: min, lines: wrap(ctx, text, maxW) };
  }

  function drawCover(ctx, img, x, y, w, h, zoom, ox, oy) {
    var base = Math.max(w / img.width, h / img.height) * (zoom || 1);
    var dw = img.width * base, dh = img.height * base;
    var dx = x + (w - dw) / 2 + (ox || 0) / 100 * w;
    var dy = y + (h - dh) / 2 + (oy || 0) / 100 * h;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function renderSlide(canvas, slide, car, index, total) {
    var b = BRANDS[car.brand] || BRANDS.mlb_dark;
    var ctx = canvas.getContext("2d");
    canvas.width = W; canvas.height = H;
    var pad = 88;

    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, W, H);
    try { ctx.letterSpacing = "0px"; } catch (e) {}

    getImageObj(slide.id, function (img) {
      // Bildflächen
      if (img && (slide.layout === "bild" || slide.layout === "split")) {
        if (slide.layout === "bild") {
          drawCover(ctx, img, 0, 0, W, H, slide.zoom, slide.ox, slide.oy);
          var g = ctx.createLinearGradient(0, H * 0.28, 0, H);
          g.addColorStop(0, "rgba(0,0,0,0)");
          g.addColorStop(1, b.bg);
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        } else {
          drawCover(ctx, img, 0, 0, W, Math.round(H * 0.52), slide.zoom, slide.ox, slide.oy);
        }
      } else if (slide.layout === "bild" || slide.layout === "split") {
        ctx.fillStyle = b.bg2;
        ctx.fillRect(0, 0, W, slide.layout === "bild" ? H : Math.round(H * 0.52));
        ctx.fillStyle = b.muted;
        ctx.font = "34px " + b.body;
        ctx.textAlign = "center";
        ctx.fillText("Bild hier hochladen", W / 2, slide.layout === "bild" ? H / 2 : Math.round(H * 0.26));
        ctx.textAlign = "left";
      }

      // Kopfzeile mit Handle
      if (b.handle || car.handle) {
        var hd = car.handle || b.handle;
        ctx.fillStyle = b.accent2;
        ctx.beginPath(); ctx.arc(pad + 26, pad + 6, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = b.text;
        ctx.font = "26px " + b.body;
        ctx.textBaseline = "middle";
        ctx.fillText(hd, pad + 66, pad + 8);
        ctx.textBaseline = "alphabetic";
      }

      var maxW = W - pad * 2;
      var headTop, bodyTop;

      if (slide.layout === "hook" || slide.layout === "zitat") {
        var isZitat = slide.layout === "zitat";
        var fam = isZitat ? b.display : b.display;
        var h = fitLines(ctx, isZitat ? slide.headline : String(slide.headline || "").toUpperCase(),
                         maxW, H * 0.5, fam, "bold", isZitat ? 76 : 92, 40, 1.16);
        ctx.font = "bold " + h.size + "px " + fam;
        ctx.fillStyle = b.text;
        var totalH = h.lines.length * h.size * 1.16;
        var y = (H - totalH) / 2 + h.size * 0.9;
        h.lines.forEach(function (ln, i) {
          if (isZitat) { ctx.textAlign = "center"; ctx.fillText(ln, W / 2, y + i * h.size * 1.16); ctx.textAlign = "left"; }
          else { ctx.fillText(ln, pad, y + i * h.size * 1.16); }
        });
        if (!isZitat) {
          ctx.fillStyle = b.accent;
          ctx.fillRect(pad, y + totalH + 24, 140, 8);
        }
        if (slide.body) {
          ctx.fillStyle = b.muted;
          ctx.font = "30px " + b.body;
          var bl = wrap(ctx, slide.body, maxW);
          bl.slice(0, 4).forEach(function (ln, i) {
            ctx.fillText(ln, isZitat ? pad : pad, y + totalH + 78 + i * 42);
          });
        }
      } else if (slide.layout === "text") {
        headTop = pad + 130;
        var ht = fitLines(ctx, slide.headline, maxW, 260, b.display, "bold", 64, 34, 1.15);
        ctx.font = "bold " + ht.size + "px " + b.display;
        ctx.fillStyle = b.accent;
        ht.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, headTop + ht.size + i * ht.size * 1.15); });
        bodyTop = headTop + ht.lines.length * ht.size * 1.15 + 70;
        var bt = fitLines(ctx, slide.body, maxW, H - bodyTop - pad - 60, b.body, "", 40, 26, 1.42);
        ctx.font = bt.size + "px " + b.body;
        ctx.fillStyle = b.text;
        bt.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, bodyTop + bt.size + i * bt.size * 1.42); });
      } else if (slide.layout === "split") {
        headTop = Math.round(H * 0.52) + 70;
        var hs = fitLines(ctx, slide.headline, maxW, 200, b.display, "bold", 58, 32, 1.15);
        ctx.font = "bold " + hs.size + "px " + b.display;
        ctx.fillStyle = b.accent;
        hs.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, headTop + hs.size + i * hs.size * 1.15); });
        var bs0 = headTop + hs.lines.length * hs.size * 1.15 + 46;
        var bs = fitLines(ctx, slide.body, maxW, H - bs0 - pad - 40, b.body, "", 36, 24, 1.42);
        ctx.font = bs.size + "px " + b.body;
        ctx.fillStyle = b.text;
        bs.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, bs0 + bs.size + i * bs.size * 1.42); });
      } else if (slide.layout === "bild") {
        var hb = fitLines(ctx, String(slide.headline || "").toUpperCase(), maxW, 340, b.display, "bold", 76, 38, 1.14);
        ctx.font = "bold " + hb.size + "px " + b.display;
        ctx.fillStyle = b.text;
        var bh = hb.lines.length * hb.size * 1.14;
        var by = H - pad - 60 - bh + hb.size * 0.9;
        hb.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, by + i * hb.size * 1.14); });
      } else if (slide.layout === "cta") {
        var hc = fitLines(ctx, slide.headline, maxW, 320, b.display, "bold", 72, 36, 1.15);
        var startY = H * 0.32;
        ctx.font = "bold " + hc.size + "px " + b.display;
        ctx.fillStyle = b.text;
        hc.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, startY + hc.size + i * hc.size * 1.15); });
        var cy = startY + hc.lines.length * hc.size * 1.15 + 60;
        var bc = fitLines(ctx, slide.body, maxW, 260, b.body, "", 38, 26, 1.42);
        ctx.font = bc.size + "px " + b.body;
        ctx.fillStyle = b.muted;
        bc.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, cy + bc.size + i * bc.size * 1.42); });
        if (slide.keyword) {
          var ky = cy + bc.lines.length * bc.size * 1.42 + 70;
          ctx.font = "bold 44px " + b.body;
          var kw = ctx.measureText(slide.keyword.toUpperCase()).width;
          ctx.fillStyle = b.accent;
          var rx = pad, rw = kw + 76, rh = 96;
          ctx.beginPath();
          if (ctx.roundRect) { ctx.roundRect(rx, ky, rw, rh, 48); } else { ctx.rect(rx, ky, rw, rh); }
          ctx.fill();
          ctx.fillStyle = b.bg;
          ctx.fillText(slide.keyword.toUpperCase(), rx + 38, ky + 62);
        }
      }

      // Fusszeile: Slide-Zähler und Wischhinweis
      ctx.fillStyle = b.muted;
      ctx.font = "26px " + b.body;
      ctx.fillText(index + 1 + " / " + total, pad, H - pad + 10);
      if (index < total - 1) {
        ctx.textAlign = "right";
        ctx.fillText("weiter wischen  ›", W - pad, H - pad + 10);
        ctx.textAlign = "left";
      }
    });
  }

        { k: "link", l: "Link", t: "text", w: "minmax(190px, 1fr)" }

    }

  var TONE = {

    "In Arbeit": "mid", "Im Gespräch": "mid", "Angebot raus": "mid", "Geplant": "mid", "Pausiert": "mid",

  /* =========================================================
     Wochen-Vorschau: Tag fuer Tag, Reels und Karussells gemischt
     ========================================================= */
  var wochenbilder = {};          // beitragId -> dataURL des Covers
  var wochenbilderGeholt = {};

  function wochenBildHolen(art, id) {
    if (!db || wochenbilderGeholt[id]) return;
    wochenbilderGeholt[id] = true;
    // Alle Cover-Dokumente auf einmal: "cover" plus die Farbvarianten
    // cover-petrol / cover-dunkelblau / cover-orange.
    db.doc(art + "/" + id).collection("bilder").limit(12).get()
      .then(function (qs) {
        var neu = false;
        qs.docs.forEach(function (d) {
          var u = (d.data() || {}).dataUrl;
          if (!u || d.id.indexOf("cover") !== 0) return;
          wochenbilder[id + "/" + d.id] = u;
          neu = true;
        });
        if (neu && activeTab === "woche") render();
      }).catch(function () {});
  }

  var COVERFARBEN = [
    { k: "petrol", l: "Petrol" },
    { k: "dunkelblau", l: "Dunkelblau" },
    { k: "orange", l: "Orange" }
  ];

  function coverBild(b) {
    if (b.art !== "reels") return wochenbilder[b.id + "/cover"] || "";
    var f = b.obj.coverfarbe || "dunkelblau";
    return wochenbilder[b.id + "/cover-" + f]
        || wochenbilder[b.id + "/cover"] || "";
  }

  var WOCHENTAGE = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

  function tagName(iso) {
    var t = new Date(iso + "T12:00:00");
    return isNaN(t) ? "" : WOCHENTAGE[t.getDay()];
  }

  function hashtagsTrennen(caption) {
    var text = String(caption || "");
    var zeilen = text.split("\n");
    for (var i = zeilen.length - 1; i >= 0; i--) {
      var z = zeilen[i].trim();
      if (!z) continue;
      if (z.indexOf("#") === 0) {
        return { text: zeilen.slice(0, i).join("\n").replace(/\s+$/, ""), tags: z };
      }
      break;
    }
    return { text: text, tags: "" };
  }

  /* Der Viewer sperrt Download-Links, die die Seite selbst oeffnet.
     Deshalb laeuft das Speichern ueber die downloads-Faehigkeit: Datei holen,
     in Bytes wandeln, der Seite zum Speichern geben. */
  function dateiSpeichern(quelle, dateiname) {
    if (!downloads) { toast("Herunterladen ist hier nicht verfügbar"); return; }
    toast("wird vorbereitet …");
    fetch(quelle)
      .then(function (a) { return a.arrayBuffer(); })
      .then(function (puffer) {
        return downloads.save({ filename: dateiname, data: new Uint8Array(puffer) });
      })
      .then(function () { toast("Gespeichert: " + dateiname); })
      .catch(function () { toast("Das Speichern hat nicht geklappt"); });
  }

  function renderWoche(main) {
    var beitraege = [];
    state.reels.forEach(function (r) {
      beitraege.push({ art: "reels", id: r.id, obj: r, format: "Reel",
                       titel: r.name, hook: r.hook || "", unter: r.unter || "",
                       caption: r.caption || "", datei: r.videodatei || "",
                       videourl: r.videourl || "" });
    });
    state.karussells.forEach(function (c) {
      var s1 = (c.slides && c.slides[0]) || {};
      beitraege.push({ art: "karussells", id: c.id, obj: c, format: "Karussell",
                       titel: c.name, hook: s1.headline || "",
                       unter: (c.slides ? c.slides.length : 0) + " Folien",
                       caption: c.caption || "", datei: "" });
    });

    beitraege.forEach(function (b) { wochenBildHolen(b.art, b.id); });

    var mitDatum = beitraege.filter(function (b) { return b.obj.datum; })
      .sort(function (a, b) { return a.obj.datum < b.obj.datum ? -1 : 1; });
    var ohneDatum = beitraege.filter(function (b) { return !b.obj.datum; });
    var frei = beitraege.filter(function (b) { return b.obj.textfrei; }).length;

    main.innerHTML =
      '<div class="page-head"><div><h1>Wochen-Vorschau</h1>' +
      '<p>Jeder Beitrag so, wie er rausgeht: Cover, Hook, Caption und Hashtags. ' +
      'Trag ein Datum ein, dann sortiert er sich in den Tag ein. Freigeben heisst, ' +
      'dass die Texte stehen — Reels lädst du dir danach aufs Handy und postest von dort.</p></div>' +
      '<div class="head-actions"><span class="chip">' + frei + ' von ' + beitraege.length +
      ' freigegeben</span></div></div>' +
      '<div id="wliste"></div>';

    var liste = main.querySelector("#wliste");

    if (!beitraege.length) {
      liste.innerHTML = '<div class="panel"><div class="empty">Noch keine Beiträge da. ' +
        'Sobald welche im Reel- oder Karussell-Studio liegen, stehen sie hier.</div></div>';
      return;
    }

    var letzterTag = "";
    mitDatum.forEach(function (b) {
      if (b.obj.datum !== letzterTag) {
        letzterTag = b.obj.datum;
        var kopf = document.createElement("div");
        kopf.className = "wt-kopf";
        kopf.innerHTML = '<span class="wt-name">' + esc(tagName(b.obj.datum)) + '</span>' +
                         '<span class="wt-datum">' + esc(b.obj.datum) + '</span>';
        liste.appendChild(kopf);
      }
      liste.appendChild(wochenKarte(b));
    });

    if (ohneDatum.length) {
      var kopf2 = document.createElement("div");
      kopf2.className = "wt-kopf";
      kopf2.innerHTML = '<span class="wt-name">Ohne Datum</span>' +
                        '<span class="wt-datum">' + ohneDatum.length + ' Beiträge</span>';
      liste.appendChild(kopf2);
      ohneDatum.forEach(function (b) { liste.appendChild(wochenKarte(b)); });
    }
  }

  function wochenKarte(b) {
    var zerlegt = hashtagsTrennen(b.caption);
    var karte = document.createElement("div");
    karte.className = "wkarte" + (b.obj.textfrei ? " frei" : "");

    var quelle = coverBild(b);
    // Wenn ein Video hinterlegt ist, steht hier der Player. Sonst das Cover.
    var bild = b.videourl
      ? '<video class="wk-bild wk-video" src="' + esc(b.videourl) + '" controls ' +
        'playsinline preload="metadata"' + (quelle ? ' poster="' + quelle + '"' : "") + '></video>'
      : (quelle
          ? '<img class="wk-bild" src="' + quelle + '" alt="">'
          : '<div class="wk-leer">Noch kein Vorschaubild</div>');

    // Farbwaehler nur beim Reel — beim Karussell macht die Farbe der Editor.
    // Laeuft daneben ein Video, kommt das Cover als kleines Bild dazu, damit
    // beides sichtbar bleibt: was im Feed steht und was abgespielt wird.
    var farbwahl = "";
    if (b.art === "reels") {
      if (b.videourl && quelle) {
        farbwahl += '<img class="wk-covermini" src="' + quelle + '" alt="Cover">';
      }
      farbwahl += '<div class="wk-holen">' +
        (b.videourl ? '<button class="btn" data-holen="video">Video speichern</button>' : "") +
        (quelle ? '<button class="btn" data-holen="cover">Cover speichern</button>' : "") +
        '</div>';
      farbwahl += '<div class="wk-farben">' +
        COVERFARBEN.map(function (f) {
          var an = (b.obj.coverfarbe || "dunkelblau") === f.k;
          return '<button class="farbknopf f-' + f.k + '" data-farbe="' + f.k + '"' +
                 (an ? ' aria-pressed="true"' : '') + ' title="' + f.l + '"></button>';
        }).join("") +
        '<span class="wk-unter">Coverfarbe</span></div>';
    }

    karte.innerHTML =
      '<div>' + bild + farbwahl + '</div>' +
      '<div class="wk-haupt">' +
        '<div class="wk-zeile">' +
          '<span class="chip' + (b.format === "Reel" ? "" : " orange") + '">' + b.format + '</span>' +
          '<strong>' + esc(b.titel) + '</strong>' +
        '</div>' +
        (b.hook ? '<div class="wk-hook">' + esc(b.hook) + '</div>' : "") +
        (b.unter ? '<div class="wk-unter">' + esc(b.unter) + '</div>' : "") +
        '<pre class="wk-caption">' + esc(zerlegt.text || "Noch keine Caption.") + '</pre>' +
        (zerlegt.tags ? '<div class="wk-tags">' + esc(zerlegt.tags) + '</div>' : "") +
        (b.datei ? '<div class="wk-datei">Datei: ' + esc(b.datei) + '</div>' : "") +
        (b.art === "karussells" ? '<div class="wk-folien"></div>' : "") +
        '<div class="wk-fuss">' +
          '<input type="date" value="' + esc(b.obj.datum || "") + '">' +
          '<button class="btn">Caption kopieren</button>' +
          (b.art === "karussells" ? '<button class="btn">Im Editor öffnen</button>' : "") +
          '<button class="btn' + (b.obj.textfrei ? "" : " primary") + '">' +
            (b.obj.textfrei ? "Freigabe zurücknehmen" : "Freigeben") + '</button>' +
        '</div>' +
      '</div>';

    // Folien des Karussells zeichnen — dieselben Canvas-Slides wie im Editor
    var folienbox = karte.querySelector(".wk-folien");
    if (folienbox && b.obj.slides) {
      b.obj.slides.forEach(function (sl, i) {
        var sp = document.createElement("div");
        sp.className = "wk-folienkarte";

        var c = document.createElement("canvas");
        c.className = "wk-folie";
        sp.appendChild(c);
        renderSlide(c, sl, b.obj, i, b.obj.slides.length);

        var nr = document.createElement("div");
        nr.className = "wk-folienr";
        nr.textContent = "Folie " + (i + 1);
        sp.appendChild(nr);

        // Beide Felder schreiben direkt in die Folie, zeichnen sie neu und
        // speichern. Kein Umweg ueber den Editor.
        function feld(schluessel, platzhalter, zeilen) {
          var t = document.createElement("textarea");
          t.className = "wk-folienfeld";
          t.rows = zeilen;
          t.placeholder = platzhalter;
          t.value = sl[schluessel] || "";
          t.oninput = function () {
            sl[schluessel] = this.value;
            renderSlide(c, sl, b.obj, i, b.obj.slides.length);
            saveCarousel(b.obj);
          };
          sp.appendChild(t);
        }
        feld("headline", "Headline", 2);
        if (sl.layout !== "hook" && sl.layout !== "zitat") feld("body", "Text", 3);

        // Layout umstellen — entscheidet, ob die Folie ueberhaupt ein Bild hat
        var lay = document.createElement("select");
        lay.className = "wk-folienfeld";
        Object.keys(LAYOUTS).forEach(function (k) {
          var o = document.createElement("option");
          o.value = k; o.textContent = LAYOUTS[k];
          if ((sl.layout || "text") === k) o.selected = true;
          lay.appendChild(o);
        });
        lay.onchange = function () {
          sl.layout = this.value;
          saveCarousel(b.obj);
          render();
        };
        sp.appendChild(lay);

        // Hintergrundbild und Bildausschnitt — nur bei Layouts mit Bild
        if (sl.layout === "bild" || sl.layout === "split") {
          var wahl = document.createElement("label");
          wahl.className = "btn filebtn wk-folienbtn";
          wahl.innerHTML = '<span>' + (images[sl.id] ? "Bild ersetzen" : "Bild wählen") +
                           '</span><input type="file" accept="image/*">';
          wahl.querySelector("input").onchange = function () {
            var f = this.files && this.files[0];
            if (!f) return;
            compressImage(f, function (dataUrl) {
              saveImage("karussells/" + b.obj.id, sl.id, dataUrl);
              renderSlide(c, sl, b.obj, i, b.obj.slides.length);
              toast("Bild gesetzt");
            });
          };
          sp.appendChild(wahl);

          if (images[sl.id]) {
            [["zoom", "Zoom", 1, 2.4, 0.02, 1],
             ["ox", "Links/Rechts", -50, 50, 1, 0],
             ["oy", "Hoch/Runter", -50, 50, 1, 0]].forEach(function (r) {
              var zeile = document.createElement("div");
              zeile.className = "wk-regler";
              var lab = document.createElement("span");
              lab.textContent = r[1];
              var s = document.createElement("input");
              s.type = "range";
              s.min = r[2]; s.max = r[3]; s.step = r[4];
              s.value = sl[r[0]] == null ? r[5] : sl[r[0]];
              s.oninput = function () {
                sl[r[0]] = parseFloat(this.value);
                renderSlide(c, sl, b.obj, i, b.obj.slides.length);
              };
              s.onchange = function () { saveCarousel(b.obj); };
              zeile.appendChild(lab); zeile.appendChild(s);
              sp.appendChild(zeile);
            });
          }
        }

        folienbox.appendChild(sp);
      });
    }

    karte.querySelectorAll("[data-holen]").forEach(function (kn) {
      kn.onclick = function () {
        var was = this.getAttribute("data-holen");
        var name = (b.obj.datum ? b.obj.datum + "-" : "") +
                   (b.titel || "beitrag").replace(/[^\wäöüÄÖÜ]+/g, "-").toLowerCase();
        if (was === "video") dateiSpeichern(b.videourl, name + ".mp4");
        else dateiSpeichern(coverBild(b), name + "-cover.jpg");
      };
    });

    karte.querySelectorAll(".farbknopf").forEach(function (kn) {
      kn.onclick = function () {
        b.obj.coverfarbe = this.getAttribute("data-farbe");
        saveReel(b.obj);
        render();
      };
    });

    var felder = karte.querySelectorAll(".wk-fuss input, .wk-fuss button");
    felder[0].onchange = function () {
      b.obj.datum = this.value;
      if (b.art === "reels") saveReel(b.obj); else saveCarousel(b.obj);
      render();
    };
    felder[1].onclick = function () {
      var t = b.caption || "";
      if (navigator.clipboard) {
        navigator.clipboard.writeText(t).then(function () { toast("Caption kopiert"); },
                                              function () { toast("Kopieren hat nicht geklappt"); });
      }
    };
    if (b.art === "karussells") {
      felder[2].onclick = function () {
        activeCarousel = b.obj.id;
        activeTab = "karussell";
        render();
      };
    }
    var freigabeKnopf = felder[felder.length - 1];
    freigabeKnopf.onclick = function () {
      b.obj.textfrei = !b.obj.textfrei;
      if (b.art === "reels") saveReel(b.obj); else saveCarousel(b.obj);
      toast(b.obj.textfrei ? "Freigegeben" : "Freigabe zurückgenommen");
      render();
    };
    return karte;
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    TABS.forEach(function (t) {
      if (t.g) {
        var g = document.createElement("div");
        g.className = "navgroup";
        g.textContent = t.g;
        nav.appendChild(g);
        return;
      }
      var b = document.createElement("button");
      b.className = "navbtn";
      b.setAttribute("aria-current", activeTab === t.id ? "true" : "false");
      var cnt = t.id === "karussell" ? state.karussells.length
        : t.id === "storys" ? state.storys.length
        : t.id === "reels" ? state.reels.length
        : (Array.isArray(state[t.id]) ? state[t.id].length : "");
      b.innerHTML = '<span>' + esc(t.label) + '</span>' + (cnt !== "" ? '<span class="cnt">' + cnt + '</span>' : "");
      b.onclick = function () { activeTab = t.id; render(); };
      nav.appendChild(b);
    });
  }

  /* =========================================================
     Übersicht
     ========================================================= */
  function renderUebersicht(main) {
    var heute = todayISO();
    var offenePosts = state.posts.filter(function (p) { return p.status !== "Gepostet"; });
    var nächste = state.posts.filter(function (p) { return p.datum >= heute && p.status !== "Gepostet"; })
      .sort(function (a, b) { return a.datum < b.datum ? -1 : 1; }).slice(0, 6);
    var heisseLeads = state.leads.filter(function (l) { return l.status === "Im Gespräch" || l.status === "Angebot raus"; });
    var offeneIdeen = state.ideen.filter(function (i) { return i.status === "Offen"; });
    var luecken = state.funnel.filter(function (f) { return funnelLuecken(f).length; });

    main.innerHTML =
      '<div class="page-head"><div><h1>Übersicht</h1><p>Der Stand von heute, ' +
      new Date().toLocaleDateString("de-CH", { weekday: "long", day: "2-digit", month: "long" }) +
      '.</p></div><div class="head-actions">' +
      '<button class="btn" id="wochebtn">Woche anlegen</button></div></div>' +
      '<div class="tiles">' +
        tile("Posts geplant", nächste.length, "in den nächsten Tagen") +
        tile("Offen im Plan", offenePosts.length, "noch nicht gepostet") +
        tile("Ideen im Vorrat", offeneIdeen.length, "unverbraucht") +
        tile("Leads im Gespräch", heisseLeads.length, "warten auf dich") +
        tile("Lücken im Funnel", luecken.length, luecken.length ? "Ketten unvollständig" : "alles verbunden") +
      '</div>' +
      '<div class="cols">' +
        '<div class="panel"><h2>Als Nächstes</h2><div class="mini" id="ov-next"></div></div>' +
        '<div class="panel"><h2>Säulen: geplant gegen Soll</h2><div class="bars" id="ov-saeulen"></div>' +
          '<div class="note" style="margin-top:10px">Der orange Strich ist dein Soll aus dem 40/35/25-Verhältnis.</div></div>' +
        '<div class="panel"><h2>PIE-Verteilung</h2><div id="ov-pie"></div></div>' +
        '<div class="panel"><h2>Archetypen-Abdeckung</h2><div class="bars" id="ov-arche"></div></div>' +
        '<div class="panel"><h2>Nächste Schritte bei Leads</h2><div class="mini" id="ov-leads"></div></div>' +
        '<div class="panel"><h2>Team Richtung ' + esc(settings.rangZiel || "Silver") + '</h2><div id="ov-rang"></div></div>' +
      '</div>';

    main.querySelector("#wochebtn").onclick = wocheAnlegen;

    var n = main.querySelector("#ov-next");
    if (!nächste.length) n.innerHTML = '<div class="empty">Nichts geplant. Klick oben auf „Woche anlegen“, dann steht das Gerüst.</div>';
    nächste.forEach(function (p) {
      var d = document.createElement("div");
      d.className = "mini-row";
      d.innerHTML = '<span class="m-date">' + esc(fmtDate(p.datum)) + '</span>' +
        '<span class="m-main">' + esc(p.thema || "ohne Thema") + '<br><span class="note">' + esc(p.format) + " · " + esc(p.saeule) + '</span></span>' +
        '<span class="chip' + (p.status === "Fertig" ? "" : " orange") + '">' + esc(p.status) + '</span>';
      n.appendChild(d);
    });

    // Säulen Ist gegen Soll
    var relevant = state.posts.filter(function (p) { return p.marke === "Mum Life Balance"; });
    var sum = relevant.length || 1;
    var saeulenHtml = Object.keys(SOLL).map(function (k) {
      var ist = relevant.filter(function (p) { return p.saeule === k; }).length;
      var pct = Math.round(ist / sum * 100);
      var soll = SOLL[k];
      return '<div class="bar-row"><div class="bar-lab"><span>' + esc(k) + '</span><b>' + pct + '% ist · ' + soll + '% soll</b></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(100, pct) + '%"></div>' +
        (soll ? '<div class="bar-soll" style="left:' + soll + '%"></div>' : '') + '</div></div>';
    }).join("");
    main.querySelector("#ov-saeulen").innerHTML = saeulenHtml +
      '<div class="note">' + relevant.length + ' Posts für Mum Life Balance gezählt.</div>';

    // PIE
    var pie = { P: 0, I: 0, E: 0 };
    state.posts.forEach(function (p) { if (pie[p.pie] != null) pie[p.pie]++; });
    var pieSum = pie.P + pie.I + pie.E || 1;
    main.querySelector("#ov-pie").innerHTML = '<div class="bars">' + ["P", "I", "E"].map(function (k) {
      var label = { P: "Persönlichkeit", I: "Inspiration", E: "Expertise" }[k];
      var pct = Math.round(pie[k] / pieSum * 100);
      return '<div class="bar-row"><div class="bar-lab"><span>' + label + '</span><b>' + pie[k] + ' · ' + pct + '%</b></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
    }).join("") + '</div><div class="note" style="margin-top:10px">Gezählt über alle Zeilen in der Content-Planung.</div>';

    // Archetypen
    var arche = ARCHETYPEN.filter(function (a) { return a !== "—"; });
    var maxA = 1;
    arche.forEach(function (a) { maxA = Math.max(maxA, state.posts.filter(function (p) { return p.archetyp === a; }).length); });
    var leer = [];
    main.querySelector("#ov-arche").innerHTML = arche.map(function (a) {
      var c = state.posts.filter(function (p) { return p.archetyp === a; }).length;
      if (!c) leer.push(a.split(" ")[a.split(" ").length - 1]);

  function wocheAnlegen() {
    var d = new Date();
    var tage = [1, 3, 5, 0]; // Mo, Mi, Fr, So
    var formate = { 1: "Reel", 3: "Karussell", 5: "Karussell", 0: "Story" };
    var basis = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (8 - (d.getDay() || 7)));
    var neu = 0;
    tage.forEach(function (t, i) {
      var tag = new Date(basis);
      tag.setDate(basis.getDate() + ((t === 0 ? 7 : t) - 1));
      var iso = tag.toISOString().slice(0, 10);
      if (state.posts.some(function (p) { return p.datum === iso; })) return;
      state.posts.push({
        id: uid("p"), datum: iso, marke: "Mum Life Balance", format: formate[t],
        saeule: SAEULEN[i % 3], pie: ["E", "P", "I"][i % 3], thema: "", keyword: "", archetyp: "—", status: "Idee"
      });
      neu++;
    });
    saveList("posts");
    toast(neu ? neu + " Zeilen für nächste Woche angelegt." : "Für nächste Woche steht schon alles.");
    render();
  }

  function tile(lab, num, note) {
    return '<div class="tile"><div class="t-lab">' + esc(lab) + '</div><div class="t-num">' + num + '</div><div class="t-note">' + esc(note) + '</div></div>';
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." : iso;
  }

  /* =========================================================
     Generische Tabelle
     ========================================================= */
  function renderTable(main, key) {
    var def = TABLES[key];
    var grid = def.cols.map(function (c) { return c.w; }).join(" ") + " 34px";

    main.innerHTML =
      '<div class="page-head"><div><h1>' + esc(def.titel) + '</h1><p>' + esc(def.unter) + '</p></div>' +
      '<div class="head-actions"><button class="btn primary" id="addrow">Zeile hinzufügen</button></div></div>' +
      '<div class="tablewrap"><div id="rows"></div></div>' +
      '<div class="tablefoot note">' + state[key].length + ' Zeilen · Änderungen speichern sich von selbst</div>';

    var rows = main.querySelector("#rows");
    var head = document.createElement("div");
    head.className = "trow head";
    head.style.gridTemplateColumns = grid;
    head.innerHTML = def.cols.map(function (c) { return "<span>" + esc(c.l) + "</span>"; }).join("") + "<span></span>";
    rows.appendChild(head);

    var list = state[key].slice();
    if (def.sort) list.sort(function (a, b) { return (a[def.sort] || "") < (b[def.sort] || "") ? -1 : 1; });

    if (!list.length) {
      var e = document.createElement("div");
      e.className = "trow";
      e.style.gridTemplateColumns = "1fr";
      e.innerHTML = '<div class="empty">Noch leer. Klick oben auf „Zeile hinzufügen“.</div>';
      rows.appendChild(e);
    }

    list.forEach(function (item) {
      var r = document.createElement("div");
      r.className = "trow";
      r.style.gridTemplateColumns = grid;
      def.cols.forEach(function (c) {
        var el;
        if (c.t === "select" || c.t === "pill") {
          el = document.createElement("select");
          if (c.t === "pill") { el.className = "pill"; el.setAttribute("data-tone", TONE[item[c.k]] || ""); }
          c.opts.forEach(function (o) {
            var op = document.createElement("option");
            op.value = o; op.textContent = o;
            if (item[c.k] === o) op.selected = true;
            el.appendChild(op);
          });
        } else {
          el = document.createElement("input");
          el.type = c.t === "date" ? "date" : "text";
          el.value = item[c.k] || "";
          el.placeholder = c.l;
        }
        el.oninput = el.onchange = function () {
          item[c.k] = el.value;
          if (c.t === "pill") el.setAttribute("data-tone", TONE[el.value] || "");
          saveList(key);
          if (activeTab === "uebersicht") render();
        };
        r.appendChild(el);
      });
      var del = document.createElement("button");
      del.className = "del"; del.title = "Zeile löschen"; del.textContent = "×";
      del.onclick = function () {
        state[key] = state[key].filter(function (x) { return x !== item; });
        saveList(key); render();
      };
      r.appendChild(del);
      rows.appendChild(r);
    });

    main.querySelector("#addrow").onclick = function () {
      state[key].push(def.neu());
      saveList(key); render();
      var inputs = document.querySelectorAll("#rows .trow:not(.head) input");
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
  }

  /* Freigabe-Daten eines Karussells, mit Vorbelegung. */
  function blo(car) {
    return car.blotato || (car.blotato = { datum: "", zeit: "07:30", profil: "mentoring", status: "" });
  }

  /* Eine Slide als JPEG, klein genug für ein Dokument. */
  function slideJpeg(car, slide, i, cb) {
    var cv = document.createElement("canvas");
    renderSlide(cv, slide, car, i, car.slides.length);
    setTimeout(function () {
      var q = 0.92;
      var out = cv.toDataURL("image/jpeg", q);
      while (out.length > 700000 && q > 0.45) { q -= 0.08; out = cv.toDataURL("image/jpeg", q); }
      cb(out);
    }, 320);
  }

  function setupBlotato(ed, car) {
    var b = blo(car);
    var note = ed.querySelector("#blonote");
    var btn = ed.querySelector("#blobtn");
    var zurueck = ed.querySelector("#blozurueck");
    var datum = ed.querySelector("#blodatum");
    var zeit = ed.querySelector("#blozeit");
    var profil = ed.querySelector("#bloprofil");

    function speichern() {
      b.datum = datum.value; b.zeit = zeit.value; b.profil = profil.value;
      saveCarousel(car);
    }
    datum.onchange = zeit.onchange = profil.onchange = speichern;

    if (!db) {
      note.textContent = "Die Freigabe braucht die Verbindung zur Datenbank. Öffne das Cockpit über den Link, dann geht es.";
      btn.disabled = true;
      return;
    }
    if (!car.textfrei) {
      note.textContent = "Erst die Texte oben freigeben. Was du nicht gelesen hast, geht auch nicht raus.";
      btn.disabled = true;
      return;
    }
    if (b.status === "wartet") {
      note.textContent = "Freigegeben für " + (b.datum || "kein Datum") + " um " + (b.zeit || "") +
        ", Profil " + (b.profil === "doterra" ? "doTERRA" : "Mentoring") +
        ". Sag es mir im Chat, dann lade ich die Folien hoch und plane den Beitrag ein.";
      btn.textContent = "Folien neu ablegen";
      zurueck.hidden = false;
      zurueck.onclick = function () {
        b.status = ""; saveCarousel(car);
        db.collection("freigaben").doc(car.id).set({
          name: car.name, status: "zurueckgezogen", updatedAt: new Date().toISOString()
        }).catch(function () {});
        render();
        toast("Freigabe zurückgezogen.");
      };
    } else if (b.status === "geplant") {
      note.textContent = "Eingeplant bei Blotato für " + (b.datum || "") + " um " + (b.zeit || "") + ".";
      btn.disabled = true;
      return;
    } else {
      note.textContent = "Datum und Uhrzeit setzen, dann freigeben. Dabei werden die fertigen Folien abgelegt — genau so, wie sie hier aussehen.";
    }

    btn.onclick = function () {

  function slideCard(car, slide, i) {
    var card = document.createElement("div");
    card.className = "slidecard";

    var head = document.createElement("div");
    head.className = "sc-head";
    head.innerHTML = '<span class="sc-num">Slide ' + (i + 1) + '</span>';
    var tools = document.createElement("div");
    tools.className = "sc-tools";
    [["‹", "nach links", -1], ["›", "nach rechts", 1]].forEach(function (t) {
      var b = document.createElement("button");
      b.className = "btn ghost"; b.textContent = t[0]; b.title = t[1];
      b.onclick = function () {
        var j = i + t[2];
        if (j < 0 || j >= car.slides.length) return;
        var tmp = car.slides[i]; car.slides[i] = car.slides[j]; car.slides[j] = tmp;
        saveCarousel(car); renderStrip(card.parentNode, car);
      };
      tools.appendChild(b);
    });
    var rm = document.createElement("button");
    rm.className = "btn ghost"; rm.textContent = "×"; rm.title = "Slide löschen";
    rm.onclick = function () {
      if (car.slides.length === 1) { toast("Ein Karussell braucht mindestens eine Slide."); return; }
      car.slides.splice(i, 1);
      saveCarousel(car); renderStrip(card.parentNode, car);
    };
    tools.appendChild(rm);
    head.appendChild(tools);
    card.appendChild(head);

    var cv = document.createElement("canvas");
    cv.className = "sc-canvas";
    cv.setAttribute("data-slide", slide.id);
    card.appendChild(cv);

    var body = document.createElement("div");
    body.className = "sc-body";

    var lay = document.createElement("select");
    Object.keys(LAYOUTS).forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = LAYOUTS[k];
      if (slide.layout === k) o.selected = true;
      lay.appendChild(o);
    });
    lay.onchange = function () { slide.layout = lay.value; saveCarousel(car); draw(); buildExtras(); };
    body.appendChild(lay);

    // Wer den Text ändert, hebt die Freigabe auf — sonst exportierst du
    // eine Fassung, die du nie gelesen hast.
    function freigabeAufheben() {
      if (!car.textfrei) return;
      car.textfrei = false;
      saveCarousel(car);
      toast("Text geändert, Freigabe aufgehoben.");
      setTimeout(render, 300);
    }

    var h = document.createElement("textarea");
    h.rows = 2; h.placeholder = "Headline"; h.value = slide.headline || "";
    h.oninput = function () { slide.headline = h.value; saveCarousel(car); draw(); freigabeAufheben(); };
    body.appendChild(h);

    var t = document.createElement("textarea");
    t.rows = 3; t.placeholder = "Fliesstext"; t.value = slide.body || "";
    t.oninput = function () { slide.body = t.value; saveCarousel(car); draw(); freigabeAufheben(); };
    body.appendChild(t);

    var extras = document.createElement("div");
    extras.style.display = "flex";
    extras.style.flexDirection = "column";
    extras.style.gap = "8px";
    body.appendChild(extras);

    function buildExtras() {
      extras.innerHTML = "";
      if (slide.layout === "cta") {
        var kw = document.createElement("input");
        kw.placeholder = "Keyword, z.B. FAHRPLAN";
        kw.value = slide.keyword || "";
        kw.oninput = function () { slide.keyword = kw.value; saveCarousel(car); draw(); };
        extras.appendChild(kw);
      }
      if (slide.layout === "bild" || slide.layout === "split") {
        var fb = document.createElement("label");
        fb.className = "btn filebtn";
        fb.innerHTML = "<span>" + (images[slide.id] ? "Bild ersetzen" : "Bild wählen") + "</span>";
        var fi = document.createElement("input");
        fi.type = "file"; fi.accept = "image/*";
        fi.onchange = function () {
          if (!fi.files || !fi.files[0]) return;
          compressImage(fi.files[0], function (dataUrl) {
            saveImage("karussells/" + car.id, slide.id, dataUrl);
            draw(); buildExtras();
          });
        };
        fb.appendChild(fi);
        extras.appendChild(fb);

        [["Zoom", "zoom", 1, 3, 0.02], ["Links/Rechts", "ox", -50, 50, 1], ["Hoch/Runter", "oy", -50, 50, 1]].forEach(function (s) {
          var row = document.createElement("div");
          row.className = "sliderow";
          var lab = document.createElement("span");
          lab.textContent = s[0];
          var rg = document.createElement("input");
          rg.type = "range"; rg.min = s[2]; rg.max = s[3]; rg.step = s[4];
          rg.value = slide[s[1]] != null ? slide[s[1]] : (s[1] === "zoom" ? 1 : 0);
          rg.oninput = function () { slide[s[1]] = parseFloat(rg.value); draw(); };
          rg.onchange = function () { saveCarousel(car); };
          row.appendChild(lab); row.appendChild(rg);
          extras.appendChild(row);
        });
      }
      var one = document.createElement("button");
      one.className = "btn ghost";
      one.textContent = "Diese Slide als PNG";
      one.onclick = function () { exportOne(car, slide, i, one); };
      extras.appendChild(one);
    }
    buildExtras();

    card.appendChild(body);

    // Bild mit der Maus im Rahmen verschieben
    var dragging = false, sx = 0, sy = 0, six = 0, siy = 0;
    cv.addEventListener("pointerdown", function (e) {
      if (slide.layout !== "bild" && slide.layout !== "split") return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      six = slide.ox || 0; siy = slide.oy || 0;
      cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing";
    });
    cv.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      slide.ox = Math.max(-50, Math.min(50, six + (e.clientX - sx) / cv.clientWidth * 100));
      slide.oy = Math.max(-50, Math.min(50, siy + (e.clientY - sy) / cv.clientHeight * 100));
      draw();
    });
    cv.addEventListener("pointerup", function () {
      if (!dragging) return;
      dragging = false; cv.style.cursor = "grab"; saveCarousel(car); buildExtras();
    });

    function draw() { renderSlide(cv, slide, car, i, car.slides.length); }
    slide.__draw = draw;
    setTimeout(draw, 0);
    return card;
  }

  function redrawAll(car) {

  /* =========================================================
     Export
     ========================================================= */
  function canvasBlob(car, slide, i) {
    return new Promise(function (res) {
      var cv = document.createElement("canvas");
      renderSlide(cv, slide, car, i, car.slides.length);
      setTimeout(function () { cv.toBlob(function (b) { res(b); }, "image/png"); }, 260);
    });
  }

  function safeName(s) {
    return String(s || "karussell").toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "karussell";
  }

  function exportOne(car, slide, i, btn) {
    if (!downloads) { toast("Speichern ist in dieser Ansicht nicht möglich."); return; }
    btn.disabled = true;
    canvasBlob(car, slide, i).then(function (blob) {
      return downloads.save({ filename: safeName(car.name) + "-" + (i + 1) + ".png", data: blob });
    }).then(function () { toast("Slide " + (i + 1) + " gespeichert."); })
      .catch(function (e) { if (e && e.code !== "declined") toast("Hat nicht geklappt: " + (e && e.code || "unbekannt")); })
      .then(function () { btn.disabled = false; });
  }

  function exportAll(car, btn) {
    if (!downloads) { toast("Speichern ist in dieser Ansicht nicht möglich."); return; }
    btn.disabled = true;
    var i = 0;
    function next() {
      if (i >= car.slides.length) { btn.disabled = false; toast("Fertig, alle Slides gespeichert."); return; }
      var idx = i++;
      canvasBlob(car, car.slides[idx], idx).then(function (blob) {
        btn.textContent = "Slide " + (idx + 1) + " von " + car.slides.length + " …";
        return downloads.save({ filename: safeName(car.name) + "-" + (idx + 1) + ".png", data: blob });
      }).then(next).catch(function (e) {
        btn.disabled = false;
        btn.textContent = "Alle Slides exportieren";
        if (e && e.code === "declined") toast("Abgebrochen.");
        else toast("Export gestoppt: " + (e && e.code || "unbekannt"));
      });
    }
    next();
    var reset = setInterval(function () {
      if (!btn.disabled) { btn.textContent = "Alle Slides exportieren"; clearInterval(reset); }
    }, 400);
  }

  /* =========================================================
     Kurs-Inhalte — wo habe ich was erklärt
     ========================================================= */
  function ohneUmlaut(w) {
    return String(w || "").toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
  }

  function lektionTreffer(wort) {
    /* Erst das Register fragen, dann alle Lektionen — so findet auch ein
       Wortanfang wie „hütch" etwas. */
    var w = ohneUmlaut(wort).trim();
    if (!w || !kurse) return [];
    var raus = [];
    kurse.kurse.forEach(function (k) {
      k.lektionen.forEach(function (l) {
        var imTitel = ohneUmlaut(l.titel).indexOf(w) >= 0;
        var treffer = (l.stichwoerter || []).filter(function (s) {
          return ohneUmlaut(s).indexOf(w) >= 0;
        });
        if (imTitel || treffer.length) {
          raus.push({ kurs: k.name, lektion: l, worte: treffer, imTitel: imTitel });
        }
      });
    });
    raus.sort(function (a, b) { return (b.imTitel ? 1 : 0) - (a.imTitel ? 1 : 0); });
    return raus;
  }

  function lektionNummer(l) {
    if (l.modul) return l.modul + "." + l.lektion;
    return l.nummer ? String(l.nummer) : "—";

  /* =========================================================
     Suchen — ein Stichwort, und es kommt, wo es vorkam
     ========================================================= */
  var suchIndex = null;       // null = noch nicht geholt
  var suchLaeuft = false;
  var suchWort = "";

  function suchIndexHolen(fertig) {
    if (suchIndex || suchLaeuft) { fertig(); return; }
    if (!db) { fertig(); return; }
    suchLaeuft = true;
    db.collection("suche").limit(40).get().then(function (qs) {
      var alles = [];
      qs.docs.forEach(function (doc) {
        (doc.data() || {}).items && (alles = alles.concat(doc.data().items));
      });
      suchIndex = alles;
      suchLaeuft = false;
      fertig();
    }).catch(function () { suchLaeuft = false; suchIndex = []; fertig(); });
  }

  function suchTreffer(wort) {
    var w = wort.toLowerCase().trim();
    if (!w || !suchIndex) return [];
    var raus = [];
    for (var i = 0; i < suchIndex.length; i++) {
      var x = suchIndex[i];
      var imTitel = (x.t || "").toLowerCase().indexOf(w) >= 0;
      if (imTitel || (x.a || "").toLowerCase().indexOf(w) >= 0) {
        raus.push({ x: x, rang: imTitel ? 0 : 1 });
      }
      if (raus.length > 400) break;
    }
    raus.sort(function (a, b) { return a.rang - b.rang; });
    return raus.map(function (r) { return r.x; });
  }

  function markiere(text, wort) {
    var w = wort.trim();
    if (!w) return esc(text);
    var i = text.toLowerCase().indexOf(w.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + w.length)) +
           '</mark>' + esc(text.slice(i + w.length));
  }

  function renderSuche(main) {
    main.innerHTML =
      '<div class="page-head"><div><h1>Suchen</h1>' +
      '<p>Ein Stichwort, und du siehst, wo im ganzen Workspace darüber geschrieben wurde — Grundlagen, Produkte, Funnel, Recherche.</p></div></div>' +
      '<div class="suchleiste"><input id="suchfeld" type="search" placeholder="zum Beispiel: Keyword, Hybridmodell, Orderbump, Energie" autocomplete="off"></div>' +
      '<div id="suchraus"></div>';

    var feld = main.querySelector("#suchfeld");
    var raus = main.querySelector("#suchraus");
    feld.value = suchWort;

    function zeigen() {
      if (suchIndex === null) {
        raus.innerHTML = '<div class="panel"><div class="empty">Der Suchindex wird geholt …</div></div>';
        suchIndexHolen(function () { if (activeTab === "suche") zeigen(); });
        return;
      }
      if (!suchIndex.length) {
        raus.innerHTML = '<div class="panel"><div class="empty">Kein Suchindex da. Der tägliche Abgleich legt ihn an.</div></div>';
        return;
      }
      if (!suchWort.trim()) {
        raus.innerHTML = '<p class="note">' + suchIndex.length + ' Abschnitte durchsuchbar.</p>';
        return;
      }
      var tr = suchTreffer(suchWort);
      if (!tr.length) {
        raus.innerHTML = '<div class="panel"><div class="empty">Nichts gefunden zu „' + esc(suchWort) + '".</div></div>';
        return;
      }
      var h = '<p class="note">' + tr.length + ' Fundstellen' + (tr.length > 60 ? ' — die ersten 60' : '') + '</p>';
      tr.slice(0, 60).forEach(function (x) {
        h += '<div class="sxtreffer">' +
             '<div class="sxkopf"><span class="sxbereich">' + esc(x.b || "") + '</span>' +
             '<span class="sxtitel">' + markiere(x.t || "", suchWort) + '</span></div>' +
             '<p class="sxauszug">' + markiere(x.a || "", suchWort) + '</p>' +
             '<p class="sxpfad">' + esc(x.d || "") + '</p></div>';
      });
      raus.innerHTML = h;
    }

    var warten;
    feld.oninput = function () {
      suchWort = feld.value;
      clearTimeout(warten);
      warten = setTimeout(zeigen, 180);
    };
    zeigen();
    feld.focus();
  }

  /* =========================================================
     Listen & Automationen — Abbild aus ActiveCampaign
     ========================================================= */
  /* fmtDate laesst das Jahr weg — hier stehen Listen von 2023, da muss es mit. */
  function mailDatum(iso) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso;
  }

  function mailTabelle(titel, spalten, reihen, leer) {
    var breiten = spalten.map(function (s) { return s.w; }).join(" ");
    var h = '<h2>' + esc(titel) + '</h2>';
    if (!reihen.length) return '<div class="panel">' + h + '<div class="empty">' + esc(leer) + '</div></div>';
    h += '<div class="tablewrap"><div class="trow head" style="grid-template-columns:' + breiten + '">' +
         spalten.map(function (s) { return '<span>' + esc(s.l) + '</span>'; }).join("") + '</div>';
    reihen.forEach(function (r) {
      h += '<div class="trow" style="grid-template-columns:' + breiten + '">' +
           spalten.map(function (s) { return '<span>' + (s.f ? s.f(r) : esc(r[s.k] == null ? "" : String(r[s.k]))) + '</span>'; }).join("") +
           '</div>';
    });
    return '<div class="panel" style="margin-bottom:18px">' + h + '</div></div>';
  }

  var offeneAutomation = null;
  var mailtexte = {};            // Automations-Nummer -> Liste der Mails
  var mailsGeholt = {};

  function mailsHolen(nummer) {
    if (!db || mailsGeholt[nummer]) return;
    mailsGeholt[nummer] = true;
    db.doc("mails/" + nummer).get().then(function (snap) {
      if (!snap.exists) { mailtexte[nummer] = []; }
      else { mailtexte[nummer] = (snap.data() || {}).items || []; }
      if (activeTab === "mailings") render();
    }).catch(function () { mailtexte[nummer] = []; });
  }

  function mailListe(nummer) {
    var mails = mailtexte[nummer];
    if (!mails) { mailsHolen(nummer); return '<div class="empty">Mails werden geholt …</div>'; }
    if (!mails.length) return '<div class="empty">In dieser Automation stecken keine Mails.</div>';
    return mails.map(function (m) {
      return '<div class="mailkarte">' +
        '<div class="mailkopf"><strong>' + esc(m.betreff || m.name || "Ohne Betreff") + '</strong>' +
        (m.gebaut ? '<span class="note">' + esc(mailDatum(m.gebaut)) + '</span>' : "") + '</div>' +
        '<pre class="mailtext">' + esc(m.text || "(kein Text hinterlegt)") + '</pre></div>';
    }).join("");
  }

      '<div class="tiles">' +

    var koerper = main.querySelector("#mailbody");

      mailTabelle("Deine Listen",
        [{ k: "name", l: "Liste", w: "minmax(240px, 1fr)" },
         { k: "kontakte", l: "Kontakte", w: "110px" },
         { k: "nummer", l: "Nr.", w: "70px" },
         { k: "seit", l: "Angelegt", w: "130px", f: function (r) { return esc(mailDatum(r.seit)); } }],
        listen, "Noch nichts abgeglichen.");

    // Automationen als aufklappbare Karten — darin stehen die Mailtexte.
    var ab = document.createElement("div");
    ab.className = "panel";
    ab.innerHTML = '<h2>Deine Automationen</h2>' +

    koerper.appendChild(ab);

      return;
    }

    autos.forEach(function (a) {

      karte.className = "dkarte" + (offeneAutomation === a.nummer ? " auf" : "");
      karte.innerHTML =
        '<button class="dkopf"><span class="dpfeil">▸</span>' +
        '<span class="dname">' + esc(a.name) + '</span>' +
        '<span class="flag ' + (a.status === "aktiv" ? "ok" : "bad") + '">' + esc(a.status) + '</span>' +
        '<span class="note">' + (a.mails ? a.mails + (a.mails === 1 ? " Mail" : " Mails") : "keine Mails") +
        ' · Nr. ' + esc(String(a.nummer)) + '</span></button>' +
        '<div class="dkoerper"></div>';

      karte.querySelector(".dkopf").onclick = function () {
        offeneAutomation = (offeneAutomation === a.nummer) ? null : a.nummer;
        render();
      };
      if (offeneAutomation === a.nummer) {
        karte.querySelector(".dkoerper").innerHTML = mailListe(a.nummer);
      }
      ab.appendChild(karte);
    });
  }

  /* =========================================================
     doTERRA Rang-Tracker — was fehlt wo, Bein für Bein
     ========================================================= */
  /* „202609" ist eine Datenbank-Schreibweise, keine, die man liest. */
  function monatKlar(m) {
    m = String(m || "");
    return /^\d{6}$/.test(m) ? m.slice(4) + "/" + m.slice(0, 4) : m;
  }

  function zahlKurz(n) {
    return (Math.round(n * 10) / 10).toLocaleString("de-CH",
      { minimumFractionDigits: 0, maximumFractionDigits: 1 });
  }

  function balken(ist, soll) {
    var teil = soll ? Math.min(100, (ist / soll) * 100) : 0;
    var ton = teil >= 100 ? "voll" : (teil >= 75 ? "nah" : "weit");
    return '<div class="dtbalken"><span class="' + ton + '" style="width:' +
           teil.toFixed(1) + '%"></span></div>';
  }

  function luecken(liste) {
    if (!liste || !liste.length) return '<span class="flag ok">erfüllt</span>';
    return liste.map(function (l) {
      return '<span class="flag bad">' + zahlKurz(l.fehlt) + ' ' + esc(l.was) +
             ' fehlen</span>';
    }).join(" ");
  }

  /* =========================================================
