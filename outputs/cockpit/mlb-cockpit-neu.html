            var zeile = document.createElement("div");
            zeile.className = "lzzeile";
            zeile.innerHTML = '<span class="lzlab">Datei</span>' +

      if (!raus.children.length) {

  function meineKette(id) {
    var k = ketten[id];
    if (!k) { k = ketten[id] = { bumps: [], upsells: [], downsells: [] }; }
    ROLLEN.forEach(function (r) { if (!k[r[0]]) k[r[0]] = []; });
    return k;
  }

  function hatKette(id) {
    var k = ketten[id];
    if (!k) return false;
    return ROLLEN.some(function (r) { return (k[r[0]] || []).length; });
  }

  function angebotNach(id) {
    var alle = (katalog && katalog.angebote) || [];
    for (var i = 0; i < alle.length; i++) {
      if (alle[i].id === id) return alle[i];
    }
    return null;
  }

  /* Was maximal in den Warenkorb kann: Grundpreis plus alle Bumps plus alle
     Upsells. Der Downsell bleibt draussen — er kommt nur nach einem
     abgelehnten Upsell, also nie zusammen mit ihm. */
  function warenkorb(a) {
    var k = meineKette(a.id);
    var grund = a.preis || 0, bump = 0, up = 0;
    k.bumps.forEach(function (x) { bump += Number(x.preis) || 0; });
    k.upsells.forEach(function (x) { up += Number(x.preis) || 0; });
    return { grund: grund, bump: bump, up: up, max: grund + bump + up };
  }

  function warenkorbText(a) {
    var w = warenkorb(a);
    var teile = [preisText(w.grund, a.waehrung)];
    if (w.bump) teile.push("+ " + preisText(w.bump, a.waehrung) + " Bump");
    if (w.up) teile.push("+ " + preisText(w.up, a.waehrung) + " Upsell");
    var ziel = Number(settings.monatsziel) || 0;
    var noetig = (ziel && w.max) ? Math.ceil(ziel / w.max) : 0;
    return '<strong>' + esc(preisText(w.max, a.waehrung)) +
      '</strong> maximal im Warenkorb<span class="note"> \u00b7 ' +
      esc(teile.join(" ")) + '</span>' +
      (noetig
        ? '<div class="note">Bei vollem Warenkorb decken <strong>' + noetig +
          '</strong> Verk\u00e4ufe im Monat dein Ziel von ' +
          esc(preisText(ziel, settings.waehrung)) + '.</div>'
        : "");
  }

  function summeNeu(a) {
    var el = document.getElementById("kw-" + a.id);
    if (el) el.innerHTML = warenkorbText(a);
  }

  /* Ein Name auf seine tragenden Woerter eingedampft. Umlaute sind egal,
     Fuellwoerter fliegen raus — sonst findet „Finde dein Thema als
     Network-Mama" seinen eigenen Kurs nicht wieder. */
  var FUELLWORT = /^(der|die|das|dein|deine|den|dem|fuer|als|und|mit|von|zum|zur|ein|eine|einen|ist|auf|aus|minuten|stunden)$/;

  function wortMenge(s) {
    return String(s || "").toLowerCase()
      .replace(/\u00e4/g, "ae").replace(/\u00f6/g, "oe")
      .replace(/\u00fc/g, "ue").replace(/\u00df/g, "ss")
      .replace(/[^a-z0-9]+/g, " ").trim().split(" ")
      .filter(function (w) { return w.length > 2 && !FUELLWORT.test(w); });
  }

  /* Den ThriveCart-Befund als Startpunkt in den Plan kopieren, damit die
     vierzehn bestehenden Ketten nicht von Hand nachgetippt werden muessen. */
  function ausThriveCart(a) {
    var alle = (katalog && katalog.angebote) || [];
    function finde(name, preis) {
      var n = String(name || "").toLowerCase().trim();
      if (!n) return "";
      var i;
      for (i = 0; i < alle.length; i++) {
        if ((alle[i].name || "").toLowerCase().trim() === n) return alle[i].id;
      }
      for (i = 0; i < alle.length; i++) {
        var m = (alle[i].name || "").toLowerCase().trim();
        if (m && (m.indexOf(n) === 0 || n.indexOf(m) === 0)) return alle[i].id;
      }
      // Dritter Anlauf ueber gemeinsame Woerter: in ThriveCart heisst derselbe
      // Kurs mal „Network-Mama", mal „Networking-Mama in 60 Minuten".
      var gesucht = wortMenge(n);
      if (!gesucht.length) return "";
      var bester = "", bestwert = 0;
      for (i = 0; i < alle.length; i++) {
        var hier = wortMenge(alle[i].name);
        if (!hier.length) continue;
        var gleich = 0;
        gesucht.forEach(function (w) { if (hier.indexOf(w) >= 0) gleich++; });
        var wert = gleich / Math.min(gesucht.length, hier.length);
        // Bei gleichem Wortbild entscheidet der Preis.
        if (preis && alle[i].preis === Number(preis)) wert += 0.05;
        if (wert > bestwert) { bestwert = wert; bester = alle[i].id; }
      }
      return bestwert >= 0.6 ? bester : "";
    }
    var k = { bumps: [], upsells: [], downsells: [] };
    ROLLEN.forEach(function (r) {
      (((a.kette || {})[r[0]]) || []).forEach(function (x) {
        var id = finde(x.name, x.preis);
        var ziel = id ? angebotNach(id) : null;
        k[r[0]].push({ id: id, name: ziel ? ziel.name : (x.name || ""),
                       preis: (x.preis === null || x.preis === undefined)
                         ? null : Number(x.preis) });
      });
    });
    return k;
  }

  function kettenZeile(a, rolle, eintrag, i, alle) {
    var zeile = document.createElement("div");
    zeile.className = "katedit-zeile";

    var sel = document.createElement("select");
    var leer = document.createElement("option");
    leer.value = ""; leer.textContent = "\u2014 Angebot w\u00e4hlen \u2014";
    sel.appendChild(leer);
    // Nach Schubladen gruppiert — neunundvierzig Zeilen am Stueck findet
    // niemand. „Sonstiges" steht zuletzt, weil dort der Altbestand liegt.
    (((katalog && katalog.kategorien) || [])).forEach(function (kat) {
      var drin = alle.filter(function (x) {
        return x.kategorie === kat.id && x.id !== a.id;
      });
      if (!drin.length) return;
      var gruppe = document.createElement("optgroup");
      gruppe.label = kat.name;
      drin.forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.id;
        o.textContent = x.name +
          (x.preis ? "  (" + preisText(x.preis, x.waehrung) + ")" : "");
        if (eintrag.id === x.id) o.selected = true;
        gruppe.appendChild(o);
      });
      sel.appendChild(gruppe);
    });
    if (!eintrag.id && eintrag.name) {
      // Kam aus ThriveCart, hat aber keine Entsprechung im Katalog.
      var fremd = document.createElement("option");
      fremd.value = "";
      fremd.textContent = eintrag.name + "  (nicht im Katalog)";
      fremd.selected = true;
      sel.appendChild(fremd);
    }
    sel.onchange = function () {
      var ziel = angebotNach(sel.value);
      eintrag.id = sel.value;
      eintrag.name = ziel ? ziel.name : "";
      if (ziel && (eintrag.preis === null || eintrag.preis === undefined ||
                   eintrag.preis === "")) {
        eintrag.preis = ziel.preis;
      }
      kettenSpeichern();
      render();
    };
    zeile.appendChild(sel);

    var preis = document.createElement("input");
    preis.type = "number"; preis.min = "0"; preis.step = "1";
    preis.placeholder = "Preis hier";
    preis.title = "Der Preis an dieser Stelle \u2014 er darf vom Einzelpreis abweichen";
    preis.value = (eintrag.preis === null || eintrag.preis === undefined)
      ? "" : eintrag.preis;
    preis.oninput = function () {
      eintrag.preis = preis.value === "" ? null : Number(preis.value);
      kettenSpeichern();
      summeNeu(a);
    };
    zeile.appendChild(preis);

    var weg = document.createElement("button");
    weg.className = "del";
    weg.textContent = "\u00d7";
    weg.title = "aus der Kette nehmen";
    weg.onclick = function () {
      meineKette(a.id)[rolle].splice(i, 1);
      kettenSpeichern();
      render();
    };
    zeile.appendChild(weg);
    return zeile;
  }

  function katalogEditor(a) {
    var box = document.createElement("div");
    box.className = "katedit";
    var k = meineKette(a.id);
    var alle = ((katalog && katalog.angebote) || []).slice()
      .sort(function (x, y) { return (x.name || "") < (y.name || "") ? -1 : 1; });

    ROLLEN.forEach(function (r) {
      var block = document.createElement("div");
      block.className = "katedit-block";
      var lab = document.createElement("div");
      lab.className = "katedit-lab";
      lab.textContent = r[1];
      block.appendChild(lab);
      k[r[0]].forEach(function (eintrag, i) {
        block.appendChild(kettenZeile(a, r[0], eintrag, i, alle));
      });
      var plus = document.createElement("button");
      plus.className = "btn ghost katplus";
      plus.textContent = "+ " + r[1];
      plus.onclick = function () {
        meineKette(a.id)[r[0]].push({ id: "", name: "", preis: null });
        kettenSpeichern();
        render();
      };
      block.appendChild(plus);
      box.appendChild(block);
    });

    var summe = document.createElement("div");
    summe.className = "katsumme";
    summe.id = "kw-" + a.id;
    summe.innerHTML = warenkorbText(a);
    box.appendChild(summe);

    // Befund gegen Plan. Nur zeigen, wenn ThriveCart ueberhaupt etwas hat.
    var hatBefund = ROLLEN.some(function (r) {
      return (((a.kette || {})[r[0]]) || []).length;
    });
    if (hatBefund) {
      var fuss = document.createElement("div");
      fuss.className = "katbefund";
      fuss.innerHTML = '<span class="note">In ThriveCart h\u00e4ngt heute: ' +
        esc(ROLLEN.map(function (r) {
          var l = ((a.kette || {})[r[0]]) || [];
          return l.length ? r[1] + " " + l.map(function (x) {
            return x.name + " (" + preisText(x.preis, x.waehrung) + ")";
          }).join(", ") : "";
        }).filter(Boolean).join(" \u00b7 ")) + '</span>';
      var holen = document.createElement("button");
      holen.className = "btn";
      holen.textContent = hatKette(a.id)
        ? "Stand aus ThriveCart \u00fcbernehmen (\u00fcberschreibt)"
        : "Stand aus ThriveCart \u00fcbernehmen";
      holen.onclick = function () {
        ketten[a.id] = ausThriveCart(a);
        kettenSpeichern();
        render();
        toast("Aus ThriveCart \u00fcbernommen. Jetzt kannst du es anpassen.");
      };
      fuss.appendChild(holen);
      box.appendChild(fuss);
    }
    return box;
  }

  function renderKatalog(main) {
    if (!katalog) {
      main.innerHTML =
        '<div class="page-head"><div><h1>Angebots-Katalog</h1>' +
        '<p>Alle Angebote in Schubladen, mit echtem Preis.</p></div></div>' +
        '<div class="panel"><div class="empty">Noch kein Katalog da. ' +
        'Er entsteht aus ThriveCart.</div></div>';
      return;
    }

    var alle = katalog.angebote || [];
    var verkauft = alle.filter(function (a) {
      return a.preis && a.kategorie !== "sonstiges";
    });
    var summe = verkauft.reduce(function (s, a) { return s + (a.preis || 0); }, 0);
    var ketten = alle.filter(function (a) {
      return a.kette && (a.kette.bumps.length || a.kette.upsells.length ||
                         a.kette.downsells.length);
    }).length;

    // Ohne Kette ist der Warenkorb nur der Einzelpreis — das waere bloss
    // die Antwort auf „was ist am teuersten", nicht auf „was traegt am meisten".
    var groesster = { wert: 0, name: "" };
    alle.forEach(function (a) {
      var w = warenkorb(a);
      if (w.max > w.grund && w.max > groesster.wert) {
        groesster = { wert: w.max, name: a.name };
      }
    });

    main.innerHTML =
      '<div class="page-head"><div><h1>Angebots-Katalog</h1>' +
      '<p>Was du hast, was es kostet und was daran hängt — direkt aus ThriveCart. ' +
      'Das Pfeilchen ↳ zeigt, was an diesem Checkout angeboten wird, ' +
      '← zeigt, wo dieses Angebot selbst eingesetzt wird. ' +
      '<strong>Klick ein Angebot an</strong>, dann baust du dort die Kette: ' +
      'Bump, Upsell und Downsell auswählen, Preis setzen, und du siehst sofort, ' +
      'was maximal in den Warenkorb passt.</p></div></div>' +
      '<div class="tiles">' +
      tile("Angebote", alle.length, "ohne Karteileichen: " + verkauft.length) +
      tile("Mit Kette", ketten, "haben Bump, Upsell oder Downsell") +
      tile("Treppe", preisText(summe, "CHF"), "alle verkauften zusammen") +
      tile("Grösster Warenkorb", preisText(groesster.wert, "CHF"),
           groesster.name || "noch keine Kette gebaut") +
      '</div>' +
      '<div class="suchleiste"><input id="katfeld" type="search" autocomplete="off" ' +
      'placeholder="Angebot suchen — zum Beispiel Storyideen, Content-Box, MBA"></div>' +
      '<div id="katraus"></div>';

    var feld = main.querySelector("#katfeld");
    var raus = main.querySelector("#katraus");
    feld.value = katalogFilter;

    function zeigen() {
      var w = katalogFilter.toLowerCase().trim();
      raus.innerHTML = "";

      (katalog.kategorien || []).forEach(function (kat) {
        var drin = alle.filter(function (a) {
          return a.kategorie === kat.id &&
                 (!w || (a.name || "").toLowerCase().indexOf(w) >= 0);
        });
        if (!drin.length) return;

        var block = document.createElement("div");
        block.className = "panel katblock";
        var h = '<h2>' + esc(kat.name) + ' <span class="note">· ' +
                esc(kat.hinweis) + '</span></h2>';

        drin.forEach(function (a) {
          var w = warenkorb(a);
          h += '<div class="katgruppe' + (offeneKette === a.id ? " auf" : "") +
               '" data-ang="' + esc(a.id) + '">' +
               '<div class="katzeile">' +
               '<span class="katpreis">' + esc(preisText(a.preis, a.waehrung)) + '</span>' +
               '<span class="katname">' + esc(a.name) +
               (a.status && a.status !== "live"
                 ? ' <span class="flag bad">' + esc(a.status) + '</span>' : "") +
               (w.max > w.grund
                 ? ' <span class="katkorb">bis ' +
                   esc(preisText(w.max, a.waehrung)) + '</span>' : "") +
               (a.link
                 ? ' <a class="katauf" href="' + esc(a.link) + '" target="_blank" ' +
                   'rel="noopener" title="' + esc(a.quelle || "") + '">öffnen ↗</a>'
                 : "") +
               '</span></div>';

          [["↳ Order Bump", a.kette.bumps], ["↳ Upsell", a.kette.upsells],
           ["↳ Downsell", a.kette.downsells]].forEach(function (r) {
            r[1].forEach(function (x) {
              h += '<div class="katkette"><span class="katrolle">' + esc(r[0]) +
                   '</span><span>' + esc(x.name) + '</span>' +
                   '<span class="katpreis klein">' + esc(preisText(x.preis, x.waehrung)) +
                   '</span></div>';
            });
          });

          (a.haengt_an || []).forEach(function (x) {
            h += '<div class="katkette rueck"><span class="katrolle">← ' +
                 esc(x.art) + '</span><span>bei ' + esc(x.bei) + '</span>' +
                 '<span class="katpreis klein">' + esc(preisText(x.preis, "CHF")) +
                 '</span></div>';
          });
          h += '</div>';
        });

        block.innerHTML = h;
        // Ein Klick auf die Zeile klappt den Ketten-Bauer auf.
        block.querySelectorAll(".katgruppe").forEach(function (g) {
          var id = g.getAttribute("data-ang");
          var a = angebotNach(id);
          if (!a) return;
          g.querySelector(".katzeile").onclick = function (ev) {
            // Der Öffnen-Pfeil ist ein Link, kein Schalter — sonst klappt
            // beim Anklicken gleichzeitig der Ketten-Bauer auf.
            if (ev.target && ev.target.classList.contains("katauf")) return;
            offeneKette = (offeneKette === id) ? null : id;
            render();
          };
          if (offeneKette === id) g.appendChild(katalogEditor(a));
        });
        raus.appendChild(block);
      });

      if (!raus.children.length) {
        raus.innerHTML = '<div class="panel"><div class="empty">Nichts gefunden.</div></div>';
      }
    }

    var warten;
    feld.oninput = function () {
      katalogFilter = feld.value;
      clearTimeout(warten);
      warten = setTimeout(zeigen, 160);
    };
    zeigen();

    var fuss = document.createElement("p");
    fuss.className = "note";
    fuss.style.marginTop = "14px";
    fuss.textContent = "Stand " + mailDatum(katalog.stand) +
      " · Preise direkt aus ThriveCart. Ein Angebot kann je Einsatzort einen " +
      "anderen Preis haben — das ist keine Panne, sondern die Mechanik.";
    main.appendChild(fuss);
  }

  /* =========================================================
     Kurs-Inhalte — wo habe ich was erklärt
     ========================================================= */
  function ohneUmlaut(w) {
    return String(w || "").toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
  }

  function lektionTreffer(wort) {
    /* Erst das Register fragen, dann alle Lektionen — so findet auch ein
       Wortanfang wie „hütch" etwas. */
    var w = ohneUmlaut(wort).trim();
    if (!w || !kurse) return [];
    var raus = [];
    kurse.kurse.forEach(function (k) {
      k.lektionen.forEach(function (l) {
        var imTitel = ohneUmlaut(l.titel).indexOf(w) >= 0;
        var treffer = (l.stichwoerter || []).filter(function (s) {
          return ohneUmlaut(s).indexOf(w) >= 0;
        });
        if (imTitel || treffer.length) {
          raus.push({ kurs: k.name, lektion: l, worte: treffer, imTitel: imTitel });
        }
      });
    });
    raus.sort(function (a, b) { return (b.imTitel ? 1 : 0) - (a.imTitel ? 1 : 0); });
    return raus;
  }

  function lektionNummer(l) {
    if (l.modul) return l.modul + "." + l.lektion;
    return l.nummer ? String(l.nummer) : "—";
  }

  function renderKurse(main) {
    if (!kurse) {
      main.innerHTML =
        '<div class="page-head"><div><h1>Kurs-Inhalte</h1>' +
        '<p>Wo habe ich was erklärt?</p></div></div>' +
        '<div class="panel"><div class="empty">Noch kein Inhaltsverzeichnis da.</div></div>';
      return;
    }

    var anzahl = kurse.kurse.reduce(function (s, k) { return s + k.lektionen.length; }, 0);
    main.innerHTML =
      '<div class="page-head"><div><h1>Kurs-Inhalte</h1>' +
      '<p>Deine ' + kurse.kurse.length + ' Kurse mit ' + anzahl + ' Lektionen. ' +
      'Tipp ein Stichwort ein, und du siehst, in welcher Lektion du es erklärt hast — ' +
      'zum Beispiel wenn jemand fragt.</p></div></div>' +
      '<div class="suchleiste"><input id="kursfeld" type="search" autocomplete="off" ' +
      'placeholder="zum Beispiel: Hütchenmethode, Käufertypen, Orderbump, Schaufenster"></div>' +
      '<div id="kursraus"></div>';

    var feld = main.querySelector("#kursfeld");
    var raus = main.querySelector("#kursraus");
    feld.value = kursWort;

    function zeigen() {
      if (kursWort.trim()) {
        var tr = lektionTreffer(kursWort);
        if (!tr.length) {
          raus.innerHTML = '<div class="panel"><div class="empty">Zu „' +
            esc(kursWort) + '" ist in deinen Kursen nichts hinterlegt.</div></div>';
          return;
        }
        var h = '<p class="note">' + tr.length +
                (tr.length === 1 ? ' Lektion' : ' Lektionen') + '</p>';
        tr.forEach(function (t) {
          h += '<div class="sxtreffer">' +
               '<div class="sxkopf"><span class="sxbereich">' + esc(t.kurs) + '</span>' +
               '<span class="klnr">' + esc(lektionNummer(t.lektion)) + '</span>' +
               '<span class="sxtitel">' + markiere(t.lektion.titel, kursWort) + '</span></div>' +
               (t.worte.length
                 ? '<p class="sxauszug">' + t.worte.map(esc).join(" · ") + '</p>' : "") +
               '</div>';
        });
        raus.innerHTML = h;
        return;
      }

      // Kein Stichwort: alle Kurse zum Aufklappen
      raus.innerHTML = "";
      kurse.kurse.forEach(function (k) {
        var karte = document.createElement("div");
        karte.className = "dkarte" + (offenerKurs === k.name ? " auf" : "");
        karte.innerHTML =
          '<button class="dkopf"><span class="dpfeil">▸</span>' +
          '<span class="dname">' + esc(k.name) + '</span>' +
          '<span class="note">' + k.lektionen.length + ' Lektionen' +
          (k.ohne_transkript ? ' · ' + k.ohne_transkript + ' ohne Transkript' : "") +
          '</span></button><div class="dkoerper"></div>';
        karte.querySelector(".dkopf").onclick = function () {
          offenerKurs = (offenerKurs === k.name) ? null : k.name;
          render();
        };
        if (offenerKurs === k.name) {
          var koerper = karte.querySelector(".dkoerper");
          // Links zum Kurs (Mitmach-Heft, Kursplattform) - nur wenn gepflegt
          if (k.links && k.links.length) {
            var lz = document.createElement("div");
            lz.className = "kurslinks";
            lz.innerHTML = k.links.map(function (v) {
              return '<a href="' + esc(v.url) + '" target="_blank" rel="noopener">'
                   + esc(v.titel || v.url) + '</a>';
            }).join(" · ");
            koerper.appendChild(lz);
          }
          // Wo die Lektionsnummer im Inhaltsverzeichnis fehlt, laesst sich das
          // Arbeitsblatt nicht sauber zuordnen. Dann steht es hier — sichtbar
          // an der falschen Ebene ist besser als unsichtbar.
          var lose = k.arbeitsblaetter_ohne_lektion || [];
          var loseHtml = lose.length
            ? '<div class="abkasten"><div class="abkopf">Arbeitsblätter, die ' +
              'sich keiner Lektion eindeutig zuordnen liessen</div>' +
              lose.map(function (a) {
                return '<a class="abknopf" href="' + esc(a.link) + '" ' +
                       'target="_blank" rel="noopener">' + esc(a.name) + ' ↗</a>';
              }).join("") + '</div>'
            : "";
          koerper.innerHTML = loseHtml + k.lektionen.map(function (l) {
            var ab = (l.arbeitsblaetter || []).map(function (a) {
              return '<a class="abknopf" href="' + esc(a.link) + '" ' +
                     'target="_blank" rel="noopener">' + esc(a.name) + ' ↗</a>';
            }).join("");
            return '<div class="klzeile' + (ab ? " mitab" : "") + '">' +
              '<span class="klnr">' + esc(lektionNummer(l)) + '</span>' +
              '<span class="kltitel">' + esc(l.titel) + '</span>' +
              '<span class="klworte">' +
              (l.ohne_transkript
                ? '<em>kein Transkript — nur Video</em>'
                : (l.stichwoerter || []).slice(0, 8).map(esc).join(" · ")) +
              (ab ? '<span class="abzeile">' + ab + '</span>' : "") +
              '</span></div>';
          }).join("");
        }
        raus.appendChild(karte);
      });
    }

    var warten;
    feld.oninput = function () {
      kursWort = feld.value;
      clearTimeout(warten);
      warten = setTimeout(zeigen, 160);
    };
    zeigen();
  }

  /* =========================================================
     Suchen — ein Stichwort, und es kommt, wo es vorkam
     ========================================================= */
  var suchIndex = null;       // null = noch nicht geholt
  var suchLaeuft = false;
  var suchWort = "";

  function suchIndexHolen(fertig) {
    if (suchIndex || suchLaeuft) { fertig(); return; }
    if (!db) { fertig(); return; }
    suchLaeuft = true;
    db.collection("suche").limit(80).get().then(function (qs) {
      var alles = [];
      qs.docs.forEach(function (doc) {
        (doc.data() || {}).items && (alles = alles.concat(doc.data().items));
      });
      suchIndex = alles;
      suchLaeuft = false;
      fertig();
    }).catch(function () { suchLaeuft = false; suchIndex = []; fertig(); });
  }

  function suchTreffer(wort) {
    var w = wort.toLowerCase().trim();
    if (!w || !suchIndex) return [];
    var raus = [];
    for (var i = 0; i < suchIndex.length; i++) {
      var x = suchIndex[i];
      var imTitel = (x.t || "").toLowerCase().indexOf(w) >= 0;
      if (imTitel || (x.a || "").toLowerCase().indexOf(w) >= 0) {
        raus.push({ x: x, rang: imTitel ? 0 : 1 });
      }
      if (raus.length > 400) break;
    }
    raus.sort(function (a, b) { return a.rang - b.rang; });
    return raus.map(function (r) { return r.x; });
  }

  function markiere(text, wort) {
    var w = wort.trim();
    if (!w) return esc(text);
    var i = text.toLowerCase().indexOf(w.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + w.length)) +
           '</mark>' + esc(text.slice(i + w.length));
  }

  function renderSuche(main) {
    main.innerHTML =
      '<div class="page-head"><div><h1>Suchen</h1>' +
      '<p>Ein Stichwort, und du siehst, wo im ganzen Workspace darüber geschrieben wurde — Grundlagen, Produkte, Funnel, Recherche.</p></div></div>' +
      '<div class="suchleiste"><input id="suchfeld" type="search" placeholder="zum Beispiel: Keyword, Hybridmodell, Orderbump, Energie" autocomplete="off"></div>' +
      '<div id="suchraus"></div>';

    var feld = main.querySelector("#suchfeld");
    var raus = main.querySelector("#suchraus");
    feld.value = suchWort;

    function zeigen() {
      if (suchIndex === null) {
        raus.innerHTML = '<div class="panel"><div class="empty">Der Suchindex wird geholt …</div></div>';
        suchIndexHolen(function () { if (activeTab === "suche") zeigen(); });
        return;
      }
      if (!suchIndex.length) {
        raus.innerHTML = '<div class="panel"><div class="empty">Kein Suchindex da. Der tägliche Abgleich legt ihn an.</div></div>';
        return;
      }
      if (!suchWort.trim()) {
        raus.innerHTML = '<p class="note">' + suchIndex.length + ' Abschnitte durchsuchbar.</p>';
        return;
      }
      var tr = suchTreffer(suchWort);
      if (!tr.length) {
        raus.innerHTML = '<div class="panel"><div class="empty">Nichts gefunden zu „' + esc(suchWort) + '".</div></div>';
        return;
      }
      var h = '<p class="note">' + tr.length + ' Fundstellen' + (tr.length > 60 ? ' — die ersten 60' : '') + '</p>';
      tr.slice(0, 60).forEach(function (x) {
        // Fremdes Material bekommt eine andere Farbe. Es soll nie aussehen
        // wie Patricias eigenes — was hier steht, ist ein Wegweiser ins
        // Original, kein Text, den man verwenden darf.
        var fremd = /^Fremd/.test(x.b || "");
        h += '<div class="sxtreffer' + (fremd ? " fremd" : "") + '">' +
             '<div class="sxkopf"><span class="sxbereich' + (fremd ? " fremd" : "") +
             '">' + esc(x.b || "") + '</span>' +
             '<span class="sxtitel">' + markiere(x.t || "", suchWort) + '</span></div>' +
             '<p class="sxauszug">' + markiere(x.a || "", suchWort) + '</p>' +
             '<p class="sxpfad">' +
             (/^https?:/.test(x.d || "")
               ? '<a href="' + esc(x.d) + '" target="_blank" rel="noopener">' +
                 esc(x.d.replace(/^https?:\/\//, "").slice(0, 72)) + ' ↗</a>'
               : esc(x.d || "")) + '</p></div>';
      });
      raus.innerHTML = h;
    }

    var warten;
    feld.oninput = function () {
      suchWort = feld.value;
      clearTimeout(warten);
      warten = setTimeout(zeigen, 180);
    };
    zeigen();
    feld.focus();
  }

  /* =========================================================
     Listen & Automationen — Abbild aus ActiveCampaign
     ========================================================= */
  /* fmtDate laesst das Jahr weg — hier stehen Listen von 2023, da muss es mit. */
  function mailDatum(iso) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso;
  }

  function mailTabelle(titel, spalten, reihen, leer) {
    var breiten = spalten.map(function (s) { return s.w; }).join(" ");
    var h = '<h2>' + esc(titel) + '</h2>';
    if (!reihen.length) return '<div class="panel">' + h + '<div class="empty">' + esc(leer) + '</div></div>';
    h += '<div class="tablewrap"><div class="trow head" style="grid-template-columns:' + breiten + '">' +
         spalten.map(function (s) { return '<span>' + esc(s.l) + '</span>'; }).join("") + '</div>';
    reihen.forEach(function (r) {
      h += '<div class="trow" style="grid-template-columns:' + breiten + '">' +
           spalten.map(function (s) { return '<span>' + (s.f ? s.f(r) : esc(r[s.k] == null ? "" : String(r[s.k]))) + '</span>'; }).join("") +
           '</div>';
    });
    return '<div class="panel" style="margin-bottom:18px">' + h + '</div></div>';
  }

  var offeneAutomation = null;
  var mailtexte = {};            // Automations-Nummer -> Liste der Mails
  var mailsGeholt = {};

  function mailsHolen(nummer) {
    if (!db || mailsGeholt[nummer]) return;
    mailsGeholt[nummer] = true;
    db.doc("mails/" + nummer).get().then(function (snap) {
      if (!snap.exists) { mailtexte[nummer] = []; }
      else { mailtexte[nummer] = (snap.data() || {}).items || []; }
      if (activeTab === "mailings") render();
    }).catch(function () { mailtexte[nummer] = []; });
  }

  function mailListe(nummer) {
    var mails = mailtexte[nummer];
    if (!mails) { mailsHolen(nummer); return '<div class="empty">Mails werden geholt …</div>'; }
    if (!mails.length) return '<div class="empty">In dieser Automation stecken keine Mails.</div>';
    return mails.map(function (m) {
      return '<div class="mailkarte">' +
        '<div class="mailkopf"><strong>' + esc(m.betreff || m.name || "Ohne Betreff") + '</strong>' +
        (m.gebaut ? '<span class="note">' + esc(mailDatum(m.gebaut)) + '</span>' : "") + '</div>' +
        '<pre class="mailtext">' + esc(m.text || "(kein Text hinterlegt)") + '</pre></div>';
    }).join("");
  }

      tile("Automationen", autos.length, aktiv + " laufen") +
      '</div>' +
      '<div id="mailbody"></div>' +

    var koerper = main.querySelector("#mailbody");
    koerper.innerHTML =
      mailTabelle("Deine Listen",
        [{ k: "name", l: "Liste", w: "minmax(240px, 1fr)" },
         { k: "kontakte", l: "Kontakte", w: "110px" },
         { k: "nummer", l: "Nr.", w: "70px" },
         { k: "seit", l: "Angelegt", w: "130px", f: function (r) { return esc(mailDatum(r.seit)); } }],
        listen, "Noch nichts abgeglichen.");

    // Automationen als aufklappbare Karten — darin stehen die Mailtexte.
    var ab = document.createElement("div");
    ab.className = "panel";
    ab.innerHTML = '<h2>Deine Automationen</h2>' +
      '<p class="note">Klick auf eine Automation, dann siehst du die Mails, die darin hängen — mit vollem Text.</p>';
    koerper.appendChild(ab);

    if (!autos.length) {
      ab.innerHTML += '<div class="empty">Noch nichts abgeglichen.</div>';
      return;
    }

    autos.forEach(function (a) {
      var karte = document.createElement("div");
      karte.className = "dkarte" + (offeneAutomation === a.nummer ? " auf" : "");
      karte.innerHTML =
        '<button class="dkopf"><span class="dpfeil">▸</span>' +
        '<span class="dname">' + esc(a.name) + '</span>' +
        '<span class="flag ' + (a.status === "aktiv" ? "ok" : "bad") + '">' + esc(a.status) + '</span>' +
        '<span class="note">' + (a.mails ? a.mails + (a.mails === 1 ? " Mail" : " Mails") : "keine Mails") +
        ' · Nr. ' + esc(String(a.nummer)) + '</span></button>' +
        '<div class="dkoerper"></div>';

      karte.querySelector(".dkopf").onclick = function () {
        offeneAutomation = (offeneAutomation === a.nummer) ? null : a.nummer;
        render();
      };
      if (offeneAutomation === a.nummer) {
        karte.querySelector(".dkoerper").innerHTML = mailListe(a.nummer);
      }
      ab.appendChild(karte);
    });
  }

  /* „202609" ist eine Datenbank-Schreibweise, keine, die man liest. */
  function monatKlar(m) {
    m = String(m || "");
    return /^\d{6}$/.test(m) ? m.slice(4) + "/" + m.slice(0, 4) : m;
  }

  function zahlKurz(n) {
    return (Math.round(n * 10) / 10).toLocaleString("de-CH",
      { minimumFractionDigits: 0, maximumFractionDigits: 1 });
  }

  function balken(ist, soll) {
    var teil = soll ? Math.min(100, (ist / soll) * 100) : 0;
    var ton = teil >= 100 ? "voll" : (teil >= 75 ? "nah" : "weit");
    return '<div class="dtbalken"><span class="' + ton + '" style="width:' +
           teil.toFixed(1) + '%"></span></div>';
  }

  function luecken(liste) {
    if (!liste || !liste.length) return '<span class="flag ok">erfüllt</span>';
    return liste.map(function (l) {
      return '<span class="flag bad">' + zahlKurz(l.fehlt) + ' ' + esc(l.was) +
             ' fehlen</span>';
    }).join(" ");
  }

    var MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August",
               "September","Oktober","November","Dezember"];
    var t = String(ym || "").split("-");
    return (MON[Number(t[1]) - 1] || ym) + " " + t[0];
  }

  /* Ein Unterschied wird nur gezeigt, wenn er einer ist. */
  function mbDelta(wert, einheit) {
    if (wert === undefined || wert === null || wert === 0) return "";
    var hoch = wert > 0;
    return '<span class="mbdelta ' + (hoch ? "hoch" : "runter") + '">' +
      (hoch ? "▲ +" : "▼ ") + (einheit === "geld"
        ? Math.abs(wert).toLocaleString("de-CH", { maximumFractionDigits: 0 })
        : Math.abs(wert)) + '</span>';
  }

  function mbKarte(m, waehrung) {
    var n = monatsbogenNotizen[m.monat] || {};
    var auf = mbOffen === m.monat;
    var d = m.vs_vormonat || {};
    var karte = document.createElement("div");
    karte.className = "panel mbkarte" + (auf ? " auf" : "") +
                      (m.laeuft_noch ? " laeuft" : "");

    var kopf = document.createElement("button");
    kopf.className = "mbkopf";
    kopf.innerHTML =
      '<span class="dpfeil">▸</span>' +
      '<span class="mbmonat">' + esc(mbName(m.monat)) + '</span>' +
      (m.laeuft_noch ? '<span class="mblaeuft">läuft noch</span>' : "") +
      '<span class="mbwert"><b>' + esc(waehrung) + " " +
        (m.umsatz || 0).toLocaleString("de-CH", { maximumFractionDigits: 0 }) +
        '</b>' + mbDelta(d.umsatz, "geld") + '</span>' +
      '<span class="mbwert">' + (m.kaeufe || 0) + ' Käufe</span>' +
      '<span class="mbwert">' + (m.beitraege || 0) + ' Beiträge' +
        mbDelta(d.beitraege) + '</span>' +
      '<span class="mbwert">' + (m.reichweite_median || 0) + ' Reichweite' +
        mbDelta(d.reichweite_median) + '</span>';
    kopf.onclick = function () { mbOffen = auf ? null : m.monat; render(); };
    karte.appendChild(kopf);

    if (!auf) return karte;

    var k = document.createElement("div");
    k.className = "mbkoerper";

    // --- Was gerechnet ist. Reine Anzeige.
    var zahlen = document.createElement("div");
    zahlen.className = "mbblock";
    // 🚨 Kosten und Gewinn nur, wo Kosten wirklich erfasst sind. Bei `null`
    // steht ein Strich und daneben der Grund — nicht eine Null, die wie ein
    // gemessener Wert aussieht.
    var kostenTeil = (m.kosten === null || m.kosten === undefined)
      ? '<div><b class="mbleer">—</b><span>Kosten nicht erfasst</span></div>'
      : '<div><b>' + esc(waehrung) + " " + m.kosten.toLocaleString("de-CH",
          { maximumFractionDigits: 0 }) + '</b><span>Kosten</span></div>' +
        (m.kosten_usd ? '<div><b class="mbleer">+ USD ' +
          m.kosten_usd.toLocaleString("de-CH", { maximumFractionDigits: 0 }) +
          '</b><span>noch nicht umgerechnet</span></div>' : "") +
        '<div><b class="' + ((m.gewinn || 0) >= 0 ? "mbplus" : "mbminus") + '">' +

          (m.gewinn || 0).toLocaleString("de-CH", { maximumFractionDigits: 0 }) +

    zahlen.innerHTML = '<h3>Was gemessen wurde</h3>' +

          { maximumFractionDigits: 0 }) + '</b><span>Umsatz</span></div>' +
        kostenTeil +
        '<div><b>' + (m.kaeufe || 0) + '</b><span>Käufe</span></div>' +
        '<div><b>' + (m.beitraege || 0) + '</b><span>Beiträge</span></div>' +
        '<div><b>' + (m.reichweite_median || 0) + '</b><span>Reichweite (Median)</span></div>' +
        '<div><b>' + (m.gespeichert || 0) + '</b><span>gespeichert</span></div>' +
        '<div><b>' + (m.geteilt || 0) + '</b><span>geteilt</span></div>' +
        '<div><b>' + (m.kommentare || 0) + '</b><span>Kommentare</span></div>' +
      '</div>' +
      '<p class="note" style="margin-top:6px">Umsatz aus ThriveCart, Content aus ' +
      'der Instagram-API. Nichts davon trägst du ein.</p>';
    k.appendChild(zahlen);

    if (m.bester || m.schwaechster) {
      var b = document.createElement("div");
      b.className = "mbblock";
      var h = '<h3>Was ankam und was nicht</h3>';
      if (m.bester) {
        h += '<p class="mbbest"><span class="mbtag gut">bester</span> ' +
             esc(m.bester.anfang) + ' <b>' + m.bester.reach + '</b>' +
             (m.bester.link ? ' <a href="' + esc(m.bester.link) +
               '" target="_blank" rel="noopener">↗</a>' : "") + '</p>';
      }
      if (m.schwaechster) {
        h += '<p class="mbbest"><span class="mbtag schwach">schwächster</span> ' +
             esc(m.schwaechster.anfang) + ' <b>' + m.schwaechster.reach + '</b>' +
             (m.schwaechster.link ? ' <a href="' + esc(m.schwaechster.link) +
               '" target="_blank" rel="noopener">↗</a>' : "") + '</p>';
      }
      b.innerHTML = h;
      k.appendChild(b);
    }

    if ((m.launches || []).length) {
      var l = document.createElement("div");
      l.className = "mbblock";
      l.innerHTML = '<h3>Was laut Jahresplan lief</h3><ul class="mbliste">' +
        m.launches.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
        '</ul>';
      k.appendChild(l);
    }

    // --- Was nur sie wissen kann.
    var eigen = document.createElement("div");
    eigen.className = "mbblock";
    eigen.innerHTML = '<h3>Was du daraus mitnimmst</h3>';
    MB_FELDER.forEach(function (f) {
      var d2 = document.createElement("div");
      d2.className = "field mbfeld";
      var lab = document.createElement("label");
      lab.textContent = f.l;
      var ta = document.createElement("textarea");
      ta.rows = f.z;
      ta.placeholder = f.p;
      ta.value = n[f.k] || "";
      ta.oninput = function () {
        if (!monatsbogenNotizen[m.monat]) monatsbogenNotizen[m.monat] = {};
        monatsbogenNotizen[m.monat][f.k] = ta.value;
        mbSpeichern();
      };
      d2.appendChild(lab); d2.appendChild(ta);
      eigen.appendChild(d2);
    });
    k.appendChild(eigen);

    karte.appendChild(k);
    return karte;

  /* =========================================================

  var WB_FELDER = [
    { k: "fokus", l: "Fokus der Woche", z: 2,
      p: "Ein Thema. Woran soll sie diese Woche denken?" },
    { k: "produkt", l: "🎯 Hauptprodukt", z: 1, p: "Worauf zahlt alles ein?" },
    { k: "cta", l: "Wochen-CTA", z: 1, p: "Stichwort oder Link" },
    { k: "pattern", l: "📅 Sales-Pattern", z: 3,

  ];
  var WB_HAKEN = [
    { k: "contentplanung", l: "Content geplant" },
    { k: "mails", l: "Mails durchgesehen" },
    { k: "downloads", l: "Downloads aufgeräumt" },
    { k: "tabs", l: "Tabs zu" }
  ];

  function wbSpeichern() {
    clearTimeout(saveTimers.wochenbogenNotizen);
    saveTimers.wochenbogenNotizen = setTimeout(function () {
      lsSet("wochenbogen-notizen", wochenbogenNotizen);
      if (!db) { setSaveState("lokal gespeichert", "off"); return; }
      db.doc("daten/wochenbogen-notizen")
        .set({ werte: wochenbogenNotizen, updatedAt: new Date().toISOString() })
        .then(function () { setSaveState("gespeichert", "on"); })
        .catch(function () { setSaveState("nur lokal gespeichert", "off"); });
    }, 700);
  }

  function wbKarte(w, waehrung) {
    var n = wochenbogenNotizen[w.kw] || {};
    var auf = wbOffen === w.kw;
    var d = w.vs_vorwoche || {};
    var karte = document.createElement("div");
    karte.className = "panel mbkarte" + (auf ? " auf" : "") +

    var kopf = document.createElement("button");
    kopf.className = "mbkopf";
    kopf.innerHTML =
      '<span class="dpfeil">▸</span>' +
      '<span class="mbmonat">' + esc(w.kw.replace("-", " ")) + '</span>' +
      '<span class="note">' + esc(fmtDate(w.von)) + '–' + esc(fmtDate(w.bis)) + '</span>' +
      (w.laeuft_noch ? '<span class="mblaeuft">läuft</span>' : "") +
      (n.fokus ? '<span class="wbfokus">' + esc(n.fokus.slice(0, 44)) + '</span>'
               : '<span class="wbleer">kein Fokus gesetzt</span>') +
      '<span class="mbwert"><b>' + esc(waehrung) + " " +
        (w.umsatz || 0).toLocaleString("de-CH", { maximumFractionDigits: 0 }) +
        '</b>' + mbDelta(d.umsatz, "geld") + '</span>' +
      '<span class="mbwert">' + (w.beitraege || 0) + ' Beiträge' +
        mbDelta(d.beitraege) + '</span>' +
      '<span class="mbwert">' + (w.reichweite_median || 0) + ' Reichw.' +
        mbDelta(d.reichweite_median) + '</span>';
    kopf.onclick = function () { wbOffen = auf ? null : w.kw; render(); };
    karte.appendChild(kopf);
    if (!auf) return karte;

    var k = document.createElement("div");
    k.className = "mbkoerper";

    var zahlen = document.createElement("div");
    zahlen.className = "mbblock";
    zahlen.innerHTML = '<h3>Was gemessen wurde</h3><div class="gpwerte">' +
      '<div><b>' + esc(waehrung) + " " + (w.umsatz || 0).toLocaleString("de-CH",
        { maximumFractionDigits: 0 }) + '</b><span>Umsatz</span></div>' +
      '<div><b>' + (w.kaeufe || 0) + '</b><span>Käufe</span></div>' +
      '<div><b>' + (w.beitraege || 0) + '</b><span>Beiträge</span></div>' +
      '<div><b>' + (w.reichweite_median || 0) + '</b><span>Reichweite</span></div>' +
      '<div><b>' + (w.gespeichert || 0) + '</b><span>gespeichert</span></div>' +
      '<div><b>' + (w.geteilt || 0) + '</b><span>geteilt</span></div>' +
      '</div>' +
      (w.bester ? '<p class="mbbest" style="margin-top:7px">' +
        '<span class="mbtag gut">bester</span>' + esc(w.bester.anfang) +
        ' <b>' + w.bester.reach + '</b>' +
        (w.bester.link ? ' <a href="' + esc(w.bester.link) +
          '" target="_blank" rel="noopener">↗</a>' : "") + '</p>' : "");
    k.appendChild(zahlen);

    if ((w.laeuft || []).length) {
      var l = document.createElement("div");
      l.className = "mbblock";
      l.innerHTML = '<h3>Was laut Jahresplan läuft</h3><ul class="mbliste">' +
        w.laeuft.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
        '</ul>';
      k.appendChild(l);
    }

    var eigen = document.createElement("div");
    eigen.className = "mbblock";
    eigen.innerHTML = '<h3>Deine Planung und dein Fazit</h3>';
    WB_FELDER.forEach(function (f) {
      var d2 = document.createElement("div");
      d2.className = "field mbfeld";
      var lab = document.createElement("label");
      lab.textContent = f.l;
      var ta = document.createElement("textarea");
      ta.rows = f.z; ta.placeholder = f.p; ta.value = n[f.k] || "";
      ta.oninput = function () {
        if (!wochenbogenNotizen[w.kw]) wochenbogenNotizen[w.kw] = {};
        wochenbogenNotizen[w.kw][f.k] = ta.value;
        wbSpeichern();
      };
      d2.appendChild(lab); d2.appendChild(ta);
      eigen.appendChild(d2);
    });

    // Die vier Routine-Haken, klein und am Schluss.
    var hz = document.createElement("div");
    hz.className = "wbhaken";
    WB_HAKEN.forEach(function (h) {
      var lab = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!n[h.k];
      cb.onchange = function () {
        if (!wochenbogenNotizen[w.kw]) wochenbogenNotizen[w.kw] = {};
        wochenbogenNotizen[w.kw][h.k] = cb.checked;
        wbSpeichern();
      };
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(" " + h.l));
      hz.appendChild(lab);
    });
    eigen.appendChild(hz);
    k.appendChild(eigen);

    karte.appendChild(k);

  /* Kundenstimmen unter der Kundenliste. Kein eigener Reiter — es sind vier.
     🚨 Nur was oeffentlich auf einer Salespage steht. Eine Stimme ohne
     geklaerte Freigabe gehoert nicht in eine Ablage, die man weitergeben kann. */
  /* =========================================================
     Aufgaben
     ========================================================= */
  var AF_PRIO = ["Hoch", "Mittel", "Tief", "Quick Win"];

  function afSpeichern() {
    clearTimeout(saveTimers.aufgaben);
    saveTimers.aufgaben = setTimeout(function () {
      lsSet("aufgaben", aufgaben);
      if (!db) { setSaveState("lokal gespeichert", "off"); return; }
      db.doc("daten/aufgaben")
        .set(Object.assign({}, aufgaben, { updatedAt: new Date().toISOString() }))
        .then(function () { setSaveState("gespeichert", "on"); })
        .catch(function () { setSaveState("nur lokal gespeichert", "off"); });
    }, 700);
  }

  function afZeile(a) {
    var z = document.createElement("div");
    var faellig = a.datum && a.datum < todayISO() && !a.erledigt;
    z.className = "afzeile" + (a.erledigt ? " fertig" : "") +
                  (faellig ? " faellig" : "");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!a.erledigt;
    cb.title = "erledigt";
    cb.onchange = function () {
      // 🚨 Nicht loeschen, nur markieren — mit Datum, damit der Monatsbogen
      // spaeter sagen kann, was in dem Monat fertig geworden ist.
      a.erledigt = cb.checked;
      a.erledigt_am = cb.checked ? todayISO() : "";
      afSpeichern(); render();
    };
    z.appendChild(cb);

    var t = document.createElement("input");
    t.type = "text"; t.value = a.aufgabe || "";
    t.className = "aftext";
    t.oninput = function () { a.aufgabe = t.value; afSpeichern(); };
    z.appendChild(t);

    var p = document.createElement("select");
    AF_PRIO.forEach(function (o) {
      var op = document.createElement("option");
      op.value = o; op.textContent = o;
      if ((a.prio || "Mittel") === o) op.selected = true;
      p.appendChild(op);
    });
    p.onchange = function () { a.prio = p.value; afSpeichern(); render(); };
    z.appendChild(p);

    var d = document.createElement("input");
    d.type = "date"; d.value = a.datum || "";
    d.onchange = function () { a.datum = d.value; afSpeichern(); render(); };
    z.appendChild(d);

    var tage = document.createElement("span");
    tage.className = "aftage";
    if (faellig) {
      var diff = Math.round(
        (new Date(todayISO()) - new Date(a.datum)) / 86400000);
      tage.textContent = diff + " Tage";
    } else if (a.erledigt && a.erledigt_am) {
      tage.textContent = "erledigt";
    }
    z.appendChild(tage);

    var weg = document.createElement("button");
    weg.className = "del";
    weg.textContent = "×";
    var scharf = false;
    weg.onclick = function () {
      if (!scharf) {
        scharf = true; weg.classList.add("scharf"); weg.textContent = "sicher?";
        setTimeout(function () {
          scharf = false; weg.classList.remove("scharf"); weg.textContent = "×";
        }, 6000);
        return;
      }
      aufgaben.items = aufgaben.items.filter(function (x) { return x.id !== a.id; });
      afSpeichern(); render();
    };
    z.appendChild(weg);

    // 🚨 Der Befund aus dem Workspace-Abgleich. Er hakt NICHTS ab — er zeigt
    // den Beleg und lässt Patricia entscheiden. Ein Haken, den eine Maschine
    // gesetzt hat, ist derselbe Fehler wie ein fehlender: die Liste stimmt
    // nicht mehr, und man merkt es zu spät.
    if (a.befund && !a.erledigt) {
      var bf = document.createElement("div");
      bf.className = "afbefund " + a.befund;
      var titel = { erledigt: "Sieht erledigt aus",
                    hinfaellig: "Wohl hinfällig",
                    teilweise: "Teilweise erledigt",
                    offen: "Bestätigt offen" }[a.befund] || a.befund;
      bf.innerHTML = "<b>" + esc(titel) + "</b> " + esc(a.beleg || "");
      if (a.befund === "erledigt" || a.befund === "hinfaellig") {
        var ja = document.createElement("button");
        ja.className = "btn";
        ja.textContent = a.befund === "erledigt" ? "Stimmt, abhaken"
                                                 : "Stimmt, weg damit";
        ja.onclick = function () {
          a.erledigt = true;
          a.erledigt_am = todayISO();
          a.erledigt_grund = a.befund;
          afSpeichern(); render();
        };
        var nein = document.createElement("button");
        nein.className = "btn ghost";
        nein.textContent = "Nein, offen";
        nein.onclick = function () {
          // Befund verwerfen, Aufgabe bleibt stehen — und der Abgleich soll
          // sie nicht beim nächsten Lauf wieder vorschlagen.
          a.befund = ""; a.beleg = ""; a.befund_verworfen = todayISO();
          afSpeichern(); render();
        };
        bf.appendChild(ja); bf.appendChild(nein);
      }
      z.appendChild(bf);
    }

    if (a.notiz) {
      var n = document.createElement("p");
      n.className = "afnotiz";
      n.textContent = a.notiz;
      z.appendChild(n);
    }
    return z;
  }

  /* =========================================================

        h += '<p class="zlist">' + esc(z.ist_text) + '</p>';
      }

      ta.value = z.notiz || z.qualitativ || "";

      d.appendChild(lab); d.appendChild(ta);
      k.appendChild(d);
      box.appendChild(k);

    var f = document.createElement("p");

  function renderAufgaben(main) {
    if (!aufgaben || !(aufgaben.items || []).length) {
      main.innerHTML =
        '<div class="page-head"><div><h1>Aufgaben</h1>' +
        '<p>Was ansteht — überfällig zuerst.</p></div></div>' +
        '<div class="panel"><div class="empty">Noch nichts übernommen:<br>' +
        '<code>python scripts/cockpit/aufgaben-bauen.py</code></div></div>';
      return;
    }
    var alle = aufgaben.items;
    var heute = todayISO();
    var offen = alle.filter(function (a) { return !a.erledigt; });
    var faellig = offen.filter(function (a) { return a.datum && a.datum < heute; });
    var heuteF = offen.filter(function (a) { return a.datum === heute; });
    var fertig = alle.filter(function (a) { return a.erledigt; });

    main.innerHTML =
      '<div class="page-head"><div><h1>Aufgaben</h1>' +
      '<p>Überfällig steht oben. Abhaken löscht nicht — eine erledigte Aufgabe ' +
      'bleibt mit Datum stehen, sonst weiss am Monatsende niemand mehr, was ' +
      'geschafft wurde.</p></div>' +
      '<div class="head-actions"><select class="btn" id="affilter">' +
        '<option value="offen">Nur offene</option>' +
        '<option value="faellig">Nur überfällige</option>' +
        '<option value="alle">Alle</option>' +
      '</select><button class="btn primary" id="afneu">Aufgabe anlegen</button>' +
      '</div></div>' +
      '<div class="tiles">' +
      tile("Überfällig", faellig.length,
           faellig.length ? "älteste " + esc(faellig[0].datum || "") : "nichts offen") +
      tile("Heute", heuteF.length, "fällig") +
      tile("Offen gesamt", offen.length,
           (aufgaben.nach_prio ? Object.keys(aufgaben.nach_prio).map(function (k) {
             return k + " " + aufgaben.nach_prio[k]; }).join(" · ") : "")) +
      tile("Sieht erledigt aus",
           offen.filter(function (a) {
             return a.befund === "erledigt" || a.befund === "hinfaellig";
           }).length,
           "mit Beleg — bestätigen") +
      tile("Erledigt", fertig.length, "bleiben stehen") +
      '</div>' +
      '<div class="panel"><div class="afkopf">' +
        '<span></span><span>Aufgabe</span><span>Priorität</span>' +
        '<span>Fällig</span><span></span><span></span></div>' +
        '<div id="afliste"></div></div>' +
      '<p class="note" style="margin-top:12px">' + esc(aufgaben.hinweis || "") + '</p>';

    var f = main.querySelector("#affilter");
    f.value = afFilter;
    f.onchange = function () { afFilter = f.value; render(); };

    var zeigen = afFilter === "alle" ? alle
      : (afFilter === "faellig" ? faellig : offen);
    // Überfällig zuerst, dann nach Datum. Erledigte ganz unten.
    zeigen = zeigen.slice().sort(function (x, y) {
      if (!!x.erledigt !== !!y.erledigt) return x.erledigt ? 1 : -1;
      var xf = x.datum && x.datum < heute, yf = y.datum && y.datum < heute;
      if (xf !== yf) return xf ? -1 : 1;
      return (x.datum || "9999") < (y.datum || "9999") ? -1 : 1;
    });

    var box = main.querySelector("#afliste");
    if (!zeigen.length) {
      box.innerHTML = '<div class="empty">Nichts in dieser Ansicht.</div>';
    }
    zeigen.forEach(function (a) { box.appendChild(afZeile(a)); });

    main.querySelector("#afneu").onclick = function () {
      aufgaben.items.unshift({
        id: uid("af"), aufgabe: "", datum: todayISO(), prio: "Mittel",
        status: "Geplant", notiz: "", erledigt: false, quelle: "Cockpit"
      });
      afSpeichern(); render();
    };

    projekteBlock(main);
  }

  /* =========================================================
     Projekte — die Klammer um die Aufgaben.

     Kein eigener Reiter: ein Projekt ist eine Gruppe von Aufgaben.
     «Ohne Status» steht ausgeschrieben da, weil ein leeres Feld wie
     erledigt aussieht. Wo «Läuft» steht und der Zeitraum vorbei ist,
     wird der Widerspruch gezeigt, nicht stillschweigend korrigiert.
     ========================================================= */
  function projekteBlock(main) {
    var items = (projekte && projekte.items) || [];
    var h = '<h2 style="margin-top:34px">Projekte</h2>';

    if (!items.length) {
      main.insertAdjacentHTML("beforeend", h +
        '<div class="card"><p class="muted">Noch nichts übernommen:<br>' +
        '<code>python scripts/cockpit/projekte-importieren.py</code></p></div>');
      return;
    }

    var heute = todayISO();
    // Widerspruch: steht auf «Läuft», Zeitraum ist aber durch.
    var haengt = items.filter(function (p) {
      return p.zustand === "Läuft" && p.vorbei;
    });
    var ohne = items.filter(function (p) { return p.zustand === "Ohne Status"; });

    function zeile(p) {
      var wann = p.von
        ? esc(p.von.slice(8) + "." + p.von.slice(5, 7) + "." +
              (p.bis ? " – " + p.bis.slice(8) + "." + p.bis.slice(5, 7) + "." + p.bis.slice(2, 4) : ""))
        : "—";
      var fahne = "";
      if (p.zustand === "Läuft" && p.vorbei) {
        fahne = ' <span class="warn" title="Steht auf Läuft, der Zeitraum ist aber vorbei">' +
                "Zeitraum durch</span>";
      }
      return "<tr" + (p.laeuft ? ' style="font-weight:600"' : "") + ">" +
        "<td>" + (p.laeuft ? "▶ " : "") + esc(p.name) + fahne + "</td>" +
        "<td>" + (p.zustand === "Ohne Status"
          ? '<span class="muted">Ohne Status</span>' : esc(p.zustand)) + "</td>" +
        "<td>" + esc(p.prio || "—") + "</td>" +
        "<td>" + wann + "</td>" +
        '<td style="text-align:right">' +
          (p.aufgaben ? p.aufgaben + " Aufgaben" : '<span class="muted">—</span>') +
        "</td></tr>";
    }

    var laeuft = items.filter(function (p) { return p.laeuft; });
    var kommt = items.filter(function (p) { return !p.laeuft && !p.vorbei; });
    var vorbei = items.filter(function (p) { return p.vorbei; });

    function gruppe(titel, ps) {
      if (!ps.length) return "";
      return '<tr><td colspan="5" class="muted" style="padding-top:14px">' +
        esc(titel) + " · " + ps.length + "</td></tr>" + ps.map(zeile).join("");
    }

    main.insertAdjacentHTML("beforeend", h +
      '<div class="card">' +
      '<div class="tiles" style="margin-bottom:14px">' +
      tile("Läuft gerade", laeuft.length, "im Zeitraum") +
      tile("Kommt noch", kommt.length, "Start in der Zukunft") +
      tile("Zeitraum durch", haengt.length, "steht aber auf «Läuft»") +
      tile("Ohne Status", ohne.length, "in Notion war das Feld leer") +
      "</div>" +
      '<table class="tbl"><thead><tr><th>Projekt</th><th>Zustand</th>' +
      "<th>Priorität</th><th>Zeitraum</th>" +
      '<th style="text-align:right">hängt dran</th></tr></thead><tbody>' +
      gruppe("Läuft gerade", laeuft) +
      gruppe("Kommt noch", kommt) +
      gruppe("Vorbei", vorbei) +
      "</tbody></table>" +
      '<p class="muted" style="margin-top:14px">' +
      esc((projekte && projekte.hinweis) || "") + "</p></div>");
  }

  function stimmenBlock(main) {
    var liste = (stimmen && stimmen.items) || [];
    if (!liste.length) return;
    var box = document.createElement("div");
    box.className = "panel";
    box.style.marginTop = "22px";
    box.innerHTML = "<h2>Kundenstimmen <span class=\"note\">" + liste.length +
      "</span></h2>" +
      '<p class="note">Aus deinen Salespages — die stehen öffentlich, sind also ' +
      'freigegeben. Zum Kopieren für Ads, Mails und neue Seiten.</p>';
    liste.forEach(function (s) {
      var z = document.createElement("div");
      z.className = "stimme";
      z.innerHTML =
        '<p class="stimmetext">„' + esc(s.text) + '"</p>' +
        '<p class="stimmewer">— ' + esc(s.name || "ohne Namen") +
        (s.handle ? ' <span class="note">' + esc(s.handle) + '</span>' : "") +
        '</p>';
      var k = document.createElement("button");
      k.className = "lzkopie";
      k.textContent = "kopieren";
      k.onclick = function () {
        var t = "„" + s.text + "“ — " + (s.name || "") +
                (s.handle ? " " + s.handle : "");
        // 🚨 Kein navigator.clipboard.writeText allein — im Artifact-Rahmen
        // kann es ohne sichtbaren Fehler abgelehnt werden. Deshalb derselbe
        // Weg wie in der Link-Zentrale, mit Rueckfall auf execCommand.
        var ok = false;
        try {
          var ta = document.createElement("textarea");
          ta.value = t;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (e) {}
        k.textContent = ok ? "kopiert" : "von Hand markieren";
        k.classList.toggle("fertig", ok);
        setTimeout(function () {
          k.textContent = "kopieren"; k.classList.remove("fertig");
        }, 2500);
      };
      z.appendChild(k);
      box.appendChild(z);
    });
    main.appendChild(box);
  }

  function renderMonatsbogen(main) {

      main.innerHTML =
        '<div class="page-head"><div><h1>Monatsbogen</h1>' +
        '<p>Der Rückblick, der sich selbst ausfüllt.</p></div></div>' +
        '<div class="panel"><div class="empty">Noch nichts gerechnet:<br>' +
        '<code>python scripts/cockpit/monatsbogen-bauen.py</code></div></div>';
      return;
    }
    var w = monatsbogen.waehrung || "CHF";

    var jahresumsatz = imJahr.reduce(function (s, m) { return s + (m.umsatz || 0); }, 0);
    var ziel = Number(settings.monatsziel) || 0;

    var ausgefuellt = monate.filter(function (m) {

      '<div class="tiles">' +

             ? w + " " + Math.round(fertig.slice().sort(function (x, y) {
