  }

  function seekTo(video, t) {
    return new Promise(function (res) {
      var fertig = false;
      function done() { if (fertig) return; fertig = true; video.removeEventListener("seeked", done); res(); }
      video.addEventListener("seeked", done);
      try { video.currentTime = t; } catch (e) { done(); }
      setTimeout(done, 1200);
    });
  }

  function frameScore(canvas) {
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    var w = canvas.width, h = canvas.height;
    var d;
    try { d = ctx.getImageData(0, 0, w, h).data; } catch (e) { return 0; }
    var grau = new Float32Array(w * h), summe = 0;
    for (var i = 0, j = 0; i < d.length; i += 4, j++) {
      var g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      grau[j] = g; summe += g;
    }
    var mittel = summe / (w * h);
    // Schärfe über die Nachbarschaftsdifferenz
    var schaerfe = 0, n = 0;
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var k = y * w + x;
        var lap = 4 * grau[k] - grau[k - 1] - grau[k + 1] - grau[k - w] - grau[k + w];
        schaerfe += lap * lap; n++;
      }
    }
    schaerfe = Math.sqrt(schaerfe / Math.max(1, n));
    // zu dunkel oder ausgebrannt wird bestraft
    var helligkeit = 1 - Math.abs(mittel - 128) / 128;
    return schaerfe * (0.45 + 0.55 * helligkeit);
  }

  function frameVorschlaege(video, anzahl, cb) {
    var dauer = video.duration;
    if (!dauer || !isFinite(dauer)) { cb([]); return; }
    var start = Math.min(0.4, dauer * 0.03);
    var zeiten = [];
    for (var i = 0; i < anzahl; i++) zeiten.push(start + (dauer - start) * (i / (anzahl - 1 || 1)) * 0.94);
    var thumb = document.createElement("canvas");
    thumb.width = 168; thumb.height = 298;
    var tctx = thumb.getContext("2d", { willReadFrequently: true });
    var gross = document.createElement("canvas");
    gross.width = 405; gross.height = 720;
    var gctx = gross.getContext("2d");
    var out = [];
    var idx = 0;
    function naechster() {
      if (idx >= zeiten.length) {
        out.sort(function (a, b) { return b.score - a.score; });
        cb(out);
        return;
      }
      var t = zeiten[idx++];
      seekTo(video, t).then(function () {
        try {
          zeichneCover(tctx, video, thumb.width, thumb.height);
          zeichneCover(gctx, video, gross.width, gross.height);
          out.push({ t: t, score: frameScore(thumb), vorschau: gross.toDataURL("image/jpeg", 0.72) });
        } catch (e) {}
        setTimeout(naechster, 20);
      });
    }
    naechster();
  }

  function zeichneCover(ctx, quelle, w, h) {
    var sw = quelle.videoWidth || quelle.width, sh = quelle.videoHeight || quelle.height;
    var f = Math.max(w / sw, h / sh);
    var dw = sw * f, dh = sh * f;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(quelle, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  function reelVollbild(video) {
    var c = document.createElement("canvas");
    c.width = RW; c.height = RH;
    zeichneCover(c.getContext("2d"), video, RW, RH);
    return c.toDataURL("image/jpeg", 0.9);
  }

  function renderReelCanvas(canvas, r, opts) {
    opts = opts || {};
    var b = BRANDS[r.brand] || BRANDS.mlb_dark;
    var ctx = canvas.getContext("2d");
    canvas.width = RW; canvas.height = RH;
    ctx.clearRect(0, 0, RW, RH);

    function textZeichnen() {
      var pad = 96;
      var maxW = RW - pad * 2;
      // 🚨 Auf dem Cover steht der Cover-Titel, nicht der gesprochene Hook.
      // Der Hook ist der Satz fuer die Kamera und dafuer zu lang.
      var coverText = r.coverhook || r.hook || "";
      var coverUnter = r.coverunter || r.unter || "";
      // Schriftgroesse als Faktor. `fitLines` verkleinert weiter, wenn der Text
      // sonst nicht in die erlaubte Hoehe passt — der Regler hebt nur die
      // Obergrenze an oder senkt sie.
      var sk = Math.max(0.6, Math.min(1.5, (r.textskala || 100) / 100));
      var h = fitLines(ctx, String(coverText).toUpperCase(), maxW, RH * 0.34 * sk,
                       b.display, "bold", Math.round(104 * sk), Math.round(44 * sk), 1.12);
      var uLines = [];
      var uSize = Math.round(40 * sk);
      if (coverUnter) {
        ctx.font = uSize + "px " + b.body;
        uLines = wrap(ctx, coverUnter, maxW).slice(0, 3);
      }
      var uZeile = Math.round(56 * sk);
      var blockH = h.lines.length * h.size * 1.12 +
                   (uLines.length ? uLines.length * uZeile + 34 : 0);
      var y;
      if (typeof r.texty === "number") {
        // Freie Hoehe in Prozent. 🚨 Bei 82 % beginnt die tote Zone, in der
        // Instagram Caption und Knöpfe drueberlegt — der Block darf nicht
        // hineinragen, deshalb wird gegen blockH begrenzt.
        var maxY = RH * 0.82 - blockH;
        var gewuenscht = RH * (r.texty / 100);
        y = Math.max(RH * 0.13, Math.min(maxY, gewuenscht));
        // Damit der Regler nicht kaputt wirkt, wenn ihn die tote Zone bremst:
        // der Zustand wird gemerkt und am Regler angeschrieben.
        r.__geklemmt = gewuenscht > maxY + 1;
      } else if (r.pos === "oben") y = 300;
      else if (r.pos === "mitte") y = (RH - blockH) / 2;
      else y = RH - 470 - blockH;

      if (r.scrim && !opts.transparent) {
        // Der Schatten traegt ihre Markenfarbe, nicht ein generisches Dunkel.
        var c3 = coverRGB(r), rgb = c3[0] + "," + c3[1] + "," + c3[2];
        var g = ctx.createLinearGradient(0, y - 150, 0, y + blockH + 150);
        g.addColorStop(0, "rgba(" + rgb + ",0)");
        g.addColorStop(0.35, "rgba(" + rgb + ",0.88)");
        g.addColorStop(0.7, "rgba(" + rgb + ",0.88)");
        g.addColorStop(1, "rgba(" + rgb + ",0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, y - 150, RW, blockH + 300);
      }

      ctx.font = "bold " + h.size + "px " + b.display;
      ctx.fillStyle = opts.transparent ? "#ffffff" : b.text;
      if (opts.transparent) {
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 4;
      }
      h.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, y + h.size + i * h.size * 1.12); });
      var uy = y + h.lines.length * h.size * 1.12 + 34;
      if (uLines.length) {
        ctx.font = uSize + "px " + b.body;
        ctx.fillStyle = opts.transparent ? "rgba(255,255,255,0.92)" : b.muted;
        uLines.forEach(function (ln, i) {
          ctx.fillText(ln, pad, uy + uSize + i * uZeile);
        });
      }
      ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      // Akzentstrich unter der Hook
      ctx.fillStyle = b.accent;
      ctx.fillRect(pad, y - 46, 130, 9);

      if (opts.guides) {
        ctx.strokeStyle = "rgba(255,80,80,0.85)";
        ctx.setLineDash([16, 14]);
        ctx.lineWidth = 4;
        ctx.strokeRect(60, 240, RW - 120 - 200, RH - 240 - 480);
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(255,80,80,0.95)";
        ctx.font = "30px " + b.body;
        ctx.fillText("sichere Zone", 74, 214);
      }
    }

    if (opts.transparent) { textZeichnen(); return; }

    var titel = images[r.id];
    if (titel) {
      getImageObj(r.id, function (img) {
        if (img) drawCover(ctx, img, 0, 0, RW, RH, 1, 0, 0);
        else { ctx.fillStyle = b.bg; ctx.fillRect(0, 0, RW, RH); }
        textZeichnen();
      });
    } else {
      // Ohne Foto: Vollflaeche in der gewaehlten Markenfarbe. Vorher stand hier
      // die Hintergrundfarbe des Marken-Looks, wodurch die Farbwahl auf der
      // Wochenkarte ohne Bild wirkungslos war.
      var cv = coverRGB(r);
      ctx.fillStyle = "rgb(" + cv[0] + "," + cv[1] + "," + cv[2] + ")";
      ctx.fillRect(0, 0, RW, RH);
      ctx.fillStyle = b.muted;
      ctx.font = "40px " + b.body;
      ctx.textAlign = "center";
      ctx.fillText("Noch kein Titelbild gewählt", RW / 2, RH / 2);
      ctx.textAlign = "left";
      textZeichnen();
    }
  }

  function renderReels(main) {
    var r = currentReel();
    main.innerHTML =
      '<div class="page-head"><div><h1>Reel-Studio</h1>' +
      '<p>Video reinziehen, Titelbild aus dem Video vorschlagen lassen, deinen Text drauf, fertig. Du bekommst das Titelbild und den Text separat als durchsichtiges PNG, damit du ihn über das geschnittene Video legen kannst.</p></div>' +
      '<div class="head-actions"><select class="btn" id="rpick"></select>' +
      '<button class="btn primary" id="newreel">Neues Reel</button></div></div><div id="reeled"></div>';

    var pick = main.querySelector("#rpick");
    if (!state.reels.length) { pick.innerHTML = "<option>noch keins</option>"; pick.disabled = true; }
    else {
      state.reels.forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.id; o.textContent = x.name;
        if (r && x.id === r.id) o.selected = true;
        pick.appendChild(o);
      });
      pick.onchange = function () { activeReel = pick.value; reelFrames = []; reelVideo = null; render(); };
    }
    main.querySelector("#newreel").onclick = function () { neuesReel(); reelFrames = []; reelVideo = null; render(); };

    var ed = main.querySelector("#reeled");
    if (!r) { ed.innerHTML = '<div class="panel"><div class="empty">Noch kein Reel. Leg eins an, dann kannst du dein Video reinziehen.</div></div>'; return; }

    ed.innerHTML =
      '<div class="reel-grid">' +
        '<div style="display:flex;flex-direction:column;gap:16px">' +
          '<div class="panel"><h2>Video</h2>' +
            '<label class="dropzone" id="dz"><span id="dztext">Video hierhin ziehen oder tippen</span>' +
            '<input type="file" accept="video/*" id="vfile"></label>' +
            '<div class="note" style="margin-top:10px">Das Video bleibt auf deinem Gerät und wird nirgendwo hochgeladen. Gespeichert wird nur das Titelbild.</div>' +
            '<div id="vinfo"></div>' +
          '</div>' +
          // Die Clip-Ablage: antippen setzt den Clip ans Reel, ✕ wirft ihn raus,
          // unten legst du einen eigenen dazu.
          '<div class="panel"><h2>Clip-Ablage</h2>' +
            '<div class="clipstreifen" id="clipstreifen"></div>' +
            '<div class="note" id="clipnote"></div>' +
          '</div>' +
          '<div class="panel"><h2>Titelbild-Vorschläge</h2><div class="frames" id="frames"></div>' +
            '<div class="note" id="fnote" style="margin-top:10px">Zuerst ein Video wählen. Danach schlage ich die schärfsten und hellsten Standbilder vor, das beste steht links.</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:16px">' +
          '<div class="panel"><h2>Titelbild-Text</h2><div id="rform"></div></div>' +
          '<div class="panel"><h2>Vorschau</h2><div class="reel-preview" id="rprev"></div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px" id="rexport"></div></div>' +
          '<div class="panel"><h2>Skript, Untertitel und Caption</h2><div id="rtext"></div></div>' +
        '</div>' +
      '</div>';

    // ---- Video laden ----
    var dz = ed.querySelector("#dz");
    var vfile = ed.querySelector("#vfile");
    function videoLaden(file) {
      if (!file) return;
      var url = URL.createObjectURL(file);
      var v = document.createElement("video");
      v.preload = "auto"; v.muted = true; v.playsInline = true; v.src = url;
      ed.querySelector("#dztext").textContent = file.name;
      ed.querySelector("#fnote").textContent = "Lade das Video …";
      v.onloadeddata = function () {
        reelVideo = v;
        ed.querySelector("#vinfo").innerHTML =
          '<div class="note" style="margin-top:8px">' + Math.round(v.duration) + " Sekunden, " +
          v.videoWidth + " mal " + v.videoHeight + " Pixel" +
          (v.videoWidth > v.videoHeight ? ". Das ist Querformat, für ein Reel wird links und rechts abgeschnitten." : "") + '</div>';
        ed.querySelector("#fnote").textContent = "Suche die besten Standbilder …";
        frameVorschlaege(v, 12, function (fr) {
          reelFrames = fr.slice(0, 8);
          zeichneFrames();
        });
      };
      v.onerror = function () {
        ed.querySelector("#fnote").textContent = "Dieses Videoformat kann der Browser nicht öffnen. Probier eine mp4-Datei.";
      };
    }
    vfile.onchange = function () { videoLaden(vfile.files && vfile.files[0]); };
    ["dragover", "dragenter"].forEach(function (e) { dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (e) { dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.remove("over"); }); });
    dz.addEventListener("drop", function (ev) {
      if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]) videoLaden(ev.dataTransfer.files[0]);
    });

    /* ---------- Clip-Ablage zeichnen ----------
       Das Vorschaubild kommt aus dem Video selbst: <video preload="metadata">
       zeigt das erste Bild, ohne dass ein zweiter Anhang noetig waere. */
    function zeichneClips() {
      var box = ed.querySelector("#clipstreifen");
      var note = ed.querySelector("#clipnote");
      if (!box) return;
      box.innerHTML = "";

      clips.forEach(function (c) {
        var url = "/_blob/" + c.asset;
        var kachel = document.createElement("div");
        kachel.className = "clipkachel" + (r.videourl === url ? " aktiv" : "");

        var v = document.createElement("video");
        v.src = url; v.muted = true; v.preload = "metadata"; v.playsInline = true;
        v.title = c.name || "Clip";
        v.onclick = function () {
          r.videourl = url;
          r.videodatei = c.name || "clip.mp4";
          saveReel(r);
          toast("Clip gesetzt: " + (c.name || "Clip"));
          render();
        };
        kachel.appendChild(v);

        if (assetsAPI) {
          var weg = document.createElement("button");
          weg.className = "clipweg";
          weg.textContent = "✕";
          weg.title = "Diesen Clip aus der Ablage werfen";
          weg.onclick = function (ev) {
            ev.stopPropagation();
            // 🚨 Loeschen gilt fuer ALLE Ansichten. Also erst nachsehen, ob ein
            // Beitrag darauf zeigt, und das sagen — sonst zeigt eine Wochenkarte
            // danach auf eine Datei, die es nicht mehr gibt.
            var benutzt = state.reels.filter(function (x) { return x.videourl === url; });
            if (benutzt.length) {
              toast("Geht nicht: „" + benutzt[0].name + "“ benutzt diesen Clip. "
                    + "Dort zuerst einen anderen setzen.");
              return;
            }
            weg.disabled = true;
            assetsAPI.delete(c.asset).then(function () {
              clips = clips.filter(function (x) { return x.id !== c.id; });
              clipsSichern();
              toast("Clip aus der Ablage geworfen.");
              render();
            }).catch(function (e) {
              weg.disabled = false;
              toast("Loeschen ging nicht (" + ((e && e.code) || "unbekannt") + ").");
            });
          };
          kachel.appendChild(weg);
        }

        var nm = document.createElement("div");
        nm.className = "clipname";
        nm.textContent = c.name || "Clip";
        kachel.appendChild(nm);
        box.appendChild(kachel);
      });

      if (!assetsAPI) {
        note.textContent = clips.length
          ? "Antippen setzt den Clip ans Reel."
          : "Noch keine Clips in der Ablage.";
        return;
      }

      // Eigenen Clip dazulegen
      var add = document.createElement("label");
      add.className = "clipkachel";
      add.style.cssText = "display:flex;align-items:center;justify-content:center;"
        + "width:92px;height:164px;border:2px dashed var(--linie);border-radius:8px;"
        + "cursor:pointer;text-align:center;font-size:12px;color:var(--ink-soft);"
        + "padding:6px";
      add.innerHTML = "<span>+ eigener<br>Clip</span>";
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = "video/mp4,video/webm"; inp.hidden = true;
      add.appendChild(inp);
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        // 🚨 20 MiB je Datei. Lieber hier sagen als den Fehler von der

  /* Freigabe-Daten eines Reels. */
  function bloR(r) {
    return r.blotato || (r.blotato = { datum: "", zeit: "18:00", profil: "mentoring", status: "" });
  }

  function setupBlotatoReel(box, r) {
    var b = bloR(r);
    var note = box.querySelector("#rblonote");
    var btn = box.querySelector("#rblobtn");
    var zurueck = box.querySelector("#rblozurueck");
    var datum = box.querySelector("#rblodatum");
    var zeit = box.querySelector("#rblozeit");
    var profil = box.querySelector("#rbloprofil");

    function speichern() {
      b.datum = datum.value; b.zeit = zeit.value; b.profil = profil.value;
      saveReel(r);
    }
    datum.onchange = zeit.onchange = profil.onchange = speichern;

    if (!db) {
      note.textContent = "Die Freigabe braucht die Verbindung zur Datenbank. Öffne das Cockpit über den Link.";
      btn.disabled = true;
      return;
    }
    if (!r.videodatei) {
      note.textContent = "Für dieses Reel ist noch keine fertige Videodatei hinterlegt. " +
        "Die trägt Claude ein, sobald das Reel geschnitten und gerendert ist.";
      btn.disabled = true;
      return;
    }
    if (b.status === "wartet") {
      note.textContent = "Freigegeben für " + (b.datum || "kein Datum") + " um " + (b.zeit || "") +
        ". Sag es mir im Chat, dann lade ich Video und Cover hoch und plane den Beitrag ein.";
      btn.textContent = "Cover neu ablegen";
      zurueck.hidden = false;
      zurueck.onclick = function () {
        b.status = ""; saveReel(r);
        db.collection("freigaben").doc(r.id).set({
          name: r.name, typ: "reel", status: "zurueckgezogen",
          updatedAt: new Date().toISOString()
        }).catch(function () {});
        render();
        toast("Freigabe zurückgezogen.");
      };
    } else if (b.status === "geplant") {
      note.textContent = "Eingeplant bei Blotato für " + (b.datum || "") + " um " + (b.zeit || "") + ".";
      btn.disabled = true;
      return;
    } else {
      note.textContent = "Datum und Uhrzeit setzen, dann freigeben. Dabei wird das Titelbild " +
        "als Cover abgelegt — genau so, wie es hier aussieht.";
    }

    btn.onclick = function () {
      if (!datum.value) { datum.focus(); toast("Setz zuerst ein Datum."); return; }
      if (!(r.caption || "").trim()) { toast("Ohne Caption kein Beitrag. Schreib sie oben rein."); return; }
      speichern();
      btn.disabled = true;
      btn.textContent = "lege ab …";

      var wann = new Date(datum.value + "T" + (zeit.value || "18:00"));
      var basis = "freigaben/" + r.id;

      function steuerSchreiben() {
        db.collection("freigaben").doc(r.id).set({
          name: r.name,
          typ: "reel",
          videodatei: r.videodatei,
          caption: r.caption || "",
          profil: profil.value,
          datum: datum.value,
          zeit: zeit.value || "18:00",
          zeitpunktISO: isNaN(wann) ? "" : wann.toISOString(),
          status: "wartet",
          updatedAt: new Date().toISOString()
        }).then(function () {
          b.status = "wartet";
          saveReel(r);
          btn.disabled = false;
          render();
          toast("Freigegeben. Sag mir im Chat Bescheid, dann geht es raus.");
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = "Für Blotato freigeben";
          toast("Das Ablegen hat nicht geklappt.");
        });
      }

      // Das Titelbild wird als Cover mitgegeben, damit im Feed steht, was sie sieht.
      var c = document.createElement("canvas");
      renderReelCanvas(c, r, {});
      setTimeout(function () {
        var q = 0.9, out = c.toDataURL("image/jpeg", q);
        while (out.length > 700000 && q > 0.45) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
        db.doc(basis).collection("bilder").doc("cover").set({ dataUrl: out, nr: 1 })
          .then(steuerSchreiben)
          .catch(function () {
            btn.disabled = false;
            btn.textContent = "Für Blotato freigeben";
            toast("Das Cover liess sich nicht ablegen.");
          });
      }, 320);
    };
  }

  function komprimiereDataUrl(dataUrl, cb) {
    var img = new Image();
    img.onload = function () {
      var maxW = 1080, q = 0.8, out = "";
      for (var a = 0; a < 6; a++) {
        var c = document.createElement("canvas");
        var f = Math.min(1, maxW / img.width);
        c.width = Math.round(img.width * f);
        c.height = Math.round(img.height * f);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 180000) break;
        if (q > 0.5) q -= 0.12; else maxW = Math.round(maxW * 0.75);
      }
      cb(out);
    };
    img.src = dataUrl;
  }
