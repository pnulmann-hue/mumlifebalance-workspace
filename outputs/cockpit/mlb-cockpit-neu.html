
<title>Mum Life Balance Cockpit</title>
<style>
  :root {
    --ground: #f3efe4;
    --surface: #fbf8f1;
    --surface-2: #ebe4d3;
    --ink: #0c1c30;
    --ink-soft: #4d6076;
    --line: rgba(12, 28, 48, 0.14);
    --line-strong: rgba(12, 28, 48, 0.28);
    --teal: #12828c;
    --teal-soft: rgba(18, 130, 140, 0.12);
    --navy: #29556d;
    --orange: #dc822e;
    --orange-soft: rgba(220, 130, 46, 0.16);
    --good: #2f7d5b;
    --warn: #b8791b;
    --crit: #b34733;
    --shadow: 0 1px 2px rgba(12, 28, 48, 0.06), 0 8px 24px rgba(12, 28, 48, 0.07);
    --display: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --body: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1c30;
      --surface: #12283f;
      --surface-2: #1a3450;
      --ink: #f1ecdd;
      --ink-soft: #a8bccb;
      --line: rgba(241, 236, 221, 0.16);
      --line-strong: rgba(241, 236, 221, 0.32);
      --teal: #35a8b2;
      --teal-soft: rgba(53, 168, 178, 0.16);
      --navy: #7fb0c7;
      --orange: #eb9a4f;
      --orange-soft: rgba(235, 154, 79, 0.18);
      --good: #5fb98d;
      --warn: #d9a84b;
      --crit: #e08a76;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1c30;
    --surface: #12283f;
    --surface-2: #1a3450;
    --ink: #f1ecdd;
    --ink-soft: #a8bccb;
    --line: rgba(241, 236, 221, 0.16);
    --line-strong: rgba(241, 236, 221, 0.32);
    --teal: #35a8b2;
    --teal-soft: rgba(53, 168, 178, 0.16);
    --navy: #7fb0c7;
    --orange: #eb9a4f;
    --orange-soft: rgba(235, 154, 79, 0.18);
    --good: #5fb98d;
    --warn: #d9a84b;
    --crit: #e08a76;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .side {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 22px 14px 28px;
    display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  /* ---------- Marke, Kopfbild, Luft (24.09.2026) ---------- */
  .brandmark { padding: 4px 8px 2px; }
  .brandmark .bm-logo { display: block; width: 100%; max-width: 176px; height: auto; }
  .brandmark .bm-sub {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft); margin-top: 8px; padding-left: 2px;
  }
  /* Das Kopfbild traegt die Startseite. Patricia sitzt links im Bild,
     rechts ist Wasser - deshalb steht der Text rechts und das Bild wird
     linksbuendig beschnitten. */
  .hero {
    position: relative; border-radius: 16px; overflow: hidden;
    min-height: 210px; display: flex; align-items: flex-end;
    margin-bottom: 26px; box-shadow: var(--shadow);
    background: var(--surface-2);
  }
  .hero-bild {
    position: absolute; inset: 0;
    background-image: url("assets/s07.jpg");
    background-size: cover; background-position: 46% 27%;
  }
  .hero-schleier {
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(12,28,48,0.00) 0%, rgba(12,28,48,0.10) 34%,
      rgba(12,28,48,0.62) 62%, rgba(12,28,48,0.80) 100%);
  }
  .hero-text { position: relative; padding: 26px 30px; margin-left: auto; max-width: 62%; color: #fff; }
  .hero-gruss { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; margin: 0 0 6px; }
  .hero-text h1 { font-family: var(--display); font-size: 30px; line-height: 1.12; margin: 0 0 8px; color: #fff; }
  .hero-sub { margin: 0; font-size: 14px; line-height: 1.5; opacity: 0.92; max-width: 46ch; }
  @media (max-width: 760px) {
    /* Auf dem Handy stand das Logo 300 px hoch, bevor irgendein Inhalt kam.
       Am Geraet gesehen, nicht am Zahlenwert entschieden. */
    .brandmark .bm-logo { max-width: 104px; }
    .brandmark .bm-sub { display: none; }
    .hero { min-height: 260px; }
    .hero-text { max-width: 100%; padding: 20px; }
    .hero-schleier { background: linear-gradient(180deg,
      rgba(12,28,48,0.05) 0%, rgba(12,28,48,0.30) 40%, rgba(12,28,48,0.84) 100%); }
    .hero-text h1 { font-size: 24px; }
  }
  /* Mehr Luft in der Leiste, damit die Gruppen als Gruppen lesbar sind. */
  /* Aufklappbare Bereiche (24.09.2026). Eine Gruppe offen, Rest zu. */
  .navgroup {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: 0; cursor: pointer; text-align: left;
    font: inherit; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-soft);
    padding: 11px 10px; margin-top: 6px; border-radius: 8px;
  }
  .navgroup:hover { background: var(--surface-2); color: var(--ink); }
  .navgroup[aria-expanded="true"] { color: var(--ink); font-weight: bold; }
  .navgroup .pfeil {
    margin-left: auto; font-size: 10px; line-height: 1;
    transition: transform 0.15s ease; opacity: 0.7;
  }
  .navgroup[aria-expanded="true"] .pfeil { transform: rotate(90deg); }
  .navgroup .gcnt {
    font-size: 10px; font-weight: normal; letter-spacing: 0;
    color: var(--ink-soft); background: var(--surface-2);
    border-radius: 999px; padding: 1px 7px;
  }
  .navgroup[aria-expanded="true"] .gcnt { background: var(--teal-soft); }
  .navbtn { padding-top: 9px; padding-bottom: 9px; }
  .navsub { padding-left: 26px; font-size: 13px; }
  .navsub::before {
    content: ""; position: absolute; left: 14px; top: 50%;
    width: 5px; height: 5px; margin-top: -2px; border-radius: 50%;
    background: var(--line-strong);
  }
  .navbtn { position: relative; }
  /* Die grossen Zahlen auf der Startseite duerfen atmen. */
  .hero + .tiles .t-num { font-size: 30px; }
  .jetzt { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); margin-bottom: 24px; }
  .jetzt .karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .jetzt .karte h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .jetzt .zeile { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .jetzt .zeile:last-child { border-bottom: 0; }
  /* Anklickbare Zeilen muessen auch danach aussehen. */
  .jetzt .zeile.klick { cursor: pointer; margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
  .jetzt .zeile.klick:hover { background: var(--teal-soft); }
  .jetzt .zeile.klick:hover span { color: var(--ink); }
  /* Abgehakt statt ausgeblendet - ein verschwundener Beitrag laesst den
     Platz leer aussehen, und dann baut man denselben Tag nochmal. */
  /* Aufgabenliste zugeklappt (24.09.2026). */
  .tuklapp > summary {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    list-style: none; padding: 2px 0;
  }
  .tuklapp > summary::-webkit-details-marker { display: none; }
  .tuklapp > summary::before {
    content: "\25b6"; font-size: 10px; color: var(--ink-soft);
    transition: transform 0.15s ease;
  }
  .tuklapp[open] > summary::before { transform: rotate(90deg); }
  .tuklapp .tu-titel {
    font-family: var(--display); font-size: 17px; color: var(--ink);
  }
  .tuklapp .tu-zahl {
    font-size: 12px; border-radius: 999px; padding: 2px 9px;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .tuklapp .tu-zahl.du { background: var(--warn-soft, #fbe7d8); color: #8a4b1c; }
  .tuklapp[open] > summary { margin-bottom: 10px; }
  .idee-karte { margin-bottom: 14px; }
  .idee-kopf { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .idee-quelle { font-size: 12px; color: var(--ink-soft); }
  .idee-kopf .btn.ghost { margin-left: auto; }
  .idee-hook { font-family: var(--display); font-size: 17px; line-height: 1.35; margin: 0 0 10px; }
  .idee-mehr > summary { cursor: pointer; font-size: 13px; color: var(--ink-soft); }
  .idee-fuss { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
               margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .idee-stand { color: var(--good); }
  .uehook.klickbar { cursor: pointer; }
  .uehook.klickbar:hover { text-decoration: underline; color: var(--teal); }
  .uezeile .uedat { font-size: 12px; padding: 2px 4px; }
  .wslot.durch { opacity: 0.62; }
  .wslot.durch .wkarte { border-style: dashed; }
  .wslot.durch::after {
    content: "\2713 ist raus";
    display: block; margin-top: 8px; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--good);
  }
  .jetzt .zeile .wann { font-size: 12px; color: var(--ink-soft); min-width: 52px; font-variant-numeric: tabular-nums; }
  .jetzt .leer { color: var(--ink-soft); font-size: 13px; }
  .brandmark .bm-name { font-family: var(--display); font-size: 20px; line-height: 1.15; letter-spacing: -0.01em; }
  .brandmark .bm-sub { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  .navbtn {
    display: flex; align-items: center; gap: 10px;
    background: none; border: 0; text-align: left;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    color: var(--ink-soft); font-size: 14px;
  }
  .navbtn:hover { background: var(--surface-2); color: var(--ink); }
  .navbtn[aria-current="true"] { background: var(--teal-soft); color: var(--ink); font-weight: bold; box-shadow: inset 3px 0 0 var(--teal); }
  .navbtn .cnt { margin-left: auto; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .side-foot { margin-top: auto; font-size: 11px; color: var(--ink-soft); padding: 0 8px; line-height: 1.45; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--good); }
  .dot.off { background: var(--warn); }

  main { padding: 26px 28px 70px; min-width: 0; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head h1 { font-family: var(--display); font-size: 26px; margin: 0; font-weight: normal; letter-spacing: -0.01em; text-wrap: balance; }
  .page-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13px; max-width: 62ch; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    border: 1px solid var(--line-strong); background: var(--surface);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); padding: 6px 8px; }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  /* Ein Link, der als Knopf auftritt: ohne das ist er unterstrichen
     und sitzt als Inline-Element schief in der Fusszeile. */
  a.btn { display: inline-block; text-decoration: none; line-height: normal; }

  /* ---------- overview ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
  .tile .t-lab { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
  .tile .t-num { font-family: var(--display); font-size: 30px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .t-note { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .panel h2 { font-family: var(--display); font-size: 17px; margin: 0 0 12px; font-weight: normal; }
  .mini { display: flex; flex-direction: column; }
  .mini-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .mini-row:first-child { border-top: 0; }
  .mini-row .m-date { font-size: 12px; color: var(--ink-soft); min-width: 74px; font-variant-numeric: tabular-nums; }
  .mini-row .m-main { flex: 1; min-width: 0; }
  .empty { color: var(--ink-soft); font-size: 13px; font-style: italic; padding: 8px 0; }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .trow { display: grid; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--line); min-width: max-content; }
  .trow.head { border-top: 0; background: var(--surface-2); position: sticky; top: 0; }
  .trow.head span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .trow input, .trow select, .trow textarea {
    width: 100%; background: transparent; border: 1px solid transparent;
    border-radius: 6px; padding: 5px 7px; font-size: 13px;
  }
  /* Ein Auswahlfeld muss man sehen, bevor man mit der Maus draufkommt:
     eigener Grund, eigener Rand, eigenes Pfeilchen. */
  .trow select {
    -webkit-appearance: none; appearance: none;
    background-color: var(--surface-2);
    border-color: var(--line);
    padding-right: 22px; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%234d6076' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 7px center;
  }
  .trow select:hover { border-color: var(--line-strong); }
  .trow select:focus { outline: 2px solid var(--teal-soft); border-color: var(--teal); }
  .trow input:hover, .trow select:hover, .trow textarea:hover { border-color: var(--line); }
  .trow input:focus, .trow select:focus, .trow textarea:focus { border-color: var(--teal); background: var(--ground); outline: none; }
  .trow .del { border: 0; background: none; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 15px; line-height: 1; }
  .trow .del:hover { background: var(--orange-soft); color: var(--crit); }
  select.pill { border-radius: 999px !important; border: 1px solid var(--line-strong) !important; font-size: 12px !important; padding: 4px 8px !important; }
  select.pill[data-tone="go"] { background: rgba(47,125,91,0.14); color: var(--good); border-color: transparent !important; }
  select.pill[data-tone="mid"] { background: var(--orange-soft); color: var(--warn); border-color: transparent !important; }
  select.pill[data-tone="new"] { background: var(--teal-soft); color: var(--teal); border-color: transparent !important; }
  select.pill[data-tone="aus"] { background: var(--surface-2); color: var(--ink-soft); border-color: transparent !important; opacity: 0.75; }
  .tablefoot { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }

  /* ---------- carousel editor ---------- */
  .editbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    background: var(--ground); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 13px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none; }
  .slidestrip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .slidecard { flex: 0 0 268px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
  .slidecard.dragging { opacity: 0.5; }
  .sc-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .sc-head .sc-num { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
  .sc-head .sc-tools { margin-left: auto; display: flex; gap: 2px; }
  .sc-canvas { display: block; width: 100%; height: auto; background: #0c1c30; cursor: grab; }
  .sc-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .sc-body textarea { resize: vertical; min-height: 42px; }
  .sliderow { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center; }
  .sliderow span { font-size: 11px; color: var(--ink-soft); }
  input[type="range"] { accent-color: var(--teal); width: 100%; }
  .filebtn { position: relative; overflow: hidden; display: inline-flex; }
  .filebtn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .addslide {
    flex: 0 0 120px; align-self: stretch; min-height: 340px;
    border: 1px dashed var(--line-strong); border-radius: var(--r); background: transparent;
    color: var(--ink-soft); cursor: pointer; font-size: 13px;
  }
  .addslide:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
  .captionbox { margin-top: 18px; }
  .captionbox textarea { width: 100%; min-height: 190px; resize: vertical; font-family: var(--body); }
  .cap-meta { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-soft); margin-top: 8px; flex-wrap: wrap; }
  .hooklist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .hookopt { text-align: left; border: 1px solid var(--line); background: var(--ground); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .hookopt:hover { border-color: var(--teal); }
  .note { font-size: 12px; color: var(--ink-soft); }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; box-shadow: var(--shadow); z-index: 50;
  }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); letter-spacing: 0.04em; }
  .chip.orange { background: var(--orange-soft); color: var(--orange); }

  .navgroup { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); padding: 14px 10px 4px; opacity: 0.8; }
  .studio-grid { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .studio-grid { grid-template-columns: 1fr; } }
  .studio-form { display: flex; flex-direction: column; gap: 12px; }
  .studio-form textarea { min-height: 92px; resize: vertical; }
  .result-block { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .result-block:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .result-block h3 { font-family: var(--display); font-size: 15px; margin: 0 0 8px; font-weight: normal; }
  .slidepreviewlist { display: flex; flex-direction: column; gap: 8px; }
  .sp { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--ground); font-size: 13px; }
  .sp b { display: block; font-family: var(--display); font-size: 14px; margin-bottom: 3px; }
  .sp .sp-lay { float: right; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .thinking { display: inline-block; color: var(--ink-soft); font-size: 13px; }
  .storystrip { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
  .storycard { flex: 0 0 210px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
  .storycard canvas { display: block; width: 100%; height: auto; background: #0c1c30; cursor: grab; }
  .dropzone { display: block; border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 30px 20px; text-align: center; color: var(--ink-soft); background: var(--surface); cursor: pointer; position: relative; }
  .dropzone:hover, .dropzone.over { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .reel-grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .reel-grid { grid-template-columns: 1fr; } }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .frames button { border: 2px solid transparent; border-radius: 8px; padding: 0; background: none; cursor: pointer; overflow: hidden; line-height: 0; position: relative; }
  .frames button img { width: 100%; display: block; border-radius: 6px; }
  .frames button[aria-pressed="true"] { border-color: var(--teal); }
  .frames button .fscore { position: absolute; left: 4px; bottom: 4px; font-size: 9px; letter-spacing: 0.06em; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 5px; border-radius: 99px; line-height: 1.5; }
  .reel-preview { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .reel-preview canvas { width: 264px; height: auto; border-radius: 10px; background: #0c1c30; box-shadow: var(--shadow); }
  .wissen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .wissen-grid textarea { width: 100%; min-height: 120px; resize: vertical; background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  .wissen-grid textarea:focus { border-color: var(--teal); outline: none; }

  /* ---------- Funnel-Ketten ---------- */
  .chain { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
  .chain-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .chain-top .c-name { font-family: var(--display); font-size: 16px; }
  .chain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; }
  .chain-step { display: flex; flex-direction: column; gap: 4px; position: relative; }
  .chain-step > label { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
  .chain-step input { background: var(--ground); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 13px; }
  .chain-step input:focus { border-color: var(--teal); outline: none; }
  .chain-step.gap input { border-color: var(--crit); background: rgba(179, 71, 51, 0.07); }
  .chain-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; flex-wrap: wrap; }
  .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .flag.ok { background: rgba(47,125,91,0.14); color: var(--good); }
  .flag.bad { background: rgba(179,71,51,0.14); color: var(--crit); }

  /* ---------- Launch-Zeitachse ---------- */
  .timeline { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 10px; margin-bottom: 18px; overflow-x: auto; }
  .tl-track { position: relative; min-width: 720px; }
  .tl-months { display: grid; grid-template-columns: repeat(12, 1fr); font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }
  .tl-months span { border-left: 1px solid var(--line); padding: 0 0 6px 6px; }
  .tl-rows { position: relative; }
  .tl-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); pointer-events: none; }
  .tl-grid i { border-left: 1px solid var(--line); }
  .tl-row { position: relative; height: 34px; }
  .tl-bar { position: absolute; top: 6px; height: 22px; border-radius: 6px; background: var(--teal); color: #fff; font-size: 12px; line-height: 22px; padding: 0 9px; white-space: nowrap; overflow: hidden; }
  .tl-bar.past { background: var(--navy); }
  .tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--orange); }

  /* ---------- Balken ---------- */
  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row .bar-lab { display: flex; justify-content: space-between; font-size: 13px; gap: 10px; }
  .bar-row .bar-lab b { font-variant-numeric: tabular-nums; font-weight: normal; color: var(--ink-soft); }
  .bar-track { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); margin-top: 5px; }
  .bar-fill { height: 100%; border-radius: 99px; background: var(--teal); }
  .bar-soll { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--orange); }
  .columns { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 10px; }
  .col-item { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
  .col-bar { width: 100%; max-width: 46px; border-radius: 4px 4px 0 0; background: var(--teal); min-height: 2px; }
  .col-cap { font-size: 11px; color: var(--ink-soft); }
  .goalline { position: relative; }
  .goalline .gl { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--orange); }
  .goalline .gl span { position: absolute; right: 0; top: -18px; font-size: 11px; color: var(--orange); background: var(--surface); padding: 0 4px; }

  /* ---------- Tagesplan ---------- */
  .tp-kw { font-family: var(--display); font-size: 15px; align-self: center;
           font-variant-numeric: tabular-nums; }
  .tp-bilanzen { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .tp-bilanz {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--orange);
    border-radius: var(--r); padding: 9px 14px; font-size: 13px;
  }
  .tp-bilanz.ok { border-left-color: var(--good); }
  .tp-bilanz b { font-weight: 600; }
  .tp-bilanz span { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tp-bilanz .tp-haken { color: var(--good); }

  .tp-tag { margin-bottom: 18px; }
  .tp-tagkopf { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .tp-tagname { font-family: var(--display); font-size: 18px; }
  .tp-tagdatum { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tp-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .tp-slots { grid-template-columns: 1fr; } }
  .tp-slot {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow);
  }
  .tp-slot.leer { box-shadow: none; background: transparent;
                  border-style: dashed; }
  .tp-slotkopf {
    font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 8px;
  }
  .tp-karte { display: grid; grid-template-columns: 54px 1fr; gap: 11px; align-items: start; }
  .tp-karte.tp-frei {
    display: block; color: var(--ink-soft); font-style: italic; font-size: 13px;
    padding: 6px 0 2px;
  }
  .tp-mini { width: 54px; border-radius: 6px; display: block; background: var(--surface-2); }
  .tp-minileer { aspect-ratio: 9/16; border: 1px dashed var(--line-strong); }
  .tp-text { min-width: 0; }
  .tp-format {
    display: inline-block; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--teal); background: var(--teal-soft);
    padding: 1px 8px; border-radius: 999px;
  }
  .tp-hook { font-family: var(--display); font-size: 15px; line-height: 1.3; margin: 4px 0 3px; }
  .tp-stand { font-size: 12px; }
  .tp-stand.gut { color: var(--good); }
  .tp-stand.warn { color: var(--orange); }
  .tp-stand.info { color: var(--teal); }
  .tp-knoepfe { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 9px; }
  .tp-knoepfe .btn { font-size: 12px; padding: 5px 9px; }
  .tp-anz {
    font-size: 10px; background: var(--surface-2); color: var(--ink-soft);
    border-radius: 999px; padding: 0 6px; margin-left: 2px;
  }
  .tp-alts {
    margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px;
    display: flex; flex-direction: column; gap: 4px;
    max-height: 290px; overflow-y: auto;
  }
  .tp-alt {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    text-align: left; background: var(--ground); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .tp-alt:hover { border-color: var(--teal); }
  .tp-althook { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-hinweis { font-size: 11px; color: var(--orange); white-space: nowrap; }
  .tp-keine { font-size: 12px; color: var(--ink-soft); font-style: italic; padding: 4px 0; }

  /* ---------- Wochenraster: Platz je Tag und Profil ---------- */
  .wt-kopf .wt-soll {
    font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-soft); background: var(--surface-2);
    padding: 2px 9px; border-radius: 999px;
  }
  .wslot { margin-bottom: 6px; }
  .wslot-kopf {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding: 4px 2px 7px;
  }
  .wslot-profil {
    font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .wslot-job, .tp-job {
    font-size: 10px; letter-spacing: 0.04em; padding: 2px 9px;
    border-radius: 999px; white-space: nowrap;
  }
  .wslot-job.lead, .tp-job.lead { background: var(--teal-soft); color: var(--teal); }
  .wslot-job.reichweite, .tp-job.reichweite { background: var(--orange-soft); color: var(--orange); }
  .wslot-warn { font-size: 12px; color: var(--orange); }
  .wslot-kopf .btn { margin-left: auto; font-size: 12px; padding: 5px 10px; }
  .wslot-leer {
    border: 1px dashed var(--line-strong); border-radius: var(--r);
    padding: 18px 16px; color: var(--ink-soft); font-style: italic;
    font-size: 13px; margin-bottom: 12px;
  }
  .wbilanz-note { margin: -12px 0 18px; }
  .tp-bilanz span.ok { color: var(--good); }
  .tp-bilanz { flex-direction: column; align-items: flex-start; gap: 2px; }
  .tp-bilanz b { margin-bottom: 2px; }

  /* Die zwei Uebersichten am Schluss der Wochen-Vorschau */
  .uebersicht { margin-top: 24px; }
  .uezeile {
    display: grid; grid-template-columns: 104px 74px 76px 86px 1fr 150px;
    gap: 10px; padding: 6px 0; border-top: 1px solid var(--line);
    font-size: 13px; align-items: center;
  }
  .uezeile.idee { grid-template-columns: 74px 76px 86px 1fr 142px; }
  .uezeile.neu { border-top-color: var(--line-strong); }
  .uedatum { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .uepro { font-size: 11px; color: var(--ink-soft); }
  .uehook { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uedat {
    background: var(--ground); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 7px; font-size: 12px; width: 100%;
  }
  .uedat:focus { border-color: var(--teal); outline: none; }
  @media (max-width: 860px) {
    .uezeile, .uezeile.idee { grid-template-columns: 1fr auto; }
    .uehook { grid-column: 1 / -1; white-space: normal; }
  }

  /* Anderes Datum und Loeschen auf der Karte */
  .wk-umplanbox { display: inline-flex; gap: 6px; align-items: center; }
  .wk-umplanbox input[type="date"] {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; font-size: 12px;
  }
  .wk-loeschen.scharf {
    background: var(--crit); border-color: var(--crit); color: #fbf8f1;
  }
  .wk-loeschen.scharf:hover { color: #fbf8f1; filter: brightness(1.08); }

  /* ---------- Wochen-Vorschau ---------- */
  .wochentag { margin-bottom: 22px; }
  .wt-kopf { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .wt-kopf .wt-name { font-family: var(--display); font-size: 18px; }
  .wt-kopf .wt-datum { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .wkarte {
    display: grid; grid-template-columns: 190px 1fr; gap: 18px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
    border-left: 3px solid var(--orange);
  }
  .wkarte.frei { border-left-color: var(--good); }
  @media (max-width: 760px) { .wkarte { grid-template-columns: 1fr; } }
  .wkarte .wk-bild { width: 100%; border-radius: 8px; display: block; background: var(--surface-2); }
  .wkarte .wk-leer {
    aspect-ratio: 9/16; border: 1px dashed var(--line-strong); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--ink-soft); font-size: 12px; padding: 10px;
  }
  .wk-haupt { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .wk-zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .wk-hook { font-family: var(--display); font-size: 17px; line-height: 1.3; }
  .wk-unter { font-size: 13px; color: var(--ink-soft); }
  /* Die Auftragszeile an Claude. Sitzt ueber der Fusszeile und nicht darin,
     weil die Fusszeile ihre Knoepfe ueber den Index anspricht — ein
     zusaetzliches Feld darin wuerde Datum, Kopieren und Freigeben
     durcheinanderbringen. */
  /* Clip-Ablage im Reel-Studio — gebaut wie der Foto-Streifen im
     Bild-Editor: Miniaturen in einer Reihe, antippen waehlt aus. */
  .clipstreifen { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; }
  .clipkachel { position: relative; flex: 0 0 auto; width: 92px; }
  .clipkachel video { width: 92px; height: 164px; object-fit: cover; border-radius: 8px; border: 3px solid transparent; cursor: pointer; background: #0c1c30; display: block; }
  .clipkachel.aktiv video { border-color: var(--petrol); }
  .clipkachel .clipname { font-size: 11px; color: var(--ink-soft); margin-top: 3px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clipweg { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(12,28,48,0.72); color: #fff; font-size: 13px; line-height: 22px; padding: 0; }
  .clipweg:hover { background: #c0392b; }

  .wk-auftrag { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; flex-wrap: wrap; }
  .wk-auftrag input { flex: 1 1 260px; min-width: 0; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 8px; font: inherit; font-size: 14px; background: #fff; }
  .wk-auftrag input:focus { outline: 2px solid var(--petrol); outline-offset: -1px; }
  .wk-warte { border-left: 3px solid var(--orange); background: #fdf3e8; padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13px; margin: 6px 0; }
  .wk-erledigt { border-left: 3px solid var(--petrol); background: #eaf4f5; padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13px; margin: 6px 0; }
  /* Seit 18.09.2026 ein Textfeld statt eines <pre>. Die Caption wird auf
     dieser Karte geprueft und auf dieser Karte freigegeben — also gehoert sie
     hier auch aenderbar. Die Hashtags stehen in einer eigenen Zeile darunter,
     damit der Text oben lesbar bleibt. */
  .wk-caption {
    display: block; width: 100%; font-family: var(--body); font-size: 13px;
    line-height: 1.6; background: var(--ground); color: inherit;
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px;
    min-height: 170px; resize: vertical; margin: 0;
  }
  .wk-caption:focus { border-color: var(--teal); outline: none; }
  .wk-tagsfeld {
    display: block; width: 100%; font-family: var(--body); font-size: 12px;
    color: var(--teal); background: var(--ground); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px;
  }
  .wk-tagsfeld:focus { border-color: var(--teal); outline: none; }

  /* Abgelehntes bleibt sichtbar, aber klein und unten. */
  .abliste { margin-top: 26px; opacity: 0.8; }
  .abliste h2 { font-family: var(--display); font-size: 16px; margin: 0 0 4px;
                font-weight: normal; color: var(--ink-soft); }
  .abzeile2 {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px;
    align-items: center;
  }
  .abzeile2:first-of-type { border-top: 0; }
  .abzeile2 .btn { font-size: 11.5px; padding: 4px 10px; }

  /* Cover direkt auf der Karte — dieselbe Zeichnung wie im Reel-Studio,
     nur mit Bedienung daneben. */
  .wk-cover { margin: 2px 0; }
  .wk-cover > summary {
    cursor: pointer; font-size: 13px; color: var(--teal); font-weight: 600;
    padding: 6px 0;
  }
  .wk-coverbox {
    display: grid; grid-template-columns: 190px 1fr; gap: 14px;
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; margin-top: 6px;
  }
  @media (max-width: 720px) { .wk-coverbox { grid-template-columns: 1fr; } }
  .wk-covercv {
    width: 100%; height: auto; border-radius: 8px; background: #0c1c30;
    border: 1px solid var(--line); display: block;
  }
  .wk-coversteuer { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .wk-coversteuer label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft); margin-top: 6px;
  }
  .wk-coversteuer textarea, .wk-coversteuer input[type="text"] {
    width: 100%; font: inherit; font-size: 13px; line-height: 1.4;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; resize: vertical;
  }
  .wk-coversteuer textarea:focus, .wk-coversteuer input[type="text"]:focus {
    border-color: var(--teal); outline: none;
  }
  .wk-fotos { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; }
  .wk-fotos img {
    flex: 0 0 auto; width: 46px; height: 82px; object-fit: cover;
    border-radius: 6px; cursor: pointer; border: 3px solid transparent;
  }
  .wk-fotos img.sel { border-color: var(--teal); }
  .wk-chk { display: flex; align-items: center; gap: 7px; font-size: 13px;
            text-transform: none; letter-spacing: 0; color: var(--ink); }
  .wk-coverknoepfe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .wk-coverknoepfe .btn { font-size: 12px; padding: 6px 12px; }

  /* Was an einem Beitrag noch fehlt. Steht auf der Karte selbst — ein Hinweis
     in einer Liste woanders wird nicht gelesen. Rot heisst: du bist dran.
     Petrol heisst: das mache ich. */
  .wk-fehlt {
    border-left: 3px solid var(--crit); background: rgba(179, 71, 51, 0.09);
    padding: 9px 12px; border-radius: 0 8px 8px 0; font-size: 13px; margin: 2px 0;
  }
  .wk-fehlt.meins { border-left-color: var(--teal); background: var(--teal-soft); }
  .wk-fehlt b { display: block; margin-bottom: 2px; }
  .wk-sprech { margin-top: 8px; }
  .wk-sprech summary { cursor: pointer; font-size: 13px; color: var(--teal); }
  .wk-sprechtext {
    margin: 8px 0 0; padding: 11px 13px; background: var(--ground);
    border: 1px solid var(--line); border-radius: 8px; font: inherit;
    font-size: 13px; line-height: 1.62; white-space: pre-wrap;
    max-height: 300px; overflow-y: auto;
  }
  .wk-hochladen { margin-top: 8px; font-size: 12px; padding: 6px 12px; }

  /* Der Aufgaben-Block oben in der Wochen-Vorschau. */
  .tuliste { margin-bottom: 18px; }
  .tuzeile {
    display: grid; grid-template-columns: 96px 1fr auto; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px;
    align-items: baseline;
  }
  .tuzeile:first-of-type { border-top: 0; }
  .tudatum { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tuwas { min-width: 0; }
  .tuwas span { color: var(--ink-soft); }
  .tuwer {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  }
  .tuwer.du { background: var(--orange-soft); color: var(--orange); }
  .tuwer.ich { background: var(--teal-soft); color: var(--teal); }
  @media (max-width: 640px) { .tuzeile { grid-template-columns: 1fr auto; }
    .tudatum { grid-column: 1 / -1; } }
  .wk-tags { font-size: 12px; color: var(--teal); word-break: break-word; }
  .wk-fuss { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* Die Ausnahme-Aktionen hinter einem Punkt-Knopf (24.09.2026). */
  .wk-mehr { position: relative; margin-left: auto; }
  .wk-mehr > summary {
    list-style: none; cursor: pointer; user-select: none;

  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 1200, q = 0.78, out = "";
        for (var attempt = 0; attempt < 6; attempt++) {
          var scale = Math.min(1, maxW / img.width);
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", q);
          if (out.length < 180000) break;
          if (q > 0.5) { q -= 0.12; } else { maxW = Math.round(maxW * 0.75); }
        }
        cb(out);
      };
      img.onerror = function () { toast("Das Bild konnte nicht gelesen werden."); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function getImageObj(slideId, cb) {
    if (!images[slideId]) { cb(null); return; }
    if (imageObjs[slideId] && imageObjs[slideId].__src === images[slideId]) { cb(imageObjs[slideId]); return; }
    var im = new Image();
    im.onload = function () { im.__src = images[slideId]; imageObjs[slideId] = im; cb(im); };
    im.onerror = function () { cb(null); };
    im.src = images[slideId];
  }

  var W = 1080, H = 1350;

  function wrap(ctx, text, maxW) {
    var out = [];
    String(text || "").split("\n").forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean);
      if (!words.length) { out.push(""); return; }
      var line = words[0];
      for (var i = 1; i < words.length; i++) {
        var test = line + " " + words[i];
        if (ctx.measureText(test).width > maxW) { out.push(line); line = words[i]; }
        else { line = test; }
      }
      out.push(line);
    });
    return out;
  }

  function fitLines(ctx, text, maxW, maxH, family, weight, start, min, lh) {
    var size = start;
    while (size > min) {
      ctx.font = weight + " " + size + "px " + family;
      var lines = wrap(ctx, text, maxW);
      if (lines.length * size * lh <= maxH) return { size: size, lines: lines };
      size -= 4;
    }
    ctx.font = weight + " " + min + "px " + family;
    return { size: min, lines: wrap(ctx, text, maxW) };
  }

  function drawCover(ctx, img, x, y, w, h, zoom, ox, oy) {
    var base = Math.max(w / img.width, h / img.height) * (zoom || 1);
    var dw = img.width * base, dh = img.height * base;
    var dx = x + (w - dw) / 2 + (ox || 0) / 100 * w;
    var dy = y + (h - dh) / 2 + (oy || 0) / 100 * h;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function renderSlide(canvas, slide, car, index, total) {
    var b = BRANDS[car.brand] || BRANDS.mlb_dark;
    var ctx = canvas.getContext("2d");
    canvas.width = W; canvas.height = H;
    var pad = 88;

    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, W, H);
    try { ctx.letterSpacing = "0px"; } catch (e) {}

    getImageObj(slide.id, function (img) {
      // Bildflächen
      if (img && (slide.layout === "bild" || slide.layout === "split")) {
        if (slide.layout === "bild") {
          drawCover(ctx, img, 0, 0, W, H, slide.zoom, slide.ox, slide.oy);
          var g = ctx.createLinearGradient(0, H * 0.28, 0, H);
          g.addColorStop(0, "rgba(0,0,0,0)");
          g.addColorStop(1, b.bg);
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        } else {
          drawCover(ctx, img, 0, 0, W, Math.round(H * 0.52), slide.zoom, slide.ox, slide.oy);
        }
      } else if (slide.layout === "bild" || slide.layout === "split") {
        ctx.fillStyle = b.bg2;
        ctx.fillRect(0, 0, W, slide.layout === "bild" ? H : Math.round(H * 0.52));
        ctx.fillStyle = b.muted;
        ctx.font = "34px " + b.body;
        ctx.textAlign = "center";
        ctx.fillText("Bild hier hochladen", W / 2, slide.layout === "bild" ? H / 2 : Math.round(H * 0.26));
        ctx.textAlign = "left";
      }

      // Kopfzeile mit Handle
      if (b.handle || car.handle) {
        var hd = car.handle || b.handle;
        ctx.fillStyle = b.accent2;
        ctx.beginPath(); ctx.arc(pad + 26, pad + 6, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = b.text;
        ctx.font = "26px " + b.body;
        ctx.textBaseline = "middle";
        ctx.fillText(hd, pad + 66, pad + 8);
        ctx.textBaseline = "alphabetic";
      }

      var maxW = W - pad * 2;
      var headTop, bodyTop;

      if (slide.layout === "hook" || slide.layout === "zitat") {
        var isZitat = slide.layout === "zitat";
        var fam = isZitat ? b.display : b.display;
        var h = fitLines(ctx, isZitat ? slide.headline : String(slide.headline || "").toUpperCase(),
                         maxW, H * 0.5, fam, "bold", isZitat ? 76 : 92, 40, 1.16);
        ctx.font = "bold " + h.size + "px " + fam;
        ctx.fillStyle = b.text;
        var totalH = h.lines.length * h.size * 1.16;
        var y = (H - totalH) / 2 + h.size * 0.9;
        h.lines.forEach(function (ln, i) {
          if (isZitat) { ctx.textAlign = "center"; ctx.fillText(ln, W / 2, y + i * h.size * 1.16); ctx.textAlign = "left"; }
          else { ctx.fillText(ln, pad, y + i * h.size * 1.16); }
        });
        if (!isZitat) {
          ctx.fillStyle = b.accent;
          ctx.fillRect(pad, y + totalH + 24, 140, 8);
        }
        if (slide.body) {
          ctx.fillStyle = b.muted;
          ctx.font = "30px " + b.body;
          var bl = wrap(ctx, slide.body, maxW);
          bl.slice(0, 4).forEach(function (ln, i) {
            ctx.fillText(ln, isZitat ? pad : pad, y + totalH + 78 + i * 42);
          });
        }
      } else if (slide.layout === "text") {
        headTop = pad + 130;
        var ht = fitLines(ctx, slide.headline, maxW, 260, b.display, "bold", 64, 34, 1.15);
        ctx.font = "bold " + ht.size + "px " + b.display;
        ctx.fillStyle = b.accent;
        ht.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, headTop + ht.size + i * ht.size * 1.15); });
        bodyTop = headTop + ht.lines.length * ht.size * 1.15 + 70;
        var bt = fitLines(ctx, slide.body, maxW, H - bodyTop - pad - 60, b.body, "", 40, 26, 1.42);
        ctx.font = bt.size + "px " + b.body;
        ctx.fillStyle = b.text;
        bt.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, bodyTop + bt.size + i * bt.size * 1.42); });
      } else if (slide.layout === "split") {
        headTop = Math.round(H * 0.52) + 70;
        var hs = fitLines(ctx, slide.headline, maxW, 200, b.display, "bold", 58, 32, 1.15);
        ctx.font = "bold " + hs.size + "px " + b.display;
        ctx.fillStyle = b.accent;
        hs.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, headTop + hs.size + i * hs.size * 1.15); });
        var bs0 = headTop + hs.lines.length * hs.size * 1.15 + 46;
        var bs = fitLines(ctx, slide.body, maxW, H - bs0 - pad - 40, b.body, "", 36, 24, 1.42);
        ctx.font = bs.size + "px " + b.body;
        ctx.fillStyle = b.text;
        bs.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, bs0 + bs.size + i * bs.size * 1.42); });
      } else if (slide.layout === "bild") {
        var hb = fitLines(ctx, String(slide.headline || "").toUpperCase(), maxW, 340, b.display, "bold", 76, 38, 1.14);
        ctx.font = "bold " + hb.size + "px " + b.display;
        ctx.fillStyle = b.text;
        var bh = hb.lines.length * hb.size * 1.14;
        var by = H - pad - 60 - bh + hb.size * 0.9;
        hb.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, by + i * hb.size * 1.14); });
      } else if (slide.layout === "cta") {
        var hc = fitLines(ctx, slide.headline, maxW, 320, b.display, "bold", 72, 36, 1.15);
        var startY = H * 0.32;
        ctx.font = "bold " + hc.size + "px " + b.display;
        ctx.fillStyle = b.text;
        hc.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, startY + hc.size + i * hc.size * 1.15); });
        var cy = startY + hc.lines.length * hc.size * 1.15 + 60;
        var bc = fitLines(ctx, slide.body, maxW, 260, b.body, "", 38, 26, 1.42);
        ctx.font = bc.size + "px " + b.body;
        ctx.fillStyle = b.muted;
        bc.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, cy + bc.size + i * bc.size * 1.42); });
        if (slide.keyword) {
          var ky = cy + bc.lines.length * bc.size * 1.42 + 70;
          ctx.font = "bold 44px " + b.body;
          var kw = ctx.measureText(slide.keyword.toUpperCase()).width;
          ctx.fillStyle = b.accent;
          var rx = pad, rw = kw + 76, rh = 96;
          ctx.beginPath();
          if (ctx.roundRect) { ctx.roundRect(rx, ky, rw, rh, 48); } else { ctx.rect(rx, ky, rw, rh); }
          ctx.fill();
          ctx.fillStyle = b.bg;
          ctx.fillText(slide.keyword.toUpperCase(), rx + 38, ky + 62);
        }
      }

      // Fusszeile: Slide-Zähler und Wischhinweis
      ctx.fillStyle = b.muted;
      ctx.font = "26px " + b.body;
      ctx.fillText(index + 1 + " / " + total, pad, H - pad + 10);
      if (index < total - 1) {
        ctx.textAlign = "right";
        ctx.fillText("weiter wischen  ›", W - pad, H - pad + 10);
        ctx.textAlign = "left";
      }
    });
  }

  /* Was in den Arbeitsansichten auftaucht. Abgelehntes nie. */
  function offeneBeitraege() {
    return alleBeitraege().filter(function (b) { return !istAbgelehnt(b); });
  }

  /* Abgelehnt heisst: aus allen Arbeitsansichten raus, aber nicht geloescht.
     Das Feld bleibt am Beitrag, und „Zurueckholen" macht es rueckgaengig. */
  function istAbgelehnt(b) { return !!(b.obj || b).abgelehnt; }

  /* 🚨 Ist der Beitrag durch? Bis 24.09.2026 wurde das nirgends gefragt —
     ein geposteter Beitrag stand weiter als offener Platz in der Woche.
     „selber-posten" zaehlt dazu: bei einem B-Roll postet Patricia selbst,
     das Cockpit erfaehrt es nie, und wartend stehenbleiben waere falscher
     als abgehakt. */
  var DRAUSSEN = ["geplant", "gepostet-von-hand", "selber-posten"];

  /* 🚨 Die Wahrheit steht in der Sammlung „freigaben", nicht am Beitrag.
     Dort schreibt der Einplan-Task hinein; `beitrag.blotato` aktualisiert
     niemand. Siehe Kopf von patch-freigaben-lesen.py. */
  var freigaben = {};

  /* 🚨 Welcher Beitrag ist als Instagram-Post wiedergefunden worden?
     Gebaut von gepostet-zuordnen.py ueber den Caption-Anfang. Ohne das weiss
     das Cockpit nicht, dass Beitrag X und Post Y dasselbe sind. */
  var igZuordnung = { zuordnung: {}, nicht_pruefbar: [] };
  var ideenExtern = { ideen: [] };
  function igPost(b) {
    return (igZuordnung.zuordnung || {})[(b && b.id) || ""] || null;
  }
  function istGepostet(b) { return !!igPost(b); }
  function nichtPruefbar(b) {
    // Das doTERRA-Konto haengt nicht an der Graph API. Fehlende Zuordnung
    // heisst dort NICHT „nicht gepostet".
    return (kartenProfil(b.obj) === "doterra") && !igPost(b);
  }

  function freigabeVon(b) {
    var id = (b && b.id) || "";
    return (id && freigaben[id]) || null;
  }
  function draussenStatus(b) {
    var f = freigabeVon(b);
    if (f && f.status) return f.status;
    // Rueckfall, solange die Sammlung nicht geladen ist.
    return (((b.obj || b).blotato) || {}).status || "";
  }
  function istDraussen(b) {
    return DRAUSSEN.indexOf(draussenStatus(b)) >= 0;
  }
  function draussenGrund(b) {
    var ig = (typeof igPost === "function") && igPost(b);
    if (ig) return ig.reach != null ? "gepostet · " + ig.reach + " erreicht"
                                    : "gepostet";
    var s = draussenStatus(b);
    return s === "geplant" ? "bei Blotato eingeplant"
      : s === "gepostet-von-hand" ? "von dir gepostet"
      : s === "selber-posten" ? "B-Roll — postest du selbst"
      : "";
  }

  /* Ein leerer Entwurf ist kein Beitrag — weder eine Aufgabe noch etwas,
     das man freigeben koennte. */
  function istLeer(b) {
    return !(b.hook || "").trim() && !(b.caption || "").trim() &&
           !((b.obj.slides || []).length) && !((b.obj.frames || []).length);
  }

  /* 🚨 Blotato lehnt jeden Zeitpunkt in der Vergangenheit ab, und der
     Einplan-Lauf ist erst um 20:00. Ein Beitrag, dessen Zeitpunkt durch ist,
     sieht fertig aus und geht trotzdem nie raus. */
  function zeitpunktVorbei(b) {
    if (!b.obj.datum) return false;
    var zeit = (b.obj.blotato && b.obj.blotato.zeit) ||
               vorgabeZeit(b.art, kartenProfil(b.obj));
    var wann = new Date(b.obj.datum + "T" + zeit);
    return !isNaN(wann) && wann.getTime() < Date.now();
  }

  /* 🚨 Ein freigegebener Beitrag rutscht nach, statt liegenzubleiben.
     Siehe Kopf von patch-nachruecken.py: „Datum ist durch" war eine Sackgasse,
     die sich jeden Tag neu bildet. Die Freigabe ist die Entscheidung, das
     Datum nur ein Wunsch. */
  /* 🚨 Merkzettel fuer EINEN Zeichendurchlauf: was die Vorschau schon an
     andere Beitraege vergeben hat. Ohne ihn bekommen vier Beitraege denselben
     Tag angezeigt, und dort ist genau ein Platz. Siehe Kopf von
     patch-slot-vorschau.py. Zurueckgesetzt in render(). */
  var slotVorschau = {};

  function naechsterSlot(b, merken2) {
    var zeit = (b.obj.blotato && b.obj.blotato.zeit) ||
               vorgabeZeit(b.art, kartenProfil(b.obj));
    var profil = kartenProfil(b.obj);
    // Eine Stunde Luft, damit der Zwei-Stunden-Lauf den Zeitpunkt sicher
    // erwischt - sonst rutscht er auf etwas, das beim naechsten Lauf schon
    // wieder vorbei ist.
    var frueheste = Date.now() + 3600000;

    // Welche Tage sind mit diesem Profil schon belegt?
    var belegt = {};
    alleBeitraege().forEach(function (x) {
      if (x.id === b.id || istAbgelehnt(x) || !x.obj.datum) return;
      if (kartenProfil(x.obj) !== profil) return;
      belegt[x.obj.datum] = true;
    });
    // Dazu, was die Vorschau in diesem Durchlauf schon vergeben hat.
    Object.keys(slotVorschau).forEach(function (k) {
      var teil = k.split("|");
      if (teil[1] === profil && teil[2] !== b.id) belegt[teil[0]] = true;
    });

    var start = new Date((b.obj.datum || todayISO()) + "T00:00:00");
    if (isNaN(start)) start = new Date();
    for (var i = 0; i <= 28; i++) {
      var d = new Date(start.getTime());
      d.setDate(d.getDate() + i);
      var wt = (d.getDay() + 6) % 7;          // 0 = Montag
      if (wt > 4) continue;                    // Wochenende: kein Feed-Platz
      if (b.art !== "storys" && WOCHENRHYTHMUS[wt] !== b.art) continue;
      var iso = d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
      if (belegt[iso]) continue;
      var wann = new Date(iso + "T" + zeit);
      if (isNaN(wann) || wann.getTime() < frueheste) continue;
      if (merken2 !== false) slotVorschau[iso + "|" + profil + "|" + b.id] = true;
      return { datum: iso, zeit: zeit, verschoben: iso !== b.obj.datum };
    }
    return null;   // nichts gefunden - lieber ehrlich als endlos suchen
  }

  /* Fertig heisst: nichts fehlt und noch nicht freigegeben. */
  function istFertig(b) {
    return !istLeer(b) && !b.obj.textfrei && !wasFehlt(b).length;
  }

  function fertigAnzahl() {
    return offeneBeitraege().filter(function (b) {
      return b.art !== "storys" && !istDraussen(b) &&
             istFertig(b) && !zeitpunktVorbei(b);
    }).length;
  }

  /* =========================================================
     Wochen-Vorschau — der eine Ort zum Pruefen, Umstellen und Freigeben
     ========================================================= */

  function renderWoche(main) {
    var alleMit = alleBeitraege();
    var abgelehnt = alleMit.filter(istAbgelehnt);
    var beitraege = alleMit.filter(function (b) { return !istAbgelehnt(b); });

    beitraege.forEach(function (b) { wochenBildHolen(b.art, b.id); });

    var tage = tpTage(tpOffset());
    var belegt = tpBelegung();
    var frei = beitraege.filter(function (b) { return b.obj.textfrei; }).length;

    main.innerHTML =
      '<div class="page-head"><div><h1>Wochen-Vorschau</h1>' +
      '<p>Pro Tag und Profil ein Platz. \u201eWechseln\u201c legt eine andere ' +
      'Variante drauf.</p></div>' +
      '<div class="head-actions">' +
        '<button class="btn" id="w-zurueck">\u2190 Woche</button>' +
        '<span class="tp-kw">KW ' + tpKw(tage[0].datum) + ' \u00b7 ' +
          wKurz(tage[0].datum) + '\u2013' + wKurz(tage[4].datum) + '</span>' +
        '<button class="btn" id="w-vor">Woche \u2192</button>' +
        (tpOffset() ? '<button class="btn ghost" id="w-heute">Diese Woche</button>' : "") +
        '<span class="chip">' + frei + ' von ' + beitraege.length + ' freigegeben</span>' +
      '</div></div>' +
      bilanzBlock(tage, belegt) +
      // Erst die Woche, dann die Liste - siehe Kopf von
      // patch-woche-aufraeumen.py.
      '<div id="wliste"></div>' +
      aufgabenBlock(beitraege) +
      '<div id="wunten"></div>';

    main.querySelector("#w-zurueck").onclick = function () {
      wochenOffset = tpOffset() - 1; slotOffen = null; render();
    };
    main.querySelector("#w-vor").onclick = function () {
      wochenOffset = tpOffset() + 1; slotOffen = null; render();
    };
    var heuteKnopf = main.querySelector("#w-heute");
    if (heuteKnopf) heuteKnopf.onclick = function () {
      wochenOffset = 0; slotOffen = null; render();
    };

    var liste = main.querySelector("#wliste");
    tage.forEach(function (t, i) {
      var soll = WOCHENRHYTHMUS[i] || "reels";
      var kopf = document.createElement("div");
      kopf.className = "wt-kopf";
      kopf.innerHTML = '<span class="wt-name">' + esc(tagName(t.iso)) + '</span>' +
        '<span class="wt-datum">' + esc(fmtDate(t.iso)) + '</span>' +
        '<span class="wt-soll">' +
          (soll === "reels" ? "Reel-Tag" : "Karussell-Tag") + '</span>';
      liste.appendChild(kopf);
      TP_PROFILE.forEach(function (p) {
        liste.appendChild(slotBlock(t, p, soll, belegt));
      });
    });

    main.querySelector("#wunten").appendChild(unterBlock(beitraege, abgelehnt));
  }

  function wKurz(d) {
    return String(d.getDate()).padStart(2, "0") + "." +
           String(d.getMonth() + 1).padStart(2, "0") + ".";
  }

  /* Soll/Ist je Profil — zwei Zeilen, weil zwei Dinge stimmen muessen:
     der Format-Mix und die CTA-Verteilung. */
  function bilanzBlock(tage, belegt) {
    var karten = TP_PROFILE.map(function (p) {
      var n = { reels: 0, karussells: 0 }, j = { lead: 0, reichweite: 0 };
      tage.forEach(function (t) {
        var l = belegt[t.iso + "|" + p.id] || [];
        if (l.length) { n[l[0].art]++; j[jobVonBeitrag(l[0])]++; }
      });
      var formOk = n.reels === TP_SOLL.reels && n.karussells === TP_SOLL.karussells;
      var jobOk = j.lead === TP_SOLL_JOB.lead && j.reichweite === TP_SOLL_JOB.reichweite;
      return '<div class="tp-bilanz' + (formOk && jobOk ? " ok" : "") + '">' +
        '<b>' + esc(p.label) + '</b>' +
        '<span' + (formOk ? ' class="ok"' : '') + '>' +
          n.reels + ' von ' + TP_SOLL.reels + ' Reels \u00b7 ' +
          n.karussells + ' von ' + TP_SOLL.karussells + ' Karussells</span>' +
        '<span' + (jobOk ? ' class="ok"' : '') + '>' +
          j.lead + ' von ' + TP_SOLL_JOB.lead + ' Lead \u00b7 ' +
          j.reichweite + ' von ' + TP_SOLL_JOB.reichweite + ' Reichweite</span>' +
        '</div>';
    }).join("");
    return '<div class="tp-bilanzen">' + karten + '</div>' +
      '<p class="note wbilanz-note">Lead oder Reichweite ist aus dem CTA ' +
      'abgelesen: ein Stichwort in Grossbuchstaben macht den Beitrag zum ' +
      'Lead-Post. Es steht auf jeder Karte \u2014 wenn dort etwas Falsches ' +
      'steht, stimmt die Zahl oben auch nicht.</p>';
  }

  /* Ein Platz: Kopfzeile mit Wechseln-Knopf, darunter die volle Karte. */
  function slotBlock(t, p, soll, belegt) {
    var schluessel = t.iso + "|" + p.id;
    var alle = belegt[schluessel] || [];
    var drauf = alle[0] || null;
    var weitere = alle.slice(1);
    var vorrat = tpVorrat(p.id);
    var offen = slotOffen === schluessel;
    var anzahl = weitere.length + vorrat.length;

    var box = document.createElement("div");
    box.className = "wslot" + (drauf ? "" : " leer") +
      (drauf && istDraussen(drauf) ? " durch" : "");

    var kopf = document.createElement("div");
    kopf.className = "wslot-kopf";
    var job = drauf ? jobVonBeitrag(drauf) : "";
    kopf.innerHTML =
      '<span class="wslot-profil">' + esc(p.label) + '</span>' +
      (drauf
        ? '<span class="wslot-job ' + job + '">' +
          (job === "lead" ? "Lead \u00b7 " + esc(ctaStichwort(drauf)) : "Reichweite") +
          '</span>'
        : "") +
      (drauf && drauf.art !== soll
        ? '<span class="wslot-warn">heute w\u00e4re ' +
          (soll === "reels" ? "ein Reel" : "ein Karussell") + ' dran</span>'
        : "") +
      '<button class="btn ghost wslot-auf">' +
        (offen ? "Liste zu" : (drauf ? "Wechseln" : "Ausw\u00e4hlen")) +
        (anzahl ? ' <span class="tp-anz">' + anzahl + '</span>' : "") +
      '</button>';
    kopf.querySelector(".wslot-auf").onclick = function () {
      slotOffen = offen ? null : schluessel;
      render();
    };
    box.appendChild(kopf);

    if (offen) box.appendChild(variantenListe(schluessel, weitere, vorrat, soll, t, p));

    if (drauf) {
      box.appendChild(wochenKarte(drauf));
    } else {
      var leer = document.createElement("div");
      leer.className = "wslot-leer";
      leer.textContent = "Noch nichts geplant. Hier geh\u00f6rt " +
        (soll === "reels" ? "ein Reel" : "ein Karussell") +
        " hin \u2014 \u00fcber \u201eAusw\u00e4hlen\u201c aus der Ideenliste holen.";
      box.appendChild(leer);
    }
    return box;
  }

  /* Die Varianten zu einem Platz: was noch am selben Tag liegt, dann der
     Vorrat ohne Datum. Das passende Format zuerst — bei zehn Eintraegen ist
     die Reihenfolge die halbe Bedienung. */
  function variantenListe(schluessel, weitere, vorrat, soll, t, p) {
    var box = document.createElement("div");
    box.className = "tp-alts";

    var eintraege = weitere.map(function (b) {
      return { b: b, hinweis: "liegt auch an diesem Tag" };
    }).concat(vorrat.map(function (b) {
      return { b: b, hinweis: "" };
    }));

    if (!eintraege.length) {
      box.innerHTML = '<div class="tp-keine">Nichts im Vorrat f\u00fcr dieses ' +
        'Profil. Was ohne Datum dasteht, findest du unten in der Ideenliste.</div>';
      return box;
    }

    eintraege.sort(function (x, y) {
      return (x.b.art === soll ? 0 : 1) - (y.b.art === soll ? 0 : 1);
    });

    eintraege.forEach(function (e) {
      var j = jobVonBeitrag(e.b);
      var k = document.createElement("button");
      k.className = "tp-alt";
      k.innerHTML =
        '<span class="tp-format">' + esc(e.b.format) + '</span>' +
        '<span class="tp-althook">' + esc(e.b.hook || e.b.titel) + '</span>' +
        '<span class="tp-job ' + j + '">' + (j === "lead" ? "Lead" : "Reichweite") + '</span>' +
        (e.hinweis ? '<span class="tp-hinweis">' + esc(e.hinweis) + '</span>' : "");
      k.onclick = function () {
        var alt = (tpBelegung()[schluessel] || [])[0] || null;
        tpBelegen(e.b, alt, t.iso, p.id);
      };
      box.appendChild(k);
    });
    return box;
  }

  /* Neu einplanen. 🚨 War der Beitrag schon freigegeben oder eingeplant, wird
     das zurueckgesetzt — sonst laesst der 20:00-Lauf ihn liegen, weil er als
     erledigt gilt, und sie wartet auf einen Post, der nie kommt. */
  function umplanen(b, neu) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(neu)) {
      toast("Das war kein Datum.");
      return;
    }
    b.obj.datum = neu;
    var zurueck = false;
    if (b.obj.textfrei) { b.obj.textfrei = false; zurueck = true; }
    if (b.obj.blotato && b.obj.blotato.status) { b.obj.blotato.status = ""; zurueck = true; }
    tpSpeichern(b);
    toast(b.titel + " liegt jetzt auf " + tagName(neu) + ", " + fmtDate(neu) +
      (zurueck ? " \u2014 Freigabe ist zur\u00fcckgenommen, gib ihn neu frei." : "."));
    render();
  }

  /* Endgueltig weg. Patricias Entscheid 19.09.2026 auf die Rueckfrage, ob
     „Loeschen" in die Ideenliste legen oder wirklich loeschen soll.
     🚨 Das Artifact hat keine Historie — was hier weg ist, ist weg. Deshalb
     zwei Klicks, und deshalb steht der Beitrags-Text zusaetzlich als Datei in
     outputs/content/ (scripts/cockpit/inhalte-sichern.py). */
  function beitragLoeschen(b) {
    if (b.art === "reels") {
      state.reels = state.reels.filter(function (x) { return x.id !== b.id; });
      lsSet("reelliste", state.reels.map(function (x) { return x.id; }));
      if (db) db.collection("reels").doc(b.id).delete().catch(function () {});
    } else if (b.art === "karussells") {
      state.karussells = state.karussells.filter(function (x) { return x.id !== b.id; });
      lsSet("karliste", state.karussells.map(function (x) { return x.id; }));
      if (db) db.collection("karussells").doc(b.id).delete().catch(function () {});
    } else {
      state.storys = state.storys.filter(function (x) { return x.id !== b.id; });
      lsSet("storyliste", state.storys.map(function (x) { return x.id; }));
      if (db) db.collection("storys").doc(b.id).delete().catch(function () {});
    }
    toast(b.titel + " ist gel\u00f6scht.");
    render();
  }

  /* ---- die zwei Uebersichten am Schluss ---------------------------------
     Die Wochenansicht oben zeigt nur die laufende Woche. Damit nichts aus dem
     Blick faellt, stehen hier ALLE Termine ueber alle Wochen, und daneben
     alles ohne Datum. */
  function unterBlock(beitraege, abgelehnt) {
    var box = document.createElement("div");

    var echte = beitraege.filter(function (b) { return !istLeer(b); });
    var mitDatum = echte.filter(function (b) { return b.obj.datum; })
      .sort(function (a, c) { return a.obj.datum < c.obj.datum ? -1 : 1; });
    var ohneDatum = echte.filter(function (b) { return !b.obj.datum; });

    // --- Was wann rausgeht ---------------------------------------------
    var plan = document.createElement("div");
    plan.className = "panel uebersicht";
    plan.innerHTML = '<h2>Was wann rausgeht</h2>' +
      '<p class="note">Alle ' + mitDatum.length + ' Beitr\u00e4ge mit Datum, ' +
      '\u00fcber alle Wochen \u2014 auch die, die oben gerade nicht im Bild sind.</p>';
    if (!mitDatum.length) {
      plan.innerHTML += '<div class="empty">Noch nichts eingeplant.</div>';
    } else {
      var letzte = "";
      mitDatum.forEach(function (b) {
        var s = tpStand(b), j = jobVonBeitrag(b);
        var z = document.createElement("div");
        z.className = "uezeile" + (b.obj.datum !== letzte ? " neu" : "");
        letzte = b.obj.datum;
        z.innerHTML =
          '<span class="uedatum">' + esc(tagName(b.obj.datum).slice(0, 2) + " " +
            fmtDate(b.obj.datum)) + '</span>' +
          '<span class="uepro">' +
            (kartenProfil(b.obj) === "doterra" ? "doTERRA" : "Mum Life") + '</span>' +
          '<span class="tp-format">' + esc(b.format) + '</span>' +
          '<span class="tp-job ' + j + '">' + (j === "lead" ? "Lead" : "Reichweite") + '</span>' +
          '<span class="uehook klickbar" title="Beitrag öffnen">' +
            esc(b.hook || b.titel) + '</span>' +
          '<span class="tp-stand ' + s.art + '">' + esc(s.text) + '</span>' +
          '<input type="date" class="uedat" value="' + esc(b.obj.datum || "") + '" ' +
            'title="Anderes Datum setzen">';
        // Patricia, 24.09.2026: „brauche ich auch die verlinkung zum beitrag.
        // dann könnte ich neue daten setzen." Beides - das Feld fuer den
        // schnellen Weg, der Klick fuer den ganzen Beitrag.
        z.querySelector(".uehook").onclick = function () {
          if (typeof springeZuBeitrag === "function") springeZuBeitrag(b);
        };
        z.querySelector(".uedat").onchange = function () {
          if (this.value) umplanen(b, this.value);
        };
        plan.appendChild(z);
      });
    }
    box.appendChild(plan);

    // --- Ideenliste ------------------------------------------------------
    var ideen = document.createElement("div");
    ideen.className = "panel uebersicht";
    ideen.innerHTML = '<h2>Ideenliste</h2>' +
      '<p class="note">' + ohneDatum.length + ' Beitr\u00e4ge ohne Datum. Sie kommen ' +
      '\u00fcber \u201eWechseln\u201c oben auf einen Platz \u2014 oder du setzt hier ' +
      'direkt einen Tag.</p>';
    if (!ohneDatum.length) {
      ideen.innerHTML += '<div class="empty">Leer \u2014 alles ist eingeplant.</div>';
    } else {
      ohneDatum.sort(function (a, c) {
        return (a.format + a.titel) < (c.format + c.titel) ? -1 : 1;
      }).forEach(function (b) {
        var j = jobVonBeitrag(b);
        var z = document.createElement("div");
        z.className = "uezeile idee";
        z.innerHTML =
          '<span class="uepro">' +
            (kartenProfil(b.obj) === "doterra" ? "doTERRA" : "Mum Life") + '</span>' +
          '<span class="tp-format">' + esc(b.format) + '</span>' +
          '<span class="tp-job ' + j + '">' + (j === "lead" ? "Lead" : "Reichweite") + '</span>' +
          '<span class="uehook">' + esc(b.hook || b.titel) + '</span>' +
          '<input type="date" class="uedat">';
        z.querySelector(".uedat").onchange = function () {
          if (this.value) umplanen(b, this.value);
        };
        ideen.appendChild(z);
      });
    }
    box.appendChild(ideen);

    // --- Aussortiertes, klein und unten, mit Rueckweg --------------------
    if (abgelehnt.length) {
      var ab = document.createElement("div");
      ab.className = "panel abliste";
      ab.innerHTML = '<h2>Abgelehnt (' + abgelehnt.length + ')</h2>' +
        '<p class="note">Aus allen Arbeitsansichten raus, aber nicht gel\u00f6scht.</p>';
      abgelehnt.sort(function (x, y) {
        return (y.obj.abgelehntStand || "") < (x.obj.abgelehntStand || "") ? -1 : 1;
      }).forEach(function (b) {
        var z = document.createElement("div");
        z.className = "abzeile2";
        z.innerHTML = '<span class="tudatum">' + esc(b.format) + '</span>' +
          '<span>' + esc(b.titel) + '</span>';
        var zurueck = document.createElement("button");
        zurueck.className = "btn";
        zurueck.textContent = "Zur\u00fcckholen";
        zurueck.onclick = function () {
          b.obj.abgelehnt = false;
          if (b.art === "reels") saveReel(b.obj);
          else if (b.art === "storys") saveStory(b.obj);
          else saveCarousel(b.obj);
          toast("Wieder da.");
          render();
        };
        z.appendChild(zurueck);
        ab.appendChild(z);
      });
      box.appendChild(ab);
    }

    return box;
  }

  /* Was an einem Beitrag fehlt, und wer dafuer zustaendig ist.
     🚨 Die Arbeitsteilung ist fest: B-Roll baue ich aus vorhandenem Material,
     ein Sprechreel drehst du — dafuer steht der Sprechtext auf der Karte.
     Ohne diese Trennung wartet jede auf die andere. */
  function wasFehlt(b) {
    var o = b.obj, raus = [];
    // Was draussen ist, kann nichts mehr fehlen — sonst steht ein geposteter
    // Beitrag bis in alle Ewigkeit unter „du bist dran".
    if (istDraussen(b)) return raus;
    if (b.art === "reels" && !b.videourl) {
      if ((o.videoart || "sprech") === "broll") {
        raus.push({ wer: "ich", was: "Video fehlt",
                    dazu: "B-Roll aus vorhandenem Material \u2014 das baue ich. " +
                          "Sag es mir in der Zeile darunter, wenn es eilt." });
      } else {
        raus.push({ wer: "du", was: "Video fehlt \u2014 du drehst es",
                    dazu: "Sprechtext steht darunter. Fertig gedreht: links " +
                          "unter dem Cover auf \u201eVideo hochladen\u201c \u2014 oder " +
                          "roh mit Versprechern ins Handy-Album Content-Inbox, " +
                          "dann hole und schneide ich es." });
      }
    }
    if (b.art !== "storys" && !(b.caption || "").trim()) {
      raus.push({ wer: "ich", was: "Caption fehlt", dazu: "" });
    }
    if (b.art === "karussells" && !(o.slides || []).length) {
      raus.push({ wer: "ich", was: "Folien fehlen", dazu: "" });
    }
    // 🚨 Ein Datum fehlt nur dann wirklich, wenn der Beitrag sonst fertig ist.
    // Sonst meldet jeder Beitrag aus dem Vorrat eine offene Aufgabe, und die
    // Liste „Was zu tun ist“ sagt nichts mehr.
    if (!o.datum && !raus.length) {
      raus.push({ wer: "du", was: "Kein Datum",
                  dazu: "Sonst ist alles da. Setz ein Datum, dann kann es raus." });
    }
    return raus;
  }

  /* Der Aufgaben-Block ueber der Liste: alles Offene auf einen Blick,
     nach Tag sortiert, getrennt nach „von dir“ und „von mir“. */
  function aufgabenBlock(beitraege) {
    var offen = [], ohneDatum = 0;
    beitraege.forEach(function (b) {
      if (istLeer(b)) return;   // ein leerer Entwurf ist keine Aufgabe
      var f = wasFehlt(b);
      if (!f.length) return;
      // 🚨 Ohne Datum ist nichts eine Aufgabe. Das sind die A/B-Varianten aus
      // der Freitagsproduktion, die nie ausgewaehlt wurden - 67 von 85 Zeilen
      // am 24.09.2026. Sie stehen unten in der Ideenliste, und dort gehoeren
      // sie hin.
      if (!b.obj.datum) { ohneDatum++; return; }
      f.forEach(function (x) { offen.push({ b: b, f: x }); });
    });

    var rest = ohneDatum
      ? '<p class="note">' + ohneDatum + ' weitere Entwürfe haben noch kein ' +
        'Datum. Die stehen unten in der Ideenliste — solange dort kein Tag ' +
        'dransteht, ist es keine Aufgabe.</p>'
      : "";

    if (!offen.length) {
      return '<div class="panel tuliste"><h2>Was zu tun ist</h2>' +
             '<div class="empty">Nichts offen — jeder eingeplante Beitrag hat ' +
             'Video, Caption und Datum.</div>' + rest + '</div>';
    }

    offen.sort(function (x, y) {
      var a = x.b.obj.datum, c = y.b.obj.datum;
      return a < c ? -1 : (a > c ? 1 : 0);
    });
    var vonDir = offen.filter(function (x) { return x.f.wer === "du"; }).length;
    var vonMir = offen.length - vonDir;

    /* <details> statt eigener Zustand: kein JS, kein localStorage, und beim
       Neuzeichnen kann nichts auseinanderlaufen. Die Zahl steht im Kopf -
       ein zugeklappter Block ohne Zahl verschweigt, dass etwas wartet. */
    var h = '<details class="panel tuliste tuklapp"><summary>' +
      '<span class="tu-titel">Was zu tun ist</span>' +
      (vonDir ? '<span class="tu-zahl du">' + vonDir + ' von dir</span>' : "") +
      (vonMir ? '<span class="tu-zahl ich">' + vonMir + ' von mir</span>' : "") +
      '</summary>' +
      '<p class="note">Was bei dir steht, hält den Beitrag auf — alles ' +
      'andere läuft auch ohne dich weiter.</p>';
    offen.forEach(function (x) {
      h += '<div class="tuzeile">' +
        '<span class="tudatum">' +
          esc(tagName(x.b.obj.datum).slice(0, 2) + " " + fmtDate(x.b.obj.datum)) +
        '</span>' +
        '<span class="tuwas"><strong>' + esc(x.f.was) + '</strong> — ' +
          esc(x.b.titel) + '</span>' +
        '<span class="tuwer ' + x.f.wer + '">' +
          (x.f.wer === "du" ? "von dir" : "von mir") + '</span>' +
        '</div>';
    });
    return h + rest + '</details>';
  }

  function wochenKarte(b) {
    var zerlegt = hashtagsTrennen(b.caption);
    var karte = document.createElement("div");
    karte.className = "wkarte" + (b.obj.textfrei ? " frei" : "");

    // Farbwaehler nur beim Reel — beim Karussell macht die Farbe der Editor.

    var farbwahl = "";
    // Beim Karussell entscheidet der Marken-Look ueber die Farbe aller Folien.

    if (b.art === "karussells") {

        // 🚨 Der Rueckweg: ein gedrehtes Video von der Karte aus abgeben.
        // Ohne das musste Patricia ins Reel-Studio wechseln und dort den

        (assetsAPI

        (quelle ? '<button class="btn" data-holen="cover">Cover speichern</button>' : "") +
        // Das Cover ist ein eigenes Bild, nicht das erste Videobild. Gebaut wird

        // und die verschiebbare Texthöhe. Muss ein Link sein: window.open() ist
        // im Artifact-Rahmen blockiert.
        // 🚨 Bei B-Roll steht der ganze Hook ab Bild null im Video — das erste
        // Videobild ist damit schon das Cover. Der Knopf bleibt, aber unauffaellig

        '<a class="btn' + (quelle ? "" : " primary") + '" data-cover="1" href="' +
          BILDEDITOR + '" target="_blank" rel="noopener">' +
          (quelle ? "Cover ändern" : "Cover bauen") + '</a>' +
        // 🚨 Auch B-Roll braucht ein Cover. Der Hook im Video ist fuer die

        (brollOhneCover
          ? '<span class="wk-unter">Der Hook im Video ist nur, was abspielt. ' +
            'Im Profil steht das Cover \u2014 und das tr\u00e4gt den Feed.</span>'

        '</div>';
      farbwahl += '<div class="wk-farben">' +
        COVERFARBEN.map(function (f) {
          var an = (b.obj.coverfarbe || "dunkelblau") === f.k;

                 (an ? ' aria-pressed="true"' : '') + ' title="' + f.l + '"></button>';
        }).join("") +
        '<span class="wk-unter">Coverfarbe</span></div>';
    }

    karte.innerHTML =
      '<div>' + bild + farbwahl + '</div>' +
      '<div class="wk-haupt">' +
        '<div class="wk-zeile">' +
          '<span class="chip' + (b.format === "Reel" ? "" : " orange") + '">' + b.format + '</span>' +
          '<strong>' + esc(b.titel) + '</strong>' +
        '</div>' +
        (b.hook ? '<div class="wk-hook">' + esc(b.hook) + '</div>' : "") +
        (b.unter ? '<div class="wk-unter">' + esc(b.unter) + '</div>' : "") +
        // Storys haben keine Caption — dort waere das Feld eine Einladung,
