  function renderJahresplan(main) {
    var jahr = new Date().getFullYear();
    var alle = (jahresplan && jahresplan.eintraege) || [];

    main.innerHTML =
      '<div class="page-head"><div><h1>Jahresplan</h1>' +
      '<p>Was wann läuft — Launches, Freebies und die Ferien, in denen nichts ' +
      'Grosses starten sollte. Hier gepflegt, nicht mehr in Notion.</p></div>' +
      '<div class="head-actions"><select class="btn" id="jpfilter"></select>' +
      '<button class="btn primary" id="jpneu">Eintrag anlegen</button></div></div>' +
      '<div id="jpkacheln" class="tiles"></div>' +
      '<div class="timeline"><div class="tl-track">' +
        '<div class="tl-months">' +
        ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"]
          .map(function (m) { return "<span>" + m + "</span>"; }).join("") +
        '</div><div class="tl-rows" id="jprows">' +
        '<div class="tl-grid">' + new Array(12).fill("<i></i>").join("") + '</div>' +
        '</div></div></div>' +
      '<div id="jpliste"></div>';

    if (!alle.length) {
      main.querySelector("#jpliste").innerHTML =
        '<div class="panel"><div class="empty">Noch nichts übernommen. ' +
        'Der Import aus Notion läuft einmalig über ' +
        '<code>python scripts/cockpit/jahresplan-importieren.py</code>.</div></div>';
      return;
    }

    var f = main.querySelector("#jpfilter");
    [{ k: "", l: "Alle Bereiche" }].concat(JP_BEREICHE).forEach(function (o) {
      var op = document.createElement("option");
      op.value = o.k; op.textContent = o.l;
      if (jpBereich === o.k && !(o.k === "" && jpBereich === "")) op.selected = true;
      f.appendChild(op);
    });
    f.value = jpBereich;
    f.onchange = function () { jpBereich = f.value; render(); };

    var sicht = jpBereich
      ? alle.filter(function (e) { return e.bereich === jpBereich; })
      : alle;

    // --- Kacheln
    var heute = todayISO();
    var laeuft = alle.filter(function (e) {
      return e.start <= heute && (e.ende || e.start) >= heute && e.bereich !== "ferien";
    });
    // 🚨 Ferien hier ausschliessen — sonst zeigen „Als Nächstes" und
    // „Nächste Ferien" dieselbe Zeile, und eine der beiden Kacheln ist weg.
    var naechste = alle.filter(function (e) {
      return e.start > heute && e.bereich !== "ferien";
    }).sort(function (x, y) { return x.start < y.start ? -1 : 1; })[0];
    var ferienNaechst = alle.filter(function (e) {
      return e.bereich === "ferien" && (e.ende || e.start) >= heute;
    }).sort(function (x, y) { return x.start < y.start ? -1 : 1; })[0];
    var z = (jahresplan && jahresplan.zahlen) || {};

    main.querySelector("#jpkacheln").innerHTML =
      tile("Läuft gerade", laeuft.length,
           laeuft.length ? esc(laeuft[0].name.slice(0, 34)) : "nichts offen") +
      tile("Als Nächstes", naechste ? esc(fmtDate(naechste.start)) : "—",
           naechste ? esc(naechste.name.slice(0, 34)) : "nichts geplant") +
      tile("Nächste Ferien", ferienNaechst ? esc(fmtDate(ferienNaechst.start)) : "—",
           ferienNaechst ? esc(ferienNaechst.name) : "—") +
      tile("Im Jahr " + jahr, z.im_jahr || sicht.length,
           Object.keys(z.nach_stufe || {}).map(function (k) {
             return k + " " + z.nach_stufe[k];
           }).join(" · ") || "Einträge");

    // --- Zeitachse: je Bereich eine Spur, Ferien zuletzt und gedaempft
    var rows = main.querySelector("#jprows");
    JP_BEREICHE.forEach(function (ber) {
      var drin = sicht.filter(function (e) {
        var a = jpTag(e.start);
        return e.bereich === ber.k && a && a.jahr === jahr;
      });
      if (!drin.length) return;
      var spur = document.createElement("div");
      spur.className = "tl-row jp-" + (ber.k || "leer");
      drin.forEach(function (e) {
        var a = jpTag(e.start), b = jpTag(e.ende || e.start) || a;
        if (!a) return;
        var links = (a.tag - 1) / 365 * 100;
        var breite = Math.max(1.6, ((b.tag - a.tag + 1) / 365) * 100);
        var bar = document.createElement("div");
        bar.className = "tl-bar jpbar jp-" + (ber.k || "leer") +
                        (e.vorbei ? " past" : "");
        bar.style.left = links + "%";
        bar.style.width = Math.min(100 - links, breite) + "%";
        bar.title = e.name + " · " + e.start + " bis " + (e.ende || e.start) +
                    (e.stufe ? " · " + e.stufe : "");
        bar.textContent = e.name;
        spur.appendChild(bar);
      });
      rows.appendChild(spur);
    });
    var hTag = jpTag(heute);
    if (hTag) {
      var marker = document.createElement("div");
      marker.className = "tl-today";
      marker.style.left = ((hTag.tag - 1) / 365 * 100) + "%";
      marker.title = "heute";
      rows.appendChild(marker);
    }

    // --- Liste, nach Monat gruppiert
    var liste = main.querySelector("#jpliste");
    var MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August",
               "September","Oktober","November","Dezember"];
    var letzterMonat = "";
    sicht.slice().sort(function (x, y) { return x.start < y.start ? -1 : 1; })
      .forEach(function (e) {
        var mon = (e.start || "").slice(0, 7);
        if (mon !== letzterMonat) {
          letzterMonat = mon;
          var h = document.createElement("h2");
          h.className = "jpmonat";
          var t = mon.split("-");
          h.textContent = (MON[Number(t[1]) - 1] || mon) + " " + t[0];
          liste.appendChild(h);
        }
        liste.appendChild(jpZeile(e));
      });

    main.querySelector("#jpneu").onclick = function () {
      jahresplan.eintraege.push({
        id: uid("jp"), name: "Neuer Eintrag", start: heute, ende: heute,
        bereich: jpBereich || "mentoring", stufe: ""
      });
      jpSpeichern(); render();
    };
  }

  function jpZeile(e) {
    var z = document.createElement("div");
    z.className = "jpzeile" + (e.vorbei ? " vorbei" : "") +
                  (e.bereich === "ferien" ? " ferien" : "");

    function feld(typ, schluessel, breite, opts) {
      var el;
      if (opts) {
        el = document.createElement("select");
        opts.forEach(function (o) {
          var op = document.createElement("option");
          op.value = typeof o === "string" ? o : o.k;
          op.textContent = (typeof o === "string" ? o : o.l) || "—";
          if ((e[schluessel] || "") === op.value) op.selected = true;
          el.appendChild(op);
        });
      } else {
        el = document.createElement("input");
        el.type = typ;
        el.value = e[schluessel] || "";
      }
      el.style.width = breite;
      el.oninput = el.onchange = function () {
        e[schluessel] = el.value;
        jpSpeichern();
      };
      return el;
    }

    z.appendChild(feld("date", "start", "130px"));
    z.appendChild(feld("date", "ende", "130px"));
    z.appendChild(feld("text", "name", "100%"));
    z.appendChild(feld(null, "bereich", "150px", JP_BEREICHE));
    z.appendChild(feld(null, "stufe", "96px", JP_STUFEN));

    var weg = document.createElement("button");
    weg.className = "del";
    weg.textContent = "×";
    var scharf = false;
    weg.onclick = function () {
      // 🚨 Kein confirm() — im Artifact-Rahmen kann ein Modal lautlos
      // blockiert sein. Zwei Klicks, der zweite verfaellt.
      if (!scharf) {
        scharf = true;
        weg.classList.add("scharf");
        weg.textContent = "sicher?";
        setTimeout(function () {
          scharf = false; weg.classList.remove("scharf"); weg.textContent = "×";
        }, 6000);
        return;
      }
      jahresplan.eintraege = jahresplan.eintraege.filter(function (x) {
        return x.id !== e.id;
      });
      jpSpeichern(); render();
    };
    z.appendChild(weg);
    return z;
  }

  /* 🗃 Abgeloest am 24.09.2026 durch renderJahresplan. Blieb stehen, weil
     PHASEN und dayOfYear noch anderswo gebraucht werden; die Funktion selbst
     ruft niemand mehr auf und darf beim naechsten Umbau raus. */
  function renderLaunches(main) {
    var jahr = new Date().getFullYear();
    main.innerHTML =
      '<div class="page-head"><div><h1>Launches</h1>' +
      '<p>Die zeitliche Ebene. Was gerade läuft, in welcher Phase es steckt und wie viele geplante Posts darauf einzahlen.</p></div>' +
      '<div class="head-actions"><button class="btn primary" id="addlaunch">Launch anlegen</button></div></div>' +
      '<div class="timeline"><div class="tl-track">' +
        '<div class="tl-months">' + ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"].map(function (m) { return "<span>" + m + "</span>"; }).join("") + '</div>' +
        '<div class="tl-rows" id="tlrows"><div class="tl-grid">' + new Array(12).fill("<i></i>").join("") + '</div></div>' +
      '</div></div>' +
      '<div id="launchlist"></div>';

    var rows = main.querySelector("#tlrows");
    var imJahr = state.launches.filter(function (l) {
      var a = dayOfYear(l.start);
      return a && a.jahr === jahr;
    });
    if (!imJahr.length) {
      rows.innerHTML += '<div class="tl-row"><div class="note" style="padding-top:8px">Noch kein Launch für ' + jahr + ' eingetragen.</div></div>';
    }
    imJahr.forEach(function (l) {
      var a = dayOfYear(l.start), b = dayOfYear(l.ende) || a;
      var row = document.createElement("div");
      row.className = "tl-row";
      var left = (a.tag - 1) / 365 * 100;
      var width = Math.max(2.5, ((b.tag - a.tag + 1) / 365) * 100);
      var vorbei = l.phase === "Abgeschlossen";
      row.innerHTML = '<div class="tl-bar' + (vorbei ? " past" : "") + '" style="left:' + left + '%;width:' + Math.min(100 - left, width) + '%" title="' +
        esc(l.name + " · " + l.start + " bis " + (l.ende || "offen")) + '">' + esc(l.name || "ohne Namen") + '</div>';
      rows.appendChild(row);
    });
    var heuteTag = dayOfYear(todayISO());
    var marker = document.createElement("div");
    marker.className = "tl-today";
    marker.style.left = ((heuteTag.tag - 1) / 365 * 100) + "%";
    marker.title = "heute";
    rows.appendChild(marker);

    var list = main.querySelector("#launchlist");
    if (!state.launches.length) {
      list.innerHTML = '<div class="panel"><div class="empty">Noch kein Launch. Ein Launch ist alles mit Start- und Enddatum, auch ein Bootcamp oder eine Aktionswoche.</div></div>';
    }
    state.launches.slice().sort(function (x, y) { return (x.start || "") < (y.start || "") ? -1 : 1; }).forEach(function (l) {
      var card = document.createElement("div");
      card.className = "chain";
      var eingezahlt = state.posts.filter(function (p) {
        return l.start && l.ende && p.datum >= l.start && p.datum <= l.ende;
      });
      card.innerHTML =
        '<div class="chain-top"><span class="c-name">' + esc(l.name || "Neuer Launch") + '</span>' +
        '<span class="chip' + (l.phase === "Verkauf" || l.phase === "Cart Close" ? " orange" : "") + '">' + esc(l.phase || "Vorbereitung") + '</span>' +
        '<button class="btn ghost" style="margin-left:auto" data-del="1">Löschen</button></div>' +
        '<div class="chain-grid"></div>' +
        '<div class="chain-foot"><span class="note">' + eingezahlt.length + ' geplante Posts fallen in diesen Zeitraum' +
        (eingezahlt.length ? "" : ", da zahlt gerade nichts ein") + '.</span></div>';

      var grid = card.querySelector(".chain-grid");
      var felder = [
        { k: "name", l: "Launch", t: "text" },
        { k: "angebot", l: "Angebot", t: "select", opts: [""].concat(state.produkte.map(function (a) { return a.name; })) },
        { k: "start", l: "Start", t: "date" },
        { k: "ende", l: "Ende", t: "date" },
        { k: "phase", l: "Phase", t: "select", opts: PHASEN },
        { k: "ziel", l: "Ziel", t: "text" }
      ];
      felder.forEach(function (fd) {
        var d = document.createElement("div");
        d.className = "chain-step";
        var lab = document.createElement("label");
        lab.textContent = fd.l;
        var el;
        if (fd.t === "select") {
          el = document.createElement("select");
          el.style.cssText = "background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px";
          fd.opts.forEach(function (o) {
            var op = document.createElement("option");
            op.value = o; op.textContent = o || "—";
            if (l[fd.k] === o) op.selected = true;
            el.appendChild(op);
          });
        } else {
          el = document.createElement("input");
          el.type = fd.t;
          el.value = l[fd.k] || "";
        }
        el.oninput = el.onchange = function () { l[fd.k] = el.value; saveList("launches"); if (fd.k !== "name" && fd.k !== "ziel") render(); };
        d.appendChild(lab); d.appendChild(el);
        grid.appendChild(d);
      });

      card.querySelector("[data-del]").onclick = function () {
        state.launches = state.launches.filter(function (x) { return x !== l; });
        saveList("launches"); render();
      };
      list.appendChild(card);
    });

    main.querySelector("#addlaunch").onclick = function () {
      var heute = new Date();
      var ende = new Date(heute.getTime() + 12 * 86400000);
      state.launches.push({
        id: uid("lc"), name: "Neuer Launch", angebot: "", start: todayISO(),
        ende: ende.toISOString().slice(0, 10), phase: "Vorbereitung", ziel: ""
      });
      saveList("launches"); render();
    };
  }

  /* =========================================================
     Zahlen & Ziele
     ========================================================= */
  function monatName(ym) {
    if (!ym) return "—";
    var t = ym.split("-");
    var m = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"][Number(t[1]) - 1];
    return m ? m + " " + String(t[0]).slice(2) : ym;
  }

  function planSpeichern() {
    clearTimeout(saveTimers.umsatzplan);
    saveTimers.umsatzplan = setTimeout(function () {
      lsSet("umsatzplan", umsatzplan);
      if (!db) { setSaveState("lokal gespeichert", "off"); return; }
      db.doc("daten/umsatzplan")
        .set({ zeilen: umsatzplan.zeilen, weitere: umsatzplan.weitere,
               updatedAt: new Date().toISOString() })
        .then(function () { setSaveState("gespeichert", "on"); })
        .catch(function () { setSaveState("nur lokal gespeichert", "off"); });
    }, 700);
  }

  function planRechnen() {
    var vorsichtig = 0, voll = 0;
    (umsatzplan.zeilen || []).forEach(function (z) {
      var a = angebotNach(z.angebot);
      if (!a) return;
      var n = Number(z.anzahl) || 0;
      var w = warenkorb(a);
      vorsichtig += n * (w.grund || 0);
      voll += n * (w.max || 0);
    });
    var extra = Number(umsatzplan.weitere) || 0;
    return { vorsichtig: vorsichtig + extra, voll: voll + extra, extra: extra };
  }

  /* Die Angebotsliste nach Schubladen, damit man nicht in neunundvierzig
     Zeilen am Stueck sucht. */
  function angebotOptionen(sel, gewaehlt) {
    var alle = ((katalog && katalog.angebote) || []).slice()
      .sort(function (x, y) { return (x.name || "") < (y.name || "") ? -1 : 1; });
    var leer = document.createElement("option");
    leer.value = ""; leer.textContent = "\u2014 Angebot w\u00e4hlen \u2014";
    sel.appendChild(leer);
    (((katalog && katalog.kategorien) || [])).forEach(function (kat) {
      var drin = alle.filter(function (x) { return x.kategorie === kat.id; });
      if (!drin.length) return;
      var gruppe = document.createElement("optgroup");
      gruppe.label = kat.name;
      drin.forEach(function (x) {
        var o = document.createElement("option");
        o.value = x.id;
        o.textContent = x.name +
          (x.preis ? "  (" + preisText(x.preis, x.waehrung) + ")" : "");
        if (gewaehlt === x.id) o.selected = true;
        gruppe.appendChild(o);
      });
      sel.appendChild(gruppe);
    });
  }

  function renderPlan(box) {
    if (!katalog) {
      box.innerHTML = '<h2>Weg zum Monatsziel</h2>' +
        '<div class="empty">Daf\u00fcr braucht es den Angebots-Katalog. ' +
        'Der entsteht aus ThriveCart.</div>';
      return;
    }
    var ziel = Number(settings.monatsziel) || 0;
    var waehrung = settings.waehrung || "CHF";

    box.innerHTML = '<h2>Weg zum Monatsziel</h2>' +
      '<p class="note">Trag ein, wie oft du ein Angebot im Monat verkaufen willst. ' +
      'Links steht, was es bringt, wenn <strong>nur das Angebot selbst</strong> ' +
      'gekauft wird. Rechts, was es bringt, wenn <strong>jede Kundin die ganze ' +
      'Kette mitnimmt</strong>. Die Wahrheit liegt dazwischen \u2014 wo genau, ' +
      'sagt dir erst deine eigene Statistik. Die Ketten baust du im ' +
      'Angebots-Katalog.</p>' +
      '<div class="plankopf">' +
      '<span>Angebot</span><span>Verk\u00e4ufe im Monat</span>' +
      '<span>nur das Angebot</span><span>mit ganzer Kette</span><span></span>' +
      '</div><div id="planrows"></div>' +
      '<div class="planextra">' +
      '<label for="planweit">Dazu kommt im Monat, ohne Checkout ' +
      '(zum Beispiel doTERRA)</label>' +
      '<input id="planweit" type="number" min="0" step="1" value="' +
      esc(umsatzplan.weitere || "") + '"></div>' +
      '<div id="plansumme"></div>';

    var rows = box.querySelector("#planrows");

    (umsatzplan.zeilen || []).forEach(function (z, i) {
      var a = angebotNach(z.angebot);
      var w = a ? warenkorb(a) : { grund: 0, max: 0 };

      var zeile = document.createElement("div");
      zeile.className = "planzeile";

      var sel = document.createElement("select");
      angebotOptionen(sel, z.angebot);
      sel.onchange = function () {
        z.angebot = sel.value;
        planSpeichern();
        render();
      };
      zeile.appendChild(sel);

      var anz = document.createElement("input");
      anz.type = "number"; anz.min = "0"; anz.step = "1";
      anz.placeholder = "0";
      anz.value = z.anzahl === null || z.anzahl === undefined ? "" : z.anzahl;
      zeile.appendChild(anz);

      var min = document.createElement("span");
      min.className = "katpreis";
      zeile.appendChild(min);

      var max = document.createElement("span");
      max.className = "katpreis";
      zeile.appendChild(max);

      // Beim Tippen wird nicht neu gezeichnet, sonst springt der Fokus weg.
      // Also muessen die beiden Geldspalten von Hand nachgezogen werden.
      function zeileNeu() {
        var k = Number(z.anzahl) || 0;
        min.textContent = preisText(k * (w.grund || 0), waehrung);
        max.textContent = preisText(k * (w.max || 0), waehrung);
      }
      zeileNeu();
      anz.oninput = function () {
        z.anzahl = anz.value === "" ? null : Number(anz.value);
        zeileNeu();
        planSpeichern();
        planNeu(box);
      };

      var weg = document.createElement("button");
      weg.className = "del";
      weg.textContent = "\u00d7";
      weg.title = "Zeile entfernen";
      weg.onclick = function () {
        umsatzplan.zeilen.splice(i, 1);
        planSpeichern();
        render();
      };
      zeile.appendChild(weg);
      rows.appendChild(zeile);
    });

    if (!(umsatzplan.zeilen || []).length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Noch nichts geplant. Fang mit dem Angebot an, das du am " +
        "besten verkaufst.";
      rows.appendChild(e);
    }

    var plus = document.createElement("button");
    plus.className = "btn";
    plus.style.marginTop = "8px";
    plus.textContent = "+ Angebot hinzuf\u00fcgen";
    plus.onclick = function () {
      if (!umsatzplan.zeilen) umsatzplan.zeilen = [];
      umsatzplan.zeilen.push({ angebot: "", anzahl: null });
      planSpeichern();
      render();
    };
    rows.appendChild(plus);

    var weit = box.querySelector("#planweit");
    weit.oninput = function () {
      umsatzplan.weitere = weit.value === "" ? 0 : Number(weit.value);
      planSpeichern();
      planNeu(box);
    };

    planNeu(box);
  }

  /* Nur die Summen neu zeichnen — wer tippt, will den Fokus behalten. */
  function planNeu(box) {
    var kasten = box.querySelector("#plansumme");
    if (!kasten) return;
    var ziel = Number(settings.monatsziel) || 0;
    var waehrung = settings.waehrung || "CHF";
    var r = planRechnen();

    function balken(lab, wert) {
      var pct = ziel ? Math.min(100, Math.round(wert / ziel * 100)) : 0;
      return '<div class="bar-row"><div class="bar-lab"><span>' + esc(lab) +
        '</span><b>' + esc(preisText(wert, waehrung)) + ' \u00b7 ' + pct +
        '%</b></div><div class="bar-track"><div class="bar-fill" style="width:' +
        pct + '%"></div></div></div>';
    }

    var satz;
    if (!ziel) {
      satz = "Setz oben rechts dein Monatsziel, dann rechne ich mit.";
    } else if (r.vorsichtig >= ziel) {
      satz = "Das geht auf, auch wenn niemand einen Bump oder Upsell mitnimmt.";
    } else if (r.voll >= ziel) {
      satz = "Das geht auf, wenn die Ketten mitlaufen. Ohne sie fehlen " +
        preisText(ziel - r.vorsichtig, waehrung) + " \u2014 " +
        "an den Ketten h\u00e4ngt hier also dein Ziel.";
    } else {
      satz = "So fehlen selbst bei voller Kette noch " +
        preisText(ziel - r.voll, waehrung) + ". Da braucht es mehr Verk\u00e4ufe " +
        "oder ein Angebot mit gr\u00f6sserem Warenkorb.";
    }

    kasten.innerHTML = '<div class="bars" style="margin-top:14px">' +
      balken("vorsichtig gerechnet", r.vorsichtig) +
      balken("mit ganzer Kette", r.voll) +
      '</div><p class="note" style="margin-top:10px">' + esc(satz) +
      (r.extra ? " Darin stecken " + esc(preisText(r.extra, waehrung)) +
        " an weiteren Einnahmen." : "") + '</p>';
  }

  /* =========================================================
     Gepostet & Analyse — was rausging und was es gebracht hat
     ========================================================= */
  function notizSpeichern() {
    clearTimeout(saveTimers.gepostetNotizen);
    saveTimers.gepostetNotizen = setTimeout(function () {
      lsSet("gepostet-notizen", gepostetNotizen);
      if (!db) { setSaveState("lokal gespeichert", "off"); return; }
      // 🚨 Eigenes Dokument. Der taegliche Abgleich schreibt `daten/gepostet`
      // und darf das hier nie anfassen — sonst sind ihre Notizen weg.
      db.doc("daten/gepostet-notizen")
        .set({ werte: gepostetNotizen, updatedAt: new Date().toISOString() })
        .then(function () { setSaveState("gespeichert", "on"); })
        .catch(function () { setSaveState("nur lokal gespeichert", "off"); });
    }, 700);
  }

  function rateTon(r) {
    // Richtwert 1–3 %. Darunter ist es ein Befund, kein Zufall.
    if (r == null) return "";
    if (r >= 3) return "gut";
    if (r >= 1) return "ok";
    return "schwach";
  }

  function gpAngebote() {
    var a = ((katalog && katalog.angebote) || []).map(function (x) { return x.name; });
    return [""].concat(a.sort());
  }

  function gpKarte(b) {
    var n = gepostetNotizen[b.id] || {};
    var auf = gepostetOffen === b.id;
    var karte = document.createElement("div");
    karte.className = "gpkarte" + (auf ? " auf" : "");

    var kopf = document.createElement("button");
    kopf.className = "gpkopf";
    var typ = b.typ === "REELS" ? "Reel" : (b.art || "Beitrag");
    kopf.innerHTML =
      '<span class="gpdatum">' + esc(fmtDate ? fmtDate(b.datum) : b.datum) + '</span>' +
      '<span class="gptyp">' + esc(typ) + '</span>' +
      '<span class="gptext">' + esc(b.anfang || "") + '</span>' +
      (b.gut_gelaufen ? '<span class="gpstern" title="lief besser als dein Schnitt">★</span>' : "") +
      (b.reif === false ? '<span class="gpjung" title="noch keine sieben Tage — die Zahlen wachsen noch">jung</span>' : "") +
      '<span class="gprate ' + rateTon(b.rate) + '">' +
        (b.rate == null ? "—" : b.rate + " %") + '</span>' +
      '<span class="gpreach">' + (b.reach || 0).toLocaleString("de-CH") + '</span>';
    kopf.onclick = function () {
      gepostetOffen = auf ? null : b.id;
      render();
    };
    karte.appendChild(kopf);

    var koerper = document.createElement("div");
    koerper.className = "gpkoerper";
    if (!auf) { karte.appendChild(koerper); return karte; }

    // Die gemessenen Zahlen. Reine Anzeige — hier tippt niemand etwas ein.
    var zahlen = document.createElement("div");
    zahlen.className = "gpwerte";
    [["Reichweite", b.reach], ["Gefällt mir", b.likes],
     ["Kommentare", b.kommentare], ["Gespeichert", b.saved],
     ["Geteilt", b.shares]].forEach(function (w) {
      var d = document.createElement("div");
      d.innerHTML = "<b>" + (w[1] || 0).toLocaleString("de-CH") + "</b><span>" +
                    esc(w[0]) + "</span>";
      zahlen.appendChild(d);
    });
    koerper.appendChild(zahlen);

    var her = document.createElement("p");
    her.className = "note";
    her.style.margin = "2px 0 10px";
    her.innerHTML = "Gemessen am " + esc(b.zahlen_vom || "?") + " · kommt von Instagram" +
      (b.geplant_als ? " · geplant als <b>" + esc(b.geplant_als) + "</b>" : "") +
      (b.link ? ' · <a href="' + esc(b.link) + '" target="_blank" rel="noopener">ansehen ↗</a>' : "");
    koerper.appendChild(her);

    if (b.hook) {
      var hk = document.createElement("p");
      hk.className = "gphook";
      hk.textContent = "„" + b.hook + "“";
      koerper.appendChild(hk);
    }

    // Patricias Einordnung. Die Optionen kommen aus den Daten, nicht aus
    // diesem Code — siehe FELDER in gepostet-bauen.py.
    var felder = (gepostet && gepostet.felder) || [];
    var raster = document.createElement("div");
    raster.className = "gpfelder";
    felder.forEach(function (f) {
      var d = document.createElement("div");
      d.className = "field";
      var l = document.createElement("label");
      l.textContent = f.l;
      var sel = document.createElement("select");
      var opts = f.opt === "__angebote__" ? gpAngebote() : f.opt;
      opts.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o; op.textContent = o || "—";
        if ((n[f.k] || "") === o) op.selected = true;
        sel.appendChild(op);
      });
      sel.onchange = function () {
        if (!gepostetNotizen[b.id]) gepostetNotizen[b.id] = {};
        gepostetNotizen[b.id][f.k] = sel.value;
        notizSpeichern();
        render();
      };
      d.appendChild(l); d.appendChild(sel);
      if (f.hinweis) {
        var h = document.createElement("span");
        h.className = "note";
        h.textContent = f.hinweis;
        d.appendChild(h);
      }
      raster.appendChild(d);
    });
    koerper.appendChild(raster);

    var nf = document.createElement("div");
    nf.className = "field";
    nf.style.marginTop = "10px";
    var nl = document.createElement("label");
    nl.textContent = "Was du daraus mitnimmst";
    var ta = document.createElement("textarea");
    ta.className = "gpnotiz";
    ta.rows = 3;
    ta.placeholder = "Warum lief das so? Was machst du beim nächsten Mal anders?";
    ta.value = n.notiz || "";
    ta.oninput = function () {
      if (!gepostetNotizen[b.id]) gepostetNotizen[b.id] = {};
      gepostetNotizen[b.id].notiz = ta.value;
      notizSpeichern();
    };
    nf.appendChild(nl); nf.appendChild(ta);
    koerper.appendChild(nf);

    karte.appendChild(koerper);
    return karte;
  }

  /* Einen gelaufenen Beitrag zurueck in die Planung holen.
     🚨 Nur in den Ideenvorrat — nie direkt auf einen Wochenplatz. Was wann
     rausgeht, bleibt Patricias Entscheidung. */
  function recycelnAlsIdee(b, knopf) {
    var text = (b.hook || b.anfang || "").slice(0, 200);
    state.ideen.unshift({
      id: uid("i"),
      typ: "Recycling",
      saeule: (gepostetNotizen[b.id] || {}).saeule || SAEULEN[0],
      text: text,
      quelle: "lief am " + b.datum + " gut (" + b.reach + " Reichweite" +
              (b.rate != null ? ", " + b.rate + " %" : "") + ")",
      status: "Offen"
    });
    saveList("ideen");
    if (!gepostetNotizen[b.id]) gepostetNotizen[b.id] = {};
    gepostetNotizen[b.id].recycelt = todayISO();
    notizSpeichern();
    knopf.disabled = true;
    knopf.textContent = "in der Ideenliste";
    toast("In den Ideenvorrat gelegt. Einplanen machst du in der Wochen-Vorschau.");
  }

      was: ["Nimm ihn als Vorlage — Aufbau, Länge, Tonfall.",
            "Zweites Format bauen und als Lead-Post mit Keyword ausspielen.",
            "Für eine Anzeige der beste Kandidat, den du hast."]
    }
  };

  function gpEinschlagBlock(liste) {
    var treffer = liste.filter(function (b) {
      return b.einschlag_aktuell && !(gepostetNotizen[b.id] || {}).ausgewertet;
    }).sort(function (x, y) { return (y.faktor || 0) - (x.faktor || 0); });
    if (!treffer.length) return null;

    var box = document.createElement("div");
    box.className = "panel gpein";
    box.style.marginBottom = "18px";
    box.innerHTML = "<h2>Das hier ist eingeschlagen <span class=\"gpzahl orange\">" +
      treffer.length + "</span></h2>" +
      '<p class="note">Weit über deinem Schnitt. Hier lohnt sich mehr als ' +
      'nochmal posten — und darauf musst du keine vier Wochen warten, solange ' +
      'du es neu baust statt zu wiederholen.</p>';

    treffer.slice(0, 5).forEach(function (b) {
      var rat = EINSCHLAG_RAT[b.einschlag_art] || EINSCHLAG_RAT.reichweite;
      var k = document.createElement("div");
      k.className = "gpeinkarte";
      var h =
        '<div class="gpeinkopf">' +
          '<span class="gpfaktor">' + (b.faktor || "?") + '×</span>' +
          '<span class="gpeinart">' + esc(rat.titel) + '</span>' +
          '<span class="gpdatum">' + esc(b.datum) + ' · vor ' +
            b.alter_tage + ' Tagen</span>' +
          '<span class="gpreach">' + (b.reach || 0).toLocaleString("de-CH") +
            ' Reichweite</span>' +
        '</div>' +
        '<p class="gpeintext">' + esc(b.hook || b.anfang || "") + '</p>' +
        '<p class="note">' + esc(rat.satz) + '</p>' +
        '<ul class="gpeinliste">' +
          rat.was.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") +
        '</ul>';
      k.innerHTML = h;

      var leiste = document.createElement("div");
      leiste.className = "gpeinknoepfe";

      var a = document.createElement("button");
      a.className = "btn primary";
      a.textContent = "Daraus mehr machen";
      a.onclick = function () {
        state.ideen.unshift({
          id: uid("i"),
          typ: "Einschlag",
          saeule: (gepostetNotizen[b.id] || {}).saeule || SAEULEN[0],
          text: (b.hook || b.anfang || "").slice(0, 200),
          quelle: "schlug am " + b.datum + " ein (" + b.reach + " Reichweite, " +
                  b.faktor + "× dein Median) — " + rat.was[0],
          status: "Offen"
        });
        saveList("ideen");
        a.disabled = true;
        a.textContent = "in der Ideenliste";
        toast("In den Ideenvorrat gelegt, mit dem Vorschlag dabei.");
      };
      leiste.appendChild(a);

      if (b.link) {
        var l = document.createElement("a");
        l.className = "btn";
        l.href = b.link; l.target = "_blank"; l.rel = "noopener";
        l.textContent = "Beitrag ansehen";
        leiste.appendChild(l);
      }

      // 🚨 Kein Loeschen, sondern „abgehakt". Der Beitrag bleibt im Archiv —
      // nur aus dieser Liste verschwindet er, damit sie nicht jeden Tag
      // dieselben zwei sieht.
      var w = document.createElement("button");
      w.className = "btn ghost";
      w.textContent = "Hab ich ausgewertet";
      w.onclick = function () {
        if (!gepostetNotizen[b.id]) gepostetNotizen[b.id] = {};
        gepostetNotizen[b.id].ausgewertet = todayISO();
        notizSpeichern();
        render();
      };
      leiste.appendChild(w);

      k.appendChild(leiste);
      box.appendChild(k);
    });
    return box;
  }

  /* Die staerksten ueberhaupt — zeitlos, ohne Handlungsdruck.
     🚨 Bewusst getrennt vom Einschlag-Block: ueber zwei Jahre Historie waeren
     123 Beitraege „eingeschlagen", und eine Arbeitsliste mit 123 Zeilen ist
     keine. Hier steht, was je funktioniert hat; dort, was gerade passiert. */
  function gpBestenliste(liste) {
    var ids = (gepostet && gepostet.bestenliste) || [];
    if (!ids.length) return null;
    var nach = {};
    liste.forEach(function (b) { nach[b.id] = b; });
    var top = ids.map(function (i) { return nach[i]; }).filter(Boolean);
    if (!top.length) return null;

    var box = document.createElement("div");
    box.className = "panel";
    box.style.marginBottom = "18px";
    box.innerHTML = "<h2>Deine stärksten Beiträge überhaupt</h2>" +
      '<p class="note">Über die ganze Historie. Kein To-do — aber es lohnt sich ' +
      'zu wissen, was bei dir je funktioniert hat.</p>';
    top.forEach(function (b, i) {
      var z = document.createElement("div");
      z.className = "gpbestzeile";
      z.innerHTML =
        '<span class="gpplatz">' + (i + 1) + '</span>' +
        '<span class="gpdatum">' + esc(b.datum) + '</span>' +
        '<span class="gptext">' + esc(b.anfang || "") + '</span>' +
        '<span class="gpreach"><b>' + (b.reach || 0).toLocaleString("de-CH") + '</b></span>' +
        (b.link ? '<a href="' + esc(b.link) + '" target="_blank" rel="noopener">↗</a>'
                : '<span></span>');
      box.appendChild(z);
    });
    return box;
  }

  function gpRecyclingBlock(liste) {
    var r = (gepostet && gepostet.regeln) || {};
    var kandidaten = liste.filter(function (b) {
      return b.recycling && !(gepostetNotizen[b.id] || {}).recycelt;
    }).sort(function (x, y) { return (y.reach || 0) - (x.reach || 0); });

    var box = document.createElement("div");
    box.className = "panel gprec";
    box.style.marginBottom = "18px";

    if (!kandidaten.length) {
      box.innerHTML = "<h2>Kann wieder raus</h2>" +
        '<div class="empty">Gerade nichts. Ein Beitrag kommt hier rein, wenn er ' +
        'überdurchschnittlich lief und mindestens ' + (r.recycling_ab_tagen || 28) +
        ' Tage her ist.</div>';
      return box;
    }

    box.innerHTML = "<h2>Kann wieder raus <span class=\"gpzahl\">" +
      kandidaten.length + "</span></h2>" +
      '<p class="note">Lief besser als dein Schnitt und ist mindestens ' +
      (r.recycling_ab_tagen || 28) + ' Tage her. Der Knopf legt es in den ' +
      'Ideenvorrat — eingeplant wird es wie immer in der Wochen-Vorschau.</p>';

    kandidaten.slice(0, 8).forEach(function (b) {
      var z = document.createElement("div");
      z.className = "gpreczeile";
      z.innerHTML =
        '<span class="gpdatum">' + esc(b.datum) + '</span>' +
        '<span class="gpalter">vor ' + b.alter_tage + ' Tagen</span>' +
        '<span class="gptext">' + esc(b.hook || b.anfang || "") + '</span>' +
        '<span class="gpreach">' + (b.reach || 0).toLocaleString("de-CH") + '</span>';
      var k = document.createElement("button");
      k.className = "btn";
      k.textContent = "Nochmal bringen";
      k.onclick = function () { recycelnAlsIdee(b, k); };
      z.appendChild(k);
      box.appendChild(z);
    });

    if (kandidaten.length > 8) {
      var m = document.createElement("p");
      m.className = "note";
      m.style.marginTop = "8px";
      m.textContent = "und " + (kandidaten.length - 8) + " weitere weiter unten in der Liste.";
      box.appendChild(m);
    }
    return box;
  }

  function renderGepostet(main) {
    if (!gepostet || !(gepostet.beitraege || []).length) {
      main.innerHTML =
        '<div class="page-head"><div><h1>Gepostet &amp; Analyse</h1>' +
        '<p>Was rausgegangen ist und was es gebracht hat.</p></div></div>' +
        '<div class="panel"><div class="empty">Noch kein Archiv. Es entsteht aus ' +
        'den Instagram-Zahlen:<br><code>python scripts/instagram-insights/holen.py</code>' +
        '<br><code>python scripts/cockpit/gepostet-bauen.py</code></div></div>';
      return;
    }

    var alle = gepostet.beitraege || [];
    var liste = gepostetProfil
      ? alle.filter(function (b) { return b.handle === gepostetProfil; })
      : alle;

    var mit = liste.filter(function (b) { return b.reach > 0; })
                   .map(function (b) { return b.reach; }).sort(function (x, y) { return x - y; });
    var median = mit.length ? mit[Math.floor(mit.length / 2)] : 0;
    // 🚨 Auch hier die alte Positionierung ausschliessen. Sonst steht in der
    // Kachel ein Rekord, den die Bestenliste darunter bewusst weglaesst — und
    // zwei Zahlen auf derselben Seite widersprechen sich.
    var bester = liste.filter(function (b) { return !b.alte_positionierung; })
      .sort(function (x, y) { return (y.reach || 0) - (x.reach || 0); })[0];
    var eingeordnet = liste.filter(function (b) {
      var n = gepostetNotizen[b.id] || {};
      return n.saeule || n.notiz;
    }).length;

    var handles = [];
    alle.forEach(function (b) {
      if (b.handle && handles.indexOf(b.handle) < 0) handles.push(b.handle);
    });

    var fw = gepostet.follower || {};
    var zuwachs = null, zuSeit = null;
    Object.keys(fw).forEach(function (h) {
      if (!gepostetProfil || h === gepostetProfil) {
        if (fw[h].zuwachs != null) {
          zuwachs = (zuwachs || 0) + fw[h].zuwachs;
          zuSeit = fw[h].seit;
        }
      }
    });

    main.innerHTML =
      '<div class="page-head"><div><h1>Gepostet &amp; Analyse</h1>' +
      '<p>Jeder Beitrag, der draussen war — mit den Zahlen, die Instagram dazu misst. ' +
      'Reichweite, Gespeichert, Geteilt und Kommentare holt der Abgleich selbst. ' +
      'Deine Einordnung und dein Fazit trägst du hier ein, sonst nichts.</p></div>' +
      '<div class="head-actions"><select class="btn" id="gpfilter"></select></div></div>' +
      (gepostet.veraltet
        ? '<p class="igwarn">Diese Zahlen sind ' + gepostet.alter_tage +
          ' Tage alt. Hol sie neu, bevor du danach entscheidest:<br>' +
          '<code>python scripts/instagram-insights/holen.py</code></p>'
        : "") +
      '<div class="tiles">' +
      // 🚨 Beide Zahlen kommen aus den Daten, nicht aus dem Ausschnitt. Das
      // Cockpit zeigt die jüngeren Beiträge, gerechnet wurde über alle — eine
      // Kachel, die den Median des Ausschnitts als „den" Median ausgibt,
      // behauptet etwas anderes, als sie misst.
      tile("Im Archiv", gepostet.archiv_gesamt || liste.length,
           (gepostet.archiv_gesamt && gepostet.archiv_gesamt !== liste.length
             ? liste.length + " davon hier · " : "") +
           "Stand " + esc(gepostet.stand || "?")) +
      tile("Reichweite",
           (gepostet.median_je_konto &&
            (gepostetProfil
              ? gepostet.median_je_konto[gepostetProfil]
              : Math.max.apply(null, Object.keys(gepostet.median_je_konto)
                  .map(function (k) { return gepostet.median_je_konto[k]; })))) || median,
           "Median über alle") +
      tile("Bester", bester ? bester.reach : 0,
           bester ? esc((bester.datum || "")) : "—") +
      (zuwachs != null
        ? tile("Follower", (zuwachs >= 0 ? "+" : "") + zuwachs, "seit " + esc(zuSeit || ""))
        : "") +
      tile("Eingeschlagen",
           liste.filter(function (b) {
             return b.einschlag_aktuell && !(gepostetNotizen[b.id] || {}).ausgewertet;
           }).length,
           "in den letzten 90 Tagen") +
      tile("Kann wieder raus",
           liste.filter(function (b) {
             return b.recycling && !(gepostetNotizen[b.id] || {}).recycelt;
           }).length,
           "überdurchschnittlich gelaufen") +
      tile("Eingeordnet", eingeordnet + " von " + liste.length, "mit Säule oder Fazit") +
      '</div>' +
      '<div class="panel" style="margin-bottom:14px"><div class="gpkopfzeile">' +
        '<span>Datum</span><span>Art</span><span>Anfang</span>' +
        '<span>Rate</span><span>Reichweite</span></div>' +
        '<div id="gpliste"></div></div>' +
      '<p class="note">Die Rate sind Interaktionen je erreichte Person — ' +
      'Richtwert 1 bis 3 Prozent. Auf die Reichweite gerechnet, nicht auf die ' +
      'Followerzahl: sonst wären die beiden Profile nicht vergleichbar. ' +
      'Das Archiv wächst mit jedem Abruf, auch wenn Instagram nur die letzten ' +
      '25 Beiträge herausgibt.</p>';

    var f = main.querySelector("#gpfilter");
    [["", "Beide Profile"]].concat(handles.map(function (h) { return [h, "@" + h]; }))
      .forEach(function (o) {
        var op = document.createElement("option");
        op.value = o[0]; op.textContent = o[1];
        if (gepostetProfil === o[0]) op.selected = true;
        f.appendChild(op);
      });
    f.onchange = function () { gepostetProfil = f.value; render(); };

    var einBox = gpEinschlagBlock(liste);
    var recBox = gpRecyclingBlock(liste);
    var listenPanel = main.querySelector("#gpliste").parentNode;
    listenPanel.parentNode.insertBefore(recBox, listenPanel);
    if (einBox) listenPanel.parentNode.insertBefore(einBox, recBox);
    var bestBox = gpBestenliste(liste);
    if (bestBox) listenPanel.parentNode.insertBefore(bestBox, listenPanel);

    var box = main.querySelector("#gpliste");
    liste.forEach(function (b) { box.appendChild(gpKarte(b)); });
  }

  function igZeile(k) {
    var b = k.bester, s = k.schwaechster;
    return '<div class="igkonto">' +
      '<div class="igkopf"><strong>@' + esc(k.handle) + '</strong>' +
        '<span class="note">' + (k.follower || 0).toLocaleString("de-CH") +
        ' Follower · ' + (k.beitraege_gezaehlt || 0) + ' Beiträge</span></div>' +
      '<div class="igwerte">' +
        '<div><b>' + (k.reichweite_median || 0) + '</b><span>Reichweite (Median)</span></div>' +
        '<div><b>' + (k.reichweite_schnitt || 0) + '</b><span>Schnitt</span></div>' +
        '<div><b>' + (k.gespeichert || 0) + '</b><span>gespeichert</span></div>' +
        '<div><b>' + (k.geteilt || 0) + '</b><span>geteilt</span></div>' +
      '</div>' +
      (b ? '<p class="note" style="margin:6px 0 0">Bester: ' + esc(b.datum) +
           ' · ' + b.reach + ' — ' + esc(b.anfang) + '</p>' : "") +
      (s && b && s.datum !== b.datum
           ? '<p class="note" style="margin:2px 0 0">Schwächster: ' + esc(s.datum) +
             ' · ' + s.reach + ' — ' + esc(s.anfang) + '</p>' : "") +
    '</div>';
  }

  /* Monatsverlauf ueber alle Kanaele. Ergaenzt den Instagram-Block darueber:
     der zeigt den Stand von heute, das hier die Entwicklung. */
  function reichweiteBlock() {
    if (!reichweite || !(reichweite.monate || []).length) return "";
    var m = reichweite.monate;
    var kopf = '<div class="rwzeile kopf"><span>Monat</span><span>Beiträge</span>' +
      '<span>Reichweite</span><span>Interaktionen</span><span>Newsletter</span>' +
      '<span>Öffnungsrate</span></div>';
    var zeilen = m.slice(0, 12).map(function (e) {
      var rate = e.oeffnungsrate;
      var ton = rate == null ? "" : (rate >= 30 ? " gut" : (rate >= 18 ? "" : " schwach"));
      return '<div class="rwzeile' + (e.laeuft_noch ? " laeuft" : "") + '">' +
        '<span>' + esc(e.monat) + (e.laeuft_noch ? ' <span class="note">läuft</span>' : "") + '</span>' +
        '<span>' + e.ig_beitraege + '</span>' +
        '<span>' + (e.ig_reichweite || 0).toLocaleString("de-CH") + '</span>' +
        '<span>' + (e.ig_interaktionen || 0).toLocaleString("de-CH") + '</span>' +
        '<span>' + e.newsletter + (e.empfaenger ? ' <span class="note">à ' +
          Math.round(e.empfaenger / Math.max(1, e.newsletter)) + '</span>' : "") + '</span>' +
        '<span class="rwrate' + ton + '">' +
          (rate == null ? "—" : rate + " %") + '</span>' +
        '</div>';
    }).join("");
    return '<div class="panel" style="margin-bottom:18px"><h2>Reichweite über die Monate</h2>' +
      '<p class="note">Instagram aus der Graph API, Newsletter aus ActiveCampaign — ' +
      'nichts davon trägst du ein. Die Öffnungsrate rechnet auf die tatsächlich ' +
      'zugestellten Mails, nicht auf die Listengrösse: sonst sänke sie jedes Mal, ' +
      'wenn die Liste wächst.</p>' +
      '<div class="rwtabelle">' + kopf + zeilen + '</div>' +
      '<p class="note" style="margin-top:9px">Von Hand bleiben: ' +
      esc((reichweite.von_hand || []).join(" · ")) + '. Dafür gibt es keine Schnittstelle.</p>' +
      '</div>';
  }

  function igBlock() {
    if (!igzahlen || !(igzahlen.konten || []).length) {
      return '<div class="panel" style="margin-bottom:18px">' +
        '<h2>Was Instagram misst</h2>' +
        '<div class="empty">Noch keine Zahlen geholt.<br>' +
        '<code>python scripts/instagram-insights/holen.py</code></div></div>';
    }
    // 🚨 Eine Zahl ohne Datum daneben sieht immer aktuell aus. Ist der Abzug
    // drei Tage oder aelter, muss das ins Auge springen.
    var alt = igzahlen.veraltet;
    return '<div class="panel' + (alt ? " igalt" : "") + '" style="margin-bottom:18px">' +
      '<h2>Was Instagram misst ' +
        '<span class="note">· Stand ' + esc(igzahlen.stand || "?") +
        (igzahlen.alter_tage != null ? " · " + igzahlen.alter_tage + " Tage alt" : "") +
        '</span></h2>' +
      (alt ? '<p class="igwarn">Diese Zahlen sind ' + igzahlen.alter_tage +
             ' Tage alt. Hol sie neu, bevor du danach entscheidest:<br>' +
             '<code>python scripts/instagram-insights/holen.py</code></p>' : "") +
      (igzahlen.konten || []).map(igZeile).join("") +
      '<p class="note" style="margin:10px 0 0">Median statt Schnitt lesen — ' +
      'ein einzelnes starkes Reel zieht den Schnitt hoch.</p>' +
    '</div>';
  }

  function renderZahlen(main) {
    var ziel = Number(settings.monatsziel) || 0;
    var reihen = state.zahlen.slice().sort(function (a, b) { return (a.monat || "") < (b.monat || "") ? -1 : 1; });
    var letzte = reihen.slice(-12);
    var maxU = Math.max(ziel, 1);
    letzte.forEach(function (r) { maxU = Math.max(maxU, Number(r.umsatz) || 0); });
    var jetzt = new Date().toISOString().slice(0, 7);
    var akt = reihen.filter(function (r) { return r.monat === jetzt; })[0];
    var aktU = akt ? Number(akt.umsatz) || 0 : 0;
    var pct = ziel ? Math.min(100, Math.round(aktU / ziel * 100)) : 0;
    var verkGesamt = reihen.reduce(function (a, r) { return a + (Number(r.verkaeufe) || 0); }, 0);
    var listeGesamt = reihen.reduce(function (a, r) { return a + (Number(r.liste) || 0); }, 0);

    main.innerHTML =
      '<div class="page-head"><div><h1>Zahlen & Ziele</h1>' +
      '<p>Du trägst ein, was war. Das Cockpit rechnet und zeigt, wie weit du vom Monatsziel weg bist.</p></div>' +
      '<div class="head-actions">' +
      '<div class="field"><label for="zielin">Monatsziel in ' + esc(settings.waehrung || "CHF") + '</label>' +
      '<input id="zielin" type="number" value="' + ziel + '" style="width:130px"></div>' +
      '<button class="btn primary" id="addmonat" style="align-self:flex-end">Monat hinzufügen</button></div></div>' +
      '<div class="tiles">' +
        tile("Dieser Monat", (settings.waehrung || "CHF") + " " + aktU.toLocaleString("de-CH"), pct + "% vom Ziel") +
        tile("Noch bis zum Ziel", (settings.waehrung || "CHF") + " " + Math.max(0, ziel - aktU).toLocaleString("de-CH"), "in " + monatName(jetzt)) +
        tile("Verkäufe gesamt", verkGesamt, "über alle erfassten Monate") +
        tile("Liste gewachsen um", listeGesamt, "neue Kontakte gesamt") +
      '</div>' +
      igBlock() +
      reichweiteBlock() +
      '<div class="panel" id="planbox" style="margin-bottom:18px"></div>' +
      '<div class="cols" style="align-items:start">' +
        '<div class="panel" style="grid-column:1/-1"><h2>Umsatz pro Monat</h2>' +
          '<div class="goalline" id="chart"></div></div>' +
      '</div>' +
      '<div class="tablewrap" style="margin-top:18px"><div id="zrows"></div></div>';

    var zi = main.querySelector("#zielin");
    zi.oninput = function () { settings.monatsziel = Number(zi.value); saveSettings(); };
    zi.onchange = function () { render(); };

    renderPlan(main.querySelector("#planbox"));

    var chart = main.querySelector("#chart");
    if (!letzte.length) {
      chart.innerHTML = '<div class="empty">Noch keine Monate erfasst. Leg unten den ersten an.</div>';
    } else {
      chart.innerHTML = '<div class="columns">' + letzte.map(function (r) {
        var u = Number(r.umsatz) || 0;
        var h = Math.round(u / maxU * 100);
        return '<div class="col-item"><div class="col-bar" style="height:' + h + '%" title="' +
          esc(monatName(r.monat) + ": " + (settings.waehrung || "CHF") + " " + u.toLocaleString("de-CH")) + '"></div>' +
          '<div class="col-cap">' + esc(monatName(r.monat)) + '</div></div>';
      }).join("") + '</div>';
      if (ziel) {
        var gl = document.createElement("div");
        gl.className = "gl";
        gl.style.top = (10 + (1 - ziel / maxU) * 140) + "px";
        gl.innerHTML = '<span>Ziel ' + ziel.toLocaleString("de-CH") + '</span>';
        chart.appendChild(gl);
      }
    }

    var cols = [
      { k: "monat", l: "Monat", t: "month", w: "150px" },
      { k: "umsatz", l: "Umsatz", t: "number", w: "130px" },
      { k: "verkaeufe", l: "Verkäufe", t: "number", w: "110px" },
      { k: "liste", l: "Neu auf der Liste", t: "number", w: "150px" },
      { k: "notiz", l: "Was war der Grund", t: "text", w: "minmax(240px, 1fr)" }
    ];
    var grid = cols.map(function (c) { return c.w; }).join(" ") + " 34px";
    var rows = main.querySelector("#zrows");
    var head = document.createElement("div");
    head.className = "trow head";
    head.style.gridTemplateColumns = grid;

  /* =========================================================
     Steuer-Unterlage — je Jahr eine Bilanz, auf Knopfdruck als CSV.

     ACHTUNG: Der Knopf gibt die ZAHLEN heraus, nicht die Belegdateien. Die
     liegen im Workspace; ein Artifact kommt nicht an den Dateiordner. Die
     CSV nennt je Zeile den Dateinamen, und unter dem Knopf steht der Befehl
     fuer das vollstaendige Paket.
     ========================================================= */
  function csvFeld(x) {
    x = (x === null || x === undefined) ? "" : String(x);
    return /[";\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
  }

  function csvDatei(kopf, zeilen) {
    var text = [kopf].concat(zeilen).map(function (r) {
      return r.map(csvFeld).join(";");
    }).join("\r\n");
    // BOM, sonst zerlegt Excel auf Deutsch die Umlaute.
    return new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
  }

  function steuerAbgeben(jahr) {
    if (!downloads) { toast("Herunterladen ist hier nicht verfügbar."); return; }
    var zeilen = ((steuer && steuer.zeilen) || []).filter(function (z) {
      return z.jahr === jahr;
    });
    if (!zeilen.length) { toast("Für " + jahr + " sind keine Ausgaben erfasst."); return; }

    var aus = csvDatei(
      ["Datum", "Was", "Kategorie", "Betrag", "Waehrung", "Beleg", "Quelle"],
      zeilen.map(function (z) {
        return [z.datum, z.was, z.art, Number(z.betrag).toFixed(2), z.waehrung,
                z.beleg || "FEHLT", z.quelle];
      }));

    downloads.save({ filename: "ausgaben-" + jahr + ".csv", data: aus })
      .then(function () {
        toast("Ausgaben " + jahr + " abgelegt · " + zeilen.length + " Zeilen");
      })
      .catch(function () { toast("Abgabe abgebrochen."); });
  }

  /* =========================================================
     Story-Rendering (1080 x 1920)
     ========================================================= */
  var SW = 1080, SH = 1920;
  var STORY_LAYOUTS = {
    text: "Text",
    bild: "Bild mit Text",
    frage: "Fragebox",
    umfrage: "Umfrage",
    cta: "Aufruf"
  };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); }
    else {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  function renderStoryFrame(canvas, fr, st, index, total) {
    var b = BRANDS[st.brand] || BRANDS.mlb_dark;
    var ctx = canvas.getContext("2d");
    canvas.width = SW; canvas.height = SH;
    var pad = 96;

    ctx.fillStyle = b.bg;
    ctx.fillRect(0, 0, SW, SH);

    getImageObj(fr.id, function (img) {
      if (img) {
        drawCover(ctx, img, 0, 0, SW, SH, fr.zoom, fr.ox, fr.oy);
        var g = ctx.createLinearGradient(0, 0, 0, SH);
        g.addColorStop(0, "rgba(0,0,0,0.45)");
        g.addColorStop(0.42, "rgba(0,0,0,0.12)");
        g.addColorStop(1, b.bg);
        ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH);
      } else if (fr.layout === "bild") {
        ctx.fillStyle = b.bg2; ctx.fillRect(0, 0, SW, SH);
        ctx.fillStyle = b.muted; ctx.font = "36px " + b.body; ctx.textAlign = "center";
        ctx.fillText("Bild hier hochladen", SW / 2, SH / 2);
        ctx.textAlign = "left";
      }

      // Fortschrittsbalken oben
      var segW = (SW - pad * 2 - (total - 1) * 8) / total;
      for (var i = 0; i < total; i++) {
        ctx.fillStyle = i <= index ? b.text : b.muted;
        ctx.globalAlpha = i <= index ? 0.9 : 0.3;
        roundRect(ctx, pad + i * (segW + 8), 62, segW, 7, 4);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Handle
      var hd = st.handle || b.handle;
      if (hd) {
        ctx.fillStyle = b.accent2;
        ctx.beginPath(); ctx.arc(pad + 26, 132, 26, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = b.text; ctx.font = "26px " + b.body;
        ctx.textBaseline = "middle"; ctx.fillText(hd, pad + 68, 134); ctx.textBaseline = "alphabetic";
      }

      var maxW = SW - pad * 2;

      if (fr.layout === "frage" || fr.layout === "umfrage") {
        var box = fitLines(ctx, fr.text, maxW - 80, 420, b.display, "bold", 62, 34, 1.2);
        var boxH = box.lines.length * box.size * 1.2 + 200;
        var by = SH * 0.36;
        ctx.fillStyle = b.bg2;
        ctx.globalAlpha = img ? 0.92 : 1;
        roundRect(ctx, pad, by, maxW, boxH, 36); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.font = "bold " + box.size + "px " + b.display;
        ctx.fillStyle = b.text;
        ctx.textAlign = "center";
        box.lines.forEach(function (ln, i) { ctx.fillText(ln, SW / 2, by + 78 + box.size + i * box.size * 1.2); });
        var innerY = by + 88 + box.lines.length * box.size * 1.2;
        if (fr.layout === "frage") {
          ctx.fillStyle = b.bg;
          roundRect(ctx, pad + 48, innerY, maxW - 96, 88, 44); ctx.fill();
          ctx.fillStyle = b.muted; ctx.font = "32px " + b.body;
          ctx.fillText(fr.cta || "Antworten …", SW / 2, innerY + 56);
        } else {
          var bw = (maxW - 96 - 24) / 2;
          [[fr.optA || "Ja", pad + 48], [fr.optB || "Nein", pad + 48 + bw + 24]].forEach(function (o) {
            ctx.fillStyle = b.accent;
            roundRect(ctx, o[1], innerY, bw, 88, 44); ctx.fill();
            ctx.fillStyle = b.bg; ctx.font = "bold 34px " + b.body;
            ctx.fillText(o[0], o[1] + bw / 2, innerY + 56);
          });
        }
        ctx.textAlign = "left";
      } else {
        var isCta = fr.layout === "cta";
        var t = fitLines(ctx, fr.text, maxW, SH * 0.42, b.display, "bold", isCta ? 76 : 68, 36, 1.2);
        var blockH = t.lines.length * t.size * 1.2;
        var ty = fr.layout === "bild" ? SH - pad - 260 - blockH : (SH - blockH) / 2;
        ctx.font = "bold " + t.size + "px " + b.display;
        ctx.fillStyle = b.text;
        t.lines.forEach(function (ln, i) { ctx.fillText(ln, pad, ty + t.size + i * t.size * 1.2); });
        if (fr.cta) {
          ctx.font = "bold 38px " + b.body;
          var cw = ctx.measureText(fr.cta).width;
          var cy = ty + blockH + 70;
          ctx.fillStyle = b.accent;
          roundRect(ctx, pad, cy, cw + 74, 96, 48); ctx.fill();
          ctx.fillStyle = b.bg;
          ctx.fillText(fr.cta, pad + 37, cy + 60);
        }
      }
    });
  }

     Mein Wissen
     ========================================================= */
  /* Die Hook-Mechanik. Abschrift aus dem Hook-Skill, weil eine Artifact-Seite
     nicht an die Dateien im Workspace kommt. Aendert sich der Skill, gehoert das
     hier nachgezogen. */
  var HOOKREGELN = [
    "HOOK-MECHANIK",
    "",
    "Reihenfolge der Hebel: Wen du ansprichst schlaegt das Thema, das Thema schlaegt die",
    "Formulierung. Ein guter Hook auf dem falschen Thema rettet nichts.",
    "",
    "Bewusstseinsstufen — wen der Hook gerade abholt:",
    "1 unbewusst: spuert nichts Konkretes. Szene aus dem Leben, kurz und bildhaft.",
    "2 problembewusst: spuert den Schmerz, kennt keinen Weg. Ihr eigener Gedanke, woertlich.",
    "3 loesungsbewusst: kennt Wege, weiss nicht welchen. Warum ausgerechnet so.",
    "4 angebotsbewusst: kennt Patricia, zoegert. Einwand aufgreifen, Beweis zeigen.",
    "5 kaufbereit: will nur den Anstoss. Angebot und echter Anlass.",
    "In der Praxis: Reichweiten-Beitraege auf Stufe 1 bis 2 — der Hook stellt IHRE Frage",
    "und gibt nicht schon Patricias Antwort. Lead-Beitraege mit Kommentar-Stichwort auf",
    "Stufe 2 bis 3. Erst Stories, Mails und Launch duerfen auf 4 bis 5.",
    "Pruefsatz: \u201eMeine Posts funktionieren nicht\u201c ist schon Stufe 3. Stufe 2 klingt nach",
    "\u201eich stecke so viel rein und es kommt nichts zurueck\u201c.",
    "",
    "Angles — aus welcher Richtung geschaut wird. Nicht zu verwechseln mit der Formel:",
    "die Formel sagt, wie ein Hook KLINGT, der Angle sagt, worauf er ZIELT.",
    "Schmerz (der Zustand, wie er sich anfuehlt) · Ergebnis (wie es aussieht, wenn es",
    "geloest ist) · Beweis (was andere erlebt haben) · Kontraer (die verbreitete Annahme",
    "stimmt nicht) · Identitaet (fuer genau die, die ...) · Neugier (der uebersehene Hebel) ·",
    "Vergleich (anders als der uebliche Weg).",
    "Regel: ueber ein Set von Hooks mindestens DREI verschiedene Angles mischen. Zehn Hooks",
    "koennen formal bunt sein und trotzdem alle denselben Nerv treffen — wen der erste nicht",
    "abholt, den holt auch der zehnte nicht ab.",
    "",
    "Laenge: kurz. Die erste Zeile muss allein ziehen, bevor jemand auf Mehr anzeigen tippt.",
    "",
    "DER LETZTE CHECK — vier Fragen, bevor ein Hook stehen bleibt.",
    "Eine einzige Frage mit Nein, und der Hook wird neu geschrieben. Nie die Caption",
    "nachbessern, um einen schwachen Hook zu retten.",
    "1. Trifft es wirklich einen Schmerz? Nicht \u201esie wuerde zustimmen\u201c, sondern es trifft.",
    "   Benenne den Schmerz woertlich. Wenn du keinen benennen kannst, ist es kein Hook,",
    "   sondern eine Aussage.",
    "2. Denkt sie \u201ekrass, wieso weiss die, was ich denke\u201c? Das ist die Latte — nicht",
    "   \u201einteressant\u201c, nicht \u201eguter Punkt\u201c. Zustimmung ist kein Stopp.",
    "   Test: Hat diese Frau das gestern Abend wirklich gedacht?",
    "3. Wuerdest du das so am Kuechentisch zu einer Freundin sagen?",
    "4. Ist die Loesung draussen? Die Loesung kommt nie im Hook. Der Hook stellt ihre Frage.",
    "",
    "DER BEITRAGS-CHECK — vier Fragen fuer den ganzen Beitrag.",
    "Beruehrt es. Nimmt sie etwas Konkretes mit. Warum sollte sie das speichern oder",
    "weiterschicken. Warum sollte sie kommentieren.",
    "Hintergrund: Patricias Engagement lag bei 0,3 bis 0,5 Prozent, der Richtwert ist 1 bis 3.",
    "Der Befund war: zu nuechtern und zu abstrakt — weder beruehrt noch konkret weitergeholfen.",
    "",
    "CTA nach der 3+1-Regel: drei Reichweiten-Beitraege mit Teilen-Aufruf, einer als",
    "Lead-Beitrag mit Kommentar-Stichwort. Reichweiten-Beitraege nie mit Verkauf ueberladen."

  function wissenText(format) {
    var teile = WISSEN_FELDER.map(function (f) {
      return f.l.toUpperCase() + ":\n" + (wissen[f.k] || f.d);
    });
    teile.push("ANGEBOTE:\n" + (state.produkte.length
      ? state.produkte.map(function (a) { return a.name + " (" + a.stufe + (a.preis ? ", " + a.preis : "") + (a.keyword ? ", Keyword " + a.keyword : "") + ")"; }).join("\n")
      : "noch keine erfasst"));
    teile.push("KÄUFERTYPEN:\nZögerliche Zoe, Ängstliche Amelie, Wissbegieriger Willi, Rudeltier Rudi, Fakten Frank, Inspirierte Ina");
    teile.push("CONTENT-SÄULEN:\n" + SAEULEN.join(", ") + ". Verhältnis 40/35/25 auf die ersten drei.");
    teile.push("PIE:\nJeder Beitrag ist Persönlichkeit, Inspiration oder Expertise.");
    teile.push(HOOKREGELN);
    if (wissenVoll && wissenVoll.text) {
      teile.push("DAS VOLLSTAENDIGE MARKENWISSEN (Stand " +
        (wissenVoll.stand || "unbekannt") + ")\n" + wissenVoll.text);
    }
    // Nur das Framework des gewaehlten Formats — Reel, Karussell oder Story.
    if (format && wissenVoll && wissenVoll.formate && wissenVoll.formate[format]) {
      teile.push("WISSEN ZUM FORMAT " + format.toUpperCase() + "\n" +
                 wissenVoll.formate[format]);
    }
    return teile.join("\n\n");
  }

  function renderWissen(main) {
    main.innerHTML =
      '<div class="page-head"><div><h1>Mein Wissen</h1>' +
      '<p>Das hier ist das Gehirn hinter dem Content-Studio. Alles, was in diesen Feldern steht, fliesst in jede Hook, jede Caption und jede Story, die du dir schreiben lässt. Je schärfer du es formulierst, desto weniger klingt der Output nach Maschine.</p></div>' +
      '<div class="head-actions"><button class="btn" id="reset">Auf Standard zurücksetzen</button></div></div>' +
      '<div class="wissen-grid" id="wg"></div>';

    var wg = main.querySelector("#wg");
    WISSEN_FELDER.forEach(function (f) {
      var panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML = "<h2>" + esc(f.l) + "</h2>";
      var ta = document.createElement("textarea");
      ta.value = wissen[f.k] != null ? wissen[f.k] : f.d;
      ta.oninput = function () { wissen[f.k] = ta.value; saveWissen(); };
      panel.appendChild(ta);
      wg.appendChild(panel);
    });
    var resetBtn = main.querySelector("#reset");
    var sicher = false;
    resetBtn.onclick = function () {
      if (!sicher) {
        sicher = true;
        resetBtn.textContent = "Sicher? Nochmal klicken";
        setTimeout(function () { sicher = false; resetBtn.textContent = "Auf Standard zurücksetzen"; }, 4000);
        return;
      }
      WISSEN_FELDER.forEach(function (f) { wissen[f.k] = f.d; });
      saveWissen(); render();
    };
  }

  /* =========================================================
     Content-Studio
     ========================================================= */
  /* Traegt eine Idee aus dem Vorrat ins Studio. Von dort geht es ueber
     „Als … anlegen" in die Wochen-Vorschau, wo Patricia freigibt. */
  function ideeInsStudio(idee) {
    studioForm.idee = idee.text || "";
    studioForm.ideeId = idee.id;
    if (idee.typ === "Angebot") studioForm.ziel = "Verkauf";
    else if (idee.typ === "Story") studioForm.format = "Story-Sequenz";
    studioResult = null;
    activeTab = "studio";
    render();
    toast("Idee ins Studio übernommen. Format wählen und schreiben lassen.");
  }

  /* Wird ein Beitrag daraus, ist die Idee verbraucht. */
  function ideeVerbraucht() {
    if (!studioForm.ideeId) return;
    var i = state.ideen.filter(function (x) { return x.id === studioForm.ideeId; })[0];
    if (i && i.status === "Offen") { i.status = "Verwendet"; saveList("ideen"); }
    studioForm.ideeId = null;
  }

  var studioForm = { idee: "", ziel: "Vertrauen", archetyp: "Zögerliche Zoe", angebot: "", phase: "", format: "Karussell", typ: "listicle", funnel: "TOF" };
  var studioResult = null;
  var studioBusy = false;

  function renderStudio(main) {
    main.innerHTML =
      '<div class="page-head"><div><h1>Content-Studio</h1>' +
      '<p>Eine Idee rein, fertiger Content raus. Alles wird mit deinem hinterlegten Wissen geschrieben, also mit deinem Ton, deinen Hookregeln und deinen Angeboten.' +
      (studioForm.ideeId ? ' <b>Kommt gerade aus deinem Ideen-Vorrat.</b>' : '') +
      '</p></div></div>' +
      '<div class="studio-grid">' +
        '<div class="panel"><h2>Woraus soll etwas werden</h2><div class="studio-form" id="sf"></div></div>' +
        '<div class="panel" id="sr"><h2>Ergebnis</h2><div class="empty">Noch nichts erstellt. Links eintragen, worum es geht, und auf Erstellen klicken.</div></div>' +
      '</div>';

    var sf = main.querySelector("#sf");
    function feld(label, el) {
      var d = document.createElement("div");
      d.className = "field";
      var l = document.createElement("label");
      l.textContent = label;
      d.appendChild(l); d.appendChild(el);
      sf.appendChild(d);
      return el;
    }
    var idee = document.createElement("textarea");
    idee.placeholder = "Zum Beispiel: warum der abgegraste Warmmarkt kein Grund zum Aufhören ist";
    idee.value = studioForm.idee;
    idee.oninput = function () { studioForm.idee = idee.value; };
    feld("Idee, Thema oder Gedanke", idee);

    function sel(key, opts) {
      var e = document.createElement("select");
      opts.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o; op.textContent = o || "—";
        if (studioForm[key] === o) op.selected = true;
        e.appendChild(op);
      });
      e.onchange = function () { studioForm[key] = e.value; };
      return e;
    }
    feld("Was soll es bewirken", sel("ziel", ["Vertrauen", "Reichweite", "Verkauf", "Positionierung"]));
    feld("Für welchen Käufertyp", sel("archetyp", ARCHETYPEN.filter(function (a) { return a !== "—"; })));
    feld("Auf welches Angebot zahlt es ein", sel("angebot", [""].concat(state.produkte.map(function (a) { return a.name; }))));
    feld("Launchphase, falls eine läuft", sel("phase", [""].concat(PHASEN)));
    feld("Was soll entstehen", sel("format", ["Karussell", "Reel", "Story-Sequenz", "Nur Hooks", "Nur Caption"]));

    var typSel = document.createElement("select");
    Object.keys(TYPEN).forEach(function (k) {
      var op = document.createElement("option");
      op.value = k; op.textContent = TYPEN[k];
      if (studioForm.typ === k) op.selected = true;
      typSel.appendChild(op);
    });
    var typHint = document.createElement("div");
    typHint.className = "note";
    typHint.textContent = TYP_HINWEIS[studioForm.typ] || "";
    typSel.onchange = function () {
      studioForm.typ = typSel.value;
      typHint.textContent = TYP_HINWEIS[studioForm.typ] || "";
    };
    feld("Karussell-Typ", typSel);
    sf.appendChild(typHint);

    var funSel = document.createElement("select");
    Object.keys(FUNNEL).forEach(function (k) {
      var op = document.createElement("option");
      op.value = k; op.textContent = FUNNEL[k];
      if (studioForm.funnel === k) op.selected = true;
      funSel.appendChild(op);
    });
    var funHint = document.createElement("div");
    funHint.className = "note";
    funHint.textContent = FUNNEL_HINWEIS[studioForm.funnel] || "";
    funSel.onchange = function () {
      studioForm.funnel = funSel.value;
      funHint.textContent = FUNNEL_HINWEIS[studioForm.funnel] || "";
    };
    feld("Funnel-Stufe", funSel);
    sf.appendChild(funHint);

    var go = document.createElement("button");
    go.className = "btn primary";
    go.textContent = studioBusy ? "schreibt …" : "Erstellen";
    go.disabled = studioBusy || !sampler;
    go.onclick = function () { studioErstellen(); };
    sf.appendChild(go);

    if (!sampler) {
      var n = document.createElement("div");
      n.className = "note";
      n.textContent = "Das Schreiben ist in dieser Ansicht nicht verfügbar. Öffne das Cockpit über den Link, dann geht es.";
      sf.appendChild(n);
    }

    if (studioResult) zeigeErgebnis(main.querySelector("#sr"));
  }

  function studioErstellen() {
    if (!sampler || studioBusy) return;
    if (!studioForm.idee.trim()) { toast("Schreib zuerst rein, worum es gehen soll."); return; }
    studioBusy = true;
    studioResult = null;
    render();
    var sr = document.getElementById("sr");
    if (sr) sr.innerHTML = "<h2>Ergebnis</h2><div class=\"thinking\">schreibt gerade, das dauert einen Moment …</div>";

    var f = studioForm;
    var FORMAT_SCHLUESSEL = { "Karussell": "karussell", "Reel": "reel", "Story-Sequenz": "story" };
    var basis =
      "Du bist die Ghostwriterin von Patricia Ulmann. Hier ist alles, was du über ihre Marke, ihre Zielgruppe und ihre Regeln wissen musst:\n\n" +
      wissenText(FORMAT_SCHLUESSEL[f.format] || "") +
      "\n\nHalte dich streng an Ton, Hookregeln und Verbote. Schreibe so, dass es nach ihr klingt und nicht nach Marketingtext.\n" +
      "Bevor du antwortest: geh die vier Fragen vom letzten Check und die vier vom Beitrags-Check durch. " +
      "Was eine davon nicht besteht, schreibst du neu, statt es abzuliefern.\n\n" +
      "AUFTRAG\nIdee: " + f.idee +
      "\nZiel des Beitrags: " + f.ziel +
      "\nKäufertyp, den er abholen soll: " + f.archetyp +
      (f.angebot ? "\nAngebot dahinter: " + f.angebot : "") +
      (f.phase ? "\nAktuelle Launchphase: " + f.phase : "") + "\n\n";

    var auftrag, schema;
    var TYP_AUFTRAG = {
      listicle: "Bau es als Listicle. Slide eins ist eine starke Headline mit einer Zahl, die neugierig macht. Danach pro Slide genau ein Punkt: die Headline IST der Punkt, der Body erklärt ihn in ein bis zwei Saetzen. Letzte Slide kurzer klarer Aufruf.",
      story: "Bau es als persönliche Geschichte. Slide eins ist ein Hook, der neugierig macht. Die Slides danach erzählen die Geschichte in Etappen wie eine Mini-Serie, und jede Slide endet so, dass man die nächste lesen will. Die vorletzte Slide sagt, was sie daraus mitgenommen hat und heute anders macht. Ton wie zu einer Freundin. Erfinde nichts dazu.",
      edukativ: "Bau es als Erklärung. Slide eins stellt eine Frage oder benennt ein Problem. Danach Schritt für Schritt, klar und ohne Fachbegriffe, oder den Fachbegriff sofort erklären. Die vorletzte Slide fasst alles in einem Satz zusammen.",
      kontrovers: "Bau es als kontroversen Take. Slide eins ist eine provokante Headline, die zum Widerspruch einlädt. Danach die Argumentation Schritt für Schritt mit konkreten Beispielen. Die vorletzte Slide ist die Nuancierung, also wo die Gegenposition recht hat. Diese Slide ist Pflicht und darf nicht fehlen, sie sorgt für Diskussion statt Streit."
    };
    var FUNNEL_AUFTRAG = {
      TOF: "Funnel-Stufe TOF: Der Post soll Reichweite bringen und geteilt werden. Kein Angebot, keine Preise, kein Programmname.",
      MOF: "Funnel-Stufe MOF: Der Post soll Vertrauen aufbauen und zeigen, wie sie denkt und arbeitet. Am Schluss ein Keyword-Aufruf.",
      BOF: "Funnel-Stufe BOF: Verkauft wird bei ihr nicht im Feed, sondern in Stories und Mails. Halte Angebot und Preis aus den Slides raus und führe über den Keyword-Aufruf zum Gespräch."
    };

    if (f.format === "Karussell") {
      auftrag = (TYP_AUFTRAG[f.typ] || TYP_AUFTRAG.listicle) + "\n" + (FUNNEL_AUFTRAG[f.funnel] || "") + "\n\n" +
        "Baue ein Instagram-Karussell mit sechs bis acht Slides. " +
        "Erlaubte Layouts: hook, text, split, bild, zitat, cta. Headlines kurz, Fliesstext höchstens vierzig Wörter pro Slide. " +
        "Gib ausserdem drei alternative Hooks und die fertige Caption nach dem hinterlegten Aufbau.\n\n" +
        'Antworte als JSON: {"name": "kurzer Titel", "hooks": ["...","...","..."], "slides": [{"layout": "hook", "headline": "...", "body": "...", "keyword": ""}], "caption": "...", "bildidee": "eine Zeile, was auf ein Bild gehört"}';
    } else if (f.format === "Reel") {
      auftrag = "Baue ein Reel. Halte dich an die Reel-Regeln oben: 3-Sekunden-Regel, " +
        "Struktur-Formel, On-Screen-Text, kein langweiliges Reel. " +
        "Das Sprechskript ist fuer ein Selfie-Video von dreissig bis fuenfundvierzig Sekunden, " +
        "in gesprochener Sprache, ohne Regieanweisungen im Text. " +
        "Die Titelbild-Hook hat hoechstens acht Woerter und steht gross lesbar auf dem Standbild. " +
        "Sag ausserdem, was auf dem Titelbild zu sehen sein soll, und gib drei alternative Hooks.\n\n" +
        'Antworte als JSON: {"name": "kurzer Titel", "hook": "Titelbild-Hook", "unter": "kurze Unterzeile oder leer", "hooks": ["...","...","..."], "skript": "das Sprechskript", "caption": "die fertige Caption", "bildidee": "was auf dem Titelbild zu sehen ist"}';
    } else if (f.format === "Story-Sequenz") {
      auftrag = "Baue eine Instagram-Story-Sequenz mit sechs bis acht Frames nach dem hinterlegten Storyaufbau. " +
        "Erlaubte Layouts: text, bild, frage, umfrage, cta. Mindestens ein Frame mit Interaktion, also frage oder umfrage. " +
        "Texte kurz genug für ein Handydisplay, höchstens fünfundzwanzig Wörter pro Frame.\n\n" +
        'Antworte als JSON: {"name": "kurzer Titel", "frames": [{"layout": "text", "text": "...", "cta": "", "optA": "", "optB": ""}], "hinweis": "eine Zeile, was du beim Filmen zeigen würdest"}';
    } else if (f.format === "Nur Hooks") {
      auftrag = "Schreibe acht Hooks zu dieser Idee, jede aus einem anderen Blickwinkel.\n\n" +
        'Antworte als JSON: {"hooks": ["...", "..."]}';
    } else {
      auftrag = "Schreibe die fertige Caption nach dem hinterlegten Aufbau, inklusive Keyword-Aufruf und genau fünf Hashtags.\n\n" +
        'Antworte als JSON: {"caption": "...", "hooks": ["drei alternative erste Zeilen"]}';
    }

    sampler.json(basis + auftrag, { modelTier: "complex" }).then(function (r) {
      studioResult = r || {};
      studioResult.__format = f.format;
    }).catch(function (e) {
      studioResult = { __fehler: (e && e.code) || "Fehler" };
    }).then(function () {
      studioBusy = false;
      render();
    });
  }

  function zeigeErgebnis(box) {
    var r = studioResult;

      box.innerHTML += '<div class="note">Das hat gerade nicht geklappt (' + esc(r.__fehler) + '). Versuch es nochmal.</div>';

      d.className = "result-block";
      d.innerHTML = "<h3>" + esc(titel) + "</h3>";
      if (typeof inhalt === "string") d.innerHTML += inhalt;

      return d;

      var hl = document.createElement("div");

        b.className = "hookopt";
        b.textContent = h;
        b.title = "In den Ideenvorrat legen";
        b.onclick = function () {
          state.ideen.unshift({ id: uid("i"), typ: "Hook", saeule: SAEULEN[0], text: h, quelle: "Content-Studio", status: "Offen" });

          }),

        };

        toast("Karussell angelegt. Texte prüfen und freigeben, gebaut wird im Bild-Editor.");
      };
      var b2 = document.createElement("button");
      b2.className = "btn";
      b2.textContent = "In die Content-Planung";
      b2.onclick = function () {
        state.posts.unshift({
          id: uid("p"), datum: todayISO(), marke: "Mum Life Balance", format: "Karussell",
          saeule: SAEULEN[0], pie: studioForm.ziel === "Vertrauen" ? "P" : "E",
          thema: r.name || studioForm.idee.slice(0, 60), keyword: "", archetyp: studioForm.archetyp, status: "In Arbeit"
        });
        saveList("posts");
        toast("In der Content-Planung eingetragen.");
      };
      act.appendChild(b1); act.appendChild(b2);

    if (studioResult.__format === "Reel" && (r.skript || r.hook)) {
      var rw = document.createElement("div");

        var hz = document.createElement("div");
        hz.className = "sp";
        hz.innerHTML = "<b>" + esc(r.hook) + "</b>" + esc(r.unter || "");
        rw.appendChild(hz);
      }
      if (r.skript) {
        var st = document.createElement("textarea");
        st.style.cssText = "width:100%;min-height:190px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px";
        st.value = r.skript;
        rw.appendChild(st);
      }
      var rb = document.createElement("button");
      rb.className = "btn primary";
      rb.textContent = "Als Reel anlegen";
      rb.onclick = function () {
        var neu = neuesReel(r.name || studioForm.idee.slice(0, 40));

  function saveReel(r) {

       sofortSichern() wirkungslos. */

        hinweis: r.hinweis || "",

        texty: (typeof r.texty === "number") ? r.texty : null,
        textskala: r.textskala || 100,
        kommentar: r.kommentar || "", kommentarStand: r.kommentarStand || "",
        kommentarErledigt: r.kommentarErledigt || "",
        kommentarAntwort: r.kommentarAntwort || "",
        videourl: r.videourl || "",

      }).then(function () { setSaveState("gespeichert", "on"); })
        .catch(function () { setSaveState("nur lokal gespeichert", "off"); });
    };
    ausstehend["rl-" + r.id] = tun;
    saveTimers["rl-" + r.id] = setTimeout(tun, 700);

  function currentReel() {
    return state.reels.filter(function (x) { return x.id === activeReel; })[0] || state.reels[0] || null;
  }

  function neuesReel(name) {
    var r = {
      id: uid("reel"), name: name || "Neues Reel", hook: "", unter: "", pos: "unten",
      brand: "mlb_dark", scrim: true, skript: "", caption: "", untertitel: "",
      updatedAt: new Date().toISOString()
    };
