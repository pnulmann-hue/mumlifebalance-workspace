        (b.art === "storys" ? "" :
          '<textarea class="wk-caption" placeholder="Caption \u2014 hier direkt \u00e4nderbar">' +
            esc(zerlegt.text) + '</textarea>' +
          '<input class="wk-tagsfeld" placeholder="#hashtags" value="' +
            esc(zerlegt.tags) + '">') +
        (b.datei ? '<div class="wk-datei">Datei: ' + esc(b.datei) + '</div>' : "") +
        (b.art === "karussells" || b.art === "storys" ? '<div class="wk-folien"></div>' : "") +
        // 🚨 Nur Sprechreels und Karussells gehen ueber Blotato. B-Roll
        // postet Patricia selbst, weil die Instagram-Musik nur in der App

        (b.art === "reels"
          ? '<div class="wk-auftrag"><select class="btn wk-videoart">' +
              '<option value="sprech"' +
                ((b.obj.videoart || "sprech") === "broll" ? "" : " selected") +
                '>Sprechreel — geht über Blotato raus</option>' +
              '<option value="broll"' +
                ((b.obj.videoart || "sprech") === "broll" ? " selected" : "") +
                '>B-Roll — poste ich selbst (Musik)</option>' +
            '</select></div>'
          : "") +
        // Was fehlt, steht ueber der Fusszeile — direkt dort, wo Patricia

        wasFehlt(b).map(function (f) {
          return '<div class="wk-fehlt' + (f.wer === "ich" ? " meins" : "") + '">' +
            '<b>' + (f.wer === "du" ? "\u270d\ufe0f Von dir: " : "\u23f3 Von mir: ") +
            esc(f.was) + '</b>' + (f.dazu ? esc(f.dazu) : "") + '</div>';
        }).join("") +
        // Der Sprechtext gehoert dorthin, wo sie das Video vermisst.
        (b.art === "reels" && !b.videourl && (b.obj.videoart || "sprech") !== "broll"
            && (b.obj.skript || "").trim()
          ? '<details class="wk-sprech"><summary>Sprechtext anzeigen</summary>' +
            '<pre class="wk-sprechtext">' + esc(b.obj.skript) + '</pre></details>'
          : "") +
        // Cover bauen, ohne die Karte zu verlassen. Aufgeklappt nur bei Bedarf,
        // sonst waere die Karte doppelt so lang.
        (b.art === "reels"
          ? '<details class="wk-cover"><summary>\u25b8 Cover bauen</summary>' +
            '<div class="wk-coverbox">' +
              '<canvas class="wk-covercv"></canvas>' +
              '<div class="wk-coversteuer">' +
                '<label>Hook auf dem Cover</label>' +
                '<textarea class="wk-ch" rows="2">' +
                  esc(b.obj.coverhook || b.obj.hook || "") + '</textarea>' +
                '<label>Unterzeile (darf leer bleiben)</label>' +
                '<input type="text" class="wk-cu" value="' +
                  esc(b.obj.coverunter || "") + '">' +
                '<label>H\u00f6he <span class="wk-cyv"></span></label>' +
                '<input type="range" class="wk-cy" min="13" max="78">' +
                '<label>Schriftgr\u00f6sse <span class="wk-csv"></span></label>' +
                '<input type="range" class="wk-cs" min="60" max="150">' +
                '<label class="wk-chk"><input type="checkbox" class="wk-scrim">' +
                  'Hinter dem Text abdunkeln</label>' +

                '<div class="wk-fotos"></div>' +
                '<div class="wk-coverknoepfe">' +
                  '<label class="btn filebtn"><span>Eigenes Foto</span>' +
                    '<input type="file" accept="image/*"></label>' +
                  '<button class="btn primary wk-covdl">Cover speichern</button>' +
                '</div>' +
              '</div>' +
            '</div></details>'
          : "") +
        auftragsZeile(b.obj) +
        '<div class="wk-fuss">' +
          '<input type="date" class="wk-datum" value="' + esc(b.obj.datum || "") + '">' +
          // Ohne dieses Feld war die Uhrzeit unsichtbar und kam aus einem Vorgabewert.
          '<input type="time" class="wk-zeit" value="' +
            esc((b.obj.blotato && b.obj.blotato.zeit) ||
                vorgabeZeit(b.art, kartenProfil(b.obj))) + '">' +
          // 🚨 Frueher wurde nur `blotato.profil` gelesen. Das ist bei fast allen
          // Beitraegen leer, also stand auf JEDER Karte „Mentoring“ — auch auf den

          '<select class="btn wk-profil">' +

            '<option value="doterra"' + (kartenProfil(b.obj) === "doterra" ? " selected" : "") + '>doTERRA</option>' +

          '<button class="btn wk-frei' + (b.obj.textfrei ? "" : " primary") + '">' +

          '<details class="wk-mehr"><summary title="Mehr Aktionen">\u22ef</summary>' +

    // Story-Folien zeichnen, mit Text zum Aendern daneben

        feld("headline", "Headline", 2);
        if (sl.layout !== "hook" && sl.layout !== "zitat") feld("body", "Text", 3);

              s.onchange = function () { saveCarousel(b.obj); };
              zeile.appendChild(lab); zeile.appendChild(s);

          }
        }

        folienbox.appendChild(sp);
      });
    }

    karte.querySelectorAll("[data-holen]").forEach(function (kn) {
      kn.onclick = function () {
        var was = this.getAttribute("data-holen");
        var name = (b.obj.datum ? b.obj.datum + "-" : "") +
                   (b.titel || "beitrag").replace(/[^\wäöüÄÖÜ]+/g, "-").toLowerCase();
        if (was === "video") dateiSpeichern(b.videourl, name + ".mp4");
        else dateiSpeichern(coverBild(b), name + "-cover.jpg");
      };
    });

    // 🚨 Fuehrt in den Bild-Editor, nicht ins Reel-Studio. Das Reel-Studio zieht
    // ein Standbild aus dem Video — ein Cover aus den Shootingbildern gibt es nur
    // drueben. Der Beitrag geht dabei nicht verloren: alle Reels stehen als
    // `daten/entwuerfe` in der Bild-Editor-Datenbank und erscheinen dort unter
    // „Aus deiner Planung“.
    karte.querySelectorAll("[data-cover]").forEach(function (kn) {
      kn.onclick = function () {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(BILDEDITOR).catch(function () {});
        }
        toast("Bild-Editor: oben „Reel-Cover 9:16“ wählen, dann unter " +
              "„Aus deiner Planung“ „" + (b.obj.name || "diesen Beitrag") +
              "“ antippen.");
      };
    });

    /* Video nachliefern. Laedt als Anhang ans Artifact und haengt die
       Adresse an den Beitrag. 🚨 20 MiB je Datei — das sagt der Knopf
       vorher, statt den Fehler von der Schnittstelle zu holen, wenn der
       Upload schon laeuft. Ein Handyvideo von ueber ~40 Sekunden reisst das. */
    var hochFeld = karte.querySelector(".wk-hochladen input");
    if (hochFeld) {
      hochFeld.onchange = function () {
        var f = this.files && this.files[0];
        if (!f) return;
        if (f.size > 20 * 1024 * 1024) {
          toast("Zu gross (" + Math.round(f.size / 1048576) + " MB). " +
                "H\u00f6chstens 20 MB \u2014 k\u00fcrzer schneiden, oder leg es aufs " +
                "Handy in das Album Content-Inbox, dann hole ich es.");
          this.value = "";
          return;
        }
        var lab = karte.querySelector(".wk-hochladen span");
        if (lab) lab.textContent = "l\u00e4dt \u2026";
        assetsAPI.upload(f).then(function (res) {
          b.obj.videourl = "/_blob/" + res.id;
          b.obj.videodatei = f.name;
          merken();
          toast("Video ist dran. Schau es dir an, dann kannst du freigeben.");
          render();
        }).catch(function (e) {
          if (lab) lab.textContent = "Video hochladen";
          toast("Hochladen ging nicht (" + ((e && e.code) || "unbekannt") + ").");
        });
      };
    }

    /* ---------- Cover auf der Karte ----------
       Gezeichnet wird mit renderReelCanvas — genau derselben Funktion wie im
       Reel-Studio. Zwei Zeichnungen desselben Covers waeren beim naechsten
       Umbau auseinandergelaufen. */
    var covBox = karte.querySelector(".wk-cover");
    if (covBox) {
      var cv = covBox.querySelector(".wk-covercv");
      var chFeld = covBox.querySelector(".wk-ch");
      var cuFeld = covBox.querySelector(".wk-cu");
      var cyReg = covBox.querySelector(".wk-cy");
      var csReg = covBox.querySelector(".wk-cs");
      var scrimBox = covBox.querySelector(".wk-scrim");
      var fotoBox = covBox.querySelector(".wk-fotos");

      // 🚨 Vorgabe 68 statt der Mitte: bei einem Hochformat-Portraet sitzt das
      // Gesicht im oberen Drittel, und ein Textblock in der Mitte legt sich
      // genau darueber. Die Zeichnung begrenzt nach unten ohnehin gegen die
      // Caption-Zone, tiefer als erlaubt kann es also nicht rutschen.
      if (typeof b.obj.texty !== "number") b.obj.texty = 68;
      cyReg.value = b.obj.texty;
      csReg.value = b.obj.textskala || 100;
      scrimBox.checked = b.obj.scrim !== false;

      function covZeichnen() {
        covBox.querySelector(".wk-cyv").textContent = cyReg.value + " %";
        covBox.querySelector(".wk-csv").textContent = csReg.value + " %";
        renderReelCanvas(cv, b.obj, {});
      }
      function covMerken() { saveReel(b.obj); }

      chFeld.oninput = function () { b.obj.coverhook = this.value; covZeichnen(); covMerken(); };
      cuFeld.oninput = function () { b.obj.coverunter = this.value; covZeichnen(); covMerken(); };
      cyReg.oninput  = function () { b.obj.texty = +this.value; covZeichnen(); };
      csReg.oninput  = function () { b.obj.textskala = +this.value; covZeichnen(); };
      cyReg.onchange = csReg.onchange = covMerken;
      scrimBox.onchange = function () { b.obj.scrim = this.checked; covZeichnen(); covMerken(); };

      // 🚨 Das gewaehlte Foto wird sofort abgelegt, nicht erst beim
      // Herunterladen. Sonst stuende auf der Karte weiter „Noch kein Cover“
      // und die Freigabe ginge ohne Titelbild raus.
      function fotoSetzen(quelle, fertig) {
        var im = new Image();
        im.onload = function () {
          var c = document.createElement("canvas");
          var f = Math.min(1, 1350 / im.height);
          c.width = Math.round(im.width * f); c.height = Math.round(im.height * f);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          komprimiereDataUrl(c.toDataURL("image/jpeg", 0.9), function (klein) {
            saveImage("reels/" + b.obj.id, b.obj.id, klein);
            wochenbilder[b.id + "/cover-" + (b.obj.coverfarbe || "dunkelblau")] = klein;
            covZeichnen();
            if (fertig) fertig();
          });
        };
        im.onerror = function () { toast("Das Bild liess sich nicht laden."); };
        im.src = quelle;
      }

      COVERFOTOS.forEach(function (name) {
        var t = document.createElement("img");
        t.src = "assets/" + name;
        t.loading = "lazy";
        t.title = name;
        t.onerror = function () { t.remove(); };
        t.onclick = function () {
          [].forEach.call(fotoBox.children, function (x) { x.classList.remove("sel"); });
          t.classList.add("sel");
          fotoSetzen("assets/" + name, function () { toast("Foto gesetzt."); });
        };
        fotoBox.appendChild(t);
      });

      var eigen = covBox.querySelector(".filebtn input");
      eigen.onchange = function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var leser = new FileReader();
        leser.onload = function () { fotoSetzen(leser.result, function () { toast("Foto gesetzt."); }); };
        leser.readAsDataURL(f);
        this.value = "";
      };

      covBox.querySelector(".wk-covdl").onclick = function () {
        if (!downloads) { toast("Herunterladen ist hier nicht verf\u00fcgbar."); return; }
        var kn = this, alt = kn.textContent;
        kn.disabled = true; kn.textContent = "bereite vor \u2026";
        var gross = document.createElement("canvas");
        renderReelCanvas(gross, b.obj, {});
        setTimeout(function () {
          gross.toBlob(function (blob) {
            var name = (b.obj.datum ? b.obj.datum + "-" : "") +
              (b.titel || "cover").replace(/[^\w\u00e4\u00f6\u00fc\u00c4\u00d6\u00dc]+/g, "-")
              .toLowerCase() + "-cover.png";
            downloads.save({ filename: name, data: blob })
              .then(function () { toast("Gespeichert: " + name); })
              .catch(function (e) {
                if (e && e.code !== "declined") toast("Hat nicht geklappt.");
              })
              .then(function () { kn.disabled = false; kn.textContent = alt; });
          }, "image/png");
        }, 300);
      };

      // Erst zeichnen, wenn aufgeklappt wird — sonst rechnet jede Karte mit.
      covBox.addEventListener("toggle", function () {
        if (covBox.open) covZeichnen();
      });
      if (covBox.open) covZeichnen();
    }

    karte.querySelectorAll(".farbknopf").forEach(function (kn) {
      kn.onclick = function () {
        b.obj.coverfarbe = this.getAttribute("data-farbe");
        saveReel(b.obj);
        render();
      };
    });

    // Ueber die Klasse angesprochen, nicht ueber den Index — sonst haengt es
    // daran, in welcher Reihenfolge die Knoepfe stehen.
    var kommentarFeld = karte.querySelector(".wk-kommentar");
    var sendeKnopf = karte.querySelector(".wk-senden");
    if (kommentarFeld && sendeKnopf) {
      sendeKnopf.onclick = function () {
        var txt = kommentarFeld.value.trim();
        if (!txt) { toast("Schreib zuerst hinein, was ich ändern soll."); return; }
        b.obj.kommentar = txt;
        b.obj.kommentarStand = new Date().toISOString();
        merken();
        render();
        toast("Notiert. Ich arbeite das bis 20:00 ein und melde mich per Telegram.");
      };
      kommentarFeld.onkeydown = function (e) {
        if (e.key === "Enter") { e.preventDefault(); sendeKnopf.click(); }
      };
    }

    // Caption und Hashtags aendern und speichern. Die drei Speicher-Funktionen
    // warten 700 ms ab, es geht also nicht je Buchstabe eine Anfrage raus.
    // 🚨 Kein render() dabei — das baut die Karte neu, und der Cursor waere weg.
    var capFeld = karte.querySelector(".wk-caption");
    var tagFeld = karte.querySelector(".wk-tagsfeld");
    if (capFeld) {
      var capSchreiben = function () {
        var text = capFeld.value.replace(/\s+$/, "");
        var tags = tagFeld ? tagFeld.value.trim() : "";
        var ganz = tags ? (text + "\n\n" + tags) : text;
        b.obj.caption = ganz;
        // 🚨 Auch die Kopie in der Liste nachziehen: daraus liest „Caption
        // kopieren“, und daran haengt die Pruefung beim Freigeben.
        b.caption = ganz;
        merken();
      };
      capFeld.oninput = capSchreiben;
      if (tagFeld) tagFeld.oninput = capSchreiben;
    }

    // 🚨 Frueher wurden die Knoepfe der Fusszeile ueber den Index angesprochen
    // (felder[0] Datum, felder[1] Kopieren, letztes Freigeben). Sobald ein
    // Beitrag freigegeben war, stand hinter „Freigeben“ aber noch „Hab ich
    // selbst gepostet“ — der Freigabe-Handler lag also auf dem falschen Knopf.
    // Jetzt haengt jeder an seiner eigenen Klasse.
    function merken() {
      if (b.art === "reels") saveReel(b.obj);
      else if (b.art === "storys") saveStory(b.obj);
      else saveCarousel(b.obj);
    }
    karte.querySelector(".wk-datum").onchange = function () {
      b.obj.datum = this.value;
      merken();
      render();
    };
    karte.querySelector(".wk-kopieren").onclick = function () {
      var t = b.caption || "";
      if (navigator.clipboard) {
        navigator.clipboard.writeText(t).then(function () { toast("Caption kopiert"); },
                                              function () { toast("Kopieren hat nicht geklappt"); });
      }
    };
    // 🚨 Frueher stand hier window.open(). In einem Artifact-Rahmen ist das
    // blockiert, und zwar lautlos — Patricia hat geklickt und nichts passierte.
    // Ein echter Link mit target="_blank" geht durch, weil die Person ihn selbst
    // anklickt. Zusaetzlich wandert die Adresse in die Zwischenablage, damit sie
    // sie notfalls von Hand einsetzen kann.
    var editorLink = karte.querySelector(".wk-editorlink");
    if (editorLink) {
      editorLink.onclick = function () {
        if (b.art === "karussells") activeCarousel = b.obj.id;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(BILDEDITOR).catch(function () {});
        }
        toast("Bild-Editor wird geöffnet. Falls nichts aufgeht: der Link ist kopiert.");
      };
    }
    var markeWahl = karte.querySelector(".wk-marke");
    if (markeWahl) {
      markeWahl.onchange = function () {
        b.obj.brand = this.value;
        b.obj.handle = BRANDS[this.value].handle;
        saveCarousel(b.obj);
        render();
      };
    }

    var artWahl = karte.querySelector(".wk-videoart");
    if (artWahl) {
      artWahl.onchange = function () {
        b.obj.videoart = this.value;
        merken();
        toast(this.value === "broll"
          ? "B-Roll — wird nicht eingeplant, du postest ihn selbst."
          : "Sprechreel — geht über Blotato raus.");
        render();
      };
    }

    var selbstKnopf = karte.querySelector(".wk-selbst");
    if (selbstKnopf) {
      selbstKnopf.onclick = function () {
        var bl2 = b.obj.blotato || (b.obj.blotato = {});
        bl2.status = "gepostet-von-hand";
        merken();
        if (db) {
          db.collection("freigaben").doc(b.id).set({
            name: b.titel, status: "gepostet-von-hand",
            notiz: "Von Patricia selbst über die Instagram-App gepostet.",
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch(function () {});
        }
        toast("Notiert — der Beitrag wird nicht mehr eingeplant.");
        render();
      };
    }

    var abKnopf = karte.querySelector(".wk-ablehnen");
    if (abKnopf) {
      abKnopf.onclick = function () {
        b.obj.abgelehnt = true;
        b.obj.abgelehntStand = new Date().toISOString();
        merken();
        toast("Aussortiert. Steht unten unter „Abgelehnt“ und ist zur\u00fcckholbar.");
        render();
      };
    }

    var zeitFeld = karte.querySelector(".wk-zeit");
    if (zeitFeld) {
      zeitFeld.onchange = function () {
        var bl = b.obj.blotato || (b.obj.blotato = {});
        bl.zeit = this.value;
        merken();
      };
    }

    var profilWahl = karte.querySelector(".wk-profil");
    if (profilWahl) {
      profilWahl.onchange = function () {
        var bl = b.obj.blotato || (b.obj.blotato = {});
        bl.profil = this.value;
        // Die Vorgabezeit haengt am Profil — doTERRA postet spaeter. Eine selbst
        // gesetzte Zeit wird dabei nie ueberschrieben.
        if (!bl.zeit && zeitFeld) zeitFeld.value = vorgabeZeit(b.art, this.value);
        if (b.art === "reels") saveReel(b.obj); else saveCarousel(b.obj);
      };
    }

    // Anderes Datum: Feld einblenden, dann uebernehmen.
    var umplanKnopf = karte.querySelector(".wk-umplan");
    if (umplanKnopf) {
      var umplanBox = karte.querySelector(".wk-umplanbox");
      umplanKnopf.onclick = function () {
        umplanBox.hidden = !umplanBox.hidden;
        if (!umplanBox.hidden) umplanBox.querySelector(".wk-neudatum").focus();
      };
      karte.querySelector(".wk-neuok").onclick = function () {
        umplanen(b, karte.querySelector(".wk-neudatum").value);
      };
    }

    // 🚨 Loeschen in zwei Klicks. Kein confirm() — im Artifact-Rahmen kann ein
    // Modal blockiert sein, und dann taete der Knopf lautlos nichts. Der
    // zweite Klick faellt nach acht Sekunden wieder zurueck, damit ein
    // scharfer Knopf nicht stehen bleibt.
    var loeschKnopf = karte.querySelector(".wk-loeschen");
    if (loeschKnopf) {
      var scharf = null;
      loeschKnopf.onclick = function () {
        if (scharf) {
          clearTimeout(scharf);
          beitragLoeschen(b);
          return;
        }
        loeschKnopf.classList.add("scharf");
        loeschKnopf.textContent = "Wirklich l\u00f6schen? Das bleibt weg.";
        scharf = setTimeout(function () {
          scharf = null;
          loeschKnopf.classList.remove("scharf");
          loeschKnopf.textContent = "L\u00f6schen";
        }, 8000);
      };
    }

    var freigabeKnopf = karte.querySelector(".wk-frei");
    freigabeKnopf.onclick = function () {
      var an = !b.obj.textfrei;
      b.obj.textfrei = an;
      merken();

      // Storys postet Patricia selbst vom Handy — die gehen nie an Blotato.
      if (b.art === "storys") {
        toast(an ? "Story freigegeben" : "Freigabe zurückgenommen");
        render();
        return;
      }

      // Zurueckgenommen: nur den Vermerk setzen, nichts loeschen.
      if (!an) {
        if (db) {
          db.collection("freigaben").doc(b.id).set({
            name: b.titel, status: "zurueckgezogen",
            updatedAt: new Date().toISOString()
          }).catch(function () {});
        }
        toast("Freigabe zurückgenommen");
        render();
        return;
      }

      if (!db) { toast("Freigegeben — aber ohne Datenbank nur lokal."); render(); return; }

      // 🚨 B-Roll geht nie ueber Blotato: die Instagram-Musik laesst sich nur
      // in der App waehlen, und ohne sie traegt ein Sieben-Sekunden-Clip nicht.
      var selberPosten = (b.art === "reels" && b.obj.videoart === "broll");
      if (!b.obj.datum) { toast("Freigegeben. Setz noch ein Datum, sonst kann ich es nicht einplanen."); render(); return; }
      if (!(b.caption || "").trim()) { toast("Freigegeben. Ohne Caption kann ich es aber nicht einplanen."); render(); return; }

      var bl = b.obj.blotato || (b.obj.blotato = {});
      var profil = kartenProfil(b.obj);
      var zeit = (zeitFeld && zeitFeld.value) || bl.zeit || vorgabeZeit(b.art, profil);
      bl.zeit = zeit;
      var wann = new Date(b.obj.datum + "T" + zeit);

      /* 🚨 Nachruecken passiert HIER, beim Freigeben - nicht beim Anzeigen.
         Was in „freigaben" steht, muss der Zeitpunkt sein, an dem es wirklich
         rausgeht. Eine Anzeige, die etwas anderes sagt als die Datenbank, ist
         der Fehler vom 16.09. */
      var nachgerueckt = "";
      if (!isNaN(wann) && wann.getTime() < Date.now()) {
        var slot = naechsterSlot(b, false);
        if (slot) {
          b.obj.datum = slot.datum;
          zeit = bl.zeit = slot.zeit;
          wann = new Date(slot.datum + "T" + slot.zeit);
          nachgerueckt = tagName(slot.datum).slice(0, 2) + " " + fmtDate(slot.datum) +
                         " um " + slot.zeit;
          merken();
        }
      }

      // 🚨 Ein Zeitpunkt in der Vergangenheit wird von Blotato abgelehnt. Frueher
      // ist das erst beim naechtlichen Einplanen aufgefallen — also gar nicht, weil
      // die Freigabe trotzdem „geklappt“ gemeldet hat.
      // Nach dem Nachruecken ist das normalerweise falsch. Bleibt es wahr,
      // hat naechsterSlot in 28 Tagen nichts gefunden.
      var vorbei = !isNaN(wann) && wann.getTime() < Date.now();

      function steuerSchreiben(anzahl) {
        db.collection("freigaben").doc(b.id).set({
          name: b.titel,
          typ: b.art === "reels" ? "reel" : "karussell",
          caption: b.caption || "",
          videodatei: b.obj.videodatei || "",
          profil: profil,
          datum: b.obj.datum,
          zeit: zeit,
          zeitpunktISO: isNaN(wann) ? "" : wann.toISOString(),
          anzahl: anzahl,
          status: selberPosten ? "selber-posten"
                  : (vorbei ? "zeitpunkt-vorbei" : "wartet"),
          updatedAt: new Date().toISOString()
        }).then(function () {
          bl.status = selberPosten ? "selber-posten"
                     : (vorbei ? "zeitpunkt-vorbei" : "wartet");
          merken();
          if (selberPosten) {
            toast("Notiert — du hast ihn in der App eingeplant. " +
                  "Ich fasse ihn nicht an.");
            render();
            return;
          }
          toast(vorbei
            ? "Freigegeben — aber " + zeit + " am " + b.obj.datum + " ist vorbei. "
              + "Instagram nimmt keinen Zeitpunkt in der Vergangenheit. Stell die Uhrzeit "
              + "später oder das Datum auf morgen, dann geht es raus."
            : "Freigegeben für " + b.obj.datum + " um " + zeit
              + ". Wird um 20:00 eingeplant.");
          render();
        }).catch(function () { toast("Das Ablegen hat nicht geklappt."); render(); });
      }

      // Beim Karussell wandern die fertigen Folien mit — genau so, wie sie hier aussehen.
      // Liegt am Beitrag ein fertiges Bild (Screenshot, Bio-Karte, Markierung), wird es
      // uebernommen statt neu gezeichnet. Nur wo keines liegt, zeichnet slideJpeg.
      if (b.art === "karussells" && b.obj.slides && b.obj.slides.length) {
        var gesamt = b.obj.slides.length;
        freigabeKnopf.disabled = true;
        freigabeKnopf.textContent = "schaue nach fertigen Folien …";
        fertigeFolien(b.id, function (fertig) {
          var i = 0;
          (function naechste() {
            if (i >= gesamt) { freigabeKnopf.disabled = false; steuerSchreiben(gesamt); return; }
            var nr = i++;
            var sid = "slide-" + String(nr + 1).padStart(2, "0");
            function ablegen(dataUrl) {
              db.doc("freigaben/" + b.id).collection("bilder").doc(sid)
                .set({ dataUrl: dataUrl, nr: nr + 1 })
                .then(naechste)
                .catch(function () {
                  freigabeKnopf.disabled = false;
                  toast("Folie " + (nr + 1) + " liess sich nicht ablegen.");
                  render();
                });
            }
            if (fertig[sid]) {
              freigabeKnopf.textContent = "übernehme Folie " + (nr + 1) + " von " + gesamt + " …";
              ablegen(fertig[sid]);
            } else {
              freigabeKnopf.textContent = "zeichne Folie " + (nr + 1) + " von " + gesamt + " …";
              slideJpeg(b.obj, b.obj.slides[nr], nr, ablegen);
            }
          })();
        });
        return;
      }
      steuerSchreiben(1);
    };
    return karte;
  }

  /* Reiter „Ideen von anderen": was bei den beobachteten Profilen deutlich
     ueber deren eigenem Schnitt lag. Gebaut von ideen-extern-bauen.py.
     Siehe Kopf von patch-ideen-extern.py, warum der Reiter bewusst nicht
     „Top-Content" heisst. */
  function renderIdeenExtern(main) {
    var alle = (ideenExtern && ideenExtern.ideen) || [];
    var stand = (ideenExtern && ideenExtern.stand) || "";
    var alt = stand ? Math.round((Date.now() - new Date(stand + "T00:00:00")) / 86400000) : 99;

    main.innerHTML =
      '<div class="page-head"><div><h1>Ideen von anderen</h1>' +
      '<p>Beitr\u00e4ge aus deiner Beobachtungsliste, die deutlich \u00fcber dem ' +
      '<strong>eigenen Schnitt des jeweiligen Kontos</strong> lagen \u2014 absolute ' +
      'Likes sagen nichts, wenn ein Konto zwanzigmal so gross ist wie deins. ' +
      'Das ist eine Anregung, kein Katalog: \u00fcbernommen wird die Machart, ' +
      'nie der Text.</p></div></div>' +
      (alt > 2 ? '<div class="panel warn"><strong>Der Stand ist ' + alt +
        ' Tage alt.</strong> Neu holen mit <code>python ' +
        'scripts/cockpit/ideen-extern-bauen.py</code>.</div>' : "") +
      '<div class="tiles">' +
      tile("Ideen", alle.length, stand ? "Stand " + fmtDate(stand) : "kein Stand") +
      tile("Eingeschlagen", alle.filter(function (i) {
             return i.stufe === "eingeschlagen"; }).length, "ab 3\u00d7 eigener Schnitt") +
      '</div><div id="ideliste"></div>';

    var box = main.querySelector("#ideliste");
    if (!alle.length) {
      box.innerHTML = '<div class="panel"><div class="empty">Noch nichts da. ' +
        'Der Scrape l\u00e4uft t\u00e4glich \u2014 das Dokument wird beim ' +
        'n\u00e4chsten Abgleich gef\u00fcllt.</div></div>';
      return;
    }

    alle.forEach(function (i) {
      var k = document.createElement("div");
      k.className = "panel idee-karte";
      var fmt = i.format === "reel" ? "Reel" : (i.format === "karussell" ? "Karussell" : "Bild");
      k.innerHTML =
        '<div class="idee-kopf">' +
          '<span class="tp-stand ' + (i.stufe === "eingeschlagen" ? "gut" : "info") + '">' +
            i.faktor + '\u00d7 eigener Schnitt</span>' +
          '<span class="tp-format">' + esc(fmt) + '</span>' +
          '<span class="idee-quelle">' + esc(i.label || i.konto) +
            ' \u00b7 ' + (i.follower || 0).toLocaleString("de-CH") + ' Follower' +

          (i.link ? '<a class="btn ghost" href="' + esc(i.link) +

        '</details>' +
        '<div class="idee-fuss">' +

            hinweis: "Nur die Machart übernehmen — Frage, Winkel, Aufbau. " +

          }).then(function () {

  /* Reiter „Fertig zum Posten": nur das, was schon steht. */
  function renderFertig(main) {
    var alle = offeneBeitraege().filter(function (b) { return !istLeer(b); });
    alle.forEach(function (b) { wochenBildHolen(b.art, b.id); });

    function nachDatum(x, y) {
      var a = x.obj.datum || "9999", c = y.obj.datum || "9999";
      return a < c ? -1 : (a > c ? 1 : 0);
    }
    var fertig = alle.filter(istFertig);
    // Feed und Story sind zwei verschiedene Handlungen: den Feed gibst du
    // frei und der 20:00-Lauf plant ihn ein, die Story postest du selbst.
    var feed = fertig.filter(function (b) { return b.art !== "storys"; });
    // 🚨 Keine eigene Sackgassen-Gruppe mehr - was fertig ist, kann raus,
    // und der Zeitpunkt rueckt beim Freigeben nach.
    var kannRaus = feed.slice().sort(nachDatum);
    var durch = feed.filter(zeitpunktVorbei);
    var frei = alle.filter(function (b) { return b.obj.textfrei; }).sort(nachDatum);

    /* 🚨 „Freigegeben" war drei verschiedene Dinge in einem Topf. Siehe Kopf
       von patch-freigegeben-trennen.py. Der Status kommt aus der Sammlung
       „freigaben", nicht aus b.obj.blotato — das war der alte Lesefehler. */
    var heuteISO = todayISO();
    function selbstSache(b) {
      return b.art === "storys" || draussenStatus(b) === "selber-posten";
    }
    /* 🚨 Was sie selbst in der App eingeplant hat, IST erledigt — dafuer
       steht ihr Klick. Eine Gruppe „du bist dran" waere eine Behauptung ueber
       etwas, das das Cockpit gar nicht sehen kann. */
    var selbst = frei.filter(selbstSache);
    // Freigegeben, aber der Termin ist durch und nichts rueckt nach: haengt.
    var haengt = frei.filter(function (b) {
      return !selbstSache(b) && DRAUSSEN.indexOf(draussenStatus(b)) < 0 &&
             zeitpunktVorbei(b);
    });
    // Was auf Instagram wiedergefunden wurde, ist durch und gehoert in den
    // Reiter „Gepostet & Analyse" — nicht mehr hierher.
    var gepostet = frei.filter(istGepostet);
    var laeuft = frei.filter(function (b) {
      return haengt.indexOf(b) < 0 && !istGepostet(b);
    });
    var offen = alle.filter(function (b) {
      return !b.obj.textfrei && wasFehlt(b).length;
    }).length;

    main.innerHTML =
      '<div class="page-head"><div><h1>Fertig zum Posten</h1>' +
      '<p>Nur was schon steht \u2014 Video da, Caption da, Datum da. ' +
      'Alle zwei Stunden wird eingeplant, was freigegeben ist. ' +
      '<strong>Ist der Zeitpunkt vorbei, rutscht der Beitrag auf den n\u00e4chsten ' +
      'passenden Tag</strong> \u2014 du musst nichts neu datieren.</p></div></div>' +
      '<div class="tiles">' +
      tile("Kann raus", kannRaus.length,
           kannRaus.length ? "Feed \u2014 wartet auf dein Go" : "gerade nichts") +
      tile("Rutscht nach", durch.length,
           durch.length ? "Zeitpunkt vorbei — geht auf den nächsten Tag"
                        : "alle Zeitpunkte liegen vorn") +
      tile("Unterwegs", laeuft.length,
           selbst.length ? selbst.length + " davon in deiner App"
                         : "eingeplant, noch nicht raus") +
      tile("Gepostet", gepostet.length,
           gepostet.length ? "steht unter „Gepostet & Analyse“" : "noch keiner") +
      tile("Noch nicht fertig", offen, "steht unter „Was zu tun ist“") +
      '</div>' +
      '<div id="fliste"></div>';

    var box = main.querySelector("#fliste");

    function gruppe(titel, unter, liste) {
      if (!liste.length) return;
      var kopf = document.createElement("div");
      kopf.className = "wt-kopf";
      kopf.innerHTML = '<span class="wt-name">' + esc(titel) + '</span>' +
                       '<span class="wt-datum">' + liste.length + '</span>';
      box.appendChild(kopf);
      if (unter) {
        var n = document.createElement("p");
        n.className = "note";
        n.style.margin = "0 0 10px";
        n.textContent = unter;
        box.appendChild(n);
      }
      liste.forEach(function (b) { box.appendChild(wochenKarte(b)); });
    }

    if (!kannRaus.length && !frei.length) {
      box.innerHTML = '<div class="panel"><div class="empty">Noch ist nichts ' +
        'fertig. Was fehlt, steht in der Wochen-Vorschau unter ' +
        '\u201eWas zu tun ist\u201c.</div></div>';
      return;
    }

    gruppe("Kann raus", durch.length
      ? durch.length + " davon haben einen Zeitpunkt in der Vergangenheit. Die "
        + "rutschen beim Freigeben auf den nächsten passenden Tag — auf der Karte "
        + "steht, auf welchen."
      : "", kannRaus);

    /* Drei Gruppen statt einer — wer dran ist, steht im Titel. */
    function liste(titel, unter, eintraege, wer) {
      if (!eintraege.length) return;
      var kopf = document.createElement("div");
      kopf.className = "wt-kopf";
      kopf.innerHTML = '<span class="wt-name">' + esc(titel) + '</span>' +
                       '<span class="wt-datum">' + eintraege.length + '</span>';
      box.appendChild(kopf);
      if (unter) {
        var n = document.createElement("p");
        n.className = "note";
        n.style.margin = "0 0 10px";
        n.textContent = unter;
        box.appendChild(n);
      }
      var panel = document.createElement("div");
      panel.className = "panel tuliste";
      var h = "";
      eintraege.forEach(function (b) {
        var s = draussenStatus(b);
        var zeit = (freigabeVon(b) || {}).zeit ||
                   (b.obj.blotato && b.obj.blotato.zeit) || "";
        var spaet = b.obj.datum && b.obj.datum <= heuteISO;
        // 🚨 Was gepostet ist, traegt seine Zahl — sonst ist „gepostet"
        // nur ein Wort.
        var ig = igPost(b);
        var stand = ig ? (ig.reach != null ? ig.reach + " erreicht" : "gepostet")
                  : nichtPruefbar(b) ? "in deiner App · nicht prüfbar"
                  : s === "gepostet-von-hand" ? "selbst gepostet"
                  : s === "geplant" ? "eingeplant"
                  : b.art === "storys" ? "Story"
                  : s === "selber-posten" ? "in deiner App"
                  : "wartet";
        h += '<div class="tuzeile">' +
          '<span class="tudatum">' +
            (b.obj.datum ? esc(tagName(b.obj.datum).slice(0, 2) + " " +
                               fmtDate(b.obj.datum)) : "ohne Datum") +
            (zeit ? " " + esc(zeit) : "") + '</span>' +
          '<span class="tuwas"><strong>' + esc(b.titel) + '</strong> <span>\u00b7 ' +
            esc(kartenProfil(b.obj) === "doterra" ? "doTERRA" : "Mentoring") +
            '</span></span>' +
          '<span class="tuwer ' + wer + '">' +
            esc(wer === "du" && spaet ? stand + " \u2014 \u00fcberf\u00e4llig" : stand) +
          '</span></div>';
      });
      panel.innerHTML = h;
      box.appendChild(panel);
    }

    liste("H\u00e4ngt", "Freigegeben, aber der Zeitpunkt ist vorbei und nichts "
      + "r\u00fcckt nach. Geht so nie raus \u2014 nimm die Freigabe zur\u00fcck "
      + "und gib sie neu, dann rutscht der Beitrag auf den n\u00e4chsten Tag.",
      haengt, "du");

    liste("Unterwegs", selbst.length
      ? "Eingeplant, aber noch nicht im Feed. " + selbst.length + " davon hast "
        + "du selbst in der App eingeplant \u2014 B-Roll und Storys gehen nie "
        + "\u00fcber Blotato, weil die Musik nur dort w\u00e4hlbar ist."
      : "Eingeplant, aber noch nicht im Feed. Hier musst du nichts mehr tun.",
      laeuft, "ich");

    liste("Gepostet", "Auf Instagram wiedergefunden. Die Auswertung steht unter "
      + "\u201eGepostet & Analyse\u201c \u2014 dort liegt auch der Knopf, um "
      + "einen gut gelaufenen Beitrag nach vier Wochen nochmal zu bringen.",
      gepostet, "ich");
  }

  /* =========================================================
     Wochenraster: ein Platz je Tag und Profil
     Gehoert zur Wochen-Vorschau. Der frueher eigene Reiter „Tagesplan" war
     eine zweite Ansicht auf dieselben Daten und ist am 19.09.2026 raus.
     ========================================================= */

  /* Fuenf Tage, zwei Profile — zehn Plaetze in der Woche. Das Soll je Profil
     ist Patricias Entscheid vom 19.09.2026: 3 Reels, 2 Karussells. */
  var TP_SOLL = { reels: 3, karussells: 2 };

  /* 🚨 Die zweite Zahl, und die wichtigere: 3 Lead-Posts mit Keyword-CTA,
     2 Reichweiten-Posts mit Share-CTA (3+2-Regel seit 15.09.2026). Wie viele
     Reels eine Woche hat, sagt ueber Konversion nichts — wie viele davon in
     einen Funnel fuehren, schon. */
  var TP_SOLL_JOB = { lead: 3, reichweite: 2 };

  /* Welcher Tag welches Format traegt. Patricia am 19.09.2026: „montag,
     mittwoch, freitag ist reeltag und dienstag und donnerstag karussell" —
     fuer beide Profile. Ein fester Rhythmus spart pro Tag eine Entscheidung. */
  var WOCHENRHYTHMUS = ["reels", "karussells", "reels", "karussells", "reels"];

  var TP_PROFILE = [
    { id: "mentoring", label: "Mum Life Balance" },
    { id: "doterra", label: "doTERRA" }
  ];
  var wochenOffset = null;   // null = noch nicht bestimmt, 0 = diese Woche
  var slotOffen = null;      // "iso|profil" — welcher Platz seine Liste zeigt

  /* Lead oder Reichweite — abgelesen aus dem CTA, nicht gepflegt.
     Ein Stichwort in Grossbuchstaben (STANDBEIN, ENERGIE …) macht den Beitrag
     zum Lead-Post, alles andere zaehlt als Reichweite.
     🚨 Das ist eine Ableitung und keine Angabe. Sie steht deshalb sichtbar auf
     jeder Karte — ein Fehlschluss soll auffallen, nicht still in der Bilanz
     mitlaufen. */
  function ctaStichwort(b) {
    var text = b.caption || "";
    if (b.art === "karussells") {
      (b.obj.slides || []).forEach(function (s) {
        text += " " + (s.headline || "") + " " + (s.body || "") + " " + (s.keyword || "");
      });
    }
    var worte = text.split(/[^A-Za-z0-9\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df]+/);
    for (var i = 0; i < worte.length; i++) {
      var w = worte[i];
      if (w.length < 4) continue;
      if (w !== w.toUpperCase()) continue;
      if (!/[A-Z\u00c4\u00d6\u00dc]/.test(w)) continue;   // reine Zahlen raus
      if (TP_KEINWORT[w]) continue;
      return w;
    }
    return "";
  }

  /* Woerter in Grossbuchstaben, die kein Stichwort sind. Kurz halten: jeder
     Eintrag hier kann einen echten Lead-Post unsichtbar machen. */
  var TP_KEINWORT = { ABER: 1, AUCH: 1, DANN: 1, DEIN: 1, DEINE: 1, MEIN: 1,
                      MEINE: 1, NICHT: 1, ODER: 1, ALLE: 1, OHNE: 1, JEDE: 1 };

  function jobVonBeitrag(b) { return ctaStichwort(b) ? "lead" : "reichweite"; }

  /* Welche Woche beim Oeffnen steht. Normalerweise diese — aber am Freitag
     ist diese Woche durch und geplant wird die naechste. Ein neuer Reiter,
     der eine leere Woche zeigt, sieht kaputt aus, obwohl er stimmt. Deshalb:
     diese Woche, ausser sie ist leer und die naechste nicht. Die Kopfzeile
     nennt immer die KW, und „Diese Woche" holt zurueck. */
  function tpOffset() {
    if (wochenOffset === null) {
      wochenOffset = (!tpBelegteTage(0) && tpBelegteTage(1)) ? 1 : 0;
    }
    return wochenOffset;
  }

  function tpBelegteTage(offset) {
    var belegt = tpBelegung(), n = 0;
    tpTage(offset).forEach(function (t) {
      TP_PROFILE.forEach(function (p) {
        if ((belegt[t.iso + "|" + p.id] || []).length) n++;
      });
    });
    return n;
  }

  /* 🚨 Nie toISOString() fuer ein Datum: das rechnet nach UTC um und macht in
     der Schweiz aus dem 22. abends den 21. Also von Hand aus den lokalen
     Bestandteilen zusammensetzen. */
  function tpIso(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function tpMontag(offset) {
    var t = new Date();
    t.setHours(12, 0, 0, 0);
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + offset * 7);
    return t;
  }

  function tpKw(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    var jan = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - jan) / 86400000 + 1) / 7);
  }

  function tpTage(offset) {
    var m = tpMontag(offset), raus = [];
    for (var i = 0; i < 5; i++) {
      var d = new Date(m);
      d.setDate(m.getDate() + i);
      raus.push({ iso: tpIso(d), datum: d });
    }
    return raus;
  }

  /* Was auf welchem Platz liegt. Mehrere am selben Tag und Profil sind
     erlaubt — der erste ist der Platzhalter, die anderen stehen unten in
     der Liste. Sie zu verstecken waere derselbe Fehler wie am 18.09. bei
     den zwei Generationen im Bild-Editor. */
  function tpBelegung() {
    var karte = {};
    offeneBeitraege().forEach(function (b) {
      if (!b.obj.datum || istLeer(b)) return;
      var k = b.obj.datum + "|" + kartenProfil(b.obj);
      (karte[k] = karte[k] || []).push(b);
    });
    return karte;
  }

  /* Der Vorrat: alles ohne Datum, das zum Profil passt. Genau dort landen
     Beitraege, die von einem Platz verdraengt werden. */
  function tpVorrat(profil) {
    return offeneBeitraege().filter(function (b) {
      return !b.obj.datum && !istLeer(b) && kartenProfil(b.obj) === profil;
    });
  }

  function tpSpeichern(b) {
    if (b.art === "reels") saveReel(b.obj); else saveCarousel(b.obj);
  }

  /* Umschalten. Der alte Beitrag faellt in den Vorrat zurueck statt
     verloren zu gehen. */
  function tpBelegen(neu, alt, iso, profil) {
    if (alt && alt.id !== neu.id) {
      alt.obj.datum = "";
      tpSpeichern(alt);
    }
    neu.obj.datum = iso;
    // 🚨 hart setzen, nicht nur wenn leer — sonst bleibt ein Beitrag ohne
    // Profil stillschweigend Mentoring, auch auf dem doTERRA-Platz.
    neu.obj.profil = profil;
    tpSpeichern(neu);
    slotOffen = null;
    toast(neu.titel + " liegt jetzt auf " + tagName(iso) + ".");
    render();
  }

  function tpFreiRaeumen(b) {
    b.obj.datum = "";
    tpSpeichern(b);
    toast(b.titel + " ist zurueck im Vorrat.");
    render();
  }

  /* Ein Satz zum Zustand — dasselbe Urteil wie in der Wochen-Vorschau,
     nur auf eine Zeile eingedampft. */
  function tpStand(b) {
    // Was draussen ist, zuerst - „Freigegeben" sagt nichts darueber, ob es
    // auch wirklich rausging.
    if (istDraussen(b)) {
      var s = draussenStatus(b);
      return { text: s === "geplant" ? "Eingeplant"
                   : s === "gepostet-von-hand" ? "Ist raus"
                   : "Postest du selbst", art: "gut" };
    }
    if (b.obj.textfrei) return { text: "Freigegeben", art: "gut" };
    var fehlt = wasFehlt(b);
    if (!fehlt.length) {
      // Statt einer Sackgasse sagen, wohin der Beitrag rutscht.
      if (zeitpunktVorbei(b)) {
        var sl = naechsterSlot(b);
        return sl
          ? { text: "Geht " + tagName(sl.datum).slice(0, 2) + " " +
                    fmtDate(sl.datum) + " raus", art: "gut" }
          : { text: "Kein freier Tag — setz eins", art: "warn" };
      }
      return { text: "Fertig — kann raus", art: "gut" };
    }
    var e = fehlt[0];
    return { text: e.was + (e.wer === "du" ? " (du)" : " (ich)"),
             art: e.wer === "du" ? "warn" : "info" };
  }

  /* Welche Gruppe aufgeklappt ist. Siehe Kopf von patch-nav-aufklappen.py:
     nur eine, und die des aktiven Reiters immer. */
  var offeneGruppe = null;
  try { offeneGruppe = localStorage.getItem("mlb:navgruppe"); } catch (e) {}

  function navBaum() {
    var baum = [], aktuell = null;
    TABS.forEach(function (t) {
      if (t.g) { aktuell = { g: t.g, items: [] }; baum.push(aktuell); return; }
      if (aktuell) aktuell.items.push(t);
      else baum.push({ solo: t });
    });
    return baum;
  }

  function gruppeVon(id) {
    var g = null;
    navBaum().forEach(function (k) {
      if (k.items && k.items.some(function (t) { return t.id === id; })) g = k.g;
    });
    return g;
  }

  function navZahl(t) {
    // 🚨 Eine 0 an einem Reiter mit Daten ist eine Falschaussage — der
    // Jahresplan zeigte 0, obwohl 54 Einträge drin sind. Deshalb nur
    // positive Zahlen.
    var c = t.id === "fertig" ? fertigAnzahl()
      : t.id === "storys" ? state.storys.length
      : t.id === "reels" ? state.reels.length
      : (Array.isArray(state[t.id]) ? state[t.id].length : "");
    return (c !== "" && c > 0) ? c : "";
  }

  /* Steht der aktive Reiter unter demselben Elternpunkt? Dann bleiben alle
     Geschwister sichtbar, damit man zwischen ihnen wechseln kann. */
  function geschwisterAktiv(items, elter) {
    var e = null, treffer = false;
    items.forEach(function (t) {
      if (!t.sub) { e = t.id; return; }
      if (t.id === activeTab && e === elter) treffer = true;
    });
    return treffer;
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    var aktivGruppe = gruppeVon(activeTab);
    // Die Gruppe des aktiven Reiters ist immer offen — sonst verliert man
    // beim Klicken die Orientierung.
    var offen = aktivGruppe || offeneGruppe;

    function knopf(t) {
      var b = document.createElement("button");
      b.className = t.sub ? "navbtn navsub" : "navbtn";
      b.setAttribute("aria-current", activeTab === t.id ? "true" : "false");
      var c = navZahl(t);
      b.innerHTML = "<span>" + esc(t.label) + "</span>" +
        (c !== "" ? '<span class="cnt">' + c + "</span>" : "");
      b.onclick = function () { activeTab = t.id; render(); };
      return b;
    }

    navBaum().forEach(function (k) {
      if (k.solo) { nav.appendChild(knopf(k.solo)); return; }

      var auf = k.g === offen;
      var kopf = document.createElement("button");
      kopf.className = "navgroup";
      kopf.setAttribute("aria-expanded", auf ? "true" : "false");
      // Summe der Zahlen in der Gruppe, damit man zugeklappt trotzdem sieht,
      // dass dort etwas wartet.
      var summe = k.items.reduce(function (a, t) {
        var c = navZahl(t); return a + (c === "" ? 0 : c);
      }, 0);
      kopf.innerHTML = "<span>" + esc(k.g) + "</span>" +
        (summe ? '<span class="gcnt">' + summe + "</span>" : "") +
        '<span class="pfeil">▶</span>';
      kopf.onclick = function () {
        offeneGruppe = auf ? null : k.g;
        try { localStorage.setItem("mlb:navgruppe", offeneGruppe || ""); } catch (e) {}
        // Beim Zuklappen der aktiven Gruppe zurück auf «Heute», sonst stünde
        // man auf einer Seite, deren Reiter nicht mehr sichtbar ist.
        if (auf && k.g === aktivGruppe) activeTab = "uebersicht";
        render();
      };
      nav.appendChild(kopf);

      /* 🚨 Ein Unterpunkt kommt und geht mit seinem Elternpunkt — dem letzten
         Nicht-Unterpunkt davor. Sonst stehen Storys und Reels auch dann da,
         wenn man gerade plant oder auswertet. Siehe Kopf von
         patch-nav-unterpunkte.py. */
      if (auf) {
        var elter = null;
        k.items.forEach(function (t) {
          if (!t.sub) { elter = t.id; nav.appendChild(knopf(t)); return; }
          // Ohne diese zweite Bedingung verschwindet die Leiste unter den
          // Fuessen, sobald man den Unterpunkt selbst anklickt.
          if (activeTab === elter || activeTab === t.id ||
              geschwisterAktiv(k.items, elter))
            nav.appendChild(knopf(t));
        });
      }
    });
  }

  /* =========================================================
     Übersicht
     ========================================================= */
  function renderUebersicht(main) {
    var heute = todayISO();
    var jetzt = new Date();

    /* Dieselbe Quelle wie die Wochen-Vorschau - siehe Kopf des Patch-Skripts. */
    var offen = (typeof offeneBeitraege === "function" ? offeneBeitraege() : alleBeitraege())
      .filter(function (b) { return b.art !== "storys"; });

    var meins = [], deins = [];
    offen.forEach(function (b) {
      (wasFehlt(b) || []).forEach(function (f) {
        var e = { b: b, was: f.was, dazu: f.dazu, datum: (blo(b.obj) || {}).datum || "" };
        (f.wer === "du" ? deins : meins).push(e);
      });
    });
    function nachDatum(a, c) { return (a.datum || "9999") < (c.datum || "9999") ? -1 : 1; }
    deins.sort(nachDatum); meins.sort(nachDatum);

    var raus = offen.filter(function (b) {
      return istFertig(b) && !zeitpunktVorbei(b);
    }).sort(function (a, c) {
      return ((blo(a.obj) || {}).datum || "9999") < ((blo(c.obj) || {}).datum || "9999") ? -1 : 1;
    });

    /* Fehlt ein Dokument, steht ein Strich - nicht eine Null. */
    var afOffen = aufgaben && aufgaben.items
      ? aufgaben.items.filter(function (a) { return !a.erledigt; }) : null;
    var afFaellig = afOffen
      ? afOffen.filter(function (a) { return a.datum && a.datum < heute; }) : null;

    var jahr = String(jetzt.getFullYear());
    var st = steuer && steuer.jahre
      ? steuer.jahre.filter(function (x) { return x.jahr === jahr; })[0] : null;
    var ziel = 40000;
    var pct = st ? Math.round(st.einnahmen / ziel * 100) : null;
    var tagImJahr = Math.floor((jetzt - new Date(jetzt.getFullYear(), 0, 0)) / 86400000);
    var jahrPct = Math.round(tagImJahr / 365 * 100);

    var stunde = jetzt.getHours();
    var gruss = stunde < 11 ? "Guten Morgen" : (stunde < 18 ? "Hallo" : "Guten Abend");
    var datum = jetzt.toLocaleDateString("de-CH",
      { weekday: "long", day: "numeric", month: "long" });

    var lage = raus.length
      ? raus.length + (raus.length === 1 ? " Beitrag wartet" : " Beiträge warten") + " auf deine Freigabe."
      : (deins.length ? "Nichts zum Freigeben — aber " + deins.length + " Sachen warten auf dich."
                      : "Nichts offen. Guter Moment für etwas Neues.");

    main.innerHTML =
      '<div class="hero">' +
        '<div class="hero-bild"></div><div class="hero-schleier"></div>' +
        '<div class="hero-text">' +
          '<p class="hero-gruss">' + esc(gruss) + '</p>' +
          '<h1>' + esc(datum) + '</h1>' +
          '<p class="hero-sub">' + esc(lage) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="tiles">' +
        tile("Kann raus", raus.length, raus.length ? "fertig, Zeitpunkt offen" : "nichts freigabebereit") +
        tile("Du bist dran", deins.length, deins.length ? "drehen, hochladen, entscheiden" : "nichts von dir offen") +
        tile("Ich bin dran", meins.length, meins.length ? "baue ich" : "nichts von mir offen") +
        tile("Überfällige Aufgaben", afFaellig ? afFaellig.length : "—",
             afOffen ? afOffen.length + " offen gesamt" : "keine Aufgaben geladen") +
        tile("Umsatz " + jahr, st ? "CHF " + Math.round(st.einnahmen).toLocaleString("de-CH") : "—",
             pct === null ? "keine Zahlen geladen"
               : pct + " % vom Ziel · Jahr zu " + jahrPct + " % vorbei") +
      '</div>' +
      '<div class="jetzt">' +
        '<div class="karte"><h3>Du bist dran</h3><div id="ov-du"></div></div>' +
        '<div class="karte"><h3>Kann raus</h3><div id="ov-raus"></div></div>' +
        '<div class="karte"><h3>Als Nächstes</h3><div id="ov-next"></div></div>' +
      '</div>';

    /* Wie viele Wochen liegt ein Datum von der laufenden Woche entfernt?
       Ueber den Montag beider Wochen gerechnet - siehe Kopf des
       Patch-Skripts, die Tages-Differenz durch sieben springt daneben. */
    function wochenAbstand(iso) {
      function montag(d) {
        var x = new Date(d + "T00:00:00");
        if (isNaN(x)) return null;
        x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
        x.setHours(0, 0, 0, 0);
        return x;
      }
      var a = montag(todayISO()), b = montag(iso);
      if (!a || !b) return null;
      return Math.round((b - a) / 604800000);
    }

    function springeZuBeitrag(b) {
      var d = (blo(b.obj) || {}).datum || "";
      activeTab = "woche";
      var ab = d ? wochenAbstand(d) : null;
      if (ab !== null) {
        wochenOffset = ab;
        // Ohne Datum kein aufgeklappter Platz - sonst oeffnet sich ein
        // beliebiger und man haelt den falschen Beitrag fuer den gesuchten.
        slotOffen = d + "|" + (typeof kartenProfil === "function"
          ? kartenProfil(b.obj) : "mentoring");
      }
      render();
    }

    function fuelle(id, zeilen, leertext) {
      var el = main.querySelector(id);
      if (!zeilen.length) { el.innerHTML = '<div class="leer">' + esc(leertext) + '</div>'; return; }
      el.innerHTML = "";
      zeilen.slice(0, 6).forEach(function (z) {
        var d = document.createElement("div");
        d.className = "zeile" + (z.gehe ? " klick" : "");
        var w = (z.wann && z.wann !== "—")
          ? '<span class="wann">' + esc(z.wann) + '</span>' : "";
        d.innerHTML = w + "<span>" + esc(z.text) + "</span>";
        if (z.gehe) {
          d.title = z.hinweis || "Hinbringen";
          d.onclick = z.gehe;
        }
        el.appendChild(d);
      });
      if (zeilen.length > 6) {
        var r = document.createElement("div");
        r.className = "leer";
        r.style.marginTop = "8px";
        r.textContent = "und " + (zeilen.length - 6) + " weitere";
        el.appendChild(r);
      }
    }

    fuelle("#ov-du", deins.map(function (e) {
      return { wann: fmtDate(e.datum),
               text: (e.b.titel || e.b.format) + " — " + e.was,
               hinweis: "Öffnet die Woche und klappt den Platz auf",
               gehe: function () { springeZuBeitrag(e.b); } };
    }), "Nichts, das auf dich wartet.");

    fuelle("#ov-raus", raus.map(function (b) {
      return { wann: fmtDate((blo(b.obj) || {}).datum), text: b.titel || b.format,
               hinweis: "Zu „Freigeben“",
               gehe: function () { activeTab = "fertig"; render(); } };
    }), "Nichts freigabebereit.");

    var next = [];
    if (jahresplan && jahresplan.eintraege) {
      next = jahresplan.eintraege.filter(function (e) {
        return e.start && e.start >= heute && e.bereich !== "Ferien";
      }).sort(function (a, c) { return a.start < c.start ? -1 : 1; })
        .map(function (e) {
          return { wann: fmtDate(e.start), text: e.name,
                   hinweis: "Zum Jahresplan",
                   gehe: function () { activeTab = "launches"; render(); } };
        });
    }
    fuelle("#ov-next", next, jahresplan ? "Nichts mehr geplant dieses Jahr."
                                        : "Jahresplan nicht geladen.");
  }

  function wocheAnlegen() {
    var d = new Date();
    var tage = [1, 3, 5, 0]; // Mo, Mi, Fr, So
    var formate = { 1: "Reel", 3: "Karussell", 5: "Karussell", 0: "Story" };
    var basis = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (8 - (d.getDay() || 7)));
    var neu = 0;
    tage.forEach(function (t, i) {
      var tag = new Date(basis);
      tag.setDate(basis.getDate() + ((t === 0 ? 7 : t) - 1));
      var iso = tag.toISOString().slice(0, 10);
      if (state.posts.some(function (p) { return p.datum === iso; })) return;
      state.posts.push({
        id: uid("p"), datum: iso, marke: "Mum Life Balance", format: formate[t],
        saeule: SAEULEN[i % 3], pie: ["E", "P", "I"][i % 3], thema: "", keyword: "", archetyp: "—", status: "Idee"
      });
      neu++;
    });
    saveList("posts");
    toast(neu ? neu + " Zeilen für nächste Woche angelegt." : "Für nächste Woche steht schon alles.");
    render();
  }

  function tile(lab, num, note) {
    return '<div class="tile"><div class="t-lab">' + esc(lab) + '</div><div class="t-num">' + num + '</div><div class="t-note">' + esc(note) + '</div></div>';
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." : iso;
  }

  /* =========================================================
     Generische Tabelle
     ========================================================= */
  function renderTable(main, key) {
    var def = TABLES[key];
    var grid = def.cols.map(function (c) { return c.w; }).join(" ") +
               (def.aktion ? " 108px" : "") + " 34px";

    main.innerHTML =
      '<div class="page-head"><div><h1>' + esc(def.titel) + '</h1><p>' + esc(def.unter) + '</p></div>' +
      '<div class="head-actions"><button class="btn primary" id="addrow">Zeile hinzufügen</button></div></div>' +
      '<div class="tablewrap"><div id="rows"></div></div>' +
      '<div class="tablefoot note">' + state[key].length + ' Zeilen · Änderungen speichern sich von selbst</div>';

    var rows = main.querySelector("#rows");
    var head = document.createElement("div");
    head.className = "trow head";
    head.style.gridTemplateColumns = grid;
    head.innerHTML = def.cols.map(function (c) { return "<span>" + esc(c.l) + "</span>"; }).join("") +
                     (def.aktion ? "<span></span>" : "") + "<span></span>";
    rows.appendChild(head);

    var list = state[key].slice();
    if (def.sort) list.sort(function (a, b) { return (a[def.sort] || "") < (b[def.sort] || "") ? -1 : 1; });

    if (!list.length) {
      var e = document.createElement("div");
      e.className = "trow";
      e.style.gridTemplateColumns = "1fr";
      e.innerHTML = '<div class="empty">Noch leer. Klick oben auf „Zeile hinzufügen“.</div>';
      rows.appendChild(e);
    }

    list.forEach(function (item) {
      var r = document.createElement("div");
      r.className = "trow";
      r.style.gridTemplateColumns = grid;
      def.cols.forEach(function (c) {
        var el;
        if (c.t === "select" || c.t === "pill") {
          el = document.createElement("select");
          if (c.t === "pill") { el.className = "pill"; el.setAttribute("data-tone", TONE[item[c.k]] || ""); }
          c.opts.forEach(function (o) {
            var op = document.createElement("option");
            op.value = o; op.textContent = o;
            if (item[c.k] === o) op.selected = true;
            el.appendChild(op);
          });
        } else {
          el = document.createElement("input");
          el.type = c.t === "date" ? "date" : "text";
          el.value = item[c.k] || "";
          el.placeholder = c.l;
        }
        el.oninput = el.onchange = function () {
          item[c.k] = el.value;
          if (c.t === "pill") el.setAttribute("data-tone", TONE[el.value] || "");
          saveList(key);
          if (activeTab === "uebersicht") render();
        };
        r.appendChild(el);
      });
      if (def.aktion) {
        var akt = document.createElement("button");
        akt.className = "btn";
        akt.style.cssText = "font-size:12px;padding:5px 8px";
        akt.textContent = def.aktion.label;
        akt.title = def.aktion.titel;
        akt.onclick = function () { ideeInsStudio(item); };
        r.appendChild(akt);
      }
      var del = document.createElement("button");
      del.className = "del"; del.title = "Zeile löschen"; del.textContent = "×";
      del.onclick = function () {
        state[key] = state[key].filter(function (x) { return x !== item; });
        saveList(key); render();
      };
      r.appendChild(del);
      rows.appendChild(r);
    });

    main.querySelector("#addrow").onclick = function () {
      state[key].push(def.neu());
      saveList(key); render();
      var inputs = document.querySelectorAll("#rows .trow:not(.head) input");
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
  }

  /* Freigabe-Daten eines Karussells, mit Vorbelegung. */
  function blo(car) {
    return car.blotato || (car.blotato = { datum: "", zeit: "07:30", profil: "mentoring", status: "" });
  }

  /* Eine Slide als JPEG, klein genug für ein Dokument. */
  function slideJpeg(car, slide, i, cb) {
    var cv = document.createElement("canvas");
    renderSlide(cv, slide, car, i, car.slides.length);
    setTimeout(function () {
      var q = 0.92;
      var out = cv.toDataURL("image/jpeg", q);
      while (out.length > 700000 && q > 0.45) { q -= 0.08; out = cv.toDataURL("image/jpeg", q); }
      cb(out);
    }, 320);
  }

  function setupBlotato(ed, car) {
    var b = blo(car);
    var note = ed.querySelector("#blonote");
    var btn = ed.querySelector("#blobtn");
    var zurueck = ed.querySelector("#blozurueck");
    var datum = ed.querySelector("#blodatum");
    var zeit = ed.querySelector("#blozeit");
    var profil = ed.querySelector("#bloprofil");

    function speichern() {
      b.datum = datum.value; b.zeit = zeit.value; b.profil = profil.value;
      saveCarousel(car);
    }
    datum.onchange = zeit.onchange = profil.onchange = speichern;

    if (!db) {
      note.textContent = "Die Freigabe braucht die Verbindung zur Datenbank. Öffne das Cockpit über den Link, dann geht es.";
      btn.disabled = true;
      return;
    }
    if (!car.textfrei) {
      note.textContent = "Erst die Texte oben freigeben. Was du nicht gelesen hast, geht auch nicht raus.";
      btn.disabled = true;
      return;
    }
    if (b.status === "wartet") {
      note.textContent = "Freigegeben für " + (b.datum || "kein Datum") + " um " + (b.zeit || "") +
        ", Profil " + (b.profil === "doterra" ? "doTERRA" : "Mentoring") +
        ". Sag es mir im Chat, dann lade ich die Folien hoch und plane den Beitrag ein.";
      btn.textContent = "Folien neu ablegen";
      zurueck.hidden = false;
      zurueck.onclick = function () {
        b.status = ""; saveCarousel(car);
        db.collection("freigaben").doc(car.id).set({
          name: car.name, status: "zurueckgezogen", updatedAt: new Date().toISOString()
        }).catch(function () {});
        render();
        toast("Freigabe zurückgezogen.");
      };
    } else if (b.status === "geplant") {
      note.textContent = "Eingeplant bei Blotato für " + (b.datum || "") + " um " + (b.zeit || "") + ".";
      btn.disabled = true;
      return;
    } else {
      note.textContent = "Datum und Uhrzeit setzen, dann freigeben. Dabei werden die fertigen Folien abgelegt — genau so, wie sie hier aussehen.";
    }

    btn.onclick = function () {
      if (!datum.value) { datum.focus(); toast("Setz zuerst ein Datum."); return; }
      if (!(car.caption || "").trim()) { toast("Ohne Caption kein Beitrag. Schreib sie oben rein."); return; }
      speichern();
      btn.disabled = true;
      var gesamt = car.slides.length;
      var i = 0;
      var basis = "freigaben/" + car.id;

      function nächste() {
        if (i >= gesamt) {
          var wann = new Date(datum.value + "T" + (zeit.value || "07:30"));
          db.collection("freigaben").doc(car.id).set({
            name: car.name,
            caption: car.caption || "",
            profil: profil.value,
            datum: datum.value,
            zeit: zeit.value || "07:30",
            zeitpunktISO: isNaN(wann) ? "" : wann.toISOString(),
            typ: car.typ || "",
            funnel: car.funnel || "",
            anzahl: gesamt,
            status: "wartet",
            updatedAt: new Date().toISOString()
          }).then(function () {
            b.status = "wartet";
            saveCarousel(car);
            btn.disabled = false;
            render();
            toast("Freigegeben. Sag mir im Chat Bescheid, dann geht es raus.");
          }).catch(function () {
            btn.disabled = false;
            btn.textContent = "Für Blotato freigeben";
            toast("Das Ablegen hat nicht geklappt.");
          });
          return;
        }
        var nr = i++;
        btn.textContent = "lege Folie " + (nr + 1) + " von " + gesamt + " ab …";
        slideJpeg(car, car.slides[nr], nr, function (dataUrl) {
          db.doc(basis).collection("bilder")
            .doc("slide-" + String(nr + 1).padStart(2, "0"))
            .set({ dataUrl: dataUrl, nr: nr + 1 })
            .then(nächste)
            .catch(function () {
              btn.disabled = false;
              btn.textContent = "Für Blotato freigeben";
              toast("Folie " + (nr + 1) + " liess sich nicht ablegen.");
            });
        });
      }
      nächste();
    };
  }


  /* Fertige Folienbilder am Beitrag holen (karussells/<id>/bilder/slide-NN).
     Ohne Datenbank oder bei einem Fehler kommt ein leeres Verzeichnis zurueck —
     dann zeichnet die Freigabe wie frueher. */
  function fertigeFolien(id, weiter) {
    var leer = {};
    if (!db) { weiter(leer); return; }
    db.doc("karussells/" + id).collection("bilder").limit(30).get()
      .then(function (snap) {
        var gefunden = {};
        snap.forEach(function (d) {
          var w = d.data && d.data();
          if (/^slide-[0-9]{2}$/.test(d.id) && w && w.dataUrl) gefunden[d.id] = w.dataUrl;
        });
        weiter(gefunden);
      })
      .catch(function () { weiter(leer); });
  }

  function renderStrip(strip, car) {
    strip.innerHTML = "";
    car.slides.forEach(function (slide, i) {
      strip.appendChild(slideCard(car, slide, i));
    });
    var add = document.createElement("button");
    add.className = "addslide";
    add.textContent = "+ Slide";
    add.onclick = function () {
      car.slides.push({ id: uid("s"), layout: "text", headline: "Zwischenüberschrift", body: "", keyword: "", zoom: 1, ox: 0, oy: 0 });
      saveCarousel(car); renderStrip(strip, car);
    };
    strip.appendChild(add);
  }

  function slideCard(car, slide, i) {
    var card = document.createElement("div");
    card.className = "slidecard";

    var head = document.createElement("div");
    head.className = "sc-head";
    head.innerHTML = '<span class="sc-num">Slide ' + (i + 1) + '</span>';
    var tools = document.createElement("div");
    tools.className = "sc-tools";
    [["‹", "nach links", -1], ["›", "nach rechts", 1]].forEach(function (t) {
      var b = document.createElement("button");
      b.className = "btn ghost"; b.textContent = t[0]; b.title = t[1];
      b.onclick = function () {
        var j = i + t[2];
        if (j < 0 || j >= car.slides.length) return;
        var tmp = car.slides[i]; car.slides[i] = car.slides[j]; car.slides[j] = tmp;
        saveCarousel(car); renderStrip(card.parentNode, car);
      };
      tools.appendChild(b);
    });
    var rm = document.createElement("button");
    rm.className = "btn ghost"; rm.textContent = "×"; rm.title = "Slide löschen";
    rm.onclick = function () {
      if (car.slides.length === 1) { toast("Ein Karussell braucht mindestens eine Slide."); return; }
      car.slides.splice(i, 1);
      saveCarousel(car); renderStrip(card.parentNode, car);
    };
    tools.appendChild(rm);
    head.appendChild(tools);
    card.appendChild(head);

    var cv = document.createElement("canvas");
    cv.className = "sc-canvas";
    cv.setAttribute("data-slide", slide.id);
    card.appendChild(cv);

    var body = document.createElement("div");
    body.className = "sc-body";

    var lay = document.createElement("select");
    Object.keys(LAYOUTS).forEach(function (k) {
      var o = document.createElement("option");
      o.value = k; o.textContent = LAYOUTS[k];
      if (slide.layout === k) o.selected = true;
      lay.appendChild(o);
    });
    lay.onchange = function () { slide.layout = lay.value; saveCarousel(car); draw(); buildExtras(); };
    body.appendChild(lay);

    // Wer den Text ändert, hebt die Freigabe auf — sonst exportierst du
    // eine Fassung, die du nie gelesen hast.
    function freigabeAufheben() {
      if (!car.textfrei) return;
      car.textfrei = false;
      saveCarousel(car);
      toast("Text geändert, Freigabe aufgehoben.");
      setTimeout(render, 300);
    }

    var h = document.createElement("textarea");
    h.rows = 2; h.placeholder = "Headline"; h.value = slide.headline || "";
    h.oninput = function () { slide.headline = h.value; saveCarousel(car); draw(); freigabeAufheben(); };
    body.appendChild(h);

    var t = document.createElement("textarea");
    t.rows = 3; t.placeholder = "Fliesstext"; t.value = slide.body || "";
    t.oninput = function () { slide.body = t.value; saveCarousel(car); draw(); freigabeAufheben(); };
    body.appendChild(t);

    var extras = document.createElement("div");
    extras.style.display = "flex";
    extras.style.flexDirection = "column";
    extras.style.gap = "8px";
    body.appendChild(extras);

    function buildExtras() {
      extras.innerHTML = "";
      if (slide.layout === "cta") {
        var kw = document.createElement("input");
        kw.placeholder = "Keyword, z.B. FAHRPLAN";
        kw.value = slide.keyword || "";
        kw.oninput = function () { slide.keyword = kw.value; saveCarousel(car); draw(); };
        extras.appendChild(kw);
      }
      if (slide.layout === "bild" || slide.layout === "split") {
        var fb = document.createElement("label");
        fb.className = "btn filebtn";
        fb.innerHTML = "<span>" + (images[slide.id] ? "Bild ersetzen" : "Bild wählen") + "</span>";
        var fi = document.createElement("input");
        fi.type = "file"; fi.accept = "image/*";
        fi.onchange = function () {
          if (!fi.files || !fi.files[0]) return;
          compressImage(fi.files[0], function (dataUrl) {
            saveImage("karussells/" + car.id, slide.id, dataUrl);
            draw(); buildExtras();
          });
        };
        fb.appendChild(fi);
        extras.appendChild(fb);

        [["Zoom", "zoom", 1, 3, 0.02], ["Links/Rechts", "ox", -50, 50, 1], ["Hoch/Runter", "oy", -50, 50, 1]].forEach(function (s) {
          var row = document.createElement("div");
          row.className = "sliderow";
          var lab = document.createElement("span");
          lab.textContent = s[0];
          var rg = document.createElement("input");
          rg.type = "range"; rg.min = s[2]; rg.max = s[3]; rg.step = s[4];
          rg.value = slide[s[1]] != null ? slide[s[1]] : (s[1] === "zoom" ? 1 : 0);
          rg.oninput = function () { slide[s[1]] = parseFloat(rg.value); draw(); };
          rg.onchange = function () { saveCarousel(car); };
          row.appendChild(lab); row.appendChild(rg);
          extras.appendChild(row);
        });
      }
      var one = document.createElement("button");
      one.className = "btn ghost";
      one.textContent = "Diese Slide als PNG";
      one.onclick = function () { exportOne(car, slide, i, one); };
      extras.appendChild(one);
    }
    buildExtras();

    card.appendChild(body);

    // Bild mit der Maus im Rahmen verschieben
    var dragging = false, sx = 0, sy = 0, six = 0, siy = 0;
    cv.addEventListener("pointerdown", function (e) {
      if (slide.layout !== "bild" && slide.layout !== "split") return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      six = slide.ox || 0; siy = slide.oy || 0;
      cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing";
    });
    cv.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      slide.ox = Math.max(-50, Math.min(50, six + (e.clientX - sx) / cv.clientWidth * 100));
      slide.oy = Math.max(-50, Math.min(50, siy + (e.clientY - sy) / cv.clientHeight * 100));
      draw();
    });
    cv.addEventListener("pointerup", function () {
      if (!dragging) return;
      dragging = false; cv.style.cursor = "grab"; saveCarousel(car); buildExtras();
    });

    function draw() { renderSlide(cv, slide, car, i, car.slides.length); }
    slide.__draw = draw;
    setTimeout(draw, 0);
    return card;
  }

  function redrawAll(car) {
    car.slides.forEach(function (s) { if (s.__draw) s.__draw(); });
  }

  /* =========================================================
     Export
     ========================================================= */
  function canvasBlob(car, slide, i) {
    return new Promise(function (res) {
      var cv = document.createElement("canvas");
      renderSlide(cv, slide, car, i, car.slides.length);
      setTimeout(function () { cv.toBlob(function (b) { res(b); }, "image/png"); }, 260);
    });
  }

  function safeName(s) {
    return String(s || "karussell").toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "karussell";
  }

  function exportOne(car, slide, i, btn) {
    if (!downloads) { toast("Speichern ist in dieser Ansicht nicht möglich."); return; }
    btn.disabled = true;
    canvasBlob(car, slide, i).then(function (blob) {
      return downloads.save({ filename: safeName(car.name) + "-" + (i + 1) + ".png", data: blob });
    }).then(function () { toast("Slide " + (i + 1) + " gespeichert."); })
      .catch(function (e) { if (e && e.code !== "declined") toast("Hat nicht geklappt: " + (e && e.code || "unbekannt")); })
      .then(function () { btn.disabled = false; });
  }

  function exportAll(car, btn) {
    if (!downloads) { toast("Speichern ist in dieser Ansicht nicht möglich."); return; }
    btn.disabled = true;
    var i = 0;
    function next() {
      if (i >= car.slides.length) { btn.disabled = false; toast("Fertig, alle Slides gespeichert."); return; }
      var idx = i++;
      canvasBlob(car, car.slides[idx], idx).then(function (blob) {
        btn.textContent = "Slide " + (idx + 1) + " von " + car.slides.length + " …";
        return downloads.save({ filename: safeName(car.name) + "-" + (idx + 1) + ".png", data: blob });
      }).then(next).catch(function (e) {
        btn.disabled = false;
        btn.textContent = "Alle Slides exportieren";
        if (e && e.code === "declined") toast("Abgebrochen.");
        else toast("Export gestoppt: " + (e && e.code || "unbekannt"));
      });
    }
    next();
    var reset = setInterval(function () {
      if (!btn.disabled) { btn.textContent = "Alle Slides exportieren"; clearInterval(reset); }
    }, 400);
  }

  /* =========================================================

  var FUNNEL_STEPS = [
    { k: "freebie", l: "Freebie / Einstieg", ph: "z.B. Fahrplan" },
    { k: "keyword", l: "Keyword", ph: "z.B. FAHRPLAN" },
    { k: "automation", l: "Automation", ph: "ActiveCampaign" },

    { k: "angebot", l: "Angebot", ph: "z.B. Finde dein Thema" }

  function funnelLuecken(f) {
    return FUNNEL_STEPS.filter(function (st) { return !String(f[st.k] || "").trim(); }).map(function (st) { return st.l; });

  function preisText(betrag, waehrung) {
    if (betrag === null || betrag === undefined) return "—";
    if (!betrag) return "0";
    return (waehrung || "CHF") + " " +
      Number(betrag).toLocaleString("de-CH", { maximumFractionDigits: 0 });
  }

  /* Kopieren muss ueberall gleich funktionieren — auch dort, wo die
     Zwischenablage gesperrt ist. Deshalb erst der moderne Weg, dann der alte
     ueber ein verstecktes Feld. */
  function inDieZwischenablage(text, knopf) {
    function geschafft() {
      var alt = knopf.textContent;
      knopf.textContent = "kopiert ✓";
      knopf.classList.add("fertig");
      setTimeout(function () {
        knopf.textContent = alt;
        knopf.classList.remove("fertig");
      }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      // Wenn der Browser die Freigabe still verschluckt, kommt die Zusage nie
      // zurueck — und Patricia steht ohne jede Rueckmeldung da. Deshalb ein
      // Zeitlimit daneben, nach dem der alte Weg uebernimmt.
      var erledigt = false;
      var wecker = setTimeout(function () {
        if (!erledigt) { erledigt = true; altKopieren(text, geschafft); }
      }, 700);
      navigator.clipboard.writeText(text).then(function () {
        if (erledigt) return;
        erledigt = true; clearTimeout(wecker); geschafft();
      }, function () {
        if (erledigt) return;
        erledigt = true; clearTimeout(wecker); altKopieren(text, geschafft);
      });
      return;
    }
    altKopieren(text, geschafft);
  }

  function altKopieren(text, fertig) {
    var feld = document.createElement("textarea");
    feld.value = text;
    feld.style.position = "fixed";
    feld.style.opacity = "0";
    document.body.appendChild(feld);
    feld.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    feld.remove();
    if (ok) fertig(); else toast("Kopieren ging nicht — Link von Hand markieren.");
  }

  function kopierZeile(lab, wert, istLink, anzeige) {
    var zeile = document.createElement("div");
    zeile.className = "lzzeile";

    var marke = document.createElement("span");
    marke.className = "lzlab";
    marke.textContent = lab;
    zeile.appendChild(marke);

    var wertfeld = document.createElement("span");
    wertfeld.className = "lzwert";
    if (istLink) {
      var a = document.createElement("a");
      a.href = wert;
      a.target = "_blank";
      a.rel = "noopener";
      // Anzeige und kopierter Wert duerfen auseinandergehen: eine
      // Blob-Adresse ist 95 Zeichen lang und sagt nichts.
      a.textContent = anzeige || wert.replace(/^https?:\/\//, "");
      wertfeld.appendChild(a);
    } else {
      wertfeld.textContent = wert;
      wertfeld.classList.add("stichwort");
    }
    zeile.appendChild(wertfeld);

    var knopf = document.createElement("button");
    knopf.className = "lzkopie";
    knopf.textContent = "kopieren";
    knopf.onclick = function () { inDieZwischenablage(wert, knopf); };
    zeile.appendChild(knopf);
    return zeile;
  }

          var kopf = document.createElement("div");
          kopf.className = "lzkopf";

                                 : (e.preis || "");
          kopf.innerHTML = '<span class="lzname">' + esc(e.name) + '</span>' +
            (preis ? '<span class="lzpreis">' + esc(preis) + '</span>' : "") +

            (e.status === "achtung"

            // ThriveCart-Zustand: „test" bucht nichts ab, „disabled" ist aus.
            (e.tc_status && e.tc_status !== "live"

            warn.style.margin = "2px 0 6px";
            warn.style.color = "var(--bad, #b3261e)";
            warn.textContent = e.tc_status === "test"
              ? "Die Kasse steht in ThriveCart auf Testmodus — sie zeigt die "
                + "Seite, bucht aber nichts ab. Nicht verlinken, solange das so ist."
              : "Dieser Checkout ist in ThriveCart abgeschaltet.";
            karte.appendChild(warn);
          }

          // In der Uebersicht steht bei einer Luecke „🔴 fehlt" in der
          // Stichwort-Spalte. Das ist keine Ansage, die man kopiert.
          var kwLeer = /^(fehlt|keins?|noch offen|—|-)$/i.test(e.keyword || "");
          if (e.keyword && !kwLeer) {
            karte.appendChild(kopierZeile("Stichwort", e.keyword, false));

          // Vier Linkarten, jede mit eigener Zeile und eigenem Knopf.
          // Die Reihenfolge ist die, in der Patricia sie braucht: erst die

          var arten = links.linkarten || [
            { id: "landingpage", kurz: "Seite" },
            { id: "thrivecart", kurz: "Kasse" },
            { id: "auslieferung", kurz: "Das kriegt sie" },
            { id: "telegram", kurz: "Gruppe" }
          ];
          var hatWas = false;
          var gezeigt = {};
          // Zu einer Blob-Adresse kennen wir meist den Dateinamen — der ist

          var namen = {};
          (e.dateien || []).forEach(function (d) {
            if (d.blob) {

              // Link-Zentrale absolut. Darum ueber das Endstueck abgleichen.
              var kurzname = namen[u];
              if (!kurzname) {
                var ab = u.indexOf("/_blob/");
                if (ab >= 0) kurzname = namen[u.slice(ab)] || "hinterlegte Datei";
              }
              karte.appendChild(kopierZeile(art.kurz, u, true, kurzname));
              // Beide Schreibweisen merken, sonst zeichnet die Datei-Zeile

          (e.dateien || []).forEach(function (d) {
