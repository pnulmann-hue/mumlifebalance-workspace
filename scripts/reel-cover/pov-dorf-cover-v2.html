<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face { font-family: "Philosopher"; font-style: normal; font-weight: 700; src: url("../hyperframes-test/mumlife-reel/assets/fonts/Philosopher-700.woff2") format("woff2"); }
    @font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 300 700; src: url("../hyperframes-test/mumlife-reel/assets/fonts/SourceSans3-Variable.woff2") format("woff2-variations"); }
    :root {
      --petrol: #12828c;
      --dunkelblau: #29556d;
      --creme: #f1ecdd;
      --orange: #dc822e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    .cover {
      position: absolute; inset: 0;
      width: 1080px; height: 1920px;
      overflow: hidden;
    }
    .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .gradient {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.0) 0%,
        rgba(0,0,0,0.05) 30%,
        rgba(0,0,0,0.4) 60%,
        rgba(0,0,0,0.8) 100%);
      z-index: 2;
    }
    .text-block {
      position: absolute;
      bottom: 380px;
      left: 40px;
      right: 40px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .pov-tag {
      display: inline-block;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 700;
      font-size: 52px;
      color: var(--orange);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-shadow: 0 4px 14px rgba(0,0,0,0.7);
    }
    .pov-line {
      font-family: "Philosopher", serif;
      font-weight: 700;
      font-size: 78px;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 6px 20px rgba(0,0,0,0.8);
      max-width: 1000px;
      margin-bottom: 12px;
      white-space: nowrap;
    }
    .pov-line.last {
      color: #fff;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="cover">
    <img class="bg" src="../../context/Shootingbilder/331 - Patricia_Nulmann_mumlifebalance_schöniaugeblick-331.jpg" alt="">
    <div class="gradient"></div>

    <div class="text-block">
      <div class="pov-tag">POV:</div>
      <div class="pov-line">Wenn die aus meinem Dorf</div>
      <div class="pov-line">meine ersten Stories</div>
      <div class="pov-line last">gesehen haben.</div>
    </div>
  </div>
</body>
</html>
