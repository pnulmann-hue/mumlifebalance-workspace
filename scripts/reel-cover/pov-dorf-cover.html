<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face { font-family: "Philosopher"; font-style: normal; font-weight: 700; src: url("../hyperframes-test/mumlife-reel/assets/fonts/Philosopher-700.woff2") format("woff2"); }
    @font-face { font-family: "Source Sans 3"; font-style: normal; font-weight: 300 700; src: url("../hyperframes-test/mumlife-reel/assets/fonts/SourceSans3-Variable.woff2") format("woff2-variations"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    .cover {
      position: absolute; inset: 0;
      width: 1080px; height: 1920px;
      overflow: hidden;
    }
    .bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .gradient {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.2) 15%,
        rgba(0,0,0,0.15) 50%,
        rgba(0,0,0,0.55) 90%,
        rgba(0,0,0,0.85) 100%);
      z-index: 2;
    }
    .pov-headline {
      position: absolute;
      top: 130px;
      left: 60px;
      right: 60px;
      z-index: 3;
      text-align: left;
    }
    .pov-headline .pov-tag {
      display: inline-block;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 700;
      font-size: 64px;
      padding: 10px 28px;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }
    .pov-headline .pov-line {
      display: block;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 600;
      font-size: 48px;
      padding: 10px 22px;
      margin-bottom: 8px;
      width: fit-content;
      line-height: 1.2;
    }
    .choice-list {
      position: absolute;
      bottom: 280px;
      left: 60px;
      right: 60px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .choice {
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-family: "Source Sans 3", sans-serif;
      font-weight: 600;
      font-size: 46px;
      padding: 18px 28px;
      width: fit-content;
      max-width: 100%;
      line-height: 1.25;
    }
    .choice.d {
      background: rgba(220, 130, 46, 0.92);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="cover">
    <img class="bg" src="../../context/Shootingbilder/201 - Patricia_Nulmann_mumlifebalance_schöniaugeblick-201.jpg" alt="">
    <div class="gradient"></div>

    <div class="pov-headline">
      <div class="pov-tag">POV:</div>
      <span class="pov-line">Wenn die aus meinem Dorf</span>
      <span class="pov-line">meine ersten Stories gesehen haben:</span>
    </div>

    <div class="choice-list">
      <div class="choice">A) Macht die das jetzt wirklich?</div>
      <div class="choice">B) Wer braucht sowas?</div>
      <div class="choice">C) Verdient die jetzt etwa Geld damit?</div>
      <div class="choice d">D) Schnäuzer drauf, in den WhatsApp damit 🙄</div>
    </div>
  </div>
</body>
</html>
