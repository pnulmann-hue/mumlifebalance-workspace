<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,700;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --petrol:#12828c; --dunkelblau:#29556d; --creme:#f1ecdd; --grey:#9a9384; }
      * { margin:0; padding:0; box-sizing:border-box; }
      .slide { width:1080px; height:1350px; background:var(--creme); position:relative; overflow:hidden; font-family:"Source Sans 3",sans-serif; }
      .inner { position:absolute; left:88px; right:88px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center; }
      .eyebrow { font-weight:700; font-size:31px; letter-spacing:0.18em; color:var(--petrol); text-transform:uppercase; margin-bottom:36px; }
      .headline { font-family:"Philosopher"; font-weight:700; font-size:106px; line-height:1.04; color:var(--dunkelblau); }
      .headline em { color:var(--petrol); font-style:italic; }
      .footer { position:absolute; left:88px; right:88px; bottom:72px; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:31px; color:var(--grey); }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="inner">
        <div class="eyebrow">Mehr Zeit fürs Business</div>
        <div class="headline">Bevor du mehr schaffst, schaff dir erst <em>Platz</em>.</div>
      </div>
      <div class="footer"><span>@mumlifebalance</span><span>Swipe →</span></div>
    </div>
  </body>
</html>
