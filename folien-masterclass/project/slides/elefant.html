<section id="elefant" data-transition="fade" style="background:#f7f4ec; color:#0c1c30; font-family:'Source Sans 3', Verdana, sans-serif; padding:128px; display:flex; flex-direction:column; gap:40px"><p style="font-size:26px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#12828c">Der Elefant im Raum</p><h2 style="font-family:'Philosopher', Georgia, serif; font-size:76px; font-weight:700; line-height:1.1; color:#29556d">Alle sagen, KI spart Zeit.<br>Bei dir kostet sie welche.</h2><p style="font-size:40px; font-weight:400; line-height:1.45; color:#5c6b73">Und du denkst, du machst etwas falsch.</p><aside>Das ist der Satz, auf den sie gewartet haben, ohne es zu wissen. Sag ihn und halt zwei Sekunden still. Nicht sofort auflösen.</aside></section>
